        function drawStaff() {
            ctx.strokeStyle = "black";
            for (let i = 0; i < 6; i++) {
                let y = staffY + i * 10;
                ctx.beginPath();
                ctx.moveTo(50, y);
                ctx.lineTo(800, y);
                ctx.stroke();
            }
        }

        function drawNotes() {
            ctx.fillStyle = "black";
            notes.forEach(([note, time]) => {
                let x = 50 + time * timeScale;
                let y = staffY + (5 - Object.keys(noteMapping).indexOf(note)) * 10;
                ctx.beginPath();
                ctx.arc(x, y, noteSize / 2, 0, Math.PI * 2);
                ctx.fill();
            });
        }

        async function convertToMIDI() {
            const { Midi } = await import("https://cdn.jsdelivr.net/npm/@tonejs/midi@2.0.26/+esm");

            const midi = new Midi();
            const track = midi.addTrack();

            notes.forEach(([note, time], index) => {
                const freq = tetrachordScale[noteMapping[note]];
                const midiNote = Math.round(69 + 12 * Math.log2(freq / 440.0)); // Convert frequency to MIDI note number
                
                track.addNote({
                    midi: midiNote,
                    time: time, // Exact seconds
                    duration: index < notes.length - 1 ? notes[index + 1][1] - time : 0.5 // Duration until next note
                });
            });

            const midiBlob = new Blob([midi.toArray()], { type: "audio/midi" });
            const url = URL.createObjectURL(midiBlob);
            const a = document.createElement("a");
            a.href = url;
            a.download = "music_tetrachord.mid";
            a.click();
        }

        canvas.width = 900;
        canvas.height = 200;

        ctx.clearRect(0, 0, canvas.width, canvas.height);
        drawStaff();
        drawNotes();
