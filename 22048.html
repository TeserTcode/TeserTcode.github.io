<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2^1024 Enhanced</title>
    <style>
        body {
            text-align: center;
            background: url('22048bg.png') no-repeat center center fixed;
            background-size: 100vw 100vh;
            transition: all 0.5s;
            filter: none;
            font-family: Arial, sans-serif;
            color: #fff;
        }
        /* Visual Effects */
        .event-effect { animation: eventPulse 1s; }
        .invert-effect { filter: invert(1); }
        .blur-effect { filter: blur(2px); }
        .sepia-effect { filter: sepia(1); }
        .hue-effect { filter: hue-rotate(90deg); }
        .contrast-effect { filter: contrast(200%); }
        @keyframes eventPulse {
            0% { background-color: rgba(255,255,255,0); }
            50% { background-color: rgba(255,255,255,0.3); }
            100% { background-color: rgba(255,255,255,0); }
        }
        table {
            border-collapse: collapse;
            margin: 20px auto;
            box-shadow: 0 0 20px 5px #34d9d6; /* Glow effect */
        }
        .main-buttons button, #toggleSettingsButton {
            background: #34d9d6;
            background-image: linear-gradient(to bottom, #34d9d6, #2bb85a);
            border-radius: 26px;
            font-family: Georgia;
            color: #000000;
            font-size: 28px;
            padding: 15px 30px;
            text-decoration: none;
            margin: 10px;
            border: none;
            cursor: pointer;
        }
        #eventMessage {
            font-size: 30px;
            color: gold;
            text-shadow: 2px 2px 4px #000;
            margin: 20px;
            height: 40px;
        }
        td {
            padding: 0;
            line-height: 0;
            position: relative;
        }
        h1 {
            font-size: 50px;
            font-family: "Comic Sans MS";
            color:purple;
            transition: all 0.5s;
        }
        img {
            border: 5px solid black;
            width: 128px;
            height: 128px;
            transition: all 0.1s ease;
        }
        .exploding, .upgrading {
            position: absolute;
            top: 0;
            left: 0;
            z-index: 10;
            animation: var(--animation-name) var(--explosion-duration) steps(4) forwards;
        }
        @keyframes explode {
            0% { background-image: url('explosion1.png'); } 25% { background-image: url('explosion2.png'); }
            50% { background-image: url('explosion3.png'); } 75% { background-image: url('explosion4.png'); }
            100% { opacity: 0; }
        }
        @keyframes upgrade {
            0% { background-image: url('upgrade1.png'); } 25% { background-image: url('upgrade2.png'); }
            50% { background-image: url('upgrade3.png'); } 75% { background-image: url('upgrade4.png'); }
            100% { opacity: 0; }
        }
        .stats-display {
            display: block; /* Initially visible */
            transition: all 0.5s;
        }
        .stats-display.hidden {
            display: none;
        }
        #score, #highscore, #difficulty, #level, #phase, #explosionDuration {
            display: inline-block;
            width: 256px;
            margin: 10px 0;
            font-size: 24px;
            background-image: linear-gradient(to bottom, #00ffdd, #00ddff);
            border-radius: 0px;
            box-shadow: 0px 1px 3px #666666;
            font-family: Arial;
            color: #000000;
            padding: 10px 5px;
            border: solid #000000 2px;
            text-decoration: none;
        }
        #error-message, #error-message2 {
            display: none; color: red; font-weight: bold; font-size: 20px;
        }
        #error-message2 { font-size: 50px; }

        /* Settings Menu */
        #settingsMenu {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 80%;
            max-width: 500px;
            background: rgba(0, 0, 0, 0.85);
            border: 2px solid #34d9d6;
            border-radius: 15px;
            padding: 20px;
            z-index: 100;
            display: none; /* Initially hidden */
        }
        #settingsMenu h2 { margin-top: 0; }
        .settings-option { margin: 15px 0; display: flex; justify-content: space-between; align-items: center; }
        .settings-option label { font-size: 18px; }
        .settings-option input[type="checkbox"] { width: 25px; height: 25px; }
        .settings-option input[type="number"] { width: 80px; font-size: 18px; padding: 5px; }
        .settings-option button { font-size: 18px; padding: 5px 10px; }

        /* Mobile Controls */
        #mobileControls {
            margin-top: 20px;
        }
        #mobileControls button {
            width: 70px;
            height: 70px;
            font-size: 24px;
            margin: 5px;
            background: #34d9d6;
            color: black;
            border: 2px solid black;
            border-radius: 10px;
            cursor: pointer;
        }
        #mobileControls div {
            display: flex;
            justify-content: center;
            align-items: center;
        }

    </style>
</head>
<body>
    <h1>2<sup>1024</sup> Enhanced</h1>
    <div id="error-message2">Ultraskill issue</div>
    <div id="eventMessage"></div>

    <div id="statsDisplay" class="stats-display">
        <div id="score">Score: 0</div>
        <div id="highscore">High-Score: 0</div>
        <div id="difficulty">Difficulty: 7</div>
        <div id="level">Level: 1</div>
        <div id="phase">Phase: 1</div>
        <div id="explosionDuration">Explosion: 500ms</div>
    </div>
    
    <table id="imageTable"></table>
    
    <div class="main-buttons">
        <button id="retryButton">Retry</button>
        <button id="saveButton">Save</button>
        <button id="loadButton">Load</button>
        <button id="toggleSettingsButton">Settings</button>
    </div>
    <div id="error-message">Skill issue</div>

    <div id="mobileControls">
        <div><button id="mobile-up">↑</button></div>
        <div>
            <button id="mobile-left">←</button>
            <button id="mobile-down">↓</button>
            <button id="mobile-right">→</button>
        </div>
    </div>

    <div id="settingsMenu">
        <h2>Settings</h2>
        <div class="settings-option">
            <label for="startLevelInput">Start From Level:</label>
            <input type="number" id="startLevelInput" value="1" min="1" max="1000">
        </div>
        <div class="settings-option">
            <label for="toggleStats">Show Game Stats:</label>
            <input type="checkbox" id="toggleStats" checked>
        </div>
        <div class="settings-option">
            <label for="toggleVisualEffects">Enable Visual Effects:</label>
            <input type="checkbox" id="toggleVisualEffects" checked>
        </div>
        <div class="settings-option">
            <label for="togglePhaseMechanics">Enable Phase Mechanics:</label>
            <input type="checkbox" id="togglePhaseMechanics" checked>
        </div>
         <div class="settings-option">
            <label>Difficulty:</label>
            <div>
                <button id="decrease-difficulty">-</button>
                <span id="difficulty-setting">7</span>
                <button id="increase-difficulty">+</button>
            </div>
        </div>
        <div class="settings-option">
            <label>Explosion Speed:</label>
            <div>
                <button id="decrease-explosion">-</button>
                <span id="explosion-setting">500</span>ms
                <button id="increase-explosion">+</button>
            </div>
        </div>
        <button id="closeSettingsButton" style="margin-top: 20px; padding: 10px 20px; font-size: 18px;">Close</button>
    </div>

    <script>
        // Game state
        let gameBoard = Array(4).fill(null).map(() => Array(4).fill(0));
        let score = 0, highscore = 0, difficulty = 7, level = 1, phase = 1, explosionDuration = 500;
        let explodingCells = [], upgradingCells = [];
        let isAnimating = false, currentEvent = null, movesetModified = false;
        
        // Settings State
        let visualEffectsEnabled = true;
        let phaseMechanicsEnabled = true;
        let startLevel = 1;

        const effects = [
            {name: "Normal", class: ""}, {name: "Invert", class: "invert-effect"},
            {name: "Blur", class: "blur-effect"}, {name: "Sepia", class: "sepia-effect"},
            {name: "Hue", class: "hue-effect"}, {name: "Contrast", class: "contrast-effect"}
        ];
        let currentEffect = 0;

        // DOM elements
        const table = document.getElementById('imageTable');
        const scoreDisplay = document.getElementById('score');
        const highscoreDisplay = document.getElementById('highscore');
        const difficultyDisplay = document.getElementById('difficulty');
        const levelDisplay = document.getElementById('level');
        const phaseDisplay = document.getElementById('phase');
        const explosionDurationDisplay = document.getElementById('explosionDuration');
        const errorMessage = document.getElementById('error-message');
        const errorMessage2 = document.getElementById('error-message2');
        const eventMessage = document.getElementById('eventMessage');
        const toggleSettingsButton = document.getElementById('toggleSettingsButton');
        const settingsMenu = document.getElementById('settingsMenu');
        const closeSettingsButton = document.getElementById('closeSettingsButton');
        
        // Settings Elements
        const startLevelInput = document.getElementById('startLevelInput');
        const toggleStatsCheckbox = document.getElementById('toggleStats');
        const toggleVisualEffectsCheckbox = document.getElementById('toggleVisualEffects');
        const togglePhaseMechanicsCheckbox = document.getElementById('togglePhaseMechanics');
        const difficultySettingDisplay = document.getElementById('difficulty-setting');
        const explosionSettingDisplay = document.getElementById('explosion-setting');
        const statsDisplay = document.getElementById('statsDisplay');

        // Initialize
        retry();

        function draw() {
            table.innerHTML = '';
            for (let row = 0; row < 4; row++) {
                const tr = document.createElement('tr');
                for (let col = 0; col < 4; col++) {
                    const td = document.createElement('td');
                    const img = document.createElement('img');
                    
                    td.style.setProperty('--explosion-duration', `${explosionDuration/1000}s`);
                    td.style.setProperty('--animation-name', 'explode');

                    const isExploding = explodingCells.some(cell => cell.row === row && cell.col === col);
                    const isUpgrading = upgradingCells.some(cell => cell.row === row && cell.col === col);
                    
                    if (gameBoard[row][col] > 0) {
                        img.src = `22048/${gameBoard[row][col]}.png`;
                        if (isExploding) {
                            td.style.setProperty('--animation-name', 'explode');
                            const animationDiv = document.createElement('div');
                            animationDiv.className = 'exploding';
                            animationDiv.style.width = '128px';
                            animationDiv.style.height = '128px';
                            td.appendChild(animationDiv);
                        }
                        if (isUpgrading) {
                            td.style.setProperty('--animation-name', 'upgrade');
                            const animationDiv = document.createElement('div');
                            animationDiv.className = 'upgrading';
                            animationDiv.style.width = '128px';
                            animationDiv.style.height = '128px';
                            td.appendChild(animationDiv);
                        }
                    } else {
                        img.src = '22048/0.png';
                    }
                    
                    td.appendChild(img);
                    tr.appendChild(td);
                }
                table.appendChild(tr);
            }
            updateDisplays();
        }
        
        function dc(array) { return array.map(row => row.slice()); }

        function fail() {
            if (isAnimating) return;
            errorMessage.style.display = 'block';
            for (let i = 0; i < 4; i++)
                for (let j = 0; j < 4; j++)
                    if(gameBoard[i][j] == 0) return;
            for (let i = 0; i < 4; i++)
                for (let j = 0; j < 3; j++) {
                    if(gameBoard[i][j] == gameBoard[i][j+1]) return;
                    if(gameBoard[j][i] == gameBoard[j+1][i]) return;
                }
            errorMessage2.style.display = 'block';
            errorMessage.style.display = 'none';
        }

        function rain() {
            if (isAnimating) return;
            errorMessage.style.display = 'none';
            errorMessage2.style.display = 'none';

            if (level % 10 === 0 && currentEvent === null) {
                triggerEvent();
                return;
            }
            
            const currentPhase = phaseMechanicsEnabled ? Math.min(9, Math.floor(level / 100) + 1) : 1;
            if (currentPhase !== phase) {
                phase = currentPhase;
                updateDisplays();
            }

            let threshold = Math.max(1, level - difficulty);
            explodingCells = [];
            upgradingCells = [];
            
            // Phase-specific mechanics
            if (phase === 1) { // Explode lowest tiles
                gameBoard.forEach((row, i) => row.forEach((val, j) => {
                    if (val > 0 && val < threshold) explodingCells.push({row: i, col: j});
                }));
            } else if (phase === 2) { // Upgrade lowest tiles
                let minVal = 1024;
                gameBoard.forEach(row => row.forEach(val => {
                    if (val > 0 && val < threshold && val < minVal) minVal = val;
                }));
                if (minVal < 1024) {
                    gameBoard.forEach((row, i) => row.forEach((val, j) => {
                        if (val === minVal) upgradingCells.push({row: i, col: j});
                    }));
                }
            } else if (phase >= 3) { // Placeholder for more complex phases 3-9+
                 gameBoard.forEach((row, i) => row.forEach((val, j) => {
                    if (val > 0 && val < threshold) explodingCells.push({row: i, col: j});
                }));
            }

            if (explodingCells.length > 0) {
                isAnimating = true;
                draw();
                setTimeout(() => {
                    explodingCells.forEach(cell => { gameBoard[cell.row][cell.col] = 0; });
                    explodingCells = [];
                    isAnimating = false;
                    spawnNewTiles();
                }, explosionDuration);
                return;
            }
            
            if (upgradingCells.length > 0) {
                isAnimating = true;
                draw();
                setTimeout(() => {
                    upgradingCells.forEach(cell => { gameBoard[cell.row][cell.col] += 1; });
                    upgradingCells = [];
                    isAnimating = false;
                    spawnNewTiles();
                }, explosionDuration);
                return;
            }
            
            spawnNewTiles();
        }

        function spawnNewTiles() {
            const emp = [];
            gameBoard.forEach((row, i) => row.forEach((val, j) => {
                if (val === 0) emp.push({ i, j });
            }));
            if (emp.length === 0) { draw(); return; }
            
            const { i, j } = emp[Math.floor(Math.random() * emp.length)];
            
            let spawnValue = currentEvent === 'betterTile' ?
                Math.max(1, level - difficulty + 3) :
                (Math.random() < 0.9 ? Math.max(1, level - difficulty) : Math.max(2, level - difficulty + 1));
                
            gameBoard[i][j] = spawnValue;
            if (spawnValue > level) {
                level = spawnValue;
            }
            
            draw();
        }

        function updateDisplays() {
            scoreDisplay.textContent = `Score: ${score}`;
            highscore = Math.max(score, highscore);
            highscoreDisplay.textContent = `High-Score: ${highscore}`;
            difficultyDisplay.textContent = `Difficulty: ${difficulty}`;
            levelDisplay.textContent = `Level: ${level}`;
            phaseDisplay.textContent = `Phase: ${phase}`;
            explosionDurationDisplay.textContent = `Explosion: ${explosionDuration}ms`;
            difficultySettingDisplay.textContent = difficulty;
            explosionSettingDisplay.textContent = explosionDuration;
        }

        function triggerEvent() {
            const events = ['betterTile', 'modifiedMoveset', 'rotateBomb', 'doublePoints', 'freeUpgrade', 'gravityShift'];
            const randomEvent = events[Math.floor(Math.random() * events.length)];
            currentEvent = randomEvent;
            
            if (visualEffectsEnabled) applyVisualEffect();
            
            eventMessage.textContent = `Event: ${randomEvent.replace(/([A-Z])/g, ' $1').trim()}!`;

            if (randomEvent === 'modifiedMoveset') movesetModified = true;
            if (randomEvent === 'freeUpgrade') {
                let minVal = 1024, minPos = [];
                gameBoard.forEach((row, i) => row.forEach((val, j) => {
                    if (val > 0 && val < minVal) {
                        minVal = val;
                        minPos = [{r:i, c:j}];
                    } else if (val === minVal) {
                        minPos.push({r:i, c:j});
                    }
                }));
                if(minPos.length > 0) minPos.forEach(p => gameBoard[p.r][p.c]++);
            }
            if (randomEvent === 'rotateBomb') {
                 const emp = [];
                 gameBoard.forEach((row, i) => row.forEach((val, j) => { if (val === 0) emp.push({ i, j }); }));
                 if (emp.length > 0) {
                     const { i, j } = emp[Math.floor(Math.random() * emp.length)];
                     // Using a special high number for bomb tile
                     gameBoard[i][j] = 9999; 
                 }
            }
            
            document.body.classList.add('event-effect');
            setTimeout(() => { document.body.classList.remove('event-effect'); }, 1000);
            
            setTimeout(() => {
                eventMessage.textContent = "";
                currentEvent = null;
                rain();
            }, 2000);
        }

        function applyVisualEffect() {
            if (effects[currentEffect].class) document.body.classList.remove(effects[currentEffect].class);
            
            // Randomize next effect instead of cycling
            currentEffect = Math.floor(Math.random() * effects.length);
            
            if (effects[currentEffect].class) document.body.classList.add(effects[currentEffect].class);
        }

        function move(direction) {
            if (isAnimating) return;
            const b = dc(gameBoard);
            let moved = false;

            // Normalize board for 'fall' logic (always merge right)
            if (direction === 'l') { rotate(); rotate(); }
            else if (direction === 'u') { rotate(); }
            else if (direction === 'd') { rotate(); rotate(); rotate(); }
            
            moved = fall();
            
            // Rotate back to original orientation
            if (direction === 'l') { rotate(); rotate(); }
            else if (direction === 'u') { rotate(); rotate(); rotate(); }
            else if (direction === 'd') { rotate(); }

            if (moved) rain();
            else fail();
            draw();

            if (moved && movesetModified && level % 10 !== 0) {
                movesetModified = false;
            }
        }

        function fall() {
            let moved = false;
            for (let i = 0; i < 4; i++) {
                // Slide tiles
                let current = gameBoard[i];
                let filtered = current.filter(val => val !== 0);
                let zeros = Array(4 - filtered.length).fill(0);
                gameBoard[i] = zeros.concat(filtered);
                if (JSON.stringify(current) !== JSON.stringify(gameBoard[i])) moved = true;

                // Merge tiles
                for (let j = 3; j > 0; j--) {
                    if (gameBoard[i][j] !== 0 && gameBoard[i][j] === gameBoard[i][j - 1]) {
                        gameBoard[i][j]++;
                        score += Math.pow(2, gameBoard[i][j]) * (currentEvent === 'doublePoints' ? 2 : 1);
                        if(gameBoard[i][j] > level) level = gameBoard[i][j];
                        gameBoard[i][j - 1] = 0;
                        moved = true;
                    }
                }

                // Slide again after merge
                filtered = gameBoard[i].filter(val => val !== 0);
                zeros = Array(4 - filtered.length).fill(0);
                gameBoard[i] = zeros.concat(filtered);
            }
            return moved;
        }

        function rotate() {
            const newArray = Array(4).fill(null).map(() => Array(4).fill(0));
            for (let i = 0; i < 4; i++) {
                for (let j = 0; j < 4; j++) {
                    newArray[j][3 - i] = gameBoard[i][j];
                }
            }
            gameBoard = newArray;
        }

        function retry() {
            if (isAnimating) return;
            if (effects[currentEffect].class) document.body.classList.remove(effects[currentEffect].class);
            
            gameBoard.forEach(row => row.fill(0));
            score = 0;
            level = startLevel;
            phase = phaseMechanicsEnabled ? Math.min(9, Math.floor(level / 100) + 1) : 1;
            explodingCells = []; upgradingCells = []; isAnimating = false;
            currentEvent = null; movesetModified = false;
            eventMessage.textContent = "";
            currentEffect = 0;
            
            rain();
            rain();
            draw();
        }
        
        // --- Settings and New Controls ---
        function changeDifficulty(amount) {
            difficulty = Math.max(1, Math.min(20, difficulty + amount));
            updateDisplays();
        }

        function changeExplosionDuration(amount) {
            explosionDuration = Math.max(100, Math.min(2000, explosionDuration + amount * 100));
            updateDisplays();
        }

        function saveGame() { /* existing saveGame logic */ }
        function loadGame() { /* existing loadGame logic */ }

        // Event listeners
        document.addEventListener('keydown', e => {
            if (isAnimating) return;
            if (e.key === 'w' || e.key === 'ArrowUp') move('u');
            else if (e.key === 'a' || e.key === 'ArrowLeft') move('l');
            else if (e.key === 's' || e.key === 'ArrowDown') move('d');
            else if (e.key === 'd' || e.key === 'ArrowRight') move('r');
        });

        // Main Buttons
        document.getElementById('retryButton').addEventListener('click', retry);
        document.getElementById('saveButton').addEventListener('click', saveGame);
        document.getElementById('loadButton').addEventListener('click', loadGame);

        // Mobile Controls
        document.getElementById('mobile-up').addEventListener('click', () => move('u'));
        document.getElementById('mobile-left').addEventListener('click', () => move('l'));
        document.getElementById('mobile-down').addEventListener('click', () => move('d'));
        document.getElementById('mobile-right').addEventListener('click', () => move('r'));

        // Settings Menu
        toggleSettingsButton.addEventListener('click', () => { settingsMenu.style.display = 'block'; });
        closeSettingsButton.addEventListener('click', () => { settingsMenu.style.display = 'none'; });
        
        startLevelInput.addEventListener('change', () => {
            startLevel = parseInt(startLevelInput.value) || 1;
        });

        toggleStatsCheckbox.addEventListener('change', () => {
            statsDisplay.classList.toggle('hidden', !toggleStatsCheckbox.checked);
        });

        toggleVisualEffectsCheckbox.addEventListener('change', () => {
            visualEffectsEnabled = toggleVisualEffectsCheckbox.checked;
            if (!visualEffectsEnabled) {
                if (effects[currentEffect].class) document.body.classList.remove(effects[currentEffect].class);
            }
        });

        togglePhaseMechanicsCheckbox.addEventListener('change', () => {
            phaseMechanicsEnabled = togglePhaseMechanicsCheckbox.checked;
        });
        
        document.getElementById('increase-difficulty').addEventListener('click', () => changeDifficulty(1));
        document.getElementById('decrease-difficulty').addEventListener('click', () => changeDifficulty(-1));
        document.getElementById('increase-explosion').addEventListener('click', () => changeExplosionDuration(1));
        document.getElementById('decrease-explosion').addEventListener('click', () => changeExplosionDuration(-1));

    </script>
</body>
</html>
