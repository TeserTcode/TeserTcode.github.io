<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Coxeter Renderer</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/mathjs/10.0.1/math.min.js"></script>
<script src="clrspc.js"></script>
<script src="polyhedra.js"></script>
<script src="mthfnc.js"></script>

<style>
body{font-family:Arial;}
input{width:45px;}
canvas{border:1px solid black;display:block;margin-top:10px;}
table{border-collapse:collapse;}
td{padding:2px;}
</style>
</head>
<body>

<h3>Coxeter Matrix</h3>

<table>
<tr><td><input id="m00" value="1"></td><td><input id="m01" value="3"></td><td><input id="m02" value="2"></td></tr>
<tr><td><input id="m10" value="3"></td><td><input id="m11" value="1"></td><td><input id="m12" value="3"></td></tr>
<tr><td><input id="m20" value="2"></td><td><input id="m21" value="3"></td><td><input id="m22" value="1"></td></tr>
</table>

Decoration
<input id="d0" value="1">
<input id="d1" value="0">
<input id="d2" value="0">

<br><br>

Preset
<select id="preset"></select>
<button onclick="generate()">Generate</button>


<button onclick="generate()">Generate</button>

<canvas id="canvas" width="700" height="700"></canvas>

<script>

let verts=[], faces=[];
let rotX=0, rotY=0, zoom=1;

function readMatrix(){
return [
[+m00.value,+m01.value,+m02.value],
[+m10.value,+m11.value,+m12.value],
[+m20.value,+m21.value,+m22.value]
];
}

function readDecoration(){
return [+d0.value,+d1.value,+d2.value];
}

function generate(){
let M=readMatrix();
let V=readDecoration();

verts = normalizevertices(verticesfromcoxeter(M,V));
faces = computeConvexFaces(verts);

draw();
}

function rotate(v){
let [x,y,z]=v;
let cx=Math.cos(rotX), sx=Math.sin(rotX);
let cy=Math.cos(rotY), sy=Math.sin(rotY);

let y1=y*cx - z*sx;
let z1=y*sx + z*cx;

let x2=x*cy + z1*sy;
let z2=-x*sy + z1*cy;

return [x2,y1,z2];
}

function project(v){
let d=16;
let scale = zoom*2/(d - v[2]);
return [v[0]*scale*250 + 350, v[1]*scale*250 + 350];
}

/* Robust convex face extraction via half-space test */
function computeConvexFaces(V){
let faces=[];
let n=V.length;
let eps=1e-6;

/* Find supporting planes */
for(let i=0;i<n;i++){
for(let j=i+1;j<n;j++){
for(let k=j+1;k<n;k++){

let a=V[i], b=V[j], c=V[k];

let normal = math.cross(
math.subtract(b,a),
math.subtract(c,a)
);

if(math.norm(normal) < eps) continue;

let d = math.dot(normal,a);

/* Check half-space condition */
let sign=null;
let ok=true;

for(let p of V){
let s = math.dot(normal,p) - d;
if(Math.abs(s)<eps) continue;

if(sign===null) sign=Math.sign(s);
else if(Math.sign(s)!==sign){
ok=false;
break;
}
}

if(!ok) continue;

/* Collect ALL vertices lying on this plane */
let faceVerts=[];
for(let idx=0; idx<n; idx++){
let s = math.dot(normal,V[idx]) - d;
if(Math.abs(s) < 1e-4){
faceVerts.push(idx);
}
}

if(faceVerts.length < 3) continue;

/* ---- Order vertices around the plane ---- */

/* pick reference point */
let ref = V[faceVerts[0]];

/* build orthonormal basis in the plane */
let nrm = math.divide(normal, math.norm(normal));

let u = (
Math.abs(nrm[0]) > 0.9
? math.cross([0,1,0], nrm)
: math.cross([1,0,0], nrm)
);
u=math.div(u,math.norm(u))
let v = math.cross(nrm,u);

/* compute 2D angles */
faceVerts.sort((p,q)=>{
let ap = math.subtract(V[p], ref);
let aq = math.subtract(V[q], ref);

let px = math.dot(ap,u);
let py = math.dot(ap,v);
let qx = math.dot(aq,u);
let qy = math.dot(aq,v);

let angP = Math.atan2(py,px);
let angQ = Math.atan2(qy,qx);

return angP - angQ;
});

faces.push(faceVerts);
}
}
}

return faces;
}
function faceColor(k){
//if(k===3) return "rgba(200,200,255,1)";
//if(k===4) return "rgba(200,255,200,1)";
//if(k===5) return "rgba(255,200,200,1)";
//if(k===6) return "rgba(255,200,255,1)";
return "rgba("+(k*94)%255+","+k*52%255+","+k*72%255+",1)";
}

function buildEdgesFromFaces(){
let edgeSet=new Set();
for(let f of faces){
let [a,b,c]=f;
let e=[[a,b],[b,c],[c,a]];
for(let [u,v] of e){
let key=u<v?u+"_"+v:v+"_"+u;
edgeSet.add(key);
}
}
return Array.from(edgeSet).map(k=>k.split("_").map(Number));
}

function draw(){
let canvas=document.getElementById("canvas");
let ctx=canvas.getContext("2d");
ctx.clearRect(0,0,canvas.width,canvas.height);

let rverts=verts.map(v=>project(rotate(v)));

//let edges = buildEdgesFromFaces();

/* Draw faces */
/* compute face depth = average z of its vertices */
let faceData = faces.map(f=>{
let avgZ = 0;
for(let i=0;i<f.length;i++){
avgZ += rotate(verts[f[i]])[2];
}
avgZ /= f.length;
return {face:f, depth:avgZ};
});

/* sort far → near */
faceData.sort((a,b)=>a.depth - b.depth);

/* draw in order */
for(let item of faceData){

let pts = item.face.map(i=>rverts[i]);
ctx.strokeStyle = "rgba(0,0,0,0)";
ctx.beginPath();
ctx.moveTo(pts[0][0], pts[0][1]);
for(let i=1;i<pts.length;i++){
//ctx.moveTo(pts[0][0], pts[1][1]);
ctx.lineTo(pts[i][0], pts[i][1]);
}
ctx.closePath();

ctx.fillStyle = faceColor(item.face.length);
ctx.fill();
ctx.stroke();
}


ctx.beginPath();/*
for(let e of edges){
let a=rverts[e[0]];
let b=rverts[e[1]];
ctx.moveTo(a[0],a[1]);
ctx.lineTo(b[0],b[1]);
}*/
ctx.stroke();
}

/* Interaction */
document.getElementById("canvas").onmousemove=function(e){
if(e.buttons){
rotY+=e.movementX*0.01;
rotX+=e.movementY*0.01;
draw();
}
};

document.getElementById("canvas").addEventListener("wheel",function(e){
e.preventDefault();
zoom*= e.deltaY>0 ? 0.9 : 1.1;
draw();
});




function setM(M){
for(let i=0;i<3;i++)
for(let j=0;j<3;j++)
document.getElementById("m"+i+j).value=M[i][j];
}

function setD(v){
for(let i=0;i<3;i++)
document.getElementById("d"+i).value=v[i];
}
const PRESETS = {
tetra:        { M:[[1,3,2],[3,1,3],[2,3,1]], D:[1,0,0]},
cube:         { M:[[1,4,2],[4,1,3],[2,3,1]], D:[1,0,0]},
octa:         { M:[[1,4,2],[4,1,3],[2,3,1]], D:[0,0,1]},
dodeca:       { M:[[1,5,2],[5,1,3],[2,3,1]], D:[1,0,0]},
icosa:        { M:[[1,5,2],[5,1,3],[2,3,1]], D:[0,0,1]},

cubeoctahedron:{ M:[[1,4,2],[4,1,3],[2,3,1]], D:[0,1,0]},
trunctetra:    { M:[[1,3,2],[3,1,3],[2,3,1]], D:[1,1,0]},
trunccube:     { M:[[1,4,2],[4,1,3],[2,3,1]], D:[1,1,0]},
rhombicubeoctahedron:{ M:[[1,4,2],[4,1,3],[2,3,1]], D:[1,0,1]},
truncocta:     { M:[[1,4,2],[4,1,3],[2,3,1]], D:[0,1,1]},
trunccubeoctahedron:{ M:[[1,4,2],[4,1,3],[2,3,1]], D:[1,1,1]},

icosidodeca:   { M:[[1,5,2],[5,1,3],[2,3,1]], D:[0,1,0]},
truncicosa:    { M:[[1,5,2],[5,1,3],[2,3,1]], D:[0,1,1]},
truncicosadodeca:{ M:[[1,5,2],[5,1,3],[2,3,1]], D:[1,1,1]},
rhombicosidodeca:{ M:[[1,5,2],[5,1,3],[2,3,1]], D:[1,0,1]},
truncdodeca:    { M:[[1,5,2],[5,1,3],[2,3,1]], D:[1,1,0]}
};
// populate preset dropdown dynamically

for(let key in PRESETS){
let opt = document.createElement("option");
opt.value = key;
opt.textContent = key;
document.getElementById("preset").appendChild(opt);
}
document.getElementById("preset").onchange = function(){
let p = this.value;
if(!PRESETS[p]) return;

setM(PRESETS[p].M);
setD(PRESETS[p].D);
};

generate();

</script>

</body>
</html>
