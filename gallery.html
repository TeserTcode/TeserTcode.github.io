<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Image Gallery</title>

<style>
* {
    box-sizing: border-box;
}

body {
    font-family: Arial, sans-serif;
    margin: 0;
    padding: 20px;
    background: #f4f4f4;
}

.loading {
    text-align: center;
    padding: 20px;
    font-size: 1.2em;
    color: #666;
}

.gallery {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
    gap: 10px;
    max-width: 1200px;
    margin: auto;
}

.gallery img {
    width: 100%;
    height: auto;
    display: block;
    border-radius: 5px;
    box-shadow: 2px 2px 5px rgba(0,0,0,.2);
    transition: transform .2s, box-shadow .2s;
    cursor: pointer;
}

.gallery img:hover {
    transform: scale(1.05);
    box-shadow: 4px 4px 15px rgba(0,0,0,.3);
}

.folder-label {
    grid-column: 1 / -1;
    font-weight: bold;
    color: #444;
    padding: 8px 4px 4px;
    border-bottom: 2px solid #ddd;
    margin-top: 10px;
    font-size: 1.1em;
}

.fullscreen-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,.85);
    justify-content: center;
    align-items: center;
    flex-direction: column;
    z-index: 1000;
    padding: 20px;
    cursor: pointer;
}

.fullscreen-overlay img {
    max-width: 90vw;
    max-height: 80vh;
    object-fit: contain;
    border-radius: 5px;
    box-shadow: 4px 4px 20px rgba(0,0,0,.5);
}

.filename {
    color: white;
    margin-top: 12px;
    font-size: 1.1em;
    text-align: center;
    word-break: break-all;
}

.error {
    max-width: 800px;
    margin: 30px auto;
    padding: 20px;
    background: #fff;
    color: #900;
    border: 1px solid #c99;
    border-radius: 5px;
}
</style>

</head>

<body>

<div class="loading" id="loading">
    Loading images...
</div>

<div class="gallery" id="gallery"></div>

<div class="fullscreen-overlay" id="fullscreenOverlay">
    <img id="fullscreenImage" src="" alt="">
    <div class="filename" id="filename"></div>
</div>

<script>
const galleryDiv = document.getElementById("gallery");
const loadingDiv = document.getElementById("loading");
const fullscreenOverlay = document.getElementById("fullscreenOverlay");
const fullscreenImage = document.getElementById("fullscreenImage");
const filenameDiv = document.getElementById("filename");

const owner = "TeserTcode";
const repo = "TeserTcode.github.io";
const branch = "gh-pages";

const imageExtensions = [
    ".png",
    ".jpg",
    ".jpeg",
    ".gif",
    ".webp",
    ".bmp",
    ".svg"
];

function isImage(path) {
    const lower = path.toLowerCase();
    return imageExtensions.some(ext => lower.endsWith(ext));
}

function getImageUrl(path) {
    /*
     * GitHub Pages URL.
     *
     * For TeserTcode.github.io this becomes:
     * https://tesertcode.github.io/path/to/image.png
     */
    return "https://tesertcode.github.io/" +
        path.split("/")
            .map(encodeURIComponent)
            .join("/");
}

async function getRepositoryFiles() {

    const url =
        `https://api.github.com/repos/${owner}/${repo}/git/trees/${branch}?recursive=1`;

    const response = await fetch(url);

    if (!response.ok) {
        throw new Error(
            `GitHub API returned ${response.status}: ${response.statusText}`
        );
    }

    const data = await response.json();

    if (!data.tree) {
        throw new Error("GitHub returned no file tree.");
    }

    return data.tree
        .filter(file =>
            file.type === "blob" &&
            isImage(file.path)
        )
        .map(file => ({
            path: file.path,
            name: file.path.split("/").pop(),
            folder: file.path.includes("/")
                ? file.path.split("/").slice(0, -1).join("/")
                : "(root)",
            url: getImageUrl(file.path)
        }));
}

function showImage(image) {

    fullscreenImage.src = image.url;
    fullscreenImage.alt = image.name;

    filenameDiv.textContent =
        `${image.name}  (${image.folder})`;

    fullscreenOverlay.style.display = "flex";
}

function closeFullscreen() {
    fullscreenOverlay.style.display = "none";
    fullscreenImage.src = "";
}

function displayGallery(images) {

    galleryDiv.innerHTML = "";

    if (images.length === 0) {
        loadingDiv.textContent = "No images found.";
        return;
    }

    /*
     * Group images by folder.
     */
    const folders = {};

    for (const image of images) {
        if (!folders[image.folder]) {
            folders[image.folder] = [];
        }

        folders[image.folder].push(image);
    }

    /*
     * Sort folders alphabetically.
     */
    const folderNames = Object.keys(folders).sort();

    for (const folderName of folderNames) {

        const folderImages = folders[folderName];

        const label = document.createElement("div");
        label.className = "folder-label";

        label.textContent =
            `📁 ${folderName} (${folderImages.length})`;

        galleryDiv.appendChild(label);

        /*
         * Sort files alphabetically.
         */
        folderImages.sort((a, b) =>
            a.name.localeCompare(
                b.name,
                undefined,
                { numeric: true }
            )
        );

        for (const image of folderImages) {

            const img = document.createElement("img");

            img.src = image.url;
            img.alt = image.name;
            img.loading = "lazy";

            img.addEventListener("click", () => {
                showImage(image);
            });

            /*
             * If a particular image fails, remove it
             * instead of leaving a broken-image icon.
             */
            img.addEventListener("error", () => {
                img.remove();
            });

            galleryDiv.appendChild(img);
        }
    }

    loadingDiv.style.display = "none";
}

async function loadGallery() {

    loadingDiv.textContent =
        "Loading images from GitHub...";

    try {

        const images = await getRepositoryFiles();

        displayGallery(images);

    } catch (error) {

        console.error(error);

        loadingDiv.style.display = "none";

        const errorDiv = document.createElement("div");

        errorDiv.className = "error";

        errorDiv.textContent =
            "Could not load the GitHub repository: " +
            error.message;

        document.body.appendChild(errorDiv);
    }
}

fullscreenOverlay.addEventListener("click", closeFullscreen);

fullscreenImage.addEventListener("click", event => {
    event.stopPropagation();
});

document.addEventListener("keydown", event => {

    if (event.key === "Escape") {
        closeFullscreen();
    }

});

loadGallery();
</script>

</body>
</html>
