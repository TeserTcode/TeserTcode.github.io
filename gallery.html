<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image Gallery</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            background-color: #f4f4f4;
            margin: 0;
            padding: 20px;
        }
        .gallery {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            gap: 10px;
            max-width: 1200px;
        }
        .gallery img {
            width: 100%;
            height: auto;
            border-radius: 5px;
            box-shadow: 2px 2px 5px rgba(0, 0, 0, 0.2);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            cursor: pointer;
        }
        .gallery img:hover {
            transform: scale(1.05);
            box-shadow: 4px 4px 15px rgba(0, 0, 0, 0.3);
        }
        .fullscreen-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.8);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }
        .fullscreen-overlay img {
            max-width: 90%;
            max-height: 80%;
            border-radius: 5px;
            box-shadow: 4px 4px 20px rgba(0, 0, 0, 0.5);
            animation: zoomIn 0.5s ease;
        }
        .filename {
            color: #fff;
            margin-top: 10px;
            font-size: 1.2em;
            animation: fadeIn 0.5s ease;
        }
        @keyframes zoomIn {
            from {
                transform: scale(0.8);
                opacity: 0;
            }
            to {
                transform: scale(1);
                opacity: 1;
            }
        }
        @keyframes fadeIn {
            from {
                opacity: 0;
            }
            to {
                opacity: 1;
            }
        }
        .loading {
            text-align: center;
            padding: 20px;
            font-size: 1.2em;
            color: #666;
        }
    </style>
</head>
<body>
    <div class="loading" id="loading">Loading images...</div>
    <div class="gallery" id="gallery"></div>
    <div class="fullscreen-overlay" id="fullscreenOverlay">
        <img id="fullscreenImage" src="" alt="">
        <div class="filename" id="filename"></div>
    </div>
    <script>
        const galleryDiv = document.getElementById("gallery");
        const loadingDiv = document.getElementById("loading");
        const fullscreenOverlay = document.getElementById("fullscreenOverlay");
        const fullscreenImage = document.getElementById("fullscreenImage");
        const filenameDiv = document.getElementById("filename");

        // Function to check if an image exists
        async function checkImage(url) {
            return new Promise((resolve) => {
                const img = new Image();
                img.onload = () => resolve(true);
                img.onerror = () => resolve(false);
                img.src = url;
            });
        }

        // Function to find all available images
        async function findAvailableImages() {
            const extensions = ['.png', '.jpg', '.jpeg', '.gif', '.webp'];
            const foundImages = [];
            
            // First check for named images (if you still want some specific ones)
            const namedImages = ["sudbg", "resistbg1", "logo", "inductorbg", "epic1", 
                               "diodebg", "capacitorbg", "bgssad", "basee", "ABREbg", 
                               "7048bg", "7024bg", "2048bg", "plantelligence", "flowers"];
            
            for (const name of namedImages) {
                for (const ext of extensions) {
                    const url = `./${name}${ext}`;
                    if (await checkImage(url)) {
                        foundImages.push({name, url});
                        break;
                    }
                }
            }
            
            // Then check for numbered images (0-17 as in your original code)
            for (let i = 0; i <= 17; i++) {
                for (const ext of extensions) {
                    const url = `./${i}${ext}`;
                    if (await checkImage(url)) {
                        foundImages.push({name: i.toString(), url});
                        break;
                    }
                }
            }
            
            return foundImages;
        }

        // Load and display all available images
        async function loadGallery() {
            loadingDiv.textContent = "Scanning for images...";
            const availableImages = await findAvailableImages();
            
            if (availableImages.length === 0) {
                loadingDiv.textContent = "No images found in the directory.";
                return;
            }
            
            loadingDiv.style.display = "none";
            
            availableImages.forEach(image => {
                const img = document.createElement("img");
                img.src = image.url;
                img.alt = image.name;
                img.addEventListener('click', () => {
                    fullscreenImage.src = img.src;
                    filenameDiv.textContent = image.name;
                    fullscreenOverlay.style.display = 'flex';
                });
                galleryDiv.appendChild(img);
            });
        }

        fullscreenOverlay.addEventListener('click', () => {
            fullscreenOverlay.style.display = 'none';
        });

        // Start loading the gallery
        loadGallery();
    </script>
</body>
</html>
