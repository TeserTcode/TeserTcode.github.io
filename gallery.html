<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Image Gallery</title>

<style>

* {
    box-sizing: border-box;
}

body {
    font-family: Arial, sans-serif;
    margin: 0;
    padding: 20px;
    background: #f4f4f4;
}

.loading {
    text-align: center;
    padding: 20px;
    font-size: 1.2em;
    color: #666;
}

.gallery {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
    gap: 10px;
    max-width: 1200px;
    margin: auto;
}

.gallery img {
    width: 100%;
    height: auto;
    min-height: 20px;
    display: block;

    border-radius: 5px;

    box-shadow:
        2px 2px 5px rgba(0,0,0,.2);

    transition:
        transform .2s,
        box-shadow .2s;

    cursor: pointer;
}

.gallery img:hover {
    transform: scale(1.05);

    box-shadow:
        4px 4px 15px rgba(0,0,0,.3);
}

.folder-label {
    grid-column: 1 / -1;

    font-weight: bold;

    color: #444;

    padding:
        8px 4px 4px;

    border-bottom:
        2px solid #ddd;

    margin-top: 10px;

    font-size: 1.1em;
}

.folder-status {
    grid-column: 1 / -1;

    color: #888;

    font-size: .85em;

    padding:
        2px 4px 6px;
}

.fullscreen-overlay {
    display: none;

    position: fixed;

    inset: 0;

    background:
        rgba(0,0,0,.85);

    justify-content: center;

    align-items: center;

    flex-direction: column;

    z-index: 1000;

    padding: 20px;

    cursor: pointer;
}

.fullscreen-overlay img {
    max-width: 90vw;

    max-height: 80vh;

    object-fit: contain;

    border-radius: 5px;

    box-shadow:
        4px 4px 20px rgba(0,0,0,.5);
}

.filename {
    color: white;

    margin-top: 12px;

    font-size: 1.1em;

    text-align: center;

    word-break: break-all;
}

.error {
    max-width: 800px;

    margin: 30px auto;

    padding: 20px;

    background: #fff;

    color: #900;

    border: 1px solid #c99;

    border-radius: 5px;
}

</style>

</head>

<body>

<div class="loading" id="loading">
    Loading repository...
</div>

<div class="gallery" id="gallery"></div>

<div
    class="fullscreen-overlay"
    id="fullscreenOverlay"
>

```
<img
    id="fullscreenImage"
    src=""
    alt=""
>

<div
    class="filename"
    id="filename"
></div>
```

</div>

<script>

/* =========================================================
   SETTINGS
========================================================= */

const galleryDiv =
    document.getElementById("gallery");

const loadingDiv =
    document.getElementById("loading");

const fullscreenOverlay =
    document.getElementById("fullscreenOverlay");

const fullscreenImage =
    document.getElementById("fullscreenImage");

const filenameDiv =
    document.getElementById("filename");


const owner =
    "TeserTcode";

const repo =
    "TeserTcode.github.io";

const branch =
    "gh-pages";


const imageExtensions = [

    ".png",
    ".jpg",
    ".jpeg",
    ".gif",
    ".webp",
    ".bmp",
    ".svg"

];


/*
 * Number of images inserted into a large folder
 * at a time.
 */
const BATCH_SIZE = 40;


/*
 * Folders below this size are completely inserted
 * immediately.
 */
const SMALL_FOLDER_SIZE = 100;


/*
 * Delay between large-folder batches.
 *
 * This gives the browser time to paint the images
 * before more elements are inserted.
 */
const BATCH_DELAY = 20;


/* =========================================================
   IMAGE CHECK
========================================================= */

function isImage(path) {

    const lower =
        path.toLowerCase();

    return imageExtensions.some(
        ext =>
            lower.endsWith(ext)
    );
}


/* =========================================================
   IMAGE URL
========================================================= */

function getImageUrl(path) {

    return (
        "https://tesertcode.github.io/" +

        path
            .split("/")
            .map(
                encodeURIComponent
            )
            .join("/")
    );
}


/* =========================================================
   GET GITHUB FILE TREE
========================================================= */

async function getRepositoryFiles() {

    const url =
        `https://api.github.com/repos/` +
        `${owner}/${repo}/git/trees/` +
        `${branch}?recursive=1`;


    const response =
        await fetch(url);


    if (!response.ok) {

        throw new Error(
            `GitHub API returned ` +
            `${response.status}: ` +
            `${response.statusText}`
        );
    }


    const data =
        await response.json();


    if (!data.tree) {

        throw new Error(
            "GitHub returned no file tree."
        );
    }


    return data.tree

        .filter(
            file =>
                file.type === "blob" &&
                isImage(file.path)
        )

        .map(
            file => ({

                path:
                    file.path,

                name:
                    file.path
                        .split("/")
                        .pop(),

                folder:
                    file.path.includes("/")
                        ? file.path
                            .split("/")
                            .slice(0,-1)
                            .join("/")
                        : "(root)",

                url:
                    getImageUrl(
                        file.path
                    )

            })
        );
}


/* =========================================================
   CREATE IMAGE ELEMENT
========================================================= */

function addImage(image, priority) {

    const img =
        document.createElement("img");


    img.alt =
        image.name;


    /*
     * Tell the browser how important this image is.
     */
    if (priority) {

        img.loading =
            "eager";

        img.fetchPriority =
            "high";

    } else {

        img.loading =
            "lazy";

        img.fetchPriority =
            "low";
    }


    /*
     * Image click.
     */
    img.addEventListener(
        "click",
        () => {

            showImage(
                image
            );

        }
    );


    /*
     * Remove broken images.
     */
    img.addEventListener(
        "error",
        () => {

            img.remove();

        }
    );


    /*
     * IMPORTANT:
     *
     * Add the element to the DOM first.
     */
    galleryDiv.appendChild(
        img
    );


    /*
     * IMPORTANT:
     *
     * Setting src starts the request immediately.
     *
     * We DO NOT await the load event.
     */
    img.src =
        image.url;


    return img;
}


/* =========================================================
   ADD FOLDER HEADER
========================================================= */

function addFolderHeader(
    folderName,
    count
) {

    const label =
        document.createElement(
            "div"
        );

    label.className =
        "folder-label";

    label.textContent =
        `${folderName} (${count})`;


    galleryDiv.appendChild(
        label
    );


    return label;
}


/* =========================================================
   ADD FOLDER STATUS
========================================================= */

function addFolderStatus(
    folderName,
    count
) {

    const status =
        document.createElement(
            "div"
        );

    status.className =
        "folder-status";

    status.textContent =
        `Loading ${folderName}: 0 / ${count}`;


    galleryDiv.appendChild(
        status
    );


    return status;
}

   LOAD SMALL FOLDER
========================================================= */
