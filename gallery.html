<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image Gallery</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            background-color: #f4f4f4;
            margin: 0;
            padding: 20px;
        }
        .gallery {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            gap: 10px;
            max-width: 1200px;
        }
        .gallery img {
            width: 100%;
            height: auto;
            border-radius: 5px;
            box-shadow: 2px 2px 5px rgba(0, 0, 0, 0.2);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            cursor: pointer;
        }
        .gallery img:hover {
            transform: scale(1.05);
            box-shadow: 4px 4px 15px rgba(0, 0, 0, 0.3);
        }
        .fullscreen-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.8);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }
        .fullscreen-overlay img {
            max-width: 90%;
            max-height: 80%;
            border-radius: 5px;
            box-shadow: 4px 4px 20px rgba(0, 0, 0, 0.5);
            animation: zoomIn 0.5s ease;
        }
        .filename {
            color: #fff;
            margin-top: 10px;
            font-size: 1.2em;
            animation: fadeIn 0.5s ease;
        }
        @keyframes zoomIn {
            from {
                transform: scale(0.8);
                opacity: 0;
            }
            to {
                transform: scale(1);
                opacity: 1;
            }
        }
        @keyframes fadeIn {
            from {
                opacity: 0;
            }
            to {
                opacity: 1;
            }
        }
        .loading {
            text-align: center;
            padding: 20px;
            font-size: 1.2em;
            color: #666;
        }
        /* folder label style - minimal, keeps existing look */
        .folder-label {
            grid-column: 1 / -1;
            font-weight: bold;
            color: #444;
            padding: 8px 0 4px 4px;
            border-bottom: 2px solid #ddd;
            margin-bottom: 4px;
            font-size: 1.1em;
        }
    </style>
</head>
<body>
    <div class="loading" id="loading">Loading images...</div>
    <div class="gallery" id="gallery"></div>
    <div class="fullscreen-overlay" id="fullscreenOverlay">
        <img id="fullscreenImage" src="" alt="">
        <div class="filename" id="filename"></div>
    </div>
    <script>
        const galleryDiv = document.getElementById("gallery");
        const loadingDiv = document.getElementById("loading");
        const fullscreenOverlay = document.getElementById("fullscreenOverlay");
        const fullscreenImage = document.getElementById("fullscreenImage");
        const filenameDiv = document.getElementById("filename");

        // Function to check if an image exists
        async function checkImage(url) {
            return new Promise((resolve) => {
                const img = new Image();
                img.onload = () => resolve(true);
                img.onerror = () => resolve(false);
                img.src = url;
            });
        }

        // Scan a folder for images with given extensions and base names
        async function scanFolder(folderPath, extensions, baseNames) {
            const found = [];
            for (const name of baseNames) {
                for (const ext of extensions) {
                    const url = `${folderPath}/${name}${ext}`;
                    if (await checkImage(url)) {
                        found.push({ name: name, url: url, folder: folderPath });
                        break;
                    }
                }
            }
            return found;
        }

        // Get all subfolders (by trying common folder names + numbered)
        async function getSubfolders() {
            const folderCandidates = new Set();
            // Common folder names
            const common = ['images', 'img', 'photos', 'pics', 'gallery', 'assets', 'media', 'pictures', 'sub', 'folder', 'static', 'bg', 'icons', 'thumb'];
            for (const f of common) folderCandidates.add(f);
            // Numbered folders 0-20
            for (let i = 0; i <= 20; i++) folderCandidates.add(String(i));
            // Also check root (./) as a folder
            folderCandidates.add('.');

            const existing = [];
            const extensions = ['.png', '.jpg', '.jpeg', '.gif', '.webp'];
            // Base names to check in each folder
            const baseNames = [
                'sudbg', 'resistbg1', 'logo', 'inductorbg', 'epic1', 
                'diodebg', 'capacitorbg', 'bgssad', 'basee', 'ABREbg', 
                '7048bg', '7024bg', '2048bg', 'plantelligence', 'flowers',
                // numbered names 0-30
                ...Array.from({length: 31}, (_, i) => String(i)),
                // common names
                'photo', 'img', 'image', 'pic', 'snapshot', 'DSC', 'PICT', 'gallery', 'bg', 'hero', 'thumb'
            ];

            for (const folder of folderCandidates) {
                const path = folder === '.' ? '.' : `./${folder}`;
                const images = await scanFolder(path, extensions, baseNames);
                if (images.length > 0) {
                    existing.push({ folder: folder === '.' ? 'root' : folder, path: path, images: images });
                }
            }
            return existing;
        }

        // Load and display all available images from subfolders, ordered by count (least first)
        async function loadGallery() {
            loadingDiv.textContent = "Scanning for images in subfolders...";
            
            const folderData = await getSubfolders();
            
            if (folderData.length === 0) {
                loadingDiv.textContent = "No images found in any subfolder.";
                return;
            }

            // Sort folders by image count (least first)
            folderData.sort((a, b) => a.images.length - b.images.length);

            loadingDiv.style.display = "none";

            // For each folder, add a label and its images
            for (const folder of folderData) {
                // Folder label
                const label = document.createElement("div");
                label.className = "folder-label";
                label.textContent = `📁 ${folder.folder} (${folder.images.length} image${folder.images.length > 1 ? 's' : ''})`;
                galleryDiv.appendChild(label);

                // Images in this folder
                for (const imgData of folder.images) {
                    const img = document.createElement("img");
                    img.src = imgData.url;
                    img.alt = imgData.name;
                    // Store folder info for fullscreen display
                    img.dataset.folder = folder.folder;
                    img.dataset.filename = imgData.name;
                    img.addEventListener('click', () => {
                        fullscreenImage.src = img.src;
                        // Show filename + folder info
                        filenameDiv.textContent = `${imgData.name}  (from: ${folder.folder})`;
                        fullscreenOverlay.style.display = 'flex';
                    });
                    galleryDiv.appendChild(img);
                }
            }
        }

        fullscreenOverlay.addEventListener('click', () => {
            fullscreenOverlay.style.display = 'none';
        });

        // Start loading the gallery
        loadGallery();
    </script>
</body>
</html>
