        math.import({
            fractalNoise: function(t, octaves) {
                let value = 0;
                let amplitude = 1;
                for (let i = 0; i < octaves; i++) {
                    value += amplitude * math.noise(t * math.pow(2, i));
                    amplitude *= 0.5;
                }
                return value;
            },
            chaos: function(t, r) {
                // Logistic map chaotic function
                let x = 0.5;
                for (let i = 0; i < 100; i++) {
                    x = r * x * (1 - x);
                }
                let value = 0;
                for (let i = 0; i < 10; i++) {
                    x = r * x * (1 - x);
                    value += (x - 0.5) * math.sin(t * (i + 1));
                }
                return value / 5;
            },
            mengerSponge: function(t, iterations) {
                // Approximation of Menger sponge fractal
                let value = 0;
                for (let i = 0; i < iterations; i++) {
                    const freq = math.pow(3, i);
                    value += math.sin(t * freq * 2 * math.PI) / freq;
                }
                return value;
            },
            // More complex FM synthesis
            fmsynth2: function(t, carrier, modulator, index) {
                const modulation = index * math.sin(2 * math.PI * modulator * t);
                return math.sin(2 * math.PI * carrier * t + modulation);
            },
            // More complex AM synthesis
            amsynth2: function(t, carrier, modulator, depth) {
                return (1 + depth * math.sin(2 * math.PI * modulator * t)) * 
                       math.sin(2 * math.PI * carrier * t);
            },
            // Band-limited impulse train (for aliasing-free waveforms)
            blit2: function(t, freq) {
                const period = 1 / freq;
                const phase = t % period;
                const n = 7; // number of harmonics
                let sum = 0;
                for (let k = 1; k <= n; k++) {
                    sum += math.sin(2 * math.PI * k * freq * t) / k;
                }
                return (2 / math.PI) * sum;
            },
            // More sophisticated ADSR envelope
            adsr2: function(t, attack, decay, sustainLevel, release, duration = 1) {
                if (t < 0) return 0;
                if (t < attack) {
                    return t / attack;
                }
                if (t < attack + decay) {
                    return 1 - (1 - sustainLevel) * ((t - attack) / decay);
                }
                if (t < duration) {
                    return sustainLevel;
                }
                if (t < duration + release) {
                    return sustainLevel * (1 - (t - duration) / release);
                }
                return 0;
            }
        });

        // Key to frequency mapping
        const keyMap = {
            'a':0,'s':1,'d':2,'f':3,'g':4,'h':5,'j':6,'k':7,'l':8
        };
      const pressedKeys = new Set();

        function generateWaveform(frequency, duration = 1) {
            const sampleRate = audioContext.sampleRate;
            const numSamples = Math.floor(duration * sampleRate);
            const waveformData = new Float32Array(numSamples);

            for (let i = 0; i < numSamples; i++) {
                let t = i / sampleRate; // Time in seconds
                waveformData[i] = math.evaluate(waveformExpression, { t: t * frequency });
            }

            return waveformData;
        }

        function updateCachedWaveform() {
            cachedWaveform = generateWaveform(currentFrequency);
            drawWaveform(cachedWaveform);
        }

        function drawWaveform(waveformData) {
            const width = waveformCanvas.width;
            const height = waveformCanvas.height;
            canvasContext.clearRect(0, 0, width, height);
            canvasContext.beginPath();
            canvasContext.moveTo(0, height / 2);

            for (let i = 0; i < waveformData.length; i++) {
                const x = (i / waveformData.length) * width * 100;
                const y = (1.5 - waveformData[i]) * height / 3;
                canvasContext.lineTo(x, y);
            }

            canvasContext.stroke();
        }

        function playSound(frequency) {
            if (disableDoubleSoundCheckbox.checked) {
                // Stop all currently playing notes
                for (const freq in activeSources) {
                    stopSound(freq);
                }
            }

            if (activeSources[frequency]) {
                return; // Already playing
            }

            if (!cachedWaveform) {
                updateCachedWaveform(); // Generate waveform if not cached
            }

            const audioBuffer = audioContext.createBuffer(1, cachedWaveform.length, audioContext.sampleRate);
            audioBuffer.getChannelData(0).set(cachedWaveform);

            const source = audioContext.createBufferSource();
            source.buffer = audioBuffer;
            source.playbackRate.value = frequency / currentFrequency; // Adjust pitch
            source.loop = true; // Loop the sound while the key is pressed
            source.connect(audioContext.destination);
            source.start();

            activeSources[frequency] = source; // Store the active source
        }

        function stopSound(frequency) {
            if (activeSources[frequency]) {
                activeSources[frequency].stop();
                activeSources[frequency].disconnect();
                delete activeSources[frequency]; // Remove the source
            }
        }

        function handleKeyDown(event) {
            const key = event.key.toLowerCase();
            if (keyMap.hasOwnProperty(key) && !pressedKeys.has(key)) {
                pressedKeys.add(key); // Mark the key as pressed
                const scale = scales[scaleSelect.value];
                const frequency = scale[keyMap[key]];
                if (frequency) {
                    playSound(frequency);
                }
            }
        }

        function handleKeyUp(event) {
            const key = event.key.toLowerCase();
            if (keyMap.hasOwnProperty(key)) {
                pressedKeys.delete(key); // Mark the key as released
                const scale = scales[scaleSelect.value];
                const frequency = scale[keyMap[key]];
                if (frequency) {
                    stopSound(frequency);
                }
            }
        }

        function saveWaveform() {
            if (!cachedWaveform) {
                updateCachedWaveform(); // Generate waveform if not cached
            }

            const buffer = new ArrayBuffer(cachedWaveform.length * 2);
            const view = new DataView(buffer);
            let offset = 0;

            cachedWaveform.forEach(sample => {
                view.setInt16(offset, sample * 32767, true);
                offset += 2;
            });

            const blob = new Blob([buffer], { type: 'audio/wav' });
            const link = document.createElement('a');
            link.href = URL.createObjectURL(blob);
            link.download = 'waveform.wav';
            link.click();
        }

        waveformInput.addEventListener('input', () => {

        });

        presetFunctions.addEventListener('change', () => {
            waveformInput.value = presetFunctions.value;
            waveformExpression = presetFunctions.value;
        });

        updateWaveformButton.addEventListener('click', () => {
            updateCachedWaveform(); // Update the cached waveform when the button is clicked
        });

        scaleSelect.addEventListener('change', () => {
            // Update the scale when changed
        });

        startToneInput.addEventListener('input', () => {
            currentFrequency = parseFloat(startToneInput.value);
        });

        saveButton.addEventListener('click', saveWaveform);

        document.addEventListener('keydown', handleKeyDown);
        document.addEventListener('keyup', handleKeyUp);

        // Initialize the cached waveform
        updateCachedWaveform();
    </script>
</body>
