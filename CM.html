<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Circular Membrane Animation</title>
  <style>
    body { margin: 0; font-family: Arial, sans-serif; }
    #controls { position: absolute; top: 10px; left: 10px; background: rgba(255, 255, 255, 0.8); padding: 10px; border-radius: 5px; }
    #controls input { width: 100px; margin-bottom: 5px; }
    #renderer { display: block; }
  </style>
</head>
<body>
  <!-- Controls -->
  <div id="controls">
    <label for="m">m:</label>
    <input type="number" id="m" value="2"><br>
    <label for="n">n:</label>
    <input type="number" id="n" value="3"><br>
    <label for="r">r:</label>
    <input type="number" id="r" value="1"><br>
    <label for="th">th:</label>
    <input type="number" id="th" value="0"><br>
    <label for="a">a:</label>
    <input type="number" id="a" value="1"><br>
    <label for="c">c:</label>
    <input type="number" id="c" value="1"><br>
    <label for="aa">aa:</label>
    <input type="number" id="aa" value="1"><br>
    <label for="bb">bb:</label>
    <input type="number" id="bb" value="0"><br>
    <label for="cc">cc:</label>
    <input type="number" id="cc" value="1"><br>
    <label for="dd">dd:</label>
    <input type="number" id="dd" value="0"><br>
    <label for="speed">Animation Speed:</label>
    <input type="number" id="speed" value="1"><br>
    <label for="quality">Mesh Quality:</label>
    <input type="number" id="quality" value="20"><br>
    <label for="precomputed">Precomputed Meshes:</label>
    <input type="number" id="precomputed" value="20"><br>

    <!-- Camera Controls -->
    <button onclick="setCameraView('front')">Front View</button>
    <button onclick="setCameraView('side')">Side View</button>
	<button onclick="setCameraView('angled')">Angled View</button>
    <button onclick="setCameraView('top')">Top View</button><br>

    <!-- Material Controls -->
    <label for="material">Material:</label>
    <select id="material" onchange="changeMaterial()">
	  <option value="filled">Filled</option>
      <option value="wireframe">Wireframe</option>
    
    </select>
  </div>

  <!-- THREE.js Renderer -->
  
  <script src="https://cdnjs.cloudflare.com/ajax/libs/mathjs/10.0.1/math.min.js"></script>- THREE.js Renderer -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="clrspc.js"></script>
  <script src="mthfnc.js"></script>
  <script>
    // Scene setup
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
    const renderer = new THREE.WebGLRenderer();
    renderer.setSize(window.innerWidth, window.innerHeight);
    document.body.appendChild(renderer.domElement);

    // Lighting
    const light = new THREE.SpotLight(0xffffff, 2);
    light.position.set(5, 5, 5).normalize();
    scene.add(light);
const ambientLight = new THREE.AmbientLight(0xffffff, 0.5); // Color: white, Intensity: 2
scene.add(ambientLight);

    // Parameters
    let m = 2, n = 3, r = 1, th = 0, a = 1, c = 1, aa = 1, bb = 0, ccc = 1, ddd = 0;
    let speed = 1, quality = 20, precomputed = 10;
    let t = 0;

    // Create initial geometry and material
    let geometry = new THREE.ParametricGeometry((u, v, target) => {
      const theta = u * Math.PI * 2;
      const radius = v * r;
      const height = circularmembrane(m, n, radius, theta, t, a, c, aa/1.3, bb, ccc, ddd);
      target.set(radius * Math.cos(theta), radius * Math.sin(theta)*1.3, height);
    }, quality, quality);

   let material = new THREE.MeshPhongMaterial({ wireframe: false, side: THREE.DoubleSide, vertexColors: THREE.VertexColors, });

    let mesh = new THREE.Mesh(geometry, material);
    scene.add(mesh);

    // Camera position
    camera.position.z = 5;

    // Animation loop
    function animate() {
      requestAnimationFrame(animate);

      // Update parameters from input fields
      m = parseFloat(document.getElementById('m').value);
      n = parseFloat(document.getElementById('n').value);
      a = parseFloat(document.getElementById('a').value);
      c = parseFloat(document.getElementById('c').value);
      aa = parseFloat(document.getElementById('aa').value);
      bb = parseFloat(document.getElementById('bb').value);
      ccc = parseFloat(document.getElementById('cc').value);
      ddd = parseFloat(document.getElementById('dd').value);
      speed = parseFloat(document.getElementById('speed').value);
      quality = parseFloat(document.getElementById('quality').value);
      precomputed = parseFloat(document.getElementById('precomputed').value);

      // Update time
      t += 0.01 * speed;

      // Update mesh geometry
      scene.remove(mesh);
      geometry = new THREE.ParametricGeometry((u, v, target) => {
        const theta = u * Math.PI * 2;
        const radius = v * r;
        const height = (radius>a)?0:re(circularmembrane(m, n, radius, theta, t, a, c, aa, bb, ccc, ddd))||0;
        target.set(radius * Math.cos(theta), radius * Math.sin(theta), height);
      }, quality, quality);

  const colors = new Float32Array(geometry.attributes.position.count * 3); // RGB for each vertex
    for (let i = 0; i < geometry.attributes.position.count; i++) {
        const z = geometry.attributes.position.getZ(i);
const colorValue = Math.min(1, Math.max(0, (z*5 + 1) / 2));
const color = new THREE.Color(colorValue, 0, 1 - colorValue); 
		colors[i * 3] = color.r;
        colors[i * 3 + 1] = color.g;
        colors[i * 3 + 2] = color.b;
	}
	
	geometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));
      mesh = new THREE.Mesh(geometry, material);
      scene.add(mesh);

       const torusGeometry = new THREE.TorusGeometry(a * 1, 0.1, quality, 100);  // Adjust the radii as needed
    const torusMaterial = new THREE.MeshBasicMaterial({ color: 0x808080, wireframe: false });  // Grey color with wireframe for visual effect
    const torusMesh = new THREE.Mesh(torusGeometry, torusMaterial);  // Torus mesh

    torusMesh.position.z = 0;  // Set it at height 0 (same as the circle mesh)
    //torusMesh.rotation.x = Math.PI / 2;  // Align it with the X-Y plane (flat)

    scene.add(torusMesh);



      renderer.render(scene, camera);
    }

    animate();

    // Handle window resize
    window.addEventListener('resize', () => {
      const width = window.innerWidth;
      const height = window.innerHeight;
      renderer.setSize(width, height);
      camera.aspect = width / height;
      camera.updateProjectionMatrix();
    });

    // Camera View Functions
    function setCameraView(view) {
      switch (view) {
        case 'front':
          camera.position.set(0, 0, 5);
          camera.lookAt(0, 0, 0);
          break;
        case 'side':
          camera.position.set(5, 0, 0);
          camera.lookAt(0, 0, 0);
          break;
        case 'top':
          camera.position.set(0, 5, 0);
          camera.lookAt(0, 0, 0);
          break;
		case 'angled':
          camera.position.set(0, -3, 5);
          camera.lookAt(0, 0, 0);
          break;
      }
    }

    // Material Change Function
    function changeMaterial() {
      const materialType = document.getElementById('material').value;
      if (materialType === 'wireframe') {
        material.wireframe = true;
      } else if (materialType === 'filled') {
        material.wireframe = false;
      }
      mesh.material = material;
    }
  </script>
</body>
</html>
