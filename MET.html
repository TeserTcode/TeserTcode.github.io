        // --- Firebase Configuration ---
        const appId = typeof __app_id !== 'undefined' ? __app_id : 'default-math-app';

        /**
         * Runs the app in offline mode, without saving progress to Firebase.
         */
        function runOfflineMode() {
            console.warn("Firebase not connected. Running in offline mode. Progress will not be saved.");
            problems = JSON.parse(JSON.stringify(initialProblems));
            initializeAppUI();
        }

        /**
         * Initializes the application, sets up Firebase if available, or falls back to offline mode.
         */
        async function init() {
            // Simulate loading with a progress bar
            let progress = 0;
            loadingInterval = setInterval(() => {
                progress += 5;
                loadingBar.style.width = `${Math.min(progress, 95)}%`; // Stop just before 100
                if (progress >= 100) clearInterval(loadingInterval);
            }, 100);


            // Render initial math on page load
            if (window.renderMathInElement) {
                renderMathInElement(document.body);
            }
            let firebaseConfig;
            try {
                if (typeof __firebase_config !== 'undefined' && __firebase_config) {
                    firebaseConfig = JSON.parse(__firebase_config);
                } else {
                    runOfflineMode();
                    return;
                }
                
                const app = initializeApp(firebaseConfig);
                auth = getAuth(app);
                db = getFirestore(app);

                onAuthStateChanged(auth, async (user) => {
                    if (user) {
                        userId = user.uid;
                        await setupProblemDataListener();
                    } else {
                        await authenticateUser();
                    }
                });
            } catch (error) {
                console.error("Firebase initialization failed:", error);
                loadingEl.innerHTML = `<p class="text-red-500">Error fetching data: ${error.message}</p>`;
                runOfflineMode();
            }
        }
        
        async function authenticateUser() {
            try {
                if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                    await signInWithCustomToken(auth, __initial_auth_token);
                } else {
                    await signInAnonymously(auth);
                }
            } catch (error) {
                console.error("Authentication failed:", error);
                runOfflineMode();
            }
        }

        async function setupProblemDataListener() {
            if (!userId) return;
            const docRef = doc(db, "artifacts", appId, "users", userId);
            
            if (problemDataUnsubscribe) problemDataUnsubscribe();

            problemDataUnsubscribe = onSnapshot(docRef, (docSnap) => {
                if (docSnap.exists() && docSnap.data().problems) {
                    problems = docSnap.data().problems;
                } else {
                    problems = JSON.parse(JSON.stringify(initialProblems));
                    saveProblemsToFirestore();
                }
                
                if (mainContentEl.classList.contains('hidden')) {
                    initializeAppUI();
                } else {
                    updateStats();
                    filterAndLoadProblem();
                    renderProblemList(); // Update list after data change
                }
            }, (error) => {
                console.error("Error listening to problem data:", error);
                loadingEl.innerHTML = `<p class="text-red-500">Error fetching data: ${error.message}</p>`;
                runOfflineMode();
            });
        }

        async function saveProblemsToFirestore() {
            if (!userId || !db) return;
            try {
                const docRef = doc(db, "artifacts", appId, "users", userId);
                await setDoc(docRef, { problems: problems }, { merge: true });
            } catch (error) {
                console.error("Error saving to Firestore:", error);
            }
        }

        function initializeAppUI() {
            // Complete and hide the loading bar
            clearInterval(loadingInterval);
            loadingBar.style.width = '100%';
            setTimeout(() => {
                loadingEl.classList.add('hidden');
                mainContentEl.classList.remove('hidden');
            }, 400);

            populateFilters();
            addEventListeners();
            updateStats();
            filterAndLoadProblem();
            renderProblemList(); // Initial render of the problem list
        }

        function populateFilters() {
            const categories = [...new Set(problems.map(p => p.category))].sort();
            const difficulties = [...new Set(problems.map(p => p.difficulty))].sort((a,b) => a-b);

            categorySelect.innerHTML = '<option>All</option>';
            categories.forEach(cat => {
                const option = document.createElement('option');
                option.value = cat;
                option.textContent = cat;
                categorySelect.appendChild(option);
            });

            difficultySelect.innerHTML = '<option>All</option>';
            difficulties.forEach(diff => {
                const option = document.createElement('option');
                option.value = diff;
                option.textContent = `${'★'.repeat(diff)}${'☆'.repeat(5-diff)}`;
                difficultySelect.appendChild(option);
            });
        }

        function addEventListeners() {
            submitBtn.addEventListener('click', checkAnswer);
            nextBtn.addEventListener('click', () => filterAndLoadProblem(true));
            categorySelect.addEventListener('change', () => {
                filterAndLoadProblem();
                renderProblemList(); // Re-render list on filter change
            });
            difficultySelect.addEventListener('change', () => {
                filterAndLoadProblem();
                renderProblemList(); // Re-render list on filter change
            });
            problemCard.addEventListener('keydown', (e) => {
                if (e.key === 'Enter' && e.target.id === 'answer-input') {
                    checkAnswer();
                }
            });
        }

        function updateStats() {
            const solved = problems.filter(p => p.solved).length;
            solvedCountEl.textContent = `${solved} / ${problems.length}`;
        }
        
        function filterAndLoadProblem(forceNext = false) {
            const selectedCategory = categorySelect.value;
            const selectedDifficulty = difficultySelect.value;

            let availableIndices = problems
                .map((p, index) => ({ p, index }))
                .filter(({ p }) => !p.solved)
                .filter(({ p }) => selectedCategory === 'All' || p.category === selectedCategory)
                .filter(({ p }) => selectedDifficulty === 'All' || p.difficulty == selectedDifficulty)
                .map(({ index }) => index);
            
            if (availableIndices.length === 0) {
                 // If all problems in the filter are solved, show all solved problems for that filter
                 availableIndices = problems
                    .map((p, index) => ({ p, index }))
                    .filter(({ p }) => selectedCategory === 'All' || p.category === selectedCategory)
                    .filter(({ p }) => selectedDifficulty === 'All' || p.difficulty == selectedDifficulty)
                    .map(({ index }) => index);
            }

            filteredProblemIndices = availableIndices;

            if (filteredProblemIndices.length === 0) {
                currentProblemIndex = -1;
                displayNoProblemsMessage();
                return;
            }

            let nextIndexToGo = 0;
            if (forceNext && currentProblemIndex !== -1) {
                const currentFilteredPos = filteredProblemIndices.indexOf(currentProblemIndex);
                if (currentFilteredPos !== -1) {
                   nextIndexToGo = (currentFilteredPos + 1) % filteredProblemIndices.length;
                }
            } else if (!forceNext && currentProblemIndex !== -1 && filteredProblemIndices.includes(currentProblemIndex)) {
                nextIndexToGo = filteredProblemIndices.indexOf(currentProblemIndex);
            } else {
                nextIndexToGo = 0;
            }
            
            currentProblemIndex = filteredProblemIndices[nextIndexToGo];
            displayProblem(currentProblemIndex);
            renderProblemList(); // Update list to highlight selected problem
        }

        function renderProblemList() {
            problemListContainer.innerHTML = ''; // Clear existing list

            const selectedProblemId = problems[currentProblemIndex]?.id;

            filteredProblemIndices.forEach(index => {
                const problem = problems[index];
                const listItem = document.createElement('div');
                listItem.classList.add('p-3', 'rounded-md', 'problem-list-item', 'flex', 'items-center', 'justify-between', 'text-sm', 'border-b', 'border-gray-200', 'last:border-b-0');

                if (problem.id === selectedProblemId) {
                    listItem.classList.add('selected', 'bg-indigo-100'); // Highlight selected problem
                } else {
                    listItem.classList.add('bg-white');
                }

                const stars = '★'.repeat(problem.difficulty) + '☆'.repeat(5 - problem.difficulty);
                let starClasses = 'star-rating';
                if (problem.difficulty === 5) {
                    starClasses = 'star-rating-5-red';
                }
                // No difficulty 6 in data, so no need for 'star-rating-6-cyan'

                listItem.innerHTML = `
                    <div class="flex-1 overflow-hidden">
                        <p class="font-medium text-gray-900 truncate">Problem #${problem.id}: ${problem.text.substring(0, 50)}...</p>
                        <p class="text-gray-600">${problem.category} <span class="${starClasses}">${stars}</span></p>
                    </div>
                    <div class="flex-shrink-0 ml-4">
                        ${problem.solved ? '<span class="text-green-500 font-bold">✔ Solved</span>' : '<span class="text-gray-500">Unsolved</span>'}
                    </div>
                `;
                listItem.addEventListener('click', () => {
                    currentProblemIndex = index;
                    displayProblem(index);
                    // Remove 'selected' from all and add to current
                    document.querySelectorAll('.problem-list-item').forEach(item => item.classList.remove('selected', 'bg-indigo-100'));
                    listItem.classList.add('selected', 'bg-indigo-100');
                });
                problemListContainer.appendChild(listItem);
            });
            if (window.renderMathInElement) {
                renderMathInElement(problemListContainer);
            }
        }


        function displayProblem(index) {
            if (index < 0 || index >= problems.length) {
                displayNoProblemsMessage();
                return;
            }

            const problem = problems[index];
            problemContentEl.classList.remove('hidden');
            noProblemsEl.classList.add('hidden');

            const stars = '★'.repeat(problem.difficulty) + '☆'.repeat(5 - problem.difficulty);
            let starClasses = 'star-rating';
            if (problem.difficulty === 5) {
                starClasses = 'star-rating-5-red';
            }
            // No difficulty 6 in data, so no need for 'star-rating-6-cyan'
            
            let wrongGuessesHTML = '';
            if (problem.wrongGuesses && problem.wrongGuesses.length > 0) {
                wrongGuessesHTML = `
                    <div class="mt-4 bg-red-50 border-l-4 border-red-400 p-3 rounded-r-lg">
                        <h4 class="font-semibold text-red-800">Your previous incorrect guesses:</h4>
                        <ul class="list-disc list-inside text-red-700 mt-1">
                            ${problem.wrongGuesses.map(g => `<li>${g}</li>`).join('')}
                        </ul>
                    </div>
                `;
            }
            
            let explanationHTML = '';
            if (problem.solved && problem.explanation) {
                 explanationHTML = `
                    <div class="mt-4 bg-blue-50 border-l-4 border-blue-400 p-4 rounded-r-lg">
                        <h4 class="font-semibold text-blue-800">Explanation</h4>
                        <p class="text-blue-700 mt-2">${problem.explanation}</p>
                    </div>
                `;
            }

            problemContentEl.innerHTML = `
                <div class="flex justify-between items-start">
                    <p class="text-sm font-medium text-indigo-600 bg-indigo-100 px-3 py-1 rounded-full">${problem.category}</p>
                    <div class="${starClasses} text-xl" title="${problem.difficulty} star difficulty">${stars}</div>
                </div>
                <p class="mt-4 text-lg text-gray-700">${problem.text}</p>
                <div class="mt-6">
                    <label for="answer-input" class="block text-sm font-medium text-gray-700">Your Answer:</label>
                    <input type="${typeof problem.answer === 'number' ? 'number' : 'text'}" id="answer-input" class="mt-1 block w-full px-3 py-2 bg-white border border-gray-300 rounded-md shadow-sm placeholder-gray-400 focus:outline-none focus:ring-indigo-500 focus:border-indigo-500 sm:text-sm" placeholder="Enter your answer">
                </div>
                <div id="feedback-container" class="mt-4 text-center font-medium h-6"></div>
                <div id="explanation-container" class="mt-4">${explanationHTML}</div>
                <div id="wrong-guesses-container">${wrongGuessesHTML}</div>
            `;
            
            if (window.renderMathInElement) {
                renderMathInElement(problemContentEl);
            }
            
            submitBtn.disabled = problem.solved;
            const answerInput = document.getElementById('answer-input');
            answerInput.disabled = problem.solved;

            if(problem.solved) {
                const feedbackEl = document.getElementById('feedback-container');
                const correctAnswerDisplay = (typeof problem.answer === 'number') ? toSignificantFigures(problem.answer, 3) : problem.answer; // Changed to 3 SF
                feedbackEl.innerHTML = `<p class="text-green-600">Solved! The correct answer is ${correctAnswerDisplay}.</p>`;
                answerInput.value = correctAnswerDisplay;
            }
        }

        function displayNoProblemsMessage() {
            problemContentEl.classList.add('hidden');
            noProblemsEl.classList.remove('hidden');
            submitBtn.disabled = true;
        }

        function checkAnswer() {
            if (currentProblemIndex === -1) return;

            const answerInput = document.getElementById('answer-input');
            const feedbackEl = document.getElementById('feedback-container');
            const problem = problems[currentProblemIndex];
            
            let isCorrect = false;

            if (typeof problem.answer === 'number') {
                const userAnswer = parseFloat(answerInput.value);
                if (isNaN(userAnswer)) {
                    feedbackEl.innerHTML = `<p class="text-red-600">Please enter a valid number.</p>`;
                    return;
                }
                const correctAnswerRounded = toSignificantFigures(problem.answer, 3); // Changed to 3 SF
                const userAnswerRounded = toSignificantFigures(userAnswer, 3); // Changed to 3 SF
                if (userAnswerRounded === correctAnswerRounded) {
                    isCorrect = true;
                }
            } else if (typeof problem.answer === 'string') {
                if (answerInput.value.trim().toLowerCase() === problem.answer.toLowerCase()) {
                    isCorrect = true;
                }
            }

            if (isCorrect) {
                const correctAnswerDisplay = (typeof problem.answer === 'number') ? toSignificantFigures(problem.answer, 3) : problem.answer; // Changed to 3 SF
                feedbackEl.innerHTML = `<p class="text-green-600">Correct! The answer is ${correctAnswerDisplay}.</p>`;
                problem.solved = true;
                submitBtn.disabled = true;
                answerInput.disabled = true;
                
                if (problem.explanation) {
                    const explanationEl = document.getElementById('explanation-container');
                    explanationEl.innerHTML = `
                        <div class="mt-4 bg-blue-50 border-l-4 border-blue-400 p-4 rounded-r-lg">
                            <h4 class="font-semibold text-blue-800">Explanation</h4>
                            <p class="text-blue-700 mt-2">${problem.explanation}</p>
                        </div>
                    `;
                    if (window.renderMathInElement) {
                        renderMathInElement(explanationEl);
                    }
                }

                updateStats();
                saveProblemsToFirestore();
                renderProblemList(); // Update list after problem is solved
            } else {
                feedbackEl.innerHTML = `<p class="text-red-600">Not quite. Try again!</p>`;
                const userGuess = answerInput.value;
                if (!problem.wrongGuesses) problem.wrongGuesses = [];
                if (userGuess && !problem.wrongGuesses.includes(userGuess)) {
                    problem.wrongGuesses.push(userGuess);
                     if(db && userId) {
                        saveProblemsToFirestore();
                    } else {
                        displayProblem(currentProblemIndex);
                    }
                }
            }
        }
        
        function toSignificantFigures(num, sf) {
            if (typeof num !== 'number' || isNaN(num)) return num;
            if (num === 0) return 0;
            const d = Math.ceil(Math.log10(num < 0 ? -num : num));
            const power = sf - d;
            const magnitude = Math.pow(10, power);
            const shifted = Math.round(num * magnitude);
            return shifted / magnitude;
        }

        init();

    </script>
