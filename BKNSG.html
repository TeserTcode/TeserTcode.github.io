<!DOCTYPE html>
<html>
<head>
    <title>Bipartite Kneser Graph Visualizer</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: white;
            color: black;
            text-align: center;
            margin: 20px;
        }
        .controls {
            margin-bottom: 20px;
        }
        canvas {
            border: 1px solid #ccc;
            margin: 0 auto;
            display: block;
        }
        .orbit-controls {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 5px;
            margin: 10px 0;
        }
        .orbit-btn {
            padding: 3px 6px;
            font-size: 12px;
        }
        .config-panel {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 10px;
            margin: 15px auto;
            max-width: 800px;
            text-align: left;
        }
        .config-group {
            border: 1px solid #eee;
            padding: 10px;
            border-radius: 5px;
        }
        button {
            padding: 5px 10px;
            margin: 0 5px;
        }
        label {
            display: block;
            margin: 5px 0;
        }
    </style>
</head>
<body>
    <h1>Bipartite Kneser Graph Visualizer</h1>
    <div class="controls">
        <label for="n">n (size):</label>
        <input type="number" id="n" min="2" max="10" value="5">
        <label for="k">k (subset size):</label>
        <input type="number" id="k" min="1" max="5" value="2">
        <button onclick="generateGraph()">Generate Graph</button>
    </div>
    
    <div class="config-panel">
        <div class="config-group">
            <h3>Orbit Controls</h3>
            <button onclick="rotateAllOrbits()">Rotate All Orbits</button>
            <button onclick="optimizeLayout()">Optimize Layout</button>
            <div id="orbitButtons" class="orbit-controls"></div>
        </div>
        
        <div class="config-group">
            <h3>Edge Style</h3>
            <label>
                <select id="edgeStyle" onchange="updateEdgeStyle()">
                    <option value="straight">Straight</option>
                    <option value="curved">Curved</option>
                    <option value="bundled">Bundled</option>
                    <option value="faded">Length-Faded</option>
                </select>
            </label>
            <label>
                Curvature: <input type="range" id="curvature" min="0" max="100" value="30" onchange="drawBipartiteGraph()">
            </label>
        </div>
        
        <div class="config-group">
            <h3>Edge Filtering</h3>
            <label>
                Max edges per node: <input type="number" id="maxEdges" min="1" max="50" value="10" onchange="drawBipartiteGraph()">
            </label>
            <label>
                Min edge length: <input type="range" id="minEdgeLength" min="0" max="200" value="0" onchange="drawBipartiteGraph()">
            </label>
        </div>
    </div>
    
    <canvas id="graphCanvas" width="800" height="600"></canvas>

    <script>
        let canvas, ctx;
        let kSubsets = [], nkSubsets = [];
        let kOrbits = [], nkOrbits = [];
        let n = 5, k = 2;
        let currentKRotations = [], currentNKRotations = [];
        let edgeStyle = "straight";
        let curvature = 0.3;
        let maxEdges = 10;
        let minEdgeLength = 0;
        
        window.onload = function() {
            canvas = document.getElementById('graphCanvas');
            ctx = canvas.getContext('2d');
            generateGraph();
        };
        
        function generateGraph() {
            n = parseInt(document.getElementById('n').value);
            k = parseInt(document.getElementById('k').value);
            edgeStyle = document.getElementById('edgeStyle').value;
            curvature = parseInt(document.getElementById('curvature').value) / 100;
            maxEdges = parseInt(document.getElementById('maxEdges').value);
            minEdgeLength = parseInt(document.getElementById('minEdgeLength').value);
            
            if (k >= n) {
                alert("k must be less than n");
                return;
            }
            
            // Generate both k-subsets and (n-k)-subsets
            kSubsets = generateCombinations(n, k);
            nkSubsets = generateCombinations(n, n - k);
            
            // Group into orbits
            kOrbits = groupIntoOrbits(kSubsets, n);
            nkOrbits = groupIntoOrbits(nkSubsets, n);
            
            currentKRotations = new Array(kOrbits.length).fill(0);
            currentNKRotations = new Array(nkOrbits.length).fill(0);
            
            createOrbitButtons();
            optimizeLayout();
        }
        
        function updateEdgeStyle() {
            edgeStyle = document.getElementById('edgeStyle').value;
            drawBipartiteGraph();
        }
        
        function createOrbitButtons() {
            const container = document.getElementById('orbitButtons');
            container.innerHTML = '';
            
            // k-subset orbits
            kOrbits.forEach((orbit, i) => {
                const btn = document.createElement('button');
                btn.className = 'orbit-btn';
                btn.textContent = `k-Orbit ${i+1}`;
                btn.style.backgroundColor = '#ffdddd';
                btn.onclick = () => {
                    currentKRotations[i] = (currentKRotations[i] + 1) % orbit.length;
                    drawBipartiteGraph();
                };
                container.appendChild(btn);
            });
            
            // (n-k)-subset orbits
            nkOrbits.forEach((orbit, i) => {
                const btn = document.createElement('button');
                btn.className = 'orbit-btn';
                btn.textContent = `(n-k)-Orbit ${i+1}`;
                btn.style.backgroundColor = '#ddddff';
                btn.onclick = () => {
                    currentNKRotations[i] = (currentNKRotations[i] + 1) % orbit.length;
                    drawBipartiteGraph();
                };
                container.appendChild(btn);
            });
        }
        
        function rotateAllOrbits() {
            for (let i = 0; i < kOrbits.length; i++) {
                currentKRotations[i] = (currentKRotations[i] + 1) % kOrbits[i].length;
            }
            for (let i = 0; i < nkOrbits.length; i++) {
                currentNKRotations[i] = (currentNKRotations[i] + 1) % nkOrbits[i].length;
            }
            drawBipartiteGraph();
        }
        
        function generateCombinations(n, k) {
            let result = [];
            function backtrack(start, path) {
                if (path.length === n) {
                    if (path.filter(x => x === '1').length === k) {
                        result.push(path.join(''));
                    }
                    return;
                }
                if (path.length + (k - path.filter(x => x === '1').length) > n) return;
                if (path.filter(x => x === '1').length < k) backtrack(start + 1, [...path, '1']);
                backtrack(start + 1, [...path, '0']);
            }
            backtrack(0, []);
            return result;
        }
        
        function groupIntoOrbits(vertices, n) {
            const visited = new Set();
            const orbitGroups = [];
            
            for (const vertex of vertices) {
                if (!visited.has(vertex)) {
                    const orbit = new Set();
                    let rotated = vertex;
                    
                    for (let i = 0; i < n; i++) {
                        if (!visited.has(rotated)) {
                            orbit.add(rotated);
                            visited.add(rotated);
                        }
                        rotated = rotateString(rotated);
                    }
                    
                    const flipped = flipString(vertex);
                    if (!visited.has(flipped)) {
                        let flippedRotated = flipped;
                        for (let i = 0; i < n; i++) {
                            if (!visited.has(flippedRotated)) {
                                orbit.add(flippedRotated);
                                visited.add(flippedRotated);
                            }
                            flippedRotated = rotateString(flippedRotated);
                        }
                    }
                    
                    if (orbit.size > 0) orbitGroups.push(Array.from(orbit));
                }
            }
            
            return orbitGroups;
        }
        
        function rotateString(s) { return s.substring(1) + s[0]; }
        function flipString(s) { return s.split('').reverse().join(''); }
        
        function isSubset(sub, sup) {
            for (let i = 0; i < sub.length; i++) {
                if (sub[i] === '1' && sup[i] !== '1') return false;
            }
            return true;
        }
        
        function drawBipartiteGraph() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            const centerX = canvas.width / 2;
            const centerY = canvas.height / 2;
            const maxRadius = Math.min(centerX, centerY) - 50;
            
            ctx.font = '20px Arial';
            ctx.fillText(`Bipartite Kneser Graph H(${n},${k})`, centerX - 150, 30);
            
            const vertexPositions = {};
            const orbitCount = kOrbits.length + nkOrbits.length;
            const orbitRadiusStep = maxRadius / (orbitCount + 1);
            
            // Position all vertices (k-subsets first, then (n-k)-subsets)
            let orbitIndex = 0;
            
            // Position k-subsets (inner orbits)
            for (let i = 0; i < kOrbits.length; i++) {
                const orbit = kOrbits[i];
                const orbitRadius = orbitRadiusStep * (i + 1);
                const angleStep = (2 * Math.PI) / orbit.length;
                const rotationOffset = currentKRotations[i] * angleStep;
                
                for (let j = 0; j < orbit.length; j++) {
                    const angle = rotationOffset + j * angleStep;
                    vertexPositions[orbit[j]] = {
                        x: centerX + orbitRadius * Math.cos(angle),
                        y: centerY + orbitRadius * Math.sin(angle),
                        orbitIndex: i,
                        isKSubset: true
                    };
                }
                orbitIndex++;
            }
            
            // Position (n-k)-subsets (outer orbits)
            for (let i = 0; i < nkOrbits.length; i++) {
                const orbit = nkOrbits[i];
                const orbitRadius = orbitRadiusStep * (kOrbits.length + i + 1);
                const angleStep = (2 * Math.PI) / orbit.length;
                const rotationOffset = currentNKRotations[i] * angleStep;
                
                for (let j = 0; j < orbit.length; j++) {
                    const angle = rotationOffset + j * angleStep;
                    vertexPositions[orbit[j]] = {
                        x: centerX + orbitRadius * Math.cos(angle),
                        y: centerY + orbitRadius * Math.sin(angle),
                        orbitIndex: kOrbits.length + i,
                        isKSubset: false
                    };
                }
                orbitIndex++;
            }
            
            // Collect all edges first for filtering
            const allEdges = [];
            
            // Check k-subsets ⊆ (n-k)-subsets
            for (const kVertex of kSubsets) {
                const edges = [];
                for (const nkVertex of nkSubsets) {
                    if (isSubset(kVertex, nkVertex)) {
                        const pos1 = vertexPositions[kVertex];
                        const pos2 = vertexPositions[nkVertex];
                        const dx = pos1.x - pos2.x;
                        const dy = pos1.y - pos2.y;
                        const length = Math.sqrt(dx*dx + dy*dy);
                        
                        if (length >= minEdgeLength) {
                            edges.push({
                                pos1: pos1,
                                pos2: pos2,
                                length: length
                            });
                        }
                    }
                }
                // Sort by length and keep only the top N
                edges.sort((a, b) => a.length - b.length);
                allEdges.push(...edges.slice(0, maxEdges));
            }
            
            // Check (n-k)-subsets ⊆ k-subsets (though for k ≠ n-k this won't happen)
            for (const nkVertex of nkSubsets) {
                const edges = [];
                for (const kVertex of kSubsets) {
                    if (isSubset(nkVertex, kVertex)) {
                        const pos1 = vertexPositions[nkVertex];
                        const pos2 = vertexPositions[kVertex];
                        const dx = pos1.x - pos2.x;
                        const dy = pos1.y - pos2.y;
                        const length = Math.sqrt(dx*dx + dy*dy);
                        
                        if (length >= minEdgeLength) {
                            edges.push({
                                pos1: pos1,
                                pos2: pos2,
                                length: length
                            });
                        }
                    }
                }
                // Sort by length and keep only the top N
                edges.sort((a, b) => a.length - b.length);
                allEdges.push(...edges.slice(0, maxEdges));
            }
            
            // Draw edges based on selected style
            allEdges.forEach(edge => {
                switch (edgeStyle) {
                    case "straight":
                        drawStraightEdge(edge.pos1, edge.pos2);
                        break;
                    case "curved":
                        drawCurvedEdge(edge.pos1, edge.pos2);
                        break;
                    case "bundled":
                        drawBundledEdge(edge.pos1, edge.pos2);
                        break;
                    case "faded":
                        drawFadedEdge(edge.pos1, edge.pos2, edge.length);
                        break;
                }
            });
            
            // Draw orbit circles and nodes
            orbitIndex = 0;
            
            // Draw k-subset orbits (inner circles)
            for (let i = 0; i < kOrbits.length; i++) {
                const orbit = kOrbits[i];
                const orbitRadius = orbitRadiusStep * (i + 1);
                
                ctx.beginPath();
                ctx.arc(centerX, centerY, orbitRadius, 0, 2 * Math.PI);
                ctx.strokeStyle = '#ffdddd';
                ctx.stroke();
                
                for (const vertex of orbit) {
                    const pos = vertexPositions[vertex];
                    drawSlicedNode(pos.x, pos.y, vertex, '#ff9999');
                }
                orbitIndex++;
            }
            
            // Draw (n-k)-subset orbits (outer circles)
            for (let i = 0; i < nkOrbits.length; i++) {
                const orbit = nkOrbits[i];
                const orbitRadius = orbitRadiusStep * (kOrbits.length + i + 1);
                
                ctx.beginPath();
                ctx.arc(centerX, centerY, orbitRadius, 0, 2 * Math.PI);
                ctx.strokeStyle = '#ddddff';
                ctx.stroke();
                
                for (const vertex of orbit) {
                    const pos = vertexPositions[vertex];
                    drawSlicedNode(pos.x, pos.y, vertex, '#9999ff');
                }
                orbitIndex++;
            }
            
            // Draw legend
            ctx.fillStyle = '#ff9999';
            ctx.fillRect(centerX - 100, centerY + maxRadius + 20, 20, 20);
            ctx.fillStyle = '#000';
            ctx.fillText(`${k}-subsets`, centerX - 70, centerY + maxRadius + 35);
            
            ctx.fillStyle = '#9999ff';
            ctx.fillRect(centerX + 30, centerY + maxRadius + 20, 20, 20);
            ctx.fillStyle = '#000';
            ctx.fillText(`${n-k}-subsets`, centerX + 60, centerY + maxRadius + 35);
        }
        
        function drawStraightEdge(pos1, pos2) {
            ctx.beginPath();
            ctx.moveTo(pos1.x, pos1.y);
            ctx.lineTo(pos2.x, pos2.y);
            ctx.strokeStyle = 'rgba(150, 150, 150, 0.7)';
            ctx.stroke();
        }
        
        function drawCurvedEdge(pos1, pos2) {
            const midX = (pos1.x + pos2.x) / 2;
            const midY = (pos1.y + pos2.y) / 2;
            const dx = pos2.x - pos1.x;
            const dy = pos2.y - pos1.y;
            const dist = Math.sqrt(dx*dx + dy*dy);
            const curveHeight = dist * curvature;
            
            const angle = Math.atan2(dy, dx);
            const ctrlX = midX + Math.sin(angle) * curveHeight;
            const ctrlY = midY - Math.cos(angle) * curveHeight;
            
            ctx.beginPath();
            ctx.moveTo(pos1.x, pos1.y);
            ctx.quadraticCurveTo(ctrlX, ctrlY, pos2.x, pos2.y);
            ctx.strokeStyle = 'rgba(150, 150, 150, 0.5)';
            ctx.stroke();
        }
        
        function drawBundledEdge(pos1, pos2) {
            const centerX = canvas.width / 2;
            const centerY = canvas.height / 2;
            const radius = Math.min(
                Math.sqrt(Math.pow(pos1.x - centerX, 2) + Math.pow(pos1.y - centerY, 2)),
                Math.sqrt(Math.pow(pos2.x - centerX, 2) + Math.pow(pos2.y - centerY, 2))
            ) * 0.7;
            
            const angle1 = Math.atan2(pos1.y - centerY, pos1.x - centerX);
            const angle2 = Math.atan2(pos2.y - centerY, pos2.x - centerX);
            
            // Find the shorter arc between the two angles
            let startAngle, endAngle;
            if (Math.abs(angle2 - angle1) < Math.PI) {
                startAngle = Math.min(angle1, angle2);
                endAngle = Math.max(angle1, angle2);
            } else {
                startAngle = Math.max(angle1, angle2);
                endAngle = Math.min(angle1, angle2) + 2 * Math.PI;
            }
            
            ctx.beginPath();
            ctx.moveTo(pos1.x, pos1.y);
            ctx.arc(centerX, centerY, radius, startAngle, endAngle, false);
            ctx.lineTo(pos2.x, pos2.y);
            ctx.strokeStyle = 'rgba(150, 150, 150, 0.4)';
            ctx.stroke();
        }
        
        function drawFadedEdge(pos1, pos2, length) {
            const maxLength = Math.sqrt(canvas.width * canvas.width + canvas.height * canvas.height);
            const opacity = 1 - (length / maxLength) * 0.8; // Fade longer edges more
            
            ctx.beginPath();
            ctx.moveTo(pos1.x, pos1.y);
            ctx.lineTo(pos2.x, pos2.y);
            ctx.strokeStyle = `rgba(150, 150, 150, ${opacity})`;
            ctx.stroke();
        }
        
        function drawSlicedNode(x, y, vertex, bgColor = '#fff') {
            const radius = 15;
            const sliceAngle = (2 * Math.PI) / n;
            
            // Draw background circle
            ctx.beginPath();
            ctx.arc(x, y, radius, 0, 2 * Math.PI);
            ctx.fillStyle = bgColor;
            ctx.fill();
            ctx.strokeStyle = '#000';
            ctx.stroke();
            
            // Draw slices
            for (let s = 0; s < n; s++) {
                const startAngle = s * sliceAngle;
                const endAngle = (s + 1) * sliceAngle;
                
                ctx.beginPath();
                ctx.moveTo(x, y);
                ctx.arc(x, y, radius, startAngle, endAngle);
                ctx.closePath();
                
                ctx.fillStyle = vertex[s] === '1' ? '#333' : 'transparent';
                ctx.fill();
                ctx.strokeStyle = '#000';
                ctx.stroke();
            }
        }
        
        function optimizeLayout() {
            const centerX = canvas.width / 2;
            const centerY = canvas.height / 2;
            const maxRadius = Math.min(centerX, centerY) - 50;
            const orbitCount = kOrbits.length + nkOrbits.length;
            const orbitRadiusStep = maxRadius / (orbitCount + 1);
            
            // Optimize k-subset orbits
            for (let i = 0; i < kOrbits.length; i++) {
                const orbit = kOrbits[i];
                const orbitRadius = orbitRadiusStep * (i + 1);
                const angleStep = (2 * Math.PI) / orbit.length;
                let bestRotation = 0;
                let minTotalLength = Infinity;
                
                for (let rotation = 0; rotation < orbit.length; rotation++) {
                    currentKRotations[i] = rotation;
                    const vertexPositions = {};
                    
                    // Position all vertices
                    let orbitIdx = 0;
                    
                    // Position k-subsets
                    for (let o = 0; o < kOrbits.length; o++) {
                        const currentOrbit = kOrbits[o];
                        const currentOrbitRadius = orbitRadiusStep * (o + 1);
                        const currentAngleStep = (2 * Math.PI) / currentOrbit.length;
                        const rotationOffset = currentKRotations[o] * currentAngleStep;
                        
                        for (let j = 0; j < currentOrbit.length; j++) {
                            const angle = rotationOffset + j * currentAngleStep;
                            vertexPositions[currentOrbit[j]] = {
                                x: centerX + currentOrbitRadius * Math.cos(angle),
                                y: centerY + currentOrbitRadius * Math.sin(angle),
                                isKSubset: true
                            };
                        }
                        orbitIdx++;
                    }
                    
                    // Position (n-k)-subsets (fixed for this optimization)
                    for (let o = 0; o < nkOrbits.length; o++) {
                        const currentOrbit = nkOrbits[o];
                        const currentOrbitRadius = orbitRadiusStep * (kOrbits.length + o + 1);
                        const currentAngleStep = (2 * Math.PI) / currentOrbit.length;
                        const rotationOffset = currentNKRotations[o] * currentAngleStep;
                        
                        for (let j = 0; j < currentOrbit.length; j++) {
                            const angle = rotationOffset + j * currentAngleStep;
                            vertexPositions[currentOrbit[j]] = {
                                x: centerX + currentOrbitRadius * Math.cos(angle),
                                y: centerY + currentOrbitRadius * Math.sin(angle),
                                isKSubset: false
                            };
                        }
                        orbitIdx++;
                    }
                    
                    let totalLength = 0;
                    for (const kVertex of kSubsets) {
                        for (const nkVertex of nkSubsets) {
                            if (isSubset(kVertex, nkVertex)) {
                                const pos1 = vertexPositions[kVertex];
                                const pos2 = vertexPositions[nkVertex];
                                const dx = pos1.x - pos2.x;
                                const dy = pos1.y - pos2.y;
                                totalLength += Math.sqrt(dx*dx + dy*dy);
                            }
                        }
                    }
                    
                    if (totalLength < minTotalLength) {
                        minTotalLength = totalLength;
                        bestRotation = rotation;
                    }
                }
                
                currentKRotations[i] = bestRotation;
            }
            
            // Optimize (n-k)-subset orbits
            for (let i = 0; i < nkOrbits.length; i++) {
                const orbit = nkOrbits[i];
                const orbitRadius = orbitRadiusStep * (kOrbits.length + i + 1);
                const angleStep = (2 * Math.PI) / orbit.length;
                let bestRotation = 0;
                let minTotalLength = Infinity;
                
                for (let rotation = 0; rotation < orbit.length; rotation++) {
                    currentNKRotations[i] = rotation;
                    const vertexPositions = {};
                    
                    // Position all vertices
                    let orbitIdx = 0;
                    
                    // Position k-subsets (fixed for this optimization)
                    for (let o = 0; o < kOrbits.length; o++) {
                        const currentOrbit = kOrbits[o];
                        const currentOrbitRadius = orbitRadiusStep * (o + 1);
                        const currentAngleStep = (2 * Math.PI) / currentOrbit.length;
                        const rotationOffset = currentKRotations[o] * currentAngleStep;
                        
                        for (let j = 0; j < currentOrbit.length; j++) {
                            const angle = rotationOffset + j * currentAngleStep;
                            vertexPositions[currentOrbit[j]] = {
                                x: centerX + currentOrbitRadius * Math.cos(angle),
                                y: centerY + currentOrbitRadius * Math.sin(angle),
                                isKSubset: true
                            };
                        }
                        orbitIdx++;
                    }
                    
                    // Position (n-k)-subsets
                    for (let o = 0; o < nkOrbits.length; o++) {
                        const currentOrbit = nkOrbits[o];
                        const currentOrbitRadius = orbitRadiusStep * (kOrbits.length + o + 1);
                        const currentAngleStep = (2 * Math.PI) / currentOrbit.length;
                        const rotationOffset = currentNKRotations[o] * currentAngleStep;
                        
                        for (let j = 0; j < currentOrbit.length; j++) {
                            const angle = rotationOffset + j * currentAngleStep;
                            vertexPositions[currentOrbit[j]] = {
                                x: centerX + currentOrbitRadius * Math.cos(angle),
                                y: centerY + currentOrbitRadius * Math.sin(angle),
                                isKSubset: false
                            };
                        }
                        orbitIdx++;
                    }
                    
                    let totalLength = 0;
                    for (const kVertex of kSubsets) {
                        for (const nkVertex of nkSubsets) {
                            if (isSubset(kVertex, nkVertex)) {
                                const pos1 = vertexPositions[kVertex];
                                const pos2 = vertexPositions[nkVertex];
                                const dx = pos1.x - pos2.x;
                                const dy = pos1.y - pos2.y;
                                totalLength += Math.sqrt(dx*dx + dy*dy);
                            }
                        }
                    }
                    
                    if (totalLength < minTotalLength) {
                        minTotalLength = totalLength;
                        bestRotation = rotation;
                    }
                }
                
                currentNKRotations[i] = bestRotation;
            }
            
            drawBipartiteGraph();
        }
    </script>
</body>
</html>
