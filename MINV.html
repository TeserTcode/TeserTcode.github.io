<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Square Matrix Inverter</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/mathjs/10.0.1/math.min.js"></script>
    <style>
        body { font-family: sans-serif; padding: 10px; }
        table { border-collapse: collapse; margin-bottom: 10px; }
        td { padding: 5px; }
        input { width: 60px; text-align: center; }
        button { margin: 3px; }
        textarea { width: 100%; height: 120px; font-family: monospace; }
    </style>
</head>
<body>
    <h3>Matrix Table:</h3>
    <table id="matrixTable">
        <tbody>
            <tr><td><input type="number" value="0.490"></td><td><input type="number" value="0.310"></td><td><input type="number" value="0.200"></td></tr>
            <tr><td><input type="number" value="0.176"></td><td><input type="number" value="0.812"></td><td><input type="number" value="0.010"></td></tr>
            <tr><td><input type="number" value="0.000"></td><td><input type="number" value="0.010"></td><td><input type="number" value="0.990"></td></tr>
        </tbody>
    </table>

    <button onclick="increaseSize()">Increase Size</button>
    <button onclick="decreaseSize()">Decrease Size</button>
    <button onclick="invertMatrix()">Invert Matrix</button>

    <h3>Matrix Text:</h3>
    <textarea id="matrixText"></textarea>

    <script>
        const table = document.getElementById('matrixTable');
        const textArea = document.getElementById('matrixText');

        function getMatrix() {
            const rows = [];
            for (let r of table.rows) {
                const rowData = [];
                for (let cell of r.cells) {
                    const val = parseFloat(cell.firstChild.value);
                    rowData.push(isNaN(val) ? 0 : val);
                }
                rows.push(rowData);
            }
            return rows;
        }

        function setMatrix(matrix) {
            table.innerHTML = '';
            matrix.forEach(row => {
                const tr = document.createElement('tr');
                row.forEach(val => {
                    const td = document.createElement('td');
                    const input = document.createElement('input');
                    input.type = 'number';
                    input.value = val.toFixed(3);
                    input.oninput = updateText;
                    td.appendChild(input);
                    tr.appendChild(td);
                });
                table.appendChild(tr);
            });
            updateText();
        }

        function updateText() {
            const matrix = getMatrix();
            const formatted = '[\n' + matrix.map(r => '    [' + r.map(v => v.toFixed(3)).join(', ') + ']').join(',\n') + '\n]';
            textArea.value = formatted;
        }

        function parseText() {
            try {
                const val = eval(textArea.value); // parse input as JS array
                if (Array.isArray(val) && val.every(r => Array.isArray(r))) {
                    if (val.length === val[0].length) { // square check
                        setMatrix(val);
                    } else {
                        alert('Matrix must be square.');
                    }
                } else {
                    alert('Invalid matrix format.');
                }
            } catch {
                alert('Error parsing matrix text.');
            }
        }

        textArea.addEventListener('input', parseText);

        function increaseSize() {
            const matrix = getMatrix();
            const n = matrix.length + 1;
            const newMatrix = [];
            for (let i = 0; i < n; i++) {
                const row = [];
                for (let j = 0; j < n; j++) {
                    row.push(matrix[i]?.[j] ?? 0);
                }
                newMatrix.push(row);
            }
            setMatrix(newMatrix);
        }

        function decreaseSize() {
            const matrix = getMatrix();
            if (matrix.length > 1) {
                const n = matrix.length - 1;
                const newMatrix = matrix.slice(0, n).map(row => row.slice(0, n));
                setMatrix(newMatrix);
            }
        }

        function invertMatrix() {
            const matrix = getMatrix();
            try {
                const inv = math.inv(matrix);
                setMatrix(inv);
            } catch (e) {
                alert('Matrix not invertible.');
            }
        }

        updateText();
    </script>
</body>
</html>
