/* =========================================================
   INPUTS
========================================================= */

function mat() {

    return materials[
        document.getElementById(
            "material"
        ).value
    ];
}


function Tinput() {

    return Math.max(
        1,
        parseFloat(
            document.getElementById(
                "temperature"
            ).value
        )
    );
}


function Nd() {

    return Math.max(
        0,
        parseFloat(
            document.getElementById(
                "Nd"
            ).value
        )
    );
}


function Na() {

    return Math.max(
        0,
        parseFloat(
            document.getElementById(
                "Na"
            ).value
        )
    );
}


function Binput() {

    return parseFloat(
        document.getElementById(
            "B"
        ).value
    );
}


function Einput() {

    return parseFloat(
        document.getElementById(
            "E"
        ).value
    );
}


function carrierType() {

    return document.getElementById(
        "carrier"
    ).value;
}


/* =========================================================
   BAND GAP
========================================================= */

function bandgap(T) {

    const m = mat();

    const name =
        document.getElementById(
            "material"
        ).value;


    if(name === "InGaAs") {

        const x =
            parseFloat(
                document.getElementById(
                    "composition"
                ).value
            );

        return Math.max(
            0.01,
            x*0.417 +
            (1-x)*1.519 -
            0.477*x*(1-x)
        );
    }


    if(name === "AlGaAs") {

        const x =
            parseFloat(
                document.getElementById(
                    "composition"
                ).value
            );

        return Math.max(
            0.01,
            x*3.13 +
            (1-x)*1.519 -
            0.7*x*(1-x)
        );
    }


    if(name === "HgCdTe") {

        const x =
            parseFloat(
                document.getElementById(
                    "composition"
                ).value
            );

        return Math.max(
            0.01,
            1.5*x -
            0.3 +
            0.3*x*x
        );
    }


    return m.Eg0 -
        m.alpha*T*T /
        (T+m.beta);
}


/* =========================================================
   DENSITY OF STATES
========================================================= */

function Nc(T) {

    return mat().Nc300 *
        Math.pow(
            T/300,
            1.5
        );
}


function Nv(T) {

    return mat().Nv300 *
        Math.pow(
            T/300,
            1.5
        );
}


/* =========================================================
   INTRINSIC CONCENTRATION
========================================================= */

function ni(T) {

    return Math.sqrt(
        Nc(T)*Nv(T)
    ) *
    Math.exp(
        -bandgap(T) /
        (2*kB*T)
    );
}


/* =========================================================
   CARRIER CONCENTRATIONS

   n - p = Nd - Na

   np = ni^2

   n =
   [(Nd-Na) +
    sqrt((Nd-Na)^2+4ni^2)]/2

   p = ni^2/n
========================================================= */

function carriers(T) {

    const intrinsic =
        ni(T);

    const difference =
        Nd()-Na();


    const n =
        (
            difference +
            Math.sqrt(
                difference*difference +
                4*intrinsic*intrinsic
            )
        ) / 2;


    const p =
        intrinsic*intrinsic /
        Math.max(
            n,
            1e-300
        );


    return {
        n:n,
        p:p
    };
}


/* =========================================================
   FERMI LEVEL

   nondegenerate approximation

   Ef - Ei = kT ln(n/ni)
========================================================= */

function fermiLevel(T) {

    const c =
        carriers(T);

    return -
        bandgap(T)/2 +
        kB*T *
        Math.log(
            Math.max(
                c.n /
                ni(T),
                1e-300
            )
        );
}


/* =========================================================
   MOBILITY
========================================================= */

function mobility(T, type) {

    const m =
        mat();

    const mu300 =
        type === "n"
        ? m.muN
        : m.muP;


    const N =
        Math.max(
            Nd()+Na(),
            1
        );


    /*
        Phonon contribution
    */

    const muPh =
        mu300 *
        Math.pow(
            T/300,
            -1.5
        );


    /*
        Ionized impurity contribution
    */

    const muImp =
        mu300 *
        Math.pow(
            T/300,
            1.5
        ) *
        (
            1e16 /
            N
        );


    /*
        Matthiessen rule
    */

    return 1 /
        (
            1/muPh +
            1/muImp
        );
}


/* =========================================================
   CONDUCTIVITY
========================================================= */

function conductivity(T) {

    const c =
        carriers(T);


    return q *
        (
            c.n *
            mobility(T,"n") +

            c.p *
            mobility(T,"p")
        );
}


/* =========================================================
   RESISTIVITY
========================================================= */

function resistivity(T) {

    return 1 /
        conductivity(T);
}


/* =========================================================
   RELAXATION TIME
========================================================= */

function relaxation(T,type) {

    const m =
        mat();

    const mass =
        type === "n"
        ? m.mN
        : m.mP;


    return mobility(
        T,
        type
    ) *
    mass *
    me /
    q;
}


/* =========================================================
   THERMAL VELOCITY
========================================================= */

function thermalVelocity(T,type) {

    const m =
        mat();

    const mass =
        type === "n"
        ? m.mN
        : m.mP;


    return Math.sqrt(
        3*kB*T*q /
        (mass*me)
    ) * 100;
}


/* =========================================================
   MEAN FREE PATH
========================================================= */

function meanFreePath(T,type) {

    return thermalVelocity(
        T,
        type
    ) *
    relaxation(
        T,
        type
    );
}


/* =========================================================
   DIFFUSION
========================================================= */

function diffusion(T,type) {

    return mobility(
        T,
        type
    ) *
    kB*T;
}


/* =========================================================
   DEBYE LENGTH
========================================================= */

function debye(T) {

    const m =
        mat();

    const c =
        carriers(T);


    const concentration =
        Math.max(
            c.n+c.p,
            1
        );


    return Math.sqrt(
        m.eps *
        eps0 *
        kB *
        T /
        (
            q*q*
            concentration
        )
    );
}


/* =========================================================
   HALL COEFFICIENT

   Two-carrier form

   RH =
   (p mu_p^2 - n mu_n^2)
   /
   [q(n mu_n+p mu_p)^2]
========================================================= */

function hall(T) {

    const c =
        carriers(T);


    const mun =
        mobility(
            T,
            "n"
        );

    const mup =
        mobility(
            T,
            "p"
        );


    return (
        c.p*mup*mup -
        c.n*mun*mun
    ) /
    (
        q *
        Math.pow(
            c.n*mun +
            c.p*mup,
            2
        )
    );
}


/* =========================================================
   HALL VOLTAGE
========================================================= */

function hallVoltage(B,T) {

    const I =
        parseFloat(
            document.getElementById(
                "current"
            ).value
        );


    const d =
        parseFloat(
            document.getElementById(
                "thickness"
            ).value
        );


    return hall(T) *
        I *
        B /
        d;
}


/* =========================================================
   HALL FIELD
========================================================= */

function hallField(B,T) {

    const I =
        parseFloat(
            document.getElementById(
                "current"
            ).value
        );


    const d =
        parseFloat(
            document.getElementById(
                "thickness"
            ).value
        );


    const w =
        parseFloat(
            document.getElementById(
                "width"
            )?.value || 1
        );


    const area =
        w*d;


    const J =
        I /
        area;


    return hall(T) *
        J *
        B;
}


/* =========================================================
   MAGNETORESISTANCE
========================================================= */

function magnetoresistance(B,T) {

    const type =
        carrierType();


    const mu =
        mobility(
            T,
            type
        );


    return Math.pow(
        mu*B,
        2
    );
}


/* =========================================================
   MAGNETIC CONDUCTIVITY
========================================================= */

function magnetoconductivity(B,T) {

    return conductivity(T) /
        (
            1 +
            magnetoresistance(
                B,
                T
            )
        );
}


/* =========================================================
   DRIFT
========================================================= */

function driftVelocity(E,T) {

    return mobility(
        T,
        carrierType()
    ) * E;
}


/* =========================================================
   JOULE HEATING
========================================================= */

function joule(E,T) {

    return conductivity(T) *
        E*E;
}


/* =========================================================
   CYCLOTRON
========================================================= */

function cyclotron(B) {

    const m =
        mat();

    const mass =
        carrierType() === "n"
        ? m.mN
        : m.mP;


    return q*B /
        (mass*me);
}


/* =========================================================
   CYCLOTRON RADIUS
========================================================= */

function cyclotronRadius(B,T) {

    const m =
        mat();

    const mass =
        carrierType() === "n"
        ? m.mN
        : m.mP;


    const v =
        Math.sqrt(
            2*kB*T*q /
            (mass*me)
        ) * 100;


    return v /
        cyclotron(B);
}


/* =========================================================
   LANDAU LEVEL
========================================================= */

function landau(B) {

    return hbar *
        cyclotron(B) /
        q;
}


/* =========================================================
   THERMAL
========================================================= */

function thermal(T) {

    const m =
        mat();

    return m.kappa *
        300/T;
}


/* =========================================================
   SEEBECK
========================================================= */

function seebeck(T) {

    const m =
        mat();


    if(
        carrierType() === "n"
    )
        return m.S_n;


    return m.S_p;
}


/* =========================================================
   THERMOELECTRIC
========================================================= */

function thermoVoltage(T) {

    return seebeck(T) *
        (T-300);
}


function peltier(T) {

    return seebeck(T)*T;
}


function lorenz() {

    return Math.PI*Math.PI*
        kB*kB /
        (3*q*q);
}


function zT(T) {

    return (
        seebeck(T)*
        seebeck(T)*
        conductivity(T)*
        T
    ) /
    thermal(T);
}


/* =========================================================
   DENSITY OF STATES
========================================================= */

function densityOfStates(E,T) {

    const m =
        mat();

    const Eg =
        bandgap(T);


    const Ec = 0;
    const Ev = -Eg;


    if(E > Ec) {

        return Math.sqrt(
            E-Ec
        );
    }


    if(E < Ev) {

        return Math.sqrt(
            Ev-E
        );
    }


    return 0;
}


/* =========================================================
   FERMI-DIRAC
========================================================= */

function fermiDistribution(E,T) {

    const Ef =
        fermiLevel(T);


    const x =
        (E-Ef) /
        (kB*T);


    if(x > 700)
        return 0;

    if(x < -700)
        return 1;


    return 1 /
        (
            1+
            Math.exp(x)
        );
}


/* =========================================================
   IMPURITY IONIZATION

   Simplified shallow donor/acceptor model
========================================================= */

function ionization(T) {

    const N =
        Nd()+Na();


    if(N <= 0)
        return 0;


    const Ei =
        0.045;


    return 1 /
        (
            1 +
            2 *
            Math.exp(
                Ei /
                (kB*T)
            )
        );
}


/* =========================================================
   OPTICAL
========================================================= */

function photonEnergy(lambda) {

    return 1239.841984 /
        lambda;
}


function absorption(E,T) {

    const Eg =
        bandgap(T);


    if(E <= Eg)
        return 0;


    return 1e4 *
        Math.sqrt(
            E-Eg
        );
}


/* =========================================================
   RECOMBINATION
========================================================= */

function recombination(t) {

    const deltaN0 =
        Math.max(
            Nd()+Na(),
            1e15
        );


    const tau =
        1e-6;


    return deltaN0 *
        Math.exp(
            -t/tau
        );
}


/* =========================================================
   DIFFUSION LENGTH
========================================================= */

function diffusionLength(T) {

    return Math.sqrt(
        diffusion(
            T,
            carrierType()
        ) *
        1e-6
    );
}


/* =========================================================
   DIFFUSING CARRIER
========================================================= */

function diffusingCarrier(x) {

    const T =
        Tinput();

    const D =
        diffusion(
            T,
            carrierType()
        );


    const t =
        1e-6;


    const N0 =
        Math.max(
            Nd()+Na(),
            1e15
        );


    return N0 /
        Math.sqrt(
            4*Math.PI*D*t
        ) *
        Math.exp(
            -x*x /
            (4*D*t)
        );
}


/* =========================================================
   PIEZORESISTANCE
========================================================= */

function piezoresistance(strain) {

    const gaugeFactor =
        100;


    return gaugeFactor *
        strain;
}

    if(type === "carrierP")

        return fermiLevel(x);


    if(type === "dos")
        return densityOfStates(
            x,
            T
        );


    if(type === "fermiDistribution")
        return fermiDistribution(
            x,
            T
        );


    if(type === "ionization")
        return ionization(x);


    if(type === "conductivity")
        return conductivity(x);


    if(type === "resistivity")
        return resistivity(x);


    if(type === "mobility")
        return mobility(
            x,
            carrierType()
        );


    if(type === "relaxation")
        return relaxation(
            x,
            carrierType()
        );


    if(type === "meanFreePath")
        return meanFreePath(
            x,
            carrierType()
        );


    if(type === "diffusion")
        return diffusion(
            x,
            carrierType()
        );


    if(type === "einstein")
        return kB*x;


    if(type === "debye")
        return debye(x);


    if(type === "hall")
        return hall(x);


    if(type === "hallVoltage")
        return hallVoltage(
            x,
            T
        );


    if(type === "hallField")
        return hallField(
            x,
            T
        );


    if(type === "magnetoresistance")
        return magnetoresistance(
            x,
            T
        );


    if(type === "magnetoconductivity")
        return magnetoconductivity(
            x,
            T
        );


    if(type === "cyclotron")
        return cyclotron(x);


    if(type === "cyclotronRadius")
        return cyclotronRadius(
            x,
            T
        );


    if(type === "landau")
        return landau(x);


    if(type === "thermal")
        return thermal(x);


    if(type === "seebeck")
        return seebeck(x);


    if(type === "thermovoltage")
        return thermoVoltage(x);


    if(type === "peltier")
        return peltier(x);


    if(type === "lorenz")
        return lorenz();


    if(type === "zT")
        return zT(x);


    if(type === "bandgap")
        return bandgap(x);


    if(type === "absorptionEnergy")
        return absorption(
            x,
            T
        );


    if(type === "absorptionWavelength")
        return absorption(
            photonEnergy(x),
            T
        );


    if(type === "photonEnergy")
        return photonEnergy(x);


    if(type === "recombination")
        return recombination(x);


    if(type === "diffusionLength")
        return diffusionLength(x);


    if(type === "diffusingCarrier")
        return diffusingCarrier(x);


    if(type === "piezoresistance")
        return piezoresistance(x);


    if(type === "conductivityDoping") {

        const oldNd =
            document.getElementById(
                "Nd"
            ).value;

        const oldNa =
            document.getElementById(
                "Na"
            ).value;


        document.getElementById(
            "Nd"
        ).value =
            Math.pow(
                10,
                x
            );

        document.getElementById(
            "Na"
        ).value = 0;


        const y =
            conductivity(T);


        document.getElementById(
            "Nd"
        ).value =
            oldNd;

        document.getElementById(
            "Na"
        ).value =
            oldNa;


        return y;
    }


    if(type === "mobilityDoping") {

        const oldNd =
            document.getElementById(
                "Nd"
            ).value;

        const oldNa =
            document.getElementById(
                "Na"
            ).value;


        document.getElementById(
            "Nd"
        ).value =
            Math.pow(
                10,
                x
            );

        document.getElementById(
            "Na"
        ).value = 0;


        const y =
            mobility(
                T,
                carrierType()
            );


        document.getElementById(
            "Nd"
        ).value =
            oldNd;

        document.getElementById(
            "Na"
        ).value =
            oldNa;


        return y;
    }


    if(type === "drift")
        return driftVelocity(
            x,
            T
        );


    if(type === "joule")
        return joule(
            x,
            T
        );


    return NaN;
}

        <br>

        `;
    }


    if(type === "diffusionLength") {

        f =
        `
        L =
        sqrt(D tau)
        <br><br>
        D =
        ${format(
            diffusion(
                T,
                carrier
            )
        )}
        cm²/s
        <br>
        tau = 10⁻⁶ s
        `;
    }


    if(type === "diffusingCarrier") {

        f =
        `
        Δn(x,t) =
        Δn₀
        /
        sqrt(4 pi D t)
        exp[
        -x²/(4Dt)
        ]
        `;
    }


    if(type === "piezoresistance") {

        f =
        `
        ΔR/R =
        100 ε
        `;
    }


    if(type === "conductivityDoping") {

        f =
        `
        N =
        10^x
        <br><br>

        sigma =
        q(n mu_n+p mu_p)
        `;
    }


    if(type === "mobilityDoping") {

        f =
        `
        N =
        10^x
        <br><br>

        1/mu =
        1/mu_ph+
        1/mu_imp
        `;
    }


    if(type === "drift") {

        f =
        `
        v_d =
        ${format(
            mobility(
                T,
                carrier
            )
        )}
        E
        `;
    }


    if(type === "joule") {

        f =
        `
        P =
        sigma E²
        `;
    }


    return `
    <div class="formula">
    ${f}
    </div>

    <div>
    ${common}
    </div>
    `;
}


/* =========================================================
   DRAW
========================================================= */

let lastData = [];


function draw() {

    const type =
        document.getElementById(
            "graph"
        ).value;


    const info =
        graphInfo[type];


    const xmin =
        parseFloat(
            document.getElementById(
                "xmin"
            ).value
        );


    const xmax =
        parseFloat(
            document.getElementById(
                "xmax"
            ).value
        );


    const count =
        Math.max(
            2,
            parseInt(
                document.getElementById(
                    "points"
                ).value
            )
        );


    const data = [];


    for(
        let i=0;
        i<count;
        i++
    ) {

        const x =
            xmin +
            (
                xmax-xmin
            ) *
            i /
            (count-1);


        const y =
            graphValue(
                type,
                x
            );


        data.push({
            x:x,
            y:y
        });
    }


    lastData =
        data;


    drawCanvas(
        data,
        info
    );


    document.getElementById(
        "formula"
    ).innerHTML =
        formulaText(
            type
        );


    showCurrent();

    showNumbers(
        data
    );
}


/* =========================================================
   DRAW CANVAS
========================================================= */

function drawCanvas(
    data,
    info
) {

    const canvas =
        document.getElementById(
            "canvas"
        );


    const ctx =
        canvas.getContext(
            "2d"
        );


    ctx.clearRect(
        0,
        0,
        canvas.width,
        canvas.height
    );


    const left = 90;
    const right = 30;
    const top = 45;
    const bottom = 70;


    const width =
        canvas.width-left-right;

    const height =
        canvas.height-top-bottom;


    let valid =
        data.filter(
            p =>
                Number.isFinite(
                    p.y
                )
        );


    if(info.log) {

        valid =
            valid.filter(
                p =>
                    p.y > 0
            );
    }


    if(valid.length === 0)
        return;


    let xmin =
        data[0].x;

    let xmax =
        data[
            data.length-1
        ].x;


    let values =
        valid.map(
            p =>
                info.log
                ? Math.log10(p.y)
                : p.y
        );


    let ymin =
        Math.min(
            ...values
        );


    let ymax =
        Math.max(
            ...values
        );


    if(ymin === ymax) {

        ymin -= 1;
        ymax += 1;
    }


    const dx =
        (xmax-xmin)*0.03;

    const dy =
        (ymax-ymin)*0.08;


    xmin -= dx;
    xmax += dx;

    ymin -= dy;
    ymax += dy;


    function px(x) {

        return left +
            (
                x-xmin
            ) /
            (
                xmax-xmin
            ) *
            width;
    }


    function py(y) {

        if(info.log)
            y = Math.log10(y);


        return top+height -
            (
                y-ymin
            ) /
            (
                ymax-ymin
            ) *
            height;
    }


    /* grid */

    ctx.strokeStyle =
        "#dddddd";

    ctx.lineWidth = 1;


    for(
        let i=0;
        i<=10;
        i++
    ) {

        const x =
            left+
            width*i/10;


        ctx.beginPath();

        ctx.moveTo(
            x,
            top
        );

        ctx.lineTo(
            x,
            top+height
        );

        ctx.stroke();
    }


    for(
        let i=0;
        i<=10;
        i++
    ) {

        const y =
            top+
            height*i/10;


        ctx.beginPath();

        ctx.moveTo(
            left,
            y
        );

        ctx.lineTo(
            left+width,
            y
        );

        ctx.stroke();
    }


    /* axes */

    ctx.strokeStyle =
        "black";

    ctx.beginPath();

    ctx.moveTo(
        left,
        top
    );

    ctx.lineTo(
        left,
        top+height
    );

    ctx.lineTo(
        left+width,
        top+height
    );

    ctx.stroke();


    /* curve */

    ctx.strokeStyle =
        "blue";

    ctx.lineWidth = 2;

    ctx.beginPath();


    let started =
        false;


    for(
        const p of data
    ) {

        if(
            !Number.isFinite(
                p.y
            )
        )
            continue;


        if(
            info.log &&
            p.y<=0
        )
            continue;


        const x =
            px(p.x);

        const y =
            py(p.y);


        if(!started) {

            ctx.moveTo(
                x,
                y
            );

            started = true;

        } else {

            ctx.lineTo(
                x,
                y
            );
        }
    }


    ctx.stroke();


    /* x labels */

    ctx.fillStyle =
        "black";

    ctx.font =
        "12px Arial";

    ctx.textAlign =
        "center";


    for(
        let i=0;
        i<=10;
        i++
    ) {

        const x =
            xmin+
            (
                xmax-xmin
            ) *
            i/10;


        ctx.fillText(
            format(x),
            px(x),
            top+height+20
        );
    }


    /* y labels */

    ctx.textAlign =
        "right";


    for(
        let i=0;
        i<=10;
        i++
    ) {

        const y =
            ymin+
            (
                ymax-ymin
            ) *
            i/10;


        const actual =
            info.log
            ? Math.pow(10,y)
            : y;


        ctx.fillText(
            format(actual),
            left-8,
            top+height-
            i*height/10+
            4
        );
    }


    /* title */

    ctx.textAlign =
        "center";

    ctx.font =
        "16px Arial";


    ctx.fillText(
        info.title,
        canvas.width/2,
        20
    );


    /* x label */

    ctx.font =
        "13px Arial";


    ctx.fillText(
        info.xlabel,
        left+width/2,
        canvas.height-15
    );


    /* y label */

    ctx.save();


    ctx.translate(
        15,
        top+height/2
    );


    ctx.rotate(
        -Math.PI/2
    );


    ctx.fillText(
        info.ylabel,
        0,
        0
    );


    ctx.restore();
}

/* =========================================================
   CSV EXPORT
========================================================= */

function exportCSV() {

    if(
        lastData.length === 0
    )
        return;


    let csv =
        "x,y\n";


    for(
        const p of lastData
    ) {

        csv +=
            p.x +
            "," +
            p.y +
            "\n";
    }


    const blob =
        new Blob(
            [csv],
            {
                type:"text/csv"
            }
        );


    const url =
        URL.createObjectURL(
            blob
        );


    const a =
        document.createElement(
            "a"
        );


    a.href = url;

    a.download =
        "semiconductor_graph.csv";


    a.click();


    URL.revokeObjectURL(
        url
    );
}


/* =========================================================
   FORMAT
========================================================= */

function format(x) {

    if(
        !Number.isFinite(x)
    )
        return "NaN";


    const a =
        Math.abs(x);


    if(
        a !== 0 &&
        (
            a < 1e-3 ||
            a >= 1e5
        )
    )
        return x.toExponential(6);


    return x.toFixed(6);
}


/* =========================================================
   RANGE
========================================================= */

function setRange() {

    const type =
        document.getElementById(
            "graph"
        ).value;


    if(
        type ===
        "conductivityDoping" ||
        type ===
        "mobilityDoping"
    ) {

        document.getElementById(
            "xmin"
        ).value = 12;

        document.getElementById(
            "xmax"
        ).value = 20;

        return;
    }


    if(
        type === "hallVoltage" ||
        type === "hallField" ||
        type === "magnetoresistance" ||
        type === "magnetoconductivity" ||
        type === "cyclotron" ||
        type === "cyclotronRadius" ||
        type === "landau"
    ) {

        document.getElementById(
            "xmin"
        ).value = 0;

        document.getElementById(
            "xmax"
        ).value = 5;

        return;
    }


    if(
        type === "drift" ||
        type === "joule"
    ) {

        document.getElementById(
            "xmin"
        ).value = 0;

        document.getElementById(
            "xmax"
        ).value = 1000;

        return;
    }


    if(
        type === "absorptionEnergy"
    ) {

        document.getElementById(
            "xmin"
        ).value = 0.1;

        document.getElementById(
            "xmax"
        ).value = 5;

        return;
    }


    if(
        type === "absorptionWavelength" ||
        type === "photonEnergy"
    ) {

        document.getElementById(
            "xmin"
        ).value = 200;

        document.getElementById(
            "xmax"
        ).value = 3000;

        return;
    }


    if(
        type === "recombination"
    ) {

        document.getElementById(
            "xmin"
        ).value = 0;

        document.getElementById(
            "xmax"
        ).value = 5e-6;

        return;
    }


    if(
        type === "diffusingCarrier"
    ) {

        document.getElementById(
            "xmin"
        ).value = -0.01;

        document.getElementById(
            "xmax"
        ).value = 0.01;

        return;
    }


    if(
        type === "piezoresistance"
    ) {

        document.getElementById(
            "xmin"
        ).value = -0.01;

        document.getElementById(
            "xmax"
        ).value = 0.01;

        return;
    }


    if(
        type === "dos" ||
        type === "fermiDistribution"
    ) {

        document.getElementById(
            "xmin"
        ).value = -2;

        document.getElementById(
            "xmax"
        ).value = 2;

        return;
    }


    document.getElementById(
        "xmin"
    ).value = 100;

    document.getElementById(
        "xmax"
    ).value = 600;
}
