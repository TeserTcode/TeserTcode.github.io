<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Number Structure Table</title>
<style>
  body {
    background: #111;
    color: #ccc;
    font-family: monospace;
  }
  #grid {
    display: grid;
    grid-template-columns: repeat(100, 1fr);
    width: 800px;
    height: 800px;
    border: 1px solid #444;
  }
  .cell {
    width: 100%;
    height: 100%;
  }
</style>
</head>
<body>

<h3>100×100 arithmetic color table</h3>
<div id="grid"></div>

<script>
function gcd(a, b) {
  while (b !== 0) {
    let t = b;
    b = a % b;
    a = t;
  }
  return a;
}

function isPrime(n) {
  if (n < 2) return false;
  if (n === 2) return true;
  if (n % 2 === 0) return false;
  for (let i = 3; i * i <= n; i += 2) {
    if (n % i === 0) return false;
  }
  return true;
}

const grid = document.getElementById("grid");

for (let b = 1; b <= 100; b++) {
  for (let a = 1; a <= 100; a++) {

    const g = gcd(a, b);

    // --- RED ---
    const pA = isPrime(a);
    const pB = isPrime(b);
    let r = 0;
    if (pA || pB) r = 128;
    if (pA && pB) r = 255;

    // --- GREEN ---
    const gcol = (g === 1) ? 255 : 0;

    // --- BLUE ---
    const reducedA = a / g;
    const bcol = isPrime(reducedA) ? 255 : 0;

    const cell = document.createElement("div");
    cell.className = "cell";
    cell.style.backgroundColor = `rgb(${0},${0},${bcol})`;

    grid.appendChild(cell);
  }
}
</script>

</body>
</html>
