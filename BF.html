<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bifurcation Diagram Drawer</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/mathjs/10.0.1/math.min.js"></script>
  <script src="clrspc.js"></script>
  <script src="mthfnc.js"></script>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 20px;
    }
    canvas {
      border: 1px solid #000;
    }
    .controls {
      margin-bottom: 20px;
    }
    .controls label {
      display: block;
      margin: 5px 0;
    }
  </style>
</head>
<body>
  <h1>Bifurcation Diagram Drawer</h1>
  <div class="controls">
    <label>
      Canvas Width: <input type="number" id="canvasWidth" value="300">
    </label>
    <label>
      Canvas Height: <input type="number" id="canvasHeight" value="400">
    </label>
    <label>
      Min X (r): <input type="number" id="minX" value="2.5" step="0.1">
    </label>
    <label>
      Max X (r): <input type="number" id="maxX" value="4.0" step="0.1">
    </label>
    <label>
      Min Y (x): <input type="number" id="minY" value="0.0" step="0.1">
    </label>
    <label>
      Max Y (x): <input type="number" id="maxY" value="1.0" step="0.1">
    </label>
    <label>
      Density (points per pixel): <input type="number" id="density" value="1">
    </label>
    <label>
      Start Position (x₀): <input type="number" id="startPos" value="0.5" step="0.1">
    </label>
    <label>
      Function: <input type="text" id="functionInput" value="r*x*(1-x)">
    </label>
    <label>
      Preset Functions:
      <select id="presetFunctions" onchange="updateFunctionInput()">
        <option value="r*x*(1-x)">Logistic Map</option>
        <option value="r-x*x">Negative Mandelbrot</option>
        <option value="r+x*x">Mandelbrot</option>
        <option value="x+1/3+r*sin(2*pi*x)/(2*pi)">Circle Map</option>
        <option value="hstep(0.5,x)*r*x+hstep(x,0.5)*r*(1-x)">Tent Map</option>
        <option value="hstep(r,x)*2*x+hstep(x,r)*(2*x-1)">Dyadic Map</option>
        <option value="r*sin(pi*x)">Sine Map</option>
        <option value="r*x*(1-x*x)">Cubic Map</option>
        <option value="r*x/(1+x)">Rational Map</option>
      </select>
    </label>
    <label>
      Lyapunov Max N: <input type="number" id="lyapMaxN" value="5">
    </label>
    <label>
      Lyapunov Density: <input type="number" id="lyapDensity" value="0.01" step="0.01">
    </label>
    <button onclick="drawDiagram()">Draw</button>
    <button onclick="calculateLyapunov()">Calculate Lyapunov</button>
  </div>
  <canvas id="bifurcationCanvas"></canvas>

  <script>
    // Function to update the function input based on the selected preset
    function updateFunctionInput() {
      const presetSelect = document.getElementById('presetFunctions');
      const functionInput = document.getElementById('functionInput');
      functionInput.value = presetSelect.value;
    }

    // Function to draw the bifurcation diagram
    function drawDiagram() {
      // Get input values
      const canvasWidth = parseInt(document.getElementById('canvasWidth').value);
      const canvasHeight = parseInt(document.getElementById('canvasHeight').value);
      const minX = parseFloat(document.getElementById('minX').value);
      const maxX = parseFloat(document.getElementById('maxX').value);
      const minY = parseFloat(document.getElementById('minY').value);
      const maxY = parseFloat(document.getElementById('maxY').value);
      const density = parseInt(document.getElementById('density').value);
      const startPos = parseFloat(document.getElementById('startPos').value);
      const functionInput = document.getElementById('functionInput').value;

      // Set up canvas
      const canvas = document.getElementById('bifurcationCanvas');
      canvas.width = canvasWidth;
      canvas.height = canvasHeight;
      const ctx = canvas.getContext('2d');
      ctx.clearRect(0, 0, canvasWidth, canvasHeight);
      ctx.fillStyle = '#000';

      // Calculate scaling factors
      const xScale = canvasWidth / (maxX - minX);
      const yScale = canvasHeight / (maxY - minY);

      // Iterate over r values
      for (let r = minX; r <= maxX; r += 1 / (xScale * density)) {
        let x = startPos;

        // Transient iterations to stabilize
        for (let i = 0; i < 50; i++) {
          x = math.evaluate(functionInput, { r, x });
        }

        // Plot points
        for (let i = 0; i < 100; i++) {
          x = math.evaluate(functionInput, { r, x });
          const px = (r - minX) * xScale;
          const py = canvasHeight - (x - minY) * yScale;
          if (px >= 0 && px < canvasWidth && py >= 0 && py < canvasHeight) {
            ctx.fillRect(px, py, 1, 1);
          }
        }
      }
    }

    // Function to calculate and draw the Lyapunov exponent
    function calculateLyapunov() {
      // Get input values
      const canvasWidth = parseInt(document.getElementById('canvasWidth').value);
      const canvasHeight = parseInt(document.getElementById('canvasHeight').value);
      const minX = parseFloat(document.getElementById('minX').value);
      const maxX = parseFloat(document.getElementById('maxX').value);
      const minY = parseFloat(document.getElementById('minY').value);
      const maxY = parseFloat(document.getElementById('maxY').value);
      const functionInput = document.getElementById('functionInput').value;
      const lyapMaxN = parseInt(document.getElementById('lyapMaxN').value);
      const lyapDensity = parseFloat(document.getElementById('lyapDensity').value);

      // Set up canvas
      const canvas = document.getElementById('bifurcationCanvas');
      const ctx = canvas.getContext('2d');
ctx.clearRect(0, 0, canvasWidth, canvasHeight);
      // Calculate scaling factors
      const xScale = canvasWidth / (maxX - minX);
      const yScale = canvasHeight / (maxY - minY);

      // Iterate over r values
      for (let r = minX; r <= maxX; r += lyapDensity) {
        let x = 0.5; // Start position for Lyapunov calculation
        let lyapSum = 0;

        // Transient iterations to stabilize
        for (let i = 0; i < 10; i++) {
          x = math.evaluate(functionInput, { r, x });
        }

        // Calculate Lyapunov exponent
        for (let i = 0; i < lyapMaxN; i++) {
          const derivative = math.derivative(functionInput, 'x').evaluate({ r, x });
          lyapSum += Math.log(Math.abs(derivative));
          x = math.evaluate(functionInput, { r, x });
        }

        const lyapExponent = lyapSum / lyapMaxN;
		console.log(lyapExponent)
        const px = (r - minX) * xScale;
        const py = canvasHeight - (lyapExponent - minY) * yScale;

        // Draw Lyapunov exponent
        if (px >= 0 && px < canvasWidth && py >= 0 && py < canvasHeight) {
          ctx.fillStyle = `hsl(${lyapExponent * 100}, 100%, 50%)`;
          ctx.fillRect(px, py, 2, 2);
        }
      }
    }

    // Initial draw
    drawDiagram();
  </script>
</body>
</html>
