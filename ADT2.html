<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>GPU Lyapunov – Chirikov Standard Map</title>
</head>
<body>

<h2>GPU Lyapunov – Chirikov Standard Map</h2>

<div>
  <label>K <input id="K" type="number" value="1.0" step="0.01"></label>
  <label>Iterations <input id="iters" type="number" value="300"></label>

  <label>Waveform f(θ)
    <select id="wave">
      <option value="0">sin</option>
      <option value="1">sin³</option>
      <option value="2">sinc</option>
      <option value="3">cos</option>
      <option value="4">cos²</option>
      <option value="5">abs(sin)</option>
      <option value="6">tanh(sin)</option>
      <option value="7">sin⁵</option>
      <option value="8">triangle</option>
      <option value="9">saw</option>
    </select>
  </label>

  <label>Color Scheme
    <select id="scheme">
      <option value="0">Blue-Yellow</option>
      <option value="1">Red-Green</option>
      <option value="2">Cyan-Magenta</option>
      <option value="3">Orange-Purple</option>
      <option value="4">Rainbow</option>
      <option value="5">Grayscale</option>
    </select>
  </label>

  <button id="drawBtn">Draw</button>
</div>

<canvas id="glCanvas" width="900" height="500" style="border:1px solid black"></canvas>

<script id="fragShader" type="x-shader/x-fragment">
precision highp float;

float tanh(float x){float e2x=exp(2.0*x);return (e2x-1.0)/(e2x+1.0);}

float wave(float theta,int w){
    if(w==0) return sin(theta);
    if(w==1) return pow(sin(theta),3.0);
    if(w==2) return theta==0.0?1.0:sin(theta)/theta;
    if(w==3) return cos(theta);
    if(w==4) return pow(cos(theta),2.0);
    if(w==5) return abs(sin(theta));
    if(w==6) return tanh(sin(theta));
    if(w==7) return pow(sin(theta),5.0);
    if(w==8) return 2.0/3.14159265*asin(sin(theta));
    if(w==9) return 2.0*(theta/(2.0*3.14159265)-floor(0.5+theta/(2.0*3.14159265)));
    return sin(theta);
}

float waveDeriv(float theta,int w){
    if(w==0) return cos(theta);
    if(w==1) return 3.0*pow(sin(theta),2.0)*cos(theta);
    if(w==2) return theta==0.0?0.0:(theta*cos(theta)-sin(theta))/(theta*theta);
    if(w==3) return -sin(theta);
    if(w==4) return -2.0*sin(theta)*cos(theta);
    if(w==5) return cos(theta)*sign(sin(theta));
    if(w==6) return cos(theta)*(1.0-pow(tanh(sin(theta)),2.0));
    if(w==7) return 5.0*pow(sin(theta),4.0)*cos(theta);
    if(w==8) return 2.0/3.14159265*sign(cos(theta));
    if(w==9) return 1.0/3.14159265;
    return cos(theta);
}

vec3 colorScheme(float lyap,int scheme){
    if(lyap<0.0) return vec3(0.0,0.0,0.0);
    float t=clamp(lyap/1.0,0.0,1.0);
    if(scheme==0) return mix(vec3(0.0,0.0,0.5),vec3(1.0,1.0,0.0),t);
    if(scheme==1) return mix(vec3(0.0,0.5,0.0),vec3(1.0,0.0,0.0),t);
    if(scheme==2) return mix(vec3(0.0,1.0,1.0),vec3(1.0,0.0,1.0),t);
    if(scheme==3) return mix(vec3(1.0,0.5,0.0),vec3(0.5,0.0,1.0),t);
    if(scheme==4) return vec3(t,0.5,1.0-t);
    if(scheme==5) return vec3(t,t,t);
    return vec3(t,0.0,1.0-t);
}

uniform float uK;
uniform int uIterations;
uniform int uWave;
uniform int uScheme;
uniform vec2 uResolution;

void main(){
    vec2 uv = gl_FragCoord.xy/uResolution;
    float theta = uv.y*6.2831853;
    float p = uv.x*6.2831853;
    float lyap = 0.0;

    for(int i=0;i<1000;i++){
        if(i>=uIterations) break;
        float dtheta = 0.0;
        p = mod(p + uK*wave(theta,uWave),6.2831853);
        theta = mod(theta + p,6.2831853);
        dtheta = abs(1.0 + uK*waveDeriv(theta,uWave));
        lyap += log(dtheta+1e-12);
    }
    lyap /= float(uIterations);
    vec3 col = colorScheme(lyap,uScheme);
    gl_FragColor = vec4(col,1.0);
}
</script>

<script>
const canvas=document.getElementById("glCanvas");
const gl=canvas.getContext("webgl");

function compileShader(type,src){
    const sh=gl.createShader(type);
    gl.shaderSource(sh,src);
    gl.compileShader(sh);
    if(!gl.getShaderParameter(sh,gl.COMPILE_STATUS)) console.error(gl.getShaderInfoLog(sh));
    return sh;
}

const vertSrc=`attribute vec2 aPosition; void main(){gl_Position=vec4(aPosition,0,1);}`;
const fragSrc=document.getElementById("fragShader").textContent;
const vert=compileShader(gl.VERTEX_SHADER,vertSrc);
const frag=compileShader(gl.FRAGMENT_SHADER,fragSrc);

const program=gl.createProgram();
gl.attachShader(program,vert);
gl.attachShader(program,frag);
gl.linkProgram(program);
gl.useProgram(program);

const vertices=new Float32Array([-1,-1,1,-1,-1,1,1,1]);
const buffer=gl.createBuffer();
gl.bindBuffer(gl.ARRAY_BUFFER,buffer);
gl.bufferData(gl.ARRAY_BUFFER,vertices,gl.STATIC_DRAW);
const posAttrib=gl.getAttribLocation(program,"aPosition");
gl.enableVertexAttribArray(posAttrib);
gl.vertexAttribPointer(posAttrib,2,gl.FLOAT,false,0,0);

const uniforms={
    uK:gl.getUniformLocation(program,"uK"),
    uIterations:gl.getUniformLocation(program,"uIterations"),
    uWave:gl.getUniformLocation(program,"uWave"),
    uScheme:gl.getUniformLocation(program,"uScheme"),
    uResolution:gl.getUniformLocation(program,"uResolution")
};

function render(){
    gl.uniform1f(uniforms.uK,+document.getElementById("K").value);
    gl.uniform1i(uniforms.uIterations,+document.getElementById("iters").value);
    gl.uniform1i(uniforms.uWave,+document.getElementById("wave").value);
    gl.uniform1i(uniforms.uScheme,+document.getElementById("scheme").value);
    gl.uniform2f(uniforms.uResolution,canvas.width,canvas.height);
    gl.drawArrays(gl.TRIANGLE_STRIP,0,4);
}

document.getElementById("drawBtn").onclick=render;
render();
</script>

</body>
</html>
