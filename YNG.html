<!DOCTYPE html>
<html>
<head>
  <title>Young Graph - Box Move Edges Only</title>
  <script src="https://unpkg.com/vis-network/standalone/umd/vis-network.min.js"></script>
  <style>
    body { font-family: sans-serif; }
    #network { width: 65%; height: 90vh; float: left; border: 1px solid #aaa; }
    #viewer {
      float: right; width: 33%; padding: 10px; border-left: 1px solid #ccc;
      height: 90vh; overflow-y: auto;
    }
    .box {
      width: 20px; height: 20px;
      border: 1px solid #444;
      display: inline-block;
      margin: 1px;
      background-color: lightblue;
      transition: all 0.3s ease;
    }
    .remove-box { background-color: salmon !important; }
    .add-box    { background-color: lightgreen !important; }
    #diagram > div { height: 24px; }
  </style>
</head>
<body>

<div id="controls">
  Size (n): <input id="size" type="number" value="6" min="1" max="30" />
  <button onclick="drawGraph()">Draw Young Graph</button>
</div>

<div id="network"></div>
<div id="viewer"><h3>Young Diagram</h3><div id="diagram"></div></div>

<script>
let selected = [];

function generatePartitions(n, max = n) {
  if (n === 0) return [[]];
  const result = [];
  for (let i = Math.min(n, max); i >= 1; i--) {
    const subparts = generatePartitions(n - i, i);
    for (const part of subparts) {
      result.push([i, ...part]);
    }
  }
  return result;
}

function isValidPartition(p) {
  for (let i = 0; i < p.length - 1; i++) {
    if (p[i] < p[i + 1]) return false;
  }
  return true;
}

function isOneBoxMove(a, b) {
  if (a.reduce((x, y) => x + y) !== b.reduce((x, y) => x + y)) return false;

  // Try moving one box from one row to another
  for (let i = 0; i < a.length; i++) {
    if (a[i] === 0) continue;
    for (let j = 0; j <= a.length; j++) {
      if (i === j) continue;
      const moved = [...a];
      moved[i]--;
      if (moved[i] === 0) moved.splice(i, 1);
      moved[j] = (moved[j] || 0) + 1;
      moved.sort((x, y) => y - x);
      if (JSON.stringify(moved) === JSON.stringify(b)) {
        return true;
      }
    }
  }
  return false;
}

function showDiagram(partition, diff = null) {
  const diagram = document.getElementById("diagram");
  diagram.innerHTML = "";

  partition.forEach((rowLen, rowIndex) => {
    const row = document.createElement("div");
    for (let i = 0; i < rowLen; i++) {
      const box = document.createElement("div");
      box.className = "box";

      if (diff) {
        const [from, to] = diff;
        const lenFrom = from[rowIndex] || 0;
        const lenTo = to[rowIndex] || 0;
        if (lenFrom > lenTo && i >= lenTo) box.classList.add("remove-box");
        if (lenFrom < lenTo && i >= lenFrom) box.classList.add("add-box");
      }

      row.appendChild(box);
    }
    diagram.appendChild(row);
  });
}

function drawGraph() {
  selected = [];
  const n = parseInt(document.getElementById("size").value, 10);
  const partitions = generatePartitions(n);

  const nodes = partitions.map((p, i) => ({
    id: i,
    label: `(${p.join(",")})`,
    partition: p,
    group: p.length,
    level: p.length
  }));

  const edges = [];
  for (let i = 0; i < nodes.length; i++) {
    for (let j = 0; j < nodes.length; j++) {
      if (i === j) continue;
      const p1 = nodes[i].partition;
      const p2 = nodes[j].partition;
      if (isOneBoxMove(p1, p2)) {
        edges.push({ from: i, to: j, arrows: "to", color: { color: "#444" } });
      }
    }
  }

  const container = document.getElementById("network");
  const data = { nodes: new vis.DataSet(nodes), edges: new vis.DataSet(edges) };

  const options = {
    layout: {
      hierarchical: {
        enabled: true,
        levelSeparation: 80,
        direction: "UD",
        nodeSpacing: 140,
      }
    },
    nodes: {
      shape: "box",
      font: { size: 16 },
      margin: 10
    },
    physics: false
  };

  const network = new vis.Network(container, data, options);

  network.on("click", function (params) {
    if (params.nodes.length === 1) {
      const nodeId = params.nodes[0];
      const part = nodes.find(n => n.id === nodeId).partition;
      selected.push(part);
      if (selected.length > 2) selected.shift();

      if (selected.length === 1) {
        showDiagram(selected[0]);
      } else if (selected.length === 2) {
        showDiagram(selected[1], selected);
      }
    }
  });
}

drawGraph();
</script>

</body>
</html>
