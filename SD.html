<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Segmented Display</title>
<style>
  body { font-family: system-ui, sans-serif; background:#f6f7fb; color:#111; padding:12px; max-width:800px; margin:0 auto; }
  label { display:block; font-size:13px; margin-top:6px; margin-bottom:2px; }
  textarea,input,select,button { width:100%; font-family:monospace; font-size:13px; box-sizing:border-box; }
  textarea { height:80px; resize:vertical; }
  .row { display:flex; gap:6px; margin-top:6px; }
  canvas { image-rendering:pixelated; border:1px solid #ccc; display:block; margin-top:8px; }
  .swatch { width:20px; height:14px; border:1px solid #aaa; border-radius:2px; display:inline-block; margin-right:4px; }
  .char-editor { margin-top:15px; border:1px solid #ccc; padding:8px; border-radius:3px; }
  .char-preview { display:flex; align-items:center; margin-bottom:8px; }
  .char-preview canvas { margin:0 8px 0 0; }
  .segments { display:flex; flex-wrap:wrap; gap:4px; margin-bottom:8px; }
  .segment { padding:4px 8px; border:1px solid #ccc; border-radius:2px; cursor:pointer; font-size:12px; }
  .segment.active { background:#00ff66; color:#000; }
  .config-buttons { display:flex; gap:4px; margin-top:8px; }
  .effects-panel { margin-top:15px; border:1px solid #ccc; padding:8px; border-radius:3px; }
  .effect-slider { margin-bottom:6px; }
  .effect-slider label { display:block; margin-bottom:2px; font-size:12px; }
  .effect-slider input { width:100%; height:16px; }
  .effect-value { float:right; font-weight:bold; font-size:11px; }
  .compact-row { display:flex; gap:6px; }
  .compact-row > * { flex:1; }
  h1 { font-size:18px; margin:0 0 10px 0; }
  h3 { font-size:14px; margin:0 0 6px 0; }
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
</head>
<body>
<h1>Segmented Display</h1>

<div class="compact-row">
  <div>
    <label>Template</label>
    <input type="file" id="imgfile" accept="image/*">
  </div>
  <div>
    <label>Text</label>
    <input id="textToShow" value="0123456789">
  </div>
  <div>
    <label>Spacing</label>
    <input type="number" id="charSpace" value="-10">
  </div>
</div>

<label>Config</label>
<textarea id="configText">
1:012356789BbCDEFgGIJOPpQRSZT
2:02356789BCDdeEfFGIJOPQRSZT
3:029ABDeHMNOPQqRUWY
4:035698ABbDGhHMmNnOoQqUWw
5:01236895aBbCcDdeEGILOoQSsZtUuWwl
6:01236895aBCcDdEgGIJjLOQSZzUuWw
7:06CcdEFGhHJjKLMmNOPpQRUuVvWw
8:046982CEFgGhHKLMNOPpQRUVWY
9:4689acdeEfFgHmPpRztxY
10:2346958ABbcefGhHmnoPqRrstxY
11:14aBbDdefgIiJjklmorTtuWwyY
12:14BbDdefgIJjkpTtl
13:5MNSXy
14:0783AKkMqZVXy
15:KkNQRSsXx
16:0278aAhKnZzVvXx
</textarea>

<div class="compact-row">
  <div><label>BG</label><input type="color" id="bgColor" value="#000000"></div>
  <div><label>ON</label><input type="color" id="onColor" value="#00ff66"></div>
  <div><label>OFF</label><input type="color" id="offColor" value="#222222"></div>
</div>

<div class="row">
  <button id="detectBtn">Detect</button>
  <button id="renderBtn">Render</button>
  <button id="saveBtn">Save .sgd</button>
  <button id="loadBtn">Load .sgd</button>
</div>

<div id="mapping"></div>

<canvas id="result"></canvas>

<div class="effects-panel">
  <h3>Effects</h3>
  <div class="compact-row">
    <div class="effect-slider">
      <label>Brightness <span class="effect-value" id="brightnessValue">0</span></label>
      <input type="range" id="brightness" min="-100" max="100" value="0">
    </div>
    <div class="effect-slider">
      <label>Contrast <span class="effect-value" id="contrastValue">0</span></label>
      <input type="range" id="contrast" min="-100" max="100" value="0">
    </div>
  </div>
  <div class="compact-row">
    <div class="effect-slider">
      <label>Sharpness <span class="effect-value" id="sharpnessValue">0</span></label>
      <input type="range" id="sharpness" min="0" max="500" value="0">
    </div>
    <div class="effect-slider">
      <label>Blur <span class="effect-value" id="blurValue">0</span></label>
      <input type="range" id="blur" min="0" max="100" value="0">
    </div>
  </div>
  <div class="compact-row">
    <div class="effect-slider">
      <label>Pixelation <span class="effect-value" id="pixelationValue">1</span></label>
      <input type="range" id="pixelation" min="1" max="20" value="1">
    </div>
    <div class="effect-slider">
      <label>Dither <span class="effect-value" id="ditherValue">0</span></label>
      <input type="range" id="dither" min="0" max="100" value="0">
    </div>
  </div>
  <h3>Glow</h3>
  <div class="compact-row">
    <div class="effect-slider">
      <label>Strength <span class="effect-value" id="glowStrengthValue">0</span></label>
      <input type="range" id="glowStrength" min="0" max="50" value="0">
    </div>
    <div class="effect-slider">
      <label>Radius <span class="effect-value" id="glowRadiusValue">5</span></label>
      <input type="range" id="glowRadius" min="1" max="500" value="5">
    </div>
  </div>
</div>

<div class="char-editor">
  <h3>Character Editor</h3>
  <div class="char-preview">
    <canvas id="charPreview" width="100" height="150"></canvas>
    <div>
      <label>Character</label>
      <input type="text" id="editChar" maxlength="1" value="0">
      <div class="segments" id="segmentControls"></div>
      <div class="config-buttons">
        <button id="updateCharBtn">Update</button>
        <button id="saveConfigBtn">Save Config</button>
        <button id="loadConfigBtn">Load Config</button>
      </div>
    </div>
  </div>
</div>

<script>
const tempCanvas=document.createElement('canvas');
const tctx=tempCanvas.getContext('2d');
let img=null, segs=[], segMap={}, config={};

function rgbToHsl(r,g,b){
  r/=255;g/=255;b/=255;
  const max=Math.max(r,g,b),min=Math.min(r,g,b);
  let h=0,s=0,l=(max+min)/2;
  if(max!==min){
    const d=max-min;
    s=l>0.5?d/(2-max-min):d/(max+min);
    switch(max){
      case r:h=(g-b)/d+(g<b?6:0);break;
      case g:h=(b-r)/d+2;break;
      case b:h=(r-g)/d+4;break;
    }h/=6;
  }
  return{h:h*360,s,l};
}
function colorKey(r,g,b){return r+","+g+","+b;}
function hexToRgb(hex){hex=hex.replace('#','');if(hex.length===3)hex=hex.split('').map(x=>x+x).join('');const n=parseInt(hex,16);return{r:(n>>16)&255,g:(n>>8)&255,b:n&255};}

// Effect sliders value display
document.querySelectorAll('.effect-slider input').forEach(slider => {
  const valueSpan = document.getElementById(slider.id + 'Value');
  valueSpan.textContent = slider.value;
  slider.addEventListener('input', () => {
    valueSpan.textContent = slider.value;
  });
});

document.getElementById('imgfile').onchange=e=>{
  const f=e.target.files[0]; if(!f)return;
  const url=URL.createObjectURL(f);
  img=new Image();
  img.onload=()=>{
    tempCanvas.width=img.width; tempCanvas.height=img.height;
    tctx.drawImage(img,0,0);
  };
  img.src=url;
};

document.getElementById('detectBtn').onclick=()=>{
  if(!img)return alert('Load image first');
  const w=tempCanvas.width,h=tempCanvas.height;
  const data=tctx.getImageData(0,0,w,h).data;
  const found={};
  for(let i=0;i<data.length;i+=4){
    const r=data[i],g=data[i+1],b=data[i+2],a=data[i+3];
    if(a<30)continue;
    const hsl=rgbToHsl(r,g,b);
    if(hsl.s<0.25||hsl.l>0.9)continue;
    const k=colorKey(r,g,b);
    if(!found[k])found[k]={r,g,b,count:0,h:hsl.h};
    found[k].count++;
  }
  segs=Object.values(found).sort((a,b)=>a.h-b.h);
  segs.forEach((s,i)=>s.id=i+1);
  segMap={}; segs.forEach(s=>segMap[colorKey(s.r,s.g,s.b)]=s);
  const mapDiv=document.getElementById('mapping');
  mapDiv.innerHTML="<b>Segments:</b><br>";
  segs.forEach(s=>{
    const sw=document.createElement('span');
    sw.className='swatch'; sw.style.background=`rgb(${s.r},${s.g},${s.b})`;
    mapDiv.appendChild(sw);
    mapDiv.append(` ${s.id} `);
  });
  
  config = parseConfig();
  updateSegmentControls();
  updateCharPreview();
};

document.getElementById('renderBtn').onclick=()=>{
  if(!img||!segs.length)return alert('Detect segments first');
  config = parseConfig();
  const text=document.getElementById('textToShow').value;
  const bg=hexToRgb(document.getElementById('bgColor').value);
  const on=hexToRgb(document.getElementById('onColor').value);
  const off=hexToRgb(document.getElementById('offColor').value);
  const spacing=parseInt(document.getElementById('charSpace').value)||0;

  const w=tempCanvas.width,h=tempCanvas.height;
  const src=tctx.getImageData(0,0,w,h);
  const resultCanvas=document.getElementById('result');
  const rctx=resultCanvas.getContext('2d');
  resultCanvas.width=text.length*w + (text.length-1)*spacing;
  resultCanvas.height=h;
  rctx.fillStyle='#fff';rctx.fillRect(0,0,resultCanvas.width,h);

  // First render all characters without effects
  for(let ci=0;ci<text.length;ci++){
    const ch=text[ci];
    const imgData=new ImageData(w,h);
    for(let i=0;i<src.data.length;i+=4){
      const r=src.data[i],g=src.data[i+1],b=src.data[i+2],a=src.data[i+3];
      const hsl=rgbToHsl(r,g,b);
      if(hsl.l>0.92||a<30){
        imgData.data[i]=bg.r;imgData.data[i+1]=bg.g;imgData.data[i+2]=bg.b;imgData.data[i+3]=255;continue;
      }
      const seg=segMap[colorKey(r,g,b)];
      if(seg){
        const onNow=(config[seg.id]||new Set()).has(ch);
        const c=onNow?on:off;
        imgData.data[i]=c.r;imgData.data[i+1]=c.g;imgData.data[i+2]=c.b;imgData.data[i+3]=255;
      }else{
        imgData.data[i]=r;imgData.data[i+1]=g;imgData.data[i+2]=b;imgData.data[i+3]=a;
      }
    }
    let temp=document.createElement('canvas');
    temp.width=w; temp.height=h;
    const tempCtx = temp.getContext('2d');
    tempCtx.putImageData(imgData,0,0);
    rctx.drawImage(temp,ci*(w+spacing),0);
  }

  // Apply effects to the entire combined image
  applyEffects(resultCanvas);
};

function parseConfig(){
  const lines=document.getElementById('configText').value.trim().split(/\r?\n/);
  const map={};
  for(const L of lines){
    const m=L.match(/^(\d+)\s*:\s*([\dA-Za-z]+)/);
    if(!m)continue;
    const seg=+m[1];
    const chars=new Set(m[2].split(''));
    map[seg]=chars;
  }
  return map;
}

function updateConfigText(){
  const lines = [];
  for(const segId in config){
    if(config.hasOwnProperty(segId)){
      lines.push(`${segId}:${Array.from(config[segId]).join('')}`);
    }
  }
  document.getElementById('configText').value = lines.join('\n');
}

function updateSegmentControls(){
  const container = document.getElementById('segmentControls');
  container.innerHTML = '';
  
  segs.forEach(seg => {
    const btn = document.createElement('div');
    btn.className = 'segment';
    btn.textContent = seg.id;
    btn.dataset.segment = seg.id;
    
    const char = document.getElementById('editChar').value;
    if(config[seg.id] && config[seg.id].has(char)) {
      btn.classList.add('active');
    }
    
    btn.onclick = () => {
      const char = document.getElementById('editChar').value;
      if(!config[seg.id]) config[seg.id] = new Set();
      
      if(config[seg.id].has(char)){
        config[seg.id].delete(char);
        btn.classList.remove('active');
      } else {
        config[seg.id].add(char);
        btn.classList.add('active');
      }
      updateConfigText();
      updateCharPreview();
    };
    
    container.appendChild(btn);
  });
}

function updateCharPreview(){
  if(!img || !segs.length) return;
  
  const char = document.getElementById('editChar').value;
  const bg = hexToRgb(document.getElementById('bgColor').value);
  const on = hexToRgb(document.getElementById('onColor').value);
  const off = hexToRgb(document.getElementById('offColor').value);
  
  const w = tempCanvas.width, h = tempCanvas.height;
  const src = tctx.getImageData(0, 0, w, h);
  const previewCanvas = document.getElementById('charPreview');
  const pctx = previewCanvas.getContext('2d');
  
  previewCanvas.width = w;
  previewCanvas.height = h;
  
  const imgData = new ImageData(w, h);
  for(let i = 0; i < src.data.length; i += 4){
    const r = src.data[i], g = src.data[i+1], b = src.data[i+2], a = src.data[i+3];
    const hsl = rgbToHsl(r, g, b);
    if(hsl.l > 0.92 || a < 30){
      imgData.data[i] = bg.r; imgData.data[i+1] = bg.g; imgData.data[i+2] = bg.b; imgData.data[i+3] = 255;
      continue;
    }
    const seg = segMap[colorKey(r, g, b)];
    if(seg){
      const onNow = (config[seg.id] || new Set()).has(char);
      const c = onNow ? on : off;
      imgData.data[i] = c.r; imgData.data[i+1] = c.g; imgData.data[i+2] = c.b; imgData.data[i+3] = 255;
    } else {
      imgData.data[i] = r; imgData.data[i+1] = g; imgData.data[i+2] = b; imgData.data[i+3] = a;
    }
  }
  pctx.putImageData(imgData, 0, 0);
}

document.getElementById('editChar').oninput = () => {
  updateSegmentControls();
  updateCharPreview();
};

document.getElementById('updateCharBtn').onclick = () => {
  updateConfigText();
  updateCharPreview();
};

document.getElementById('saveConfigBtn').onclick = () => {
  const data = document.getElementById('configText').value;
  const blob = new Blob([data], {type: 'text/plain'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'segment-config.txt';
  a.click();
  URL.revokeObjectURL(url);
};

document.getElementById('loadConfigBtn').onclick = () => {
  const input = document.createElement('input');
  input.type = 'file';
  input.accept = '.txt';
  input.onchange = e => {
    const file = e.target.files[0];
    if(!file) return;
    
    const reader = new FileReader();
    reader.onload = e => {
      document.getElementById('configText').value = e.target.result;
      config = parseConfig();
      updateSegmentControls();
      updateCharPreview();
    };
    reader.readAsText(file);
  };
  input.click();
};

// Save/Load .sgd files (ZIP format)
document.getElementById('saveBtn').onclick = async () => {
  if(!img||!segs.length)return alert('Render something first');
  
  const configData = document.getElementById('configText').value;
  const resultCanvas = document.getElementById('result');
  
  // Create ZIP using the actual JSZip from CDN
  const zip = new JSZip();
  zip.file("config.txt", configData);
  
  // Convert canvas to blob and add to zip
  const blob = await new Promise(resolve => resultCanvas.toBlob(resolve, 'image/png'));
  zip.file("display.png", blob);
  
  // Generate and download ZIP
  const content = await zip.generateAsync({type:"blob"});
  const url = URL.createObjectURL(content);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'display.sgd';
  a.click();
  URL.revokeObjectURL(url);
};

document.getElementById('loadBtn').onclick = () => {
  const input = document.createElement('input');
  input.type = 'file';
  input.accept = '.sgd';
  input.onchange = async e => {
    const file = e.target.files[0];
    if(!file) return;
    
    try {
      const zip = await JSZip.loadAsync(file);
      
      // Load config
      const configFile = zip.file("config.txt");
      if(configFile) {
        const configText = await configFile.async("text");
        document.getElementById('configText').value = configText;
        config = parseConfig();
        updateSegmentControls();
        updateCharPreview();
      }
      
      // Load image
      const imageFile = zip.file("display.png");
      if(imageFile) {
        const imageBlob = await imageFile.async("blob");
        const url = URL.createObjectURL(imageBlob);
        img = new Image();
        img.onload = () => {
          tempCanvas.width = img.width;
          tempCanvas.height = img.height;
          tctx.drawImage(img, 0, 0);
          URL.revokeObjectURL(url);
        };
        img.src = url;
      }
    } catch(err) {
      alert('Error loading .sgd file: ' + err.message);
    }
  };
  input.click();
};

/* --- Enhanced Effects System --- */
function applyEffects(canvas) {
  const ctx = canvas.getContext('2d');
  const w = canvas.width, h = canvas.height;
  
  // Get effect values
  const brightness = parseInt(document.getElementById('brightness').value);
  const contrast = parseInt(document.getElementById('contrast').value);
  const sharpness = parseInt(document.getElementById('sharpness').value);
  const blur = parseInt(document.getElementById('blur').value);
  const pixelation = parseInt(document.getElementById('pixelation').value);
  const dither = parseInt(document.getElementById('dither').value);
  const glowStrength = parseInt(document.getElementById('glowStrength').value);
  const glowRadius = parseInt(document.getElementById('glowRadius').value);
  
  // Create working canvas
  const workCanvas = document.createElement('canvas');
  workCanvas.width = w;
  workCanvas.height = h;
  const workCtx = workCanvas.getContext('2d');
  workCtx.drawImage(canvas, 0, 0);
  
  // Apply effects in order
  if (brightness !== 0 || contrast !== 0) {
    applyBrightnessContrast(workCanvas, brightness, contrast);
  }
  
  if (sharpness > 0) {
    applySharpness(workCanvas, sharpness);
  }
  
  if (blur > 0) {
    applyBlur(workCanvas, blur);
  }
  
  if (pixelation > 1) {
    applyPixelation(workCanvas, pixelation);
  }
  
  if (dither > 0) {
    applyDither(workCanvas, dither);
  }
  
  if (glowStrength > 0) {
    applyGlow(workCanvas, glowStrength, glowRadius);
  }
  
  // Draw final result back to original canvas
  ctx.drawImage(workCanvas, 0, 0);
}

function applyBrightnessContrast(canvas, brightness, contrast) {
  const ctx = canvas.getContext('2d');
  const w = canvas.width, h = canvas.height;
  const imgData = ctx.getImageData(0, 0, w, h);
  const data = imgData.data;
  
  const brightnessFactor = brightness / 100;
  const contrastFactor = (259 * (contrast + 255)) / (255 * (259 - contrast));
  
  for (let i = 0; i < data.length; i += 4) {
    // Apply brightness
    let r = data[i] + 255 * brightnessFactor;
    let g = data[i+1] + 255 * brightnessFactor;
    let b = data[i+2] + 255 * brightnessFactor;
    
    // Apply contrast
    r = contrastFactor * (r - 128) + 128;
    g = contrastFactor * (g - 128) + 128;
    b = contrastFactor * (b - 128) + 128;
    
    data[i] = clamp(r);
    data[i+1] = clamp(g);
    data[i+2] = clamp(b);
  }
  
  ctx.putImageData(imgData, 0, 0);
}

function applySharpness(canvas, value) {
  const ctx = canvas.getContext('2d');
  const w = canvas.width, h = canvas.height;
  const imgData = ctx.getImageData(0, 0, w, h);
  const data = imgData.data;
  const tempData = new Uint8ClampedArray(data);
  
  const factor = value / 200;
  
  for (let y = 1; y < h - 1; y++) {
    for (let x = 1; x < w - 1; x++) {
      for (let c = 0; c < 3; c++) {
        const idx = (y * w + x) * 4 + c;
        const orig = tempData[idx];
        
        let sum = -tempData[((y-1)*w + x)*4 + c];
        sum += -tempData[(y*w + (x-1))*4 + c];
        sum += 5 * orig;
        sum += -tempData[(y*w + (x+1))*4 + c];
        sum += -tempData[((y+1)*w + x)*4 + c];
        
        data[idx] = clamp(orig * (1 - factor) + sum * factor);
      }
    }
  }
  
  ctx.putImageData(imgData, 0, 0);
}

function applyGlow(canvas, strength, radius) {
  const ctx = canvas.getContext('2d');
  const w = canvas.width, h = canvas.height;
  
  // Create blurred version for glow
  const glowCanvas = document.createElement('canvas');
  glowCanvas.width = w;
  glowCanvas.height = h;
  const glowCtx = glowCanvas.getContext('2d');
  glowCtx.drawImage(canvas, 0, 0);
  
  // Apply blur with specified radius
  const blurAmount = Math.ceil(radius / 2);
  for (let i = 0; i < blurAmount; i++) {
    const imgData = glowCtx.getImageData(0, 0, w, h);
    const data = imgData.data;
    const tempData = new Uint8ClampedArray(data);
    
    for (let y = 1; y < h - 1; y++) {
      for (let x = 1; x < w - 1; x++) {
        for (let c = 0; c < 3; c++) {
          let sum = 0;
          for (let ky = -1; ky <= 1; ky++) {
            for (let kx = -1; kx <= 1; kx++) {
              const idx = ((y + ky) * w + (x + kx)) * 4 + c;
              sum += tempData[idx];
            }
          }
          const idx = (y * w + x) * 4 + c;
          data[idx] = sum / 9;
        }
      }
    }
    glowCtx.putImageData(imgData, 0, 0);
  }
  
  // Get glow image data for additive blending
  const glowData = glowCtx.getImageData(0, 0, w, h).data;
  const origData = ctx.getImageData(0, 0, w, h);
  const finalData = origData.data;
  
  // Apply additive glow with white overflow
  for (let i = 0; i < finalData.length; i += 4) {
    const glowR = glowData[i];
    const glowG = glowData[i+1];
    const glowB = glowData[i+2];
    
    // Calculate glow intensity
    const intensity = (glowR + glowG + glowB) / 3;
    const glowAdd = (intensity / 255) * strength;
    
    // Add glow to original (additive blending)
    let r = finalData[i] + glowR * glowAdd;
    let g = finalData[i+1] + glowG * glowAdd;
    let b = finalData[i+2] + glowB * glowAdd;
    
    // If any channel exceeds 255, spread to other channels (white overflow)
    if (r > 255 || g > 255 || b > 255) {
      const maxVal = Math.max(r, g, b);
      if (maxVal > 255) {
        const overflow = maxVal - 255;
        // Distribute overflow to all channels
        r = Math.min(255, r + overflow * 0.5);
        g = Math.min(255, g + overflow * 0.5);
        b = Math.min(255, b + overflow * 0.5);
      }
    }
    
    finalData[i] = clamp(r);
    finalData[i+1] = clamp(g);
    finalData[i+2] = clamp(b);
  }
  
  ctx.putImageData(origData, 0, 0);
}

function applyBlur(canvas, value) {
  const ctx = canvas.getContext('2d');
  const w = canvas.width, h = canvas.height;
  
  for (let i = 0; i < value; i++) {
    const imgData = ctx.getImageData(0, 0, w, h);
    const data = imgData.data;
    const tempData = new Uint8ClampedArray(data);
    
    for (let y = 1; y < h - 1; y++) {
      for (let x = 1; x < w - 1; x++) {
        for (let c = 0; c < 3; c++) {
          let sum = 0;
          for (let ky = -1; ky <= 1; ky++) {
            for (let kx = -1; kx <= 1; kx++) {
              const idx = ((y + ky) * w + (x + kx)) * 4 + c;
              sum += tempData[idx];
            }
          }
          const idx = (y * w + x) * 4 + c;
          data[idx] = sum / 9;
        }
      }
    }
    ctx.putImageData(imgData, 0, 0);
  }
}

function applyPixelation(canvas, value) {
  const ctx = canvas.getContext('2d');
  const w = canvas.width, h = canvas.height;
  
  const size = value;
  const smallW = Math.floor(w / size);
  const smallH = Math.floor(h / size);
  
  const tempCanvas = document.createElement('canvas');
  tempCanvas.width = smallW;
  tempCanvas.height = smallH;
  const tempCtx = tempCanvas.getContext('2d');
  tempCtx.imageSmoothingEnabled = false;
  tempCtx.drawImage(canvas, 0, 0, smallW, smallH);
  
  ctx.imageSmoothingEnabled = false;
  ctx.drawImage(tempCanvas, 0, 0, smallW, smallH, 0, 0, w, h);
  ctx.imageSmoothingEnabled = true;
}

function applyDither(canvas, value) {
  const ctx = canvas.getContext('2d');
  const w = canvas.width, h = canvas.height;
  const imgData = ctx.getImageData(0, 0, w, h);
  const data = imgData.data;
  
  const threshold = value / 100;
  
  for (let y = 0; y < h; y++) {
    for (let x = 0; x < w; x++) {
      const idx = (y * w + x) * 4;
      
      const noise = (Math.random() - 0.5) * 255 * threshold;
      
      data[idx] = clamp(data[idx] + noise);
      data[idx+1] = clamp(data[idx+1] + noise);
      data[idx+2] = clamp(data[idx+2] + noise);
    }
  }
  
  ctx.putImageData(imgData, 0, 0);
}

function clamp(v){return Math.max(0,Math.min(255,v));}
