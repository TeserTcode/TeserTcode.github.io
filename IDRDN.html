<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Radon Transform Maker</title>
  <style>
    canvas {
      border: 1px solid black;
      margin: 10px;
    }
    .container {
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .controls {
      margin: 10px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      max-width: 800px;
    }
    .control-group {
      border: 1px solid #ddd;
      padding: 10px;
      border-radius: 5px;
    }
    .control-group h3 {
      margin-top: 0;
    }
    label {
      display: block;
      margin: 5px 0;
    }
    button {
      padding: 5px 10px;
      margin: 5px;
    }
    .canvas-container {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
    }
    .canvas-row {
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
  margin-bottom: 20px;
}

.canvas-container {
  display: inline-block;
  margin-right: 10px;
  vertical-align: top;
}

.canvas-container canvas {
  display: block;
}
  </style>
</head>
<body>
  <div class="container">
    <h1>Inverse Dual Radon Transform Maker</h1>
    
    <div class="controls">
      <div class="control-group">
        <h3>Image Input</h3>
        <input type="file" id="imageInput" accept="image/*" />
      </div>
      
      <div class="control-group">
        <h3>Transform Settings</h3>
        <label for="steps">Number of Rotation Steps (N):</label>
        <input type="number" id="steps" value="360" min="1" />
        
        <label for="rotationMethod">Rotation Method:</label>
        <select id="rotationMethod">
          <option selected value="nearest">Nearest Neighbor</option>
          <option value="expandAverage">Expand Canvas (Average Fill)</option>
          <option value="expandNearest">Expand Canvas (Nearest Fill)</option>
          <option value="expandBlack">Expand Canvas (Black Fill)</option>
        </select>
        
        <label for="backgroundMethod">Background Method:</label>
        <select id="backgroundMethod">
          <option value="canvasAverage">Canvas Average</option>
          <option selected value="black">Black</option>
          <option value="nearestEdge">Nearest Edge Color</option>
        </select>
      </div>
      
      <div class="control-group">
        <h3>Average Method</h3>
        <select id="averageMethod" size="10">
          <option selected value="mean">Arithmetic Mean</option>
          <option value="median">Median</option>
          <option value="max">Max</option>
          <option value="min">Min</option>
          <option value="harmonic">Harmonic Mean</option>
          <option value="geometric">Geometric Mean</option>
          <option value="agm">Arithmetic-Geometric Mean (AGM)</option>
          <option value="midRange">Mid-Range</option>
          <option value="rms">Root Mean Square (RMS)</option>
          <option value="quadraticMean">Quadratic Mean</option>
        </select>
      </div>
      
      <div class="control-group">
        <h3>Color & Contrast</h3>
        <label>
          <input type="checkbox" id="grayscale"> Grayscale
        </label>
        
        <label for="grayscaleMethod">Grayscale Method:</label>
        <select id="grayscaleMethod">
          <option  selected value="average">Average (R+G+B)/3</option>
          <option value="luminance">Luminance (0.21R + 0.72G + 0.07B)</option>
          <option value="max">Max Channel</option>
          <option value="min">Min Channel</option>
          <option value="red">Red Channel</option>
          <option value="green">Green Channel</option>
          <option value="blue">Blue Channel</option>
          <option value="geometric">Geometric Mean</option>
        </select>
        
        <label for="contrast">Contrast:</label>
        <input type="range" id="contrast" min="0" max="200" value="100">
        
        <label for="brightness">Brightness:</label>
        <input type="range" id="brightness" min="0" max="200" value="100">
      </div>
    </div>
    
	
	<div id="control-group">
    <label>Brightness: <input type="range" id="brightness2" min="-100" max="100" value="0" /></label>
    <label>Contrast: <input type="range" id="contrast2" min="0" max="300" value="100" /></label>
    <label>
      Color Negatives:
      <select id="negatives">
        <option value="gray">Gray</option>
        <option value="red" selected>Red</option>
        <option value="hide">Hide</option>
      </select>
    </label>
	<button id="processButton">Process Result Canvas</button>
<button id="updateButton">Update Final Image</button>


  </div>
	
	
	
    <div class="button-group">
      <button id="startButton">Start Animation</button>
      <button id="fastCalculateButton">Fast Calculate</button>
      <button id="saveButton" disabled>Save Result</button>
    </div>
   
    <div class="canvas-container">
      <div>
        <h3>Original Image</h3>
        <canvas id="sourceCanvas" width="100" height="100"></canvas>
      </div>
      <div>
        <h3>Radon Transform</h3>
        <canvas id="resultCanvas" width="100" height="100"></canvas>
      </div>
      <button onclick="rotate90Clockwise()">Rotate 90°</button>
    </div>
  </div>
  <div id="steps2"></div> 
  <script src="https://cdnjs.cloudflare.com/ajax/libs/mathjs/11.7.0/math.min.js"></script>
  <script>
    const sourceCanvas = document.getElementById('sourceCanvas');
    const resultCanvas = document.getElementById('resultCanvas');
    const sourceCtx = sourceCanvas.getContext('2d');
    const resultCtx = resultCanvas.getContext('2d');
    const imageInput = document.getElementById('imageInput');
    const stepsInput = document.getElementById('steps');
    const rotationMethodSelect = document.getElementById('rotationMethod');
    const backgroundMethodSelect = document.getElementById('backgroundMethod');
    const averageMethodSelect = document.getElementById('averageMethod');
    const grayscaleCheckbox = document.getElementById('grayscale');
    const grayscaleMethodSelect = document.getElementById('grayscaleMethod');
    const contrastInput = document.getElementById('contrast');
    const brightnessInput = document.getElementById('brightness');
    const startButton = document.getElementById('startButton');
    const fastCalculateButton = document.getElementById('fastCalculateButton');
    const saveButton = document.getElementById('saveButton');

    let image = null;
    let animationFrameId = null;
    let currentStep = 0;
    let radonImageData = null;
    let originalImageData = null;


function rotate90Clockwise() {
    
     const canvas = document.getElementById('resultCanvas');
  const ctx = canvas.getContext('2d');
  
  
  const tempCanvas = document.createElement("canvas");
  const tempCtx = tempCanvas.getContext("2d");

  // Swap width and height
  tempCanvas.width = canvas.height;
  tempCanvas.height = canvas.width;

  // Apply rotation
  tempCtx.translate(tempCanvas.width, 0);
  tempCtx.rotate(Math.PI / 2); // 90 degrees

  // Draw original content onto rotated context
  tempCtx.drawImage(canvas, 0, 0);

  // Resize original canvas
  canvas.width = tempCanvas.width;
  canvas.height = tempCanvas.height;

  // Copy rotated image back
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  ctx.drawImage(tempCanvas, 0, 0);
}
    // Load image
    imageInput.addEventListener('change', (event) => {
      const file = event.target.files[0];
      if (file) {
        const reader = new FileReader();
        reader.onload = (e) => {
          image = new Image();
          image.src = e.target.result;
          image.onload = () => {
            // Calculate expanded size to avoid cutting corners
            const expandedSize = Math.ceil(Math.sqrt(image.width ** 2 + image.height ** 2));
            
            // Set canvas sizes (result canvas is wider to accommodate all steps)
            sourceCanvas.width = expandedSize;
            sourceCanvas.height = expandedSize;
            resultCanvas.width = expandedSize * 2; // Wider to fit all projections
            resultCanvas.height = expandedSize;
            
            // Draw original image centered on expanded canvas
            sourceCtx.fillStyle = 'black';
            sourceCtx.fillRect(0, 0, sourceCanvas.width, sourceCanvas.height);
            sourceCtx.drawImage(
              image, 
              (sourceCanvas.width - image.width) / 2, 
              (sourceCanvas.height - image.height) / 2
            );
            
            // Store original image data
            originalImageData = sourceCtx.getImageData(0, 0, sourceCanvas.width, sourceCanvas.height);
            
            // Reset result canvas
            resultCtx.fillStyle = 'black';
            resultCtx.fillRect(0, 0, resultCanvas.width, resultCanvas.height);
          };
        };
        reader.readAsDataURL(file);
      }
    });

    // Start animation
    startButton.addEventListener('click', () => {
      if (!image) return;
      const steps = parseInt(stepsInput.value, 10);
      if (isNaN(steps) || steps < 1) return;

      currentStep = 0;
      radonImageData = resultCtx.createImageData(resultCanvas.width, resultCanvas.height);
      
      // Clear result canvas
      resultCtx.fillStyle = 'black';
      resultCtx.fillRect(0, 0, resultCanvas.width, resultCanvas.height);

      const animate = () => {
        if (currentStep >= steps*2) {
          cancelAnimationFrame(animationFrameId);
          saveButton.disabled = false;
          return;
        }

        const angle = (90 / steps) * currentStep;
        rotateAndUpdateColumn(angle);
        currentStep++;
        animationFrameId = requestAnimationFrame(animate);
      };

      animate();
    });

    // Fast calculate (no animation)
    fastCalculateButton.addEventListener('click', () => {
      if (!image) return;
      const steps = parseInt(stepsInput.value, 10);
      if (isNaN(steps) || steps < 1) return;

      radonImageData = resultCtx.createImageData(resultCanvas.width, resultCanvas.height);
      
      // Clear result canvas
      resultCtx.fillStyle = 'black';
      resultCtx.fillRect(0, 0, resultCanvas.width, resultCanvas.height);

      // Perform all steps without animation
      for (let step = 0; step < steps*2; step++) {
       currentStep = step;
        const angle = (90 / steps) * step;
        rotateAndUpdateColumn(angle);
      }

      // Enable save button
      saveButton.disabled = false;
    });

    // Rotate image and update one column in the result
    function rotateAndUpdateColumn(angle) {
      const tempCanvas = document.createElement('canvas');
      tempCanvas.width = sourceCanvas.width;
      tempCanvas.height = sourceCanvas.height;
      const tempCtx = tempCanvas.getContext('2d');
      
      // Handle rotation based on the selected method
      const rotationMethod = rotationMethodSelect.value;
      const backgroundMethod = backgroundMethodSelect.value;
      
      if (rotationMethod === "nearest") {
        rotateNearestNeighbor(tempCtx, angle);
      } else if (rotationMethod.startsWith("expand")) {
        const fillMethod = rotationMethod.replace("expand", "").toLowerCase();
        rotateExpandCanvas(tempCtx, angle/2, fillMethod, backgroundMethod);
      }
      
      // Get image data
      let imageData = tempCtx.getImageData(0, 0, tempCanvas.width, tempCanvas.height);
      
      // Apply grayscale if needed
      if (grayscaleCheckbox.checked) {
        imageData = applyGrayscale(imageData, grayscaleMethodSelect.value);
      }
      
      // Apply contrast and brightness
      imageData = applyContrastBrightness(
        imageData, 
        parseInt(contrastInput.value) / 100, 
        parseInt(brightnessInput.value) / 100
      );
      
      const data = imageData.data;

      // Compute average color per row and update one column in the result
      const columnX = Math.floor((currentStep / parseInt(stepsInput.value, 10)) * (resultCanvas.width / 2));
      
      for (let y = 0; y < tempCanvas.height; y++) {
        const rowPixels = [];
        for (let x = 0; x < tempCanvas.width; x++) {
          const index = (y * tempCanvas.width + x) * 4;
          rowPixels.push([data[index], data[index + 1], data[index + 2]]);
        }

        const avgColor = computeAverage(rowPixels, averageMethodSelect.value);

        // Update the column in the result canvas
        const radonIndex = (y * resultCanvas.width + columnX) * 4;
        radonImageData.data[radonIndex] = avgColor[0];
        radonImageData.data[radonIndex + 1] = avgColor[1];
        radonImageData.data[radonIndex + 2] = avgColor[2];
        radonImageData.data[radonIndex + 3] = 255; // Alpha
      }

      resultCtx.putImageData(radonImageData, 0, 0);

      // Draw rotated image on the source canvas for animation
      sourceCtx.clearRect(0, 0, sourceCanvas.width, sourceCanvas.height);
      sourceCtx.putImageData(imageData, 0, 0);
    }

    // Rotation methods
    function rotateNearestNeighbor(ctx, angle) {
      ctx.clearRect(0, 0, ctx.canvas.width, ctx.canvas.height);
      
      // Handle background
      applyBackground(ctx, backgroundMethodSelect.value);
      
      ctx.save();
      ctx.translate(ctx.canvas.width / 2, ctx.canvas.height / 2);
      ctx.rotate((angle * Math.PI) / 180);
      ctx.drawImage(image, -image.width / 2, -image.height / 2);
      ctx.restore();
    }

    function rotateExpandCanvas(ctx, angle, fillMethod, backgroundMethod) {
      const expandedSize = Math.sqrt(ctx.canvas.width ** 2 + ctx.canvas.height ** 2);
      const tempCanvas = document.createElement('canvas');
      tempCanvas.width = expandedSize;
      tempCanvas.height = expandedSize;
      const tempCtx = tempCanvas.getContext('2d');

      // Fill the expanded canvas
      if (fillMethod === "average") {
        const avgColor = computeOverallAverage(image);
        tempCtx.fillStyle = `rgb(${avgColor[0]}, ${avgColor[1]}, ${avgColor[2]})`;
        tempCtx.fillRect(0, 0, tempCanvas.width, tempCanvas.height);
      } else if (fillMethod === "nearest") {
        // Fill with nearest edge color
        applyBackground(tempCtx, "nearestEdge");
      } else if (fillMethod === "black") {
        tempCtx.fillStyle = 'black';
        tempCtx.fillRect(0, 0, tempCanvas.width, tempCanvas.height);
      }

      // Draw the original image centered on the expanded canvas
      tempCtx.drawImage(
        image, 
        (expandedSize - image.width) / 2, 
        (expandedSize - image.height) / 2
      );

      // Rotate the expanded canvas
      tempCtx.save();
      tempCtx.translate(expandedSize / 2, expandedSize / 2);
      tempCtx.rotate((angle * Math.PI) / 180);
      tempCtx.drawImage(tempCanvas, -expandedSize / 2, -expandedSize / 2);
      tempCtx.restore();

      // Draw the rotated expanded canvas back to the original canvas
      ctx.clearRect(0, 0, ctx.canvas.width, ctx.canvas.height);
      applyBackground(ctx, backgroundMethod);
      ctx.drawImage(
        tempCanvas, 
        (ctx.canvas.width - expandedSize) / 2, 
        (ctx.canvas.height - expandedSize) / 2
      );
    }
    
    function applyBackground(ctx, method) {
      if (method === "black") {
        ctx.fillStyle = 'black';
        ctx.fillRect(0, 0, ctx.canvas.width, ctx.canvas.height);
      } else if (method === "canvasAverage") {
        const avgColor = computeOverallAverage(image);
        ctx.fillStyle = `rgb(${avgColor[0]}, ${avgColor[1]}, ${avgColor[2]})`;
        ctx.fillRect(0, 0, ctx.canvas.width, ctx.canvas.height);
      } else if (method === "nearestEdge") {
        // Get edge colors
        const edgeColors = getEdgeColors();
        // Create gradient or pattern (simplified here to use top-left color)
        ctx.fillStyle = `rgb(${edgeColors.topLeft[0]}, ${edgeColors.topLeft[1]}, ${edgeColors.topLeft[2]})`;
        ctx.fillRect(0, 0, ctx.canvas.width, ctx.canvas.height);
      }
    }
    
    function getEdgeColors() {
      // Simplified - get colors from the corners of the image
      const imgData = originalImageData || sourceCtx.getImageData(0, 0, sourceCanvas.width, sourceCanvas.height);
      const data = imgData.data;
      const w = imgData.width;
      const h = imgData.height;
      
      const topLeft = [data[0], data[1], data[2]];
      const topRight = [data[(w-1)*4], data[(w-1)*4+1], data[(w-1)*4+2]];
      const bottomLeft = [data[(h-1)*w*4], data[(h-1)*w*4+1], data[(h-1)*w*4+2]];
      const bottomRight = [data[(h*w-1)*4], data[(h*w-1)*4+1], data[(h*w-1)*4+2]];
      
      return { topLeft, topRight, bottomLeft, bottomRight };
    }

    // Compute overall average color of the image
    function computeOverallAverage(img) {
      const canvas = document.createElement('canvas');
      canvas.width = img.width;
      canvas.height = img.height;
      const ctx = canvas.getContext('2d');
      ctx.drawImage(img, 0, 0);
      const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
      const data = imageData.data;

      let sumR = 0, sumG = 0, sumB = 0;
      for (let i = 0; i < data.length; i += 4) {
        sumR += data[i];
        sumG += data[i + 1];
        sumB += data[i + 2];
      }
      const totalPixels = data.length / 4;
      return [sumR / totalPixels, sumG / totalPixels, sumB / totalPixels];
    }

    // Compute average color based on the selected method
    function computeAverage(pixels, method) {
      if (pixels.length === 0) return [0, 0, 0];
      
      // Normalize pixel values to [0, 255]
      const normalizedPixels = pixels.map(pixel => [
        Math.min(255, Math.max(0, pixel[0])) / 255,
        Math.min(255, Math.max(0, pixel[1])) / 255,
        Math.min(255, Math.max(0, pixel[2])) / 255
      ]);

      if (method === "mean") {
        const sum = normalizedPixels.reduce((acc, pixel) => [acc[0] + pixel[0], acc[1] + pixel[1], acc[2] + pixel[2]], [0, 0, 0]);
        return [
          sum[0] / normalizedPixels.length * 255,
          sum[1] / normalizedPixels.length * 255,
          sum[2] / normalizedPixels.length * 255
        ];
      } else if (method === "median") {
        const sortedR = normalizedPixels.map(p => p[0]).sort((a, b) => a - b);
        const sortedG = normalizedPixels.map(p => p[1]).sort((a, b) => a - b);
        const sortedB = normalizedPixels.map(p => p[2]).sort((a, b) => a - b);
        const mid = Math.floor(normalizedPixels.length / 2);
        return [
          sortedR[mid] * 255,
          sortedG[mid] * 255,
          sortedB[mid] * 255
        ];
      } else if (method === "max") {
        const maxR = Math.max(...normalizedPixels.map(p => p[0]));
        const maxG = Math.max(...normalizedPixels.map(p => p[1]));
        const maxB = Math.max(...normalizedPixels.map(p => p[2]));
        return [maxR * 255, maxG * 255, maxB * 255];
      } else if (method === "min") {
        const minR = Math.min(...normalizedPixels.map(p => p[0]));
        const minG = Math.min(...normalizedPixels.map(p => p[1]));
        const minB = Math.min(...normalizedPixels.map(p => p[2]));
        return [minR * 255, minG * 255, minB * 255];
      } else if (method === "harmonic") {
        const sumR = normalizedPixels.reduce((acc, pixel) => acc + 1 / (pixel[0] || 0.0001), 0);
        const sumG = normalizedPixels.reduce((acc, pixel) => acc + 1 / (pixel[1] || 0.0001), 0);
        const sumB = normalizedPixels.reduce((acc, pixel) => acc + 1 / (pixel[2] || 0.0001), 0);
        return [
          (normalizedPixels.length / sumR) * 255,
          (normalizedPixels.length / sumG) * 255,
          (normalizedPixels.length / sumB) * 255
        ];
      } else if (method === "geometric") {
        const productR = normalizedPixels.reduce((acc, pixel) => acc * (pixel[0] || 0.0001), 1);
        const productG = normalizedPixels.reduce((acc, pixel) => acc * (pixel[1] || 0.0001), 1);
        const productB = normalizedPixels.reduce((acc, pixel) => acc * (pixel[2] || 0.0001), 1);
        return [
          Math.pow(productR, 1 / normalizedPixels.length) * 255,
          Math.pow(productG, 1 / normalizedPixels.length) * 255,
          Math.pow(productB, 1 / normalizedPixels.length) * 255
        ];
      } else if (method === "agm") {
        const agmR = agm(normalizedPixels.map(p => p[0])) * 255;
        const agmG = agm(normalizedPixels.map(p => p[1])) * 255;
        const agmB = agm(normalizedPixels.map(p => p[2])) * 255;
        return [agmR, agmG, agmB];
      } else if (method === "midRange") {
        const minR = Math.min(...normalizedPixels.map(p => p[0]));
        const maxR = Math.max(...normalizedPixels.map(p => p[0]));
        const minG = Math.min(...normalizedPixels.map(p => p[1]));
        const maxG = Math.max(...normalizedPixels.map(p => p[1]));
        const minB = Math.min(...normalizedPixels.map(p => p[2]));
        const maxB = Math.max(...normalizedPixels.map(p => p[2]));
        return [
          ((minR + maxR) / 2) * 255,
          ((minG + maxG) / 2) * 255,
          ((minB + maxB) / 2) * 255
        ];
      } else if (method === "rms" || method === "quadraticMean") {
        const rmsR = Math.sqrt(normalizedPixels.reduce((acc, pixel) => acc + pixel[0] ** 2, 0) / normalizedPixels.length) * 255;
        const rmsG = Math.sqrt(normalizedPixels.reduce((acc, pixel) => acc + pixel[1] ** 2, 0) / normalizedPixels.length) * 255;
        const rmsB = Math.sqrt(normalizedPixels.reduce((acc, pixel) => acc + pixel[2] ** 2, 0) / normalizedPixels.length) * 255;
        return [rmsR, rmsG, rmsB];
      }
      
      return [0, 0, 0]; // Default
    }

    // Arithmetic-Geometric Mean (AGM) helper function
    function agm(values) {
      if (values.length === 0) return 0;
      
      let a = values.reduce((acc, val) => acc + val, 0) / values.length;
      let g = Math.pow(values.reduce((acc, val) => acc * (val || 0.0001)), 1 / values.length);
      
      while (Math.abs(a - g) > 1e-7) {
        const aNew = (a + g) / 2;
        const gNew = Math.sqrt(a * g);
        a = aNew;
        g = gNew;
      }
      return a;
    }
    
    // Apply grayscale conversion
    function applyGrayscale(imageData, method) {
      const data = imageData.data;
      
      for (let i = 0; i < data.length; i += 4) {
        const r = data[i] / 255;
        const g = data[i + 1] / 255;
        const b = data[i + 2] / 255;
        
        let grayValue;
        
        switch (method) {
          case "average":
            grayValue = (r + g + b) / 3;
            break;
          case "luminance":
            grayValue = 0.21 * r + 0.72 * g + 0.07 * b;
            break;
          case "max":
            grayValue = Math.max(r, g, b);
            break;
          case "min":
            grayValue = Math.min(r, g, b);
            break;
          case "red":
            grayValue = r;
            break;
          case "green":
            grayValue = g;
            break;
          case "blue":
            grayValue = b;
            break;
          case "geometric":
            grayValue = Math.pow(r * g * b, 1/3);
            break;
          default:
            grayValue = (r + g + b) / 3;
        }
        
        const gray = Math.round(grayValue * 255);
        data[i] = gray;
        data[i + 1] = gray;
        data[i + 2] = gray;
      }
      
      return imageData;
    }
    
    // Apply contrast and brightness
    function applyContrastBrightness(imageData, contrast, brightness) {
      const data = imageData.data;
      
      // Adjust contrast and brightness
      const intercept = 128 * (1 - contrast) * brightness;
      
      for (let i = 0; i < data.length; i += 4) {
        data[i] = Math.min(255, Math.max(0, data[i] * contrast * brightness + intercept));
        data[i + 1] = Math.min(255, Math.max(0, data[i + 1] * contrast * brightness + intercept));
        data[i + 2] = Math.min(255, Math.max(0, data[i + 2] * contrast * brightness + intercept));
      }
      
      return imageData;
    }

    // Save result
    saveButton.addEventListener('click', () => {
      const link = document.createElement('a');
      link.download = 'radon_transform.png';
      link.href = resultCanvas.toDataURL();
      link.click();
    });
	
	
	
	
	
	
	
	
	
	
	
 let MAX_SIZE = 256;
    let realResult = null, resultSize = [0, 0];

function processFromResultCanvas() {

  const canvas = document.getElementById("resultCanvas");
  const ctx = canvas.getContext("2d");

  // Save original content
  const tempCanvas = document.createElement("canvas");
  const tempCtx = tempCanvas.getContext("2d");
  tempCanvas.width = canvas.width;
  tempCanvas.height = canvas.height;
  tempCtx.drawImage(canvas, 0, 0);

  // Resize and stretch
  canvas.width = MAX_SIZE;
  canvas.height = MAX_SIZE;
  ctx.drawImage(tempCanvas, 0, 0, MAX_SIZE, MAX_SIZE); // stretches the image

  // Proceed with processing
  const inputData = ctx.getImageData(0, 0, canvas.width, canvas.height);
  const w = inputData.width;
  const h = inputData.height;

  document.getElementById("steps2").innerHTML = "";

  const gray = grayscaleMatrix(inputData);
  const grayCtx = normalizeToImage(gray);
  createCanvas("Step 1: Input Sinogram", w, h).drawImage(grayCtx.canvas, 0, 0);

  const lhalf = gray.map((row, i) => row.map(() => Math.min(i, h - i)));
  const lhalfCtx = normalizeToImage(lhalf, "gray");
  createCanvas("Step 2: lhalf Filter", w, h).drawImage(lhalfCtx.canvas, 0, 0);

  const fft = fft2D(gray);
  const fftMag = normalizeToImage(fft.map(row => row.map(c => math.abs(c))), "gray");
  createCanvas("Step 3: FFT Magnitude", w, h).drawImage(fftMag.canvas, 0, 0);

  const lhalfComplex = lhalf.map(row => row.map(val => math.complex(val, 0)));
  const filteredFFT = multiplyComplexMatrix(fft, lhalfComplex);
  const filteredMag = normalizeToImage(filteredFFT.map(row => row.map(c => math.abs(c))), "gray");
  createCanvas("Step 4: FFT × lhalf", w, h).drawImage(filteredMag.canvas, 0, 0);

  const ifft = fft2D(filteredFFT, true);
  realResult = extractReal(ifft);
  resultSize = [w, h];
}

document.getElementById("processButton").addEventListener("click", processFromResultCanvas);

document.getElementById("updateButton").addEventListener("click", updateFinalImage);

function createCanvas(title, w, h) {
  const container = document.createElement("div");
  container.className = "canvas-container";
  
  const label = document.createElement("div");
  label.textContent = title;
  
  const canvas = document.createElement("canvas");
  canvas.width = w;
  canvas.height = h;
  
  container.appendChild(label);
  container.appendChild(canvas);
  
  // Check if we need to create a new row
  const stepsDiv = document.getElementById("steps");
  const lastRow = stepsDiv.lastElementChild;
  
  if (!lastRow || !lastRow.classList.contains("canvas-row") || 
      lastRow.children.length >= 3) { // Adjust this number for how many per row
    const newRow = document.createElement("div");
    newRow.className = "canvas-row";
    stepsDiv.appendChild(newRow);
    newRow.appendChild(container);
  } else {
    lastRow.appendChild(container);
  }
  
  return canvas.getContext("2d");
}

    function resizeCanvasToFit(img) {
      const scale = Math.min(1, MAX_SIZE / Math.max(img.width, img.height));
      const w = Math.floor(img.width * scale);
      const h = Math.floor(img.height * scale);
      const canvas = document.createElement("canvas");
      canvas.width = w;
      canvas.height = h;
      const ctx = canvas.getContext("2d");
      ctx.drawImage(img, 0, 0, w, h);
      return ctx.getImageData(0, 0, w, h);
    }

    function grayscaleMatrix(imageData) {
      const { width: w, height: h, data } = imageData;
      const matrix = [];
      for (let y = 0; y < h; y++) {
        const row = [];
        for (let x = 0; x < w; x++) {
          const i = (y * w + x) * 4;
          const gray = (data[i] + data[i + 1] + data[i + 2]) / 3;
          row.push(gray);
        }
        matrix.push(row);
      }
      return matrix;
    }

    function normalizeToImage(matrix, colorMode = "red", brightness = 0, contrast = 100) {
      const h = matrix.length;
      const w = matrix[0].length;
      const flat = matrix.flat();
      const min = Math.min(...flat);
      const max = Math.max(...flat);
      const maxabs = colorMode === "gray" ? (max - min || 1)
                    : colorMode === "red" ? Math.max(max, -min) || 1
                    : Math.max(max, 0) || 1;

      const canvas = document.createElement("canvas");
      canvas.width = w;
      canvas.height = h;
      const ctx = canvas.getContext("2d");
      const imgData = ctx.createImageData(w, h);

      const b = +brightness;
      const c = +contrast / 100;

      for (let y = 0; y < h; y++) {
        for (let x = 0; x < w; x++) {
          const i = (y * w + x) * 4;
          const val = matrix[y][x];

          let gray = 0, r = 0, g = 0, bval = 0, a = 255;

          if (colorMode === "gray") {
  // Map -maxabs → 0, 0 → 0.5, maxabs → 1
  let norm = (val + maxabs) / (2 * maxabs);
  let gray = norm * 255;
  gray = ((gray - 128) * c + 128 + b);
  gray = Math.max(0, Math.min(255, gray));
  r = g = bval = gray;
} else if (colorMode === "red" && val < 0) {
            r = ((-val / maxabs) * 255 - 128) * c + 128 + b;
            r = Math.max(0, Math.min(255, r));
            g = bval = 0;
          } else if (colorMode === "hide" && val < 0) {
            a = 0;
          } else {
            gray = ((val / maxabs) * 255 - 128) * c + 128 + b;
            gray = Math.max(0, Math.min(255, gray));
            r = g = bval = gray;
          }

          imgData.data[i + 0] = r;
          imgData.data[i + 1] = g;
          imgData.data[i + 2] = bval;
          imgData.data[i + 3] = a;
        }
      }

      ctx.putImageData(imgData, 0, 0);
      return ctx;
    }

    function fft2D(matrix, inverse = false) {
      const h = matrix.length;
      const w = matrix[0].length;
      const temp = Array(h);
      for (let y = 0; y < h; y++) {
        temp[y] = inverse ? math.ifft(matrix[y]) : math.fft(matrix[y]);
      }
      const result = Array(h).fill().map(() => Array(w));
      for (let x = 0; x < w; x++) {
        const col = temp.map(row => row[x]);
        const colTrans = inverse ? math.ifft(col) : math.fft(col);
        for (let y = 0; y < h; y++) {
          result[y][x] = colTrans[y];
        }
      }
      return result;
    }

    function multiplyComplexMatrix(matA, matB) {
      const h = matA.length;
      const w = matA[0].length;
      const result = [];
      for (let y = 0; y < h; y++) {
        const row = [];
        for (let x = 0; x < w; x++) {
          row.push(math.multiply(matA[y][x], matB[y][x]));
        }
        result.push(row);
      }
      return result;
    }

    function extractReal(matrix) {
      return matrix.map(row => row.map(val => val.re || 0));
    }

function processImage(img) {
      document.getElementById("steps2").innerHTML = "";
      const inputData = resizeCanvasToFit(img);
      const w = inputData.width;
      const h = inputData.height;

      const gray = grayscaleMatrix(inputData);
      const grayCtx = normalizeToImage(gray);
      createCanvas("Step 1: Input Sinogram", w, h).drawImage(grayCtx.canvas, 0, 0);

      const lhalf = gray.map((row, i) => row.map(() => Math.min(i, h - i)));
      const lhalfCtx = normalizeToImage(lhalf, "gray");
      createCanvas("Step 2: lhalf Filter", w, h).drawImage(lhalfCtx.canvas, 0, 0);

      const fft = fft2D(gray);
      const fftMag = normalizeToImage(fft.map(row => row.map(c => math.abs(c))), "gray");
      createCanvas("Step 3: FFT Magnitude", w, h).drawImage(fftMag.canvas, 0, 0);

      const lhalfComplex = lhalf.map(row => row.map(val => math.complex(val, 0)));
      const filteredFFT = multiplyComplexMatrix(fft, lhalfComplex);
      const filteredMag = normalizeToImage(filteredFFT.map(row => row.map(c => math.abs(c))), "gray");
      createCanvas("Step 4: FFT × lhalf", w, h).drawImage(filteredMag.canvas, 0, 0);

      const ifft = fft2D(filteredFFT, true);
      realResult = extractReal(ifft);
      resultSize = [w, h];
      updateFinalImage();
    }

    function updateFinalImage() {
      if (!realResult) return;
      const [w, h] = resultSize;
      const brightness = document.getElementById("brightness2").value;
      const contrast = document.getElementById("contrast2").value;
      const negMode = document.getElementById("negatives").value;
      const finalCtx = normalizeToImage(realResult, negMode, brightness, contrast);

      // Replace or update final canvas
      let canvasDiv = [...document.querySelectorAll("#steps2 div")]
        .find(div => div.firstChild?.textContent?.includes("Step 5"));

      if (!canvasDiv) {
        finalCtx.canvas.style.display = "block";
        createCanvas("Step 5: Inverse FFT (Reconstructed)", w, h).drawImage(finalCtx.canvas, 0, 0);
      } else {
        const canvas = canvasDiv.querySelector("canvas");
        const ctx = canvas.getContext("2d");
        ctx.clearRect(0, 0, w, h);
        ctx.drawImage(finalCtx.canvas, 0, 0);
      }
    }
  </script>
