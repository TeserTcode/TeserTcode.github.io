      "elk.layered.compaction.postCompaction.strategy":"LEFT_RIGHT_CONSTRAINT_LOCKING",
      "elk.hierarchyHandling":"INCLUDE_CHILDREN"
    },
    children:ns.map((name)=>{
      const e=data[name]||[];
      return {
        id:ids.get(name),
        width:110,
        height:84,
        ports:[
          {id:ids.get(name)+"_n",properties:{"org.eclipse.elk.port.side":"NORTH"}},
          {id:ids.get(name)+"_s",properties:{"org.eclipse.elk.port.side":"SOUTH"}},
          {id:ids.get(name)+"_e",properties:{"org.eclipse.elk.port.side":"EAST"}},
          {id:ids.get(name)+"_w",properties:{"org.eclipse.elk.port.side":"WEST"}}
        ],
        layoutOptions:{
          "org.eclipse.elk.layered.layerConstraint":String(Math.max(0,Math.min(5,Number(e[4])||0)))
        }
      }
    }),
    edges:edges.filter(e=>ids.has(e[0])&&ids.has(e[1])).map((e,i)=>({
      id:"e"+i,
      sources:[ids.get(e[0])+"_s"],
      targets:[ids.get(e[1])+"_n"]
    }))
  };

  const r=await elk.layout(kg);
  const scale=1.65,ox=250,oy=150;
  nodes.clear();

  (r.children||[]).forEach(c=>{
    const name=ns.find(x=>ids.get(x)===c.id);
    if(!name)return;
    const level=Math.max(0,Math.min(5,Number((data[name]||[])[4])||0));
    nodes.set(name,{
      name,level,
      x:ox+(c.x||0)*scale,
      y:oy+(c.y||0)*scale,
      tx:ox+(c.x||0)*scale,
      ty:oy+(c.y||0)*scale,
      w:(c.width||110)*scale,
      h:(c.height||84)*scale,
      r:58,
      pinned:false,
      ax:ox+(c.x||0)*scale,
      ay:oy+(c.y||0)*scale
    });
  });

  annealedElkResult=r;
  update();
}

let annealedElkResult=null;

function layout(){
  return seed();
}


function makeLevels(){
  levelLayer.replaceChildren();
  levelNames.forEach((s,i)=>{
    let t=document.createElementNS('http://www.w3.org/2000/svg','text');
    t.classList.add('level');
    t.textContent=s;
    t.setAttribute('x',100);
    t.setAttribute('y',150+i*460);
    levelLayer.appendChild(t)
  })
}

function makeEdges(){
  edgeLayer.replaceChildren();
  edgeEls.length=0;
  edges.forEach(e=>{
    if(!nodes.has(e[0])||!nodes.has(e[1]))return;
    let l=document.createElementNS('http://www.w3.org/2000/svg','path');
    l.classList.add('edge',e[2]);
    l.dataset.a=e[0];
    l.dataset.b=e[1];
    if(e[2]!=='modification'&&e[2]!=='relation')l.setAttribute('marker-end','url(#arrow)');
    l.setAttribute('fill','none');
    edgeLayer.appendChild(l);
    edgeEls.push(l)
  })
}

function routeEdge(a,b){
  const ygap=Math.max(18,Math.abs(b.y-a.y));
  if(Math.abs(a.y-b.y)<3){
    let s=b.x>=a.x?1:-1;
    return `M ${a.x+s*(a.r+6)} ${a.y} H ${b.x-s*(b.r+14)}`;
  }

  /* ELK is orthogonal; this fallback keeps every segment horizontal/vertical
     and forces normal hierarchy edges to travel downward. */
  const sy=b.y>=a.y?1:-1;
  const x1=a.x,x2=b.x;
  const y1=a.y+sy*(a.r+7),y2=b.y-sy*(b.r+15);
  const mid=(y1+y2)/2;
  if(sy>0)return `M ${x1} ${y1} V ${mid} H ${x2} V ${y2}`;
  return `M ${x1} ${a.y-(a.r+7)} H ${x2} V ${y2}`;
}

function worldPoint(x,y){
  const r=svg.getBoundingClientRect();
  return {
    x:(x-r.left-view.x)/view.scale,
    y:(y-r.top-view.y)/view.scale
  }
}

function update(){
  nodes.forEach(n=>{
    if(n.el)n.el.setAttribute('transform',`translate(${n.x},${n.y})`);
  });
  edgeEls.forEach(l=>{
    const a=nodes.get(l.dataset.a),b=nodes.get(l.dataset.b);
    if(!a||!b)return;
    l.setAttribute('d',routeEdge(a,b))
  });
  world.setAttribute('transform',`translate(${view.x},${view.y}) scale(${view.scale})`)
}

async function reheat(){
  /* Re-run ELK instead of manually perturbing node positions. */
  await seed()
}
function makeNodes(){
  nodeLayer.replaceChildren();
  nodes.forEach(n=>{
    let g=document.createElementNS('http://www.w3.org/2000/svg','g');
    g.classList.add('node');
    if(nonEquation(data[n.name]))g.classList.add('non-equation');
    let c=document.createElementNS('http://www.w3.org/2000/svg','circle');
    c.setAttribute('r',n.r);c.setAttribute('fill',col(n.name));
    let t=document.createElementNS('http://www.w3.org/2000/svg','text');
    t.textContent=n.name;t.setAttribute('font-size',n.name.length>24?10:n.name.length>16?11:13);
    g.append(c,t);n.el=g;
    g.addEventListener('click',e=>{
      e.stopPropagation();
      showPopup(n.name)
    });
    nodeLayer.appendChild(g)
  })
}

function worldPoint(x,y){
  const r=svg.getBoundingClientRect();
  return {
    x:(x-r.left-view.x)/view.scale,
    y:(y-r.top-view.y)/view.scale
  }
}

function update(){
  nodes.forEach(n=>{
    if(n.el)n.el.setAttribute('transform',`translate(${n.x},${n.y})`);
  });
  edgeEls.forEach(l=>{
    let a=nodes.get(l.dataset.a),b=nodes.get(l.dataset.b);if(!a||!b)return;
    let dx=b.x-a.x,dy=b.y-a.y,gapA=a.r+7,gapB=b.r+15;
    if(Math.abs(dy)<3){
      let sg=dx>=0?1:-1,x1=a.x+sg*gapA,x2=b.x-sg*gapB;
      l.setAttribute('d',`M ${x1} ${a.y} H ${x2}`);
      return
    }
    /* ELK gives the route. Convert every segment to horizontal/vertical SVG commands. */
    let p=l._points||[];
    if(p.length<2){
      let y=Math.min(b.y,a.y)+Math.abs(b.y-a.y)/2;
      l.setAttribute('d',`M ${a.x} ${a.y+(b.y>a.y?gapA:-gapA)} V ${y} H ${b.x} V ${b.y-(b.y>a.y?gapB:-gapB)}`);
      return
    }
    let d=`M ${p[0].x} ${p[0].y}`;
    for(let i=1;i<p.length;i++)d+=` ${p[i].x===p[i-1].x?'V':'H'} ${p[i].x===p[i-1].x?p[i].y:p[i].x}`;
    l.setAttribute('d',d)
  });
  world.setAttribute('transform',`translate(${view.x},${view.y}) scale(${view.scale})`)
}
function reheat(){
  layout()
}

let plotToken=0;
function callFunction(code,x){
  let p=parseCall(code);
  if(!p)return {ok:false,error:"invalid function call: "+code};
  let fn=window[p.name];
  if(typeof fn!=="function"&&typeof math[p.name]==="function")fn=math[p.name];
  if(typeof fn!=="function")return {ok:false,error:"function not found: "+p.name};
  try{
    let args=p.args.map(a=>{
      a=a.trim();
      if(a==="x"||a==="z"||a==="t")return x;
      if(paramState[a]!==undefined)return paramState[a];
      if(a==="pi")return Math.PI;
      if(a==="e")return Math.E;
      if(a==="I")return math.complex(0,1);
      let v=Number(a);
      return Number.isFinite(v)?v:a
    });
    return {ok:true,value:fn(...args)}
  }catch(err){return {ok:false,error:String(err.message||err)}}
}
function realValue(v){
  if(typeof v==="number"&&Number.isFinite(v))return v;
  if(v&&typeof v.re==="number"&&typeof v.im==="number"&&Math.abs(v.im)<1e-8&&Number.isFinite(v.re))return v.re;
  if(v&&typeof v.toNumber==="function"){try{let z=v.toNumber();if(Number.isFinite(z))return z}catch{}}
  return NaN
}
function plotOne(canvas,call,opt={}){
  let token=++plotToken,ctx=canvas.getContext("2d");
  if(!ctx){return}
  let dpr=devicePixelRatio||1,w=Math.max(320,canvas.clientWidth||640),h=Math.max(190,canvas.clientHeight||260);
  canvas.width=Math.floor(w*dpr);canvas.height=Math.floor(h*dpr);
  ctx.setTransform(dpr,0,0,dpr,0,0);
  ctx.clearRect(0,0,w,h);

  let row=canvas.parentElement,status=row.querySelector(".plotstatus");
  let xmin=Number.isFinite(opt.xmin)?opt.xmin:-5;
  let xmax=Number.isFinite(opt.xmax)?opt.xmax:5;
  let samples=Math.max(80,Math.min(1600,Number(opt.samples)||420));
  let pts=[],bad=0;

  status.textContent="calculating "+samples+" samples...";

  for(let i=0;i<=samples;i++){
    if(token!==plotToken){status.textContent="cancelled";return}
    let x=xmin+(xmax-xmin)*i/samples,r=callFunction(call,x);
    if(!r.ok){status.textContent=r.error;return}
    let y=realValue(r.value);
    if(Number.isFinite(y)&&Math.abs(y)<1e12)pts.push([x,y]);
    else{pts.push([x,NaN]);bad++}
  }

  let finite=pts.filter(p=>Number.isFinite(p[1]));
  if(!finite.length){status.textContent="no finite values";return}

  let ymin=opt.ymin,ymax=opt.ymax;
  if(!Number.isFinite(ymin)||!Number.isFinite(ymax)){
    let ys=finite.map(p=>p[1]).sort((a,b)=>a-b);
    let lo=ys[Math.floor(ys.length*.02)],hi=ys[Math.floor(ys.length*.98)];
    if(lo===hi){lo=Math.min(...ys);hi=Math.max(...ys)}
    let span=hi-lo||1;
    ymin=lo-.08*span;ymax=hi+.08*span;
  }
  if(!(ymax>ymin)){ymin-=1;ymax+=1}

  let L=58,R=18,T=22,B=34,pw=w-L-R,ph=h-T-B;
  let X=x=>L+(x-xmin)/(xmax-xmin)*pw;
  let Y=y=>T+(ymax-y)/(ymax-ymin)*ph;

  ctx.font="11px Consolas,monospace";
  ctx.lineWidth=1;
  ctx.strokeStyle="#ddd";
  ctx.fillStyle="#555";

  // grid and ticks
  let xt=8,yt=6;
  for(let i=0;i<=xt;i++){
    let x=xmin+(xmax-xmin)*i/xt,px=X(x);
    ctx.beginPath();ctx.moveTo(px,T);ctx.lineTo(px,T+ph);ctx.stroke();
    ctx.fillText(fmtChart(x),px-16,T+ph+18);
  }
  for(let i=0;i<=yt;i++){
    let y=ymin+(ymax-ymin)*i/yt,py=Y(y);
    ctx.beginPath();ctx.moveTo(L,py);ctx.lineTo(L+pw,py);ctx.stroke();
    ctx.fillText(fmtChart(y),4,py+4);
  }

  // axes
  ctx.strokeStyle="#888";
  if(xmin<=0&&xmax>=0){let px=X(0);ctx.beginPath();ctx.moveTo(px,T);ctx.lineTo(px,T+ph);ctx.stroke()}
  if(ymin<=0&&ymax>=0){let py=Y(0);ctx.beginPath();ctx.moveTo(L,py);ctx.lineTo(L+pw,py);ctx.stroke()}

  // frame
  ctx.strokeStyle="#aaa";ctx.strokeRect(L,T,pw,ph);

  // adaptive-looking discontinuity protection: do not connect jumps.
  ctx.strokeStyle="#111";ctx.lineWidth=1.7;ctx.beginPath();
  let drawing=false,lastX=NaN,lastY=NaN;
  pts.forEach(p=>{
    if(!Number.isFinite(p[1])){drawing=false;return}
    let px=X(p[0]),py=Y(p[1]);
    let jump=Number.isFinite(lastY)&&Math.abs(py-lastY)>ph*.65;
    if(!drawing||jump){ctx.moveTo(px,py);drawing=true}
    else ctx.lineTo(px,py);
    lastX=px;lastY=py;
  });
  ctx.stroke();

  ctx.fillStyle="#333";
  ctx.font="bold 11px Consolas,monospace";
  ctx.fillText(call,L,T-7);
  ctx.font="10px Consolas,monospace";
  ctx.fillText("x",L+pw-5,T+ph+27);
  ctx.save();ctx.translate(13,T+8);ctx.rotate(-Math.PI/2);ctx.fillText("y",0,0);ctx.restore();

  status.textContent=`${call}    x=[${fmtChart(xmin)}, ${fmtChart(xmax)}]    finite ${finite.length}/${pts.length}`;
}

function fmtChart(x){
  if(!Number.isFinite(x))return "nan";
  let a=Math.abs(x);
  if(a!==0&&(a>=1e4||a<1e-3))return x.toExponential(2);
  return Number(x.toPrecision(4)).toString();
}
function initParams(e){(e[7]||[]).forEach(q=>{if(paramState[q[0]]===undefined)paramState[q[0]]=q[4]})}
function sliderHtml(name,q){
  let [p,min,max,step,def]=q;if(paramState[p]===undefined)paramState[p]=def;
  return `<label class="slider"><span>${esc(p)}=<b data-val="${esc(name)}:${esc(p)}">${paramState[p]}</b></span><input type="range" min="${min}" max="${max}" step="${step}" value="${paramState[p]}" data-node="${esc(name)}" data-param="${esc(p)}"></label>`
}
function bindPopupControls(name){
  document.querySelectorAll('#popup input[type=range]').forEach(inp=>inp.oninput=()=>{
    paramState[inp.dataset.param]=Number(inp.value);
    let b=document.querySelector(`[data-val="${CSS.escape(name)}:${CSS.escape(inp.dataset.param)}"]`);if(b)b.textContent=inp.value;
  });
  document.querySelectorAll('#popup .plotbtn').forEach(btn=>btn.onclick=()=>{
    let box=btn.parentElement.parentElement;
    let c=box.querySelector('canvas[data-call]');
    if(!c)return;
    let xmin=Number(box.querySelector('.plotxmin')?.value),xmax=Number(box.querySelector('.plotxmax')?.value);
    let samples=Number(box.querySelector('.plotsamples')?.value);
    if(!Number.isFinite(xmin)||!Number.isFinite(xmax)||xmax<=xmin){
      let st=box.querySelector('.plotstatus');if(st)st.textContent="invalid x range";return
    }
    plotOne(c,c.dataset.call,{xmin,xmax,samples})
  })
}
function parseCall(str){
  str=String(str||"").trim();
  let m=str.match(/^([A-Za-z_$][\w$]*)\s*\(([\s\S]*)\)$/);
  if(!m)return {name:str,args:[]};
  let args=[],buf="",d=0,quote="";
  for(let i=0;i<m[2].length;i++){
    let c=m[2][i];
    if(quote){
      buf+=c;
      if(c===quote&&m[2][i-1]!=="\\")quote="";
      continue
    }
    if(c==="'"||c==='"'){quote=c;buf+=c;continue}
    if(c==="("||c==="["||c==="{"){d++;buf+=c;continue}
    if(c===")"||c==="]"||c==="}"){d--;buf+=c;continue}
    if(c===","&&d===0){args.push(buf.trim());buf="";continue}
    buf+=c
  }
  if(buf.trim())args.push(buf.trim());
  return {name:m[1],args}
}

function parsePlotArg(a,x){
  a=String(a??"").trim();
  if(a==="x"||a==="z"||a==="t")return x;
  if(paramState[a]!==undefined)return paramState[a];
  if(a==="pi")return Math.PI;
  if(a==="e")return Math.E;
  if(a==="I")return math.complex(0,1);

  /* allow direct numeric expressions in function arguments */
  if(/^[0-9eE+*/().\-\s]+$/.test(a)){
    try{
      let v=Function('"use strict";return ('+a+')')();
      if(Number.isFinite(v))return v
    }catch{}
  }

  let v=Number(a);
  return Number.isFinite(v)?v:a
}

function callFunction(code,x){
  let p=parseCall(code);
  if(!p||!p.name)return {ok:false,error:"invalid function call: "+code};

  /* mthfnc functions are loaded globally, so call them directly. */
  let fn=typeof window[p.name]==="function"?window[p.name]:null;
  if(!fn)return {ok:false,error:"function not found: "+p.name};

  try{
    let args=p.args.map(a=>parsePlotArg(a,x));
    return {ok:true,value:fn(...args)}
  }catch(err){
    return {ok:false,error:String(err?.message||err)}
  }
}
function showPopup(name){
  let e=data[name],rows='';initParams(e);
  rows+=`<tr><th>equation</th><td class="formula">${esc(e[1])}</td></tr>`;
  rows+=`<tr><th>description</th><td>${esc(e[2])}</td></tr>`;
  rows+=`<tr><th>extra</th><td>${esc(e[3])}</td></tr>`;
  rows+=`<tr><th>generality</th><td>${esc(e[4])} — ${esc(levelNames[Math.max(0,Math.min(5,Number(e[4])||0))])}</td></tr>`;
  rows+=`<tr><th>status</th><td>${noequation(e)?'no equation':'equation present'}; ${nocode(e)?'no mthfnc code':'mthfnc code present'}</td></tr>`;
  let params=e[7]||[];if(params.length)rows+=`<tr><th>inputs</th><td>${params.map(q=>sliderHtml(name,q)).join('')}</td></tr>`;

  let sols=e[6]||[];
  if(sols.length){
    let block=sols.map((q,i)=>{
      let call=q[3]||"";
      let safe=!!call&&parseCall(call);
      return `<div class="plotrow"><div class="plothead"><b>${esc(q[0])}</b><span class="code">${esc(q[2]||"")}</span></div><div class="formula">${esc(q[1]||"")}</div>${call?`<div class="plottools"><label>xmin <input class="plotxmin" type="number" value="-5" step="any"></label><label>xmax <input class="plotxmax" type="number" value="5" step="any"></label><label>samples <input class="plotsamples" type="number" value="420" min="80" max="1600" step="20"></label><button class="plotbtn" data-i="${i}">plot</button></div><div class="plotstatus">${esc(call)}</div><canvas class="plotcanvas" data-call="${esc(call)}"></canvas>`:"<div class=\"plotstatus\">no example call supplied</div>"}</div>`
    }).join('');
    rows+=`<tr><th>functions</th><td>${block}</td></tr>`;
  }
  let con=edges.filter(e0=>e0[0]===name||e0[1]===name).map(e0=>{
    let dir=e0[0]===name?'→':'←',other=e0[0]===name?e0[1]:e0[0];
    return `<div class="connection"><span class="tag">${esc(e0[2])}</span>${dir} <b>${esc(other)}</b>${e0[3]?` — ${esc(e0[3])}`:''}</div>`
  }).join('');
  rows+=`<tr><th>connections</th><td>${con||'none'}</td></tr>`;

  let codes=sols.map(q=>q[2]).filter(Boolean);
  if(name==="heun rc")codes.push("heunrc(q,b,g,d,z){ return heunc(q,b,g,d,0,z); }");
  if(name==="heun rb")codes.push("heunrb(q,a,g,d,z){ return heunb(q,a,g,d,0,z); }");
  if(name==="heun rt")codes.push("heunrt(q,a,g,d,z){ return heunt(q,a,g,d,0,z); }");
  if(name==="heun rd")codes.push("heunrd(q,beta,eps,z){ return heund(q,beta,eps,0,-1,z); }");
  if(name==="heun dd")codes.push("heundd(eps,z){ return heund(q=1,beta=1,gamma=0,delta=0,eps,z); }");
  rows+=`<tr><th>code</th><td><pre class="codeblock">${esc(codes.join("\n"))||"no mthfnc function mapped"}</pre></td></tr>`;
  let src=e[8]||[];if(src.length)rows+=`<tr><th>sources</th><td>${src.map(u=>`<div class="source"><a href="${esc(u)}" target="_blank" rel="noopener">${esc(u)}</a></div>`).join("")}</td></tr>`;

  document.getElementById('ptitle').textContent=e[0];document.getElementById('info').innerHTML=rows;
  let pop=document.getElementById('popup');pop.style.display='block';
  let n=nodes.get(name),r=svg.getBoundingClientRect(),pw=Math.min(510,window.innerWidth-20);
  pop.style.width=pw+"px";
  requestAnimationFrame(()=>{
    let ph=pop.offsetHeight,left=r.left+view.x+n.x*view.scale+18,top=r.top+view.y+n.y*view.scale+18;
    left=Math.max(10,Math.min(left,window.innerWidth-pw-10));top=Math.max(10,Math.min(top,window.innerHeight-ph-10));
    pop.style.left=left+"px";pop.style.top=top+"px";bindPopupControls(name)
  })
}
function closePopup(){document.getElementById('popup').style.display='none'}
function searchNodes(){
  let q=document.getElementById('search').value.toLowerCase().trim();
  nodes.forEach(n=>n.el.style.opacity=!q||n.name.toLowerCase().includes(q)?'1':'.1')
}
svg.addEventListener('mousedown',e=>{
  if(e.button!==0||e.target.closest('.node'))return;
  pan=true;px=e.clientX;py=e.clientY;vx=view.x;vy=view.y;svg.classList.add('dragging')
});
window.addEventListener('mousemove',e=>{
  if(pan){view.x=vx+e.clientX-px;view.y=vy+e.clientY-py;update()}
});
window.addEventListener('mouseup',()=>{
  pan=false;svg.classList.remove('dragging')
});
svg.addEventListener('wheel',e=>{
  e.preventDefault();let r=svg.getBoundingClientRect(),mx=e.clientX-r.left,my=e.clientY-r.top,old=view.scale,ns=Math.max(.10,Math.min(3.5,old*(e.deltaY<0?1.12:.89)));
  view.x=mx-(mx-view.x)*(ns/old);view.y=my-(my-view.y)*(ns/old);view.scale=ns;update()
},{passive:false});
svg.addEventListener('click',e=>{if(!e.target.closest('.node'))closePopup()});
layout().then(()=>{makeLevels();makeNodes();makeEdges();update()}).catch(e=>console.error('elk layout failed',e));
</script>
