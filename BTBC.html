<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <title>Extended Base Converter</title>
    <style>
    @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+Symbols&display=swap');
        body {
            Content-Type: text/html; charset=UTF-8

            display: flex;
            flex-direction: column;
            align-items: center;
            margin-top: 50px;
            color: yellow;
            background-image: url("basee.png");
            background-size: cover;
        }
        input, select, button {
            margin: 10px;
            padding: 5px;
            font-size: 16px;
        }
        .container {
            display: flex;
            flex-direction: column;
            align-items: center;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Base Converter</h1>
    <input type="text" id="inputNumber" placeholder="Enter number (e.g., 6.2234 or 4/2)">
    
    
    <div>    <label for="fromBase">From Base: </label>
        <select id="fromBaseSelect">

            <option value="14">e (Base 14)</option>
            <option value="16">Hexadecimal</option>

            <option value="36">Hexatrigesimal</option>
            <option value="60">Sexagesimal</option>
            <option value="64">Tetrasexagesimal</option>
            <option value="100">Centesimal</option>
            <option value="112">Centoduodecimal</option>
            <option value="128">Centoctovigisimal</option>
            <option value="140">e* (Base 140)</option>
            <option value="154">ğ (Base 154)</option>
            <option value="200">Decavigesimal</option>
            <option value="456">Quadringentohexaquinquagesimal</option>
            <option value="500">Pentacentesimal</option>
            <option value="1000">Decacentesimal</option>
            <option value="1296">Fetaniftimal</option>

            <option value="6.28318530718">𝜏</option>
            <option value="2.71828182846">e (fake 2.71)</option>
        </select>
        <input type="text" id="fromBaseInput" placeholder="Manual From Base">
    </div>
    <div>
        <label for="toBase">To Base: </label>
        <select id="toBaseSelect">,
            <option value='0'>Maximal(character table dependant)</option>
            <option value="2">Binary</option>
            <option value="3">Ternary</option>
            <option value="7">e/2 (Base 7)</option>
            <option value="8">Octal</option>
            <option value="10">Decimal</option>
            <option value="12">Duodecimal</option>
            <option value="14" selected>e (Base 14)</option>
            <option value="16">Hexadecimal</option>
            <option value="20">Vigesimal</option>
            <option value="36">Hexatrigesimal</option>
            <option value="60">Sexagesimal</option>
            <option value="64">Tetrasexagesimal</option>
            <option value="100">Centesimal</option>
            <option value="112">Centoduodecimal</option>
            <option value="128">Centoctovigisimal</option>
            <option value="140">e* (Base 140)</option>
            <option value="154">ğ (Base 154)</option>
            <option value="200">Decavigesimal</option>
            <option value="456">Quadringentohexaquinquagesimal</option>
            <option value="500">Pentacentesimal</option>
            <option value="1000">Decacentesimal</option>
            <option value="1296">Fetaniftimal</option>
            <option value="1.41421356237">√2</option>
            <option value="1.73205080757">√3</option>
            <option value="3.16227766017">√10</option>
            <option value="1.61803398875">Φ</option>
            <option value="3.14159265359">π</option>
            <option value="6.28318530718">𝜏</option>
            <option value="2.71828182846">e (fake 2.71)</option>
        </select>
        <input type="text" id="toBaseInput" placeholder="Manual To Base">
    </div>
    <div>
        <label for="characterTable">Character Table: </label>
        <select id="characterTableSelect">
            <option value="original">Original</option>
             <option selected value="original2">Original Extended</option>
            <option value="justletters">Just Letters (a-z)</option>
            <option value="ascii">ASCII</option>
             <option value="utf82">UTF8 2 byte</option>
            <option value="custom1">Custom 1 (0-9, A-Z)</option>
            <option value="custom2">Custom 2 (0-9, A-Z, a-z)</option>
            <option value="custom3">Custom 3 (0-9, a-z)</option>
            <option value="custom8">Custom 8 (0-9, A-Z, a-z, !@#$%^&*~`_-)</option>
            
            <option value="braille">Braille (⠁⠂⠃...)</option>
          
             <option value="symbolsByHeight">Symbols by Height (▁▂▃...)</option>
            <option value="chinese">Chinese Characters (一丁丂...)</option>
           
            <option value="runes">Elder Futhark Runes (ᚠᚡᚢ...)</option>
        
            <option value="chess">Chess Pieces (♔♕♖...)</option>
            <option value="math">Math Symbols (∀∁∂...)</option>
            <option value="greek">Greek Letters (ΑΒΓ...)</option>
            <option value="cyrillic">Cyrillic Letters (АБВ...)</option>
            <option value="arrows">Arrows (←↑→...)</option>
            <option value="shapes">Shapes (■□▢...)</option>
            <option value="stars">Stars (★☆✪...)</option>
            <option value="music">Music Notes (♩♪♫...)</option>
         
     
            <option value="alchemy">Alchemy Symbols (☿♀♁...)</option>
            <option value="planets">Planets (☉☿♀...)</option>
            <option value="chessUnicode">Chess Unicode (♔♕♖...)</option>
       
            
        </select>
    </div>
    <button onclick="convertBase()">Convert</button>
    <input type="text" id="outputNumber" readonly placeholder="Converted Number">
    <button onclick="convertBack()">Convert Back</button>
     <button id="autoConvertButton" onclick="startAutoConvert()">Start Auto Convert</button><br>
</div>

    function getBaseValue(elementId) {
        const value = document.getElementById(elementId).value.trim();
        const numberValue = parseFloat(value);
        return isNaN(numberValue) ? parseFloat(document.getElementById(elementId.replace('Input', 'Select')).value) : numberValue;
    }

    function convertBase() {
    const inputNumber = document.getElementById('inputNumber').value.trim();
    const fromBaseInput = getBaseValue('fromBaseInput');
    const toBaseInput = getBaseValue('toBaseInput');
    const characterTable = document.getElementById('characterTableSelect').value;

    // Determine the bases
    const fromBase = (fromBaseInput === 0) ? characterTables[characterTable].length : fromBaseInput;
    const toBase = (toBaseInput === 0) ? characterTables[characterTable].length : toBaseInput;
//console.log(toBase)
    // Evaluate the input number using math.js
    const decimalValue = math.evaluate(inputNumber);

    // Convert the number to the target base
    const finalResult = convertFromDecimal(decimalValue, toBase, characterTable);
    document.getElementById('outputNumber').value = finalResult;
}

function convertBack() {
    const outputNumber = document.getElementById('outputNumber').value.trim();
    const fromBaseInput = getBaseValue('toBaseInput'); // Swap from and to bases for reverse conversion
    const toBaseInput = getBaseValue('fromBaseInput');
    const characterTable = document.getElementById('characterTableSelect').value;

    // Determine the bases
    const fromBase = (fromBaseInput === 0) ? characterTables[characterTable].length : fromBaseInput;
    const toBase = (toBaseInput === 0) ? characterTables[characterTable].length : toBaseInput;

    // Convert the output number back to decimal
    const decimalValue = convertToDecimal(outputNumber, fromBase, characterTable);

    // Convert the decimal value to the original base
    const finalResult = convertFromDecimal(decimalValue, toBase, characterTable);
    document.getElementById('inputNumber').value = finalResult;
}

    function convertToDecimal(number, base, characterTable) {
        const [integerPart, fractionalPart] = number.split('.');
        const baseCharacters = characterTables[characterTable];
        let decimalValue = 0;

        // Convert integer part to decimal
        for (let i = 0; i < integerPart.length; i++) {
            const digitValue = baseCharacters.indexOf(integerPart[i]);
            decimalValue = decimalValue * base + digitValue;
        }

        // Convert fractional part to decimal
        if (fractionalPart) {
            for (let i = 0; i < fractionalPart.length; i++) {
                const digitValue = baseCharacters.indexOf(fractionalPart[i]);
                decimalValue += digitValue / Math.pow(base, i + 1);
            }
        }

        return decimalValue;
    }

    function convertFromDecimal(decimalValuee, base, characterTable) {
        const baseCharacters = characterTables[characterTable];
        let result = '';
let decimalValue=decimalValuee+0
        // Determine the maximum power of the base needed
        let maxPower = Math.floor(Math.log(decimalValue) / Math.log(base));

        while (decimalValue > 1e-7 || maxPower > -1) {
            let n;
            for (n = 0; n < base; n++) {
                if (n * Math.pow(base, maxPower) > decimalValue) {
                    break;
                }
            }
            n--;
            if (maxPower == -1) result += '.';
            result += baseCharacters[n];
            decimalValue -= n * Math.pow(base, maxPower);
            maxPower--;
        }

        return result || '0'; // Return '0' if the result is empty
    }
    
    
        // Auto-convert functionality
    let autoConvertInterval;
    let currentNumber = 0;
    let delay = 1000; // Start with 1 second delay

    function startAutoConvert() {
        const button = document.getElementById('autoConvertButton');
        if (button.textContent === "Start Auto Convert") {
            button.textContent = "Stop Auto Convert";
            autoConvertInterval = setInterval(autoConvert, delay);
        } else {
            button.textContent = "Start Auto Convert";
            clearInterval(autoConvertInterval);

    function autoConvert() {
        const toBaseInput = getBaseValue('toBaseInput');
        const characterTable = document.getElementById('characterTableSelect').value;
        const toBase = (toBaseInput === 0) ? characterTables[characterTable].length : toBaseInput;

        // Convert the current number
        const finalResult = convertFromDecimal(currentNumber, toBase, characterTable);
        document.getElementById('outputNumber').value = finalResult;

        // Increment the number
        currentNumber++;

        // Adjust the delay exponentially
        if (currentNumber <= 10) {
            delay = 1000 / currentNumber; // Decrease delay exponentially
        } else {
            delay = Math.max(0, delay * 0.99); // Cap the minimum delay at 10ms
        }
        if(delay<1)currentNumber+=Math.round(1/sqrt(delay));

        // Update the interval with the new delay
        clearInterval(autoConvertInterval);
        autoConvertInterval = setInterval(autoConvert, delay);
    }
