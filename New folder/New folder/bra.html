<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>String Expander</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
        }
        #buttons {
            margin-top: 20px;
        }
        #buttons button {
            margin: 5px;
        }
        #output {
            margin-top: 10px;
            white-space: pre-wrap; /* Preserve whitespace and line breaks */
        }
    </style>
</head>
<body>
    <h1>String Expander</h1>
    <label for="input">Input:</label>
    <input type="text" id="input" value="{{[}<O>{,}{]<}<}{,}{>}<o>">
    <br>
    <label for="w">Repeat count:</label>
    <input type="number" id="w" value="2">
    <br>
    <button onclick="processInput()">Expand</button>
    <button onclick="expandResult()">Expand Result</button>
    <button onclick="simulateExpansion()">Simulate Expansion</button>
    <div id="output"></div>
    <div id="buttons">
        <button onclick="setText('w - [,]')">w - [,]</button>
        <button onclick="setText('w^2 [[,]]')">w^2 [[,]]</button>
        <button onclick="setText('w^w {[},{]}')">w^w {[},{]}</button>
        <button onclick="setText('e_0 ([{(,)}<]<),(>[>]')">e_0 ([{(,)}<]<),(>[>])</button>
        <button onclick="setText('phi(w,0) {[}{,}{]<}{,}{[>}{]}')">phi(w,0) {[}{,}{]<}{,}{[>}{]}</button>
        <button onclick="setText('G_0 \"{{[}<O>{,}{]<}<}{,}{>}<o>\"')">G_0 "{{[}<O>{,}{]<}<}{,}{>}<o>"</button>
    </div>

    <script>
        function stringfy(inp) {
            let chararray = [];
            let numbuffer = '';
            let commacount = 0;

            for (let c of inp) {
                if (c === ',') commacount++;
                else {
                    if (commacount > 0) chararray.push(`-N${commacount}`);
                    commacount = 0;

                    if (/\d/.test(c)) numbuffer += c;
                    else {
                        if (numbuffer) {
                            chararray.push(`-N${numbuffer}`);
                            numbuffer = '';
                        }
                        switch (c) {
                            case '(': chararray.push('01'); break;
                            case ')': chararray.push('-01'); break;
                            case '[': chararray.push('02'); break;
                            case ']': chararray.push('-02'); break;
                            case '{': chararray.push('03'); break;
                            case '}': chararray.push('-03'); break;
                            case 'w': chararray.push('09', '-N1', '-09'); break;
                            default: if (!/\s/.test(c)) chararray.push(c); break;
                        }
                    }
                }
            }
            if (commacount > 0) chararray.push(`-N${commacount}`);
            if (numbuffer) chararray.push(`-N${numbuffer}`);

            return chararray;
        }

        function del(chararray) {
            let lastNegative01Index = chararray.length;
            let lastNegative02Index = chararray.length;
            let lastNegative03Index = chararray.length;

            for (let i = 0; i < chararray.length; ++i) {
                if (chararray[i] === '-01') lastNegative01Index = i;
                else if (chararray[i] === '-02') lastNegative02Index = i;
                else if (chararray[i] === '-03') lastNegative03Index = i;
            }

            if (lastNegative01Index < chararray.length) {
                chararray = chararray.slice(0, lastNegative01Index + 1)
                    .concat(chararray.slice(lastNegative01Index + 1)
                        .filter(el => el !== '01'));
            }

            if (lastNegative02Index < chararray.length) {
                chararray = chararray.slice(0, lastNegative02Index + 1)
                    .concat(chararray.slice(lastNegative02Index + 1)
                        .filter(el => el !== '02'));
            }

            if (lastNegative03Index < chararray.length) {
                chararray = chararray.slice(0, lastNegative03Index + 1)
                    .concat(chararray.slice(lastNegative03Index + 1)
                        .filter(el => el !== '03'));
            }

            return chararray;
        }

        function expanda(chararray, w) {
            let expandedarray = [...chararray];
            let a = [];
            let i = 0;
            let ifv = 0;

            while (i < expandedarray.length) {
                if (expandedarray[i].length > 1 && expandedarray[i][0] !== '-') {
                    let startstr = expandedarray[i];
                    a.push(i);
                    let counter = 1;
                    let found = false;
                    for (let j = i + 1; j < expandedarray.length; ++j) {
                        if (expandedarray[j] === startstr) counter++;
                        else if (expandedarray[j] === `-${startstr}`) {
                            --counter;
                            if (counter === 0) {
                                a.push(j);
                                found = true;
                                i = j;
                                break;
                            }
                        }
                    }
                    if (!found) {
                        a.pop();
                        if (a.length) {
                            i = a.pop();
                        }
                    }
                }
                ++i;
            }

            if (a.length < 2) {
                let foundspecial = false;
                for (let j = 0; j < expandedarray.length; ++j) {
                    if (expandedarray[j] === '<') {
                        for (let k = j + 1; k < expandedarray.length; ++k) {
                            if (expandedarray[k] === '>') {
                                foundspecial = true;
                                expandedarray.splice(j, 1);
                                expandedarray.splice(k - 1, 1);
                                break;
                            }
                        }
                        if (foundspecial) break;
                    }
                }
                if (!foundspecial) {
                    let foundunpairedstart = false;
                    for (let j = 0; j < expandedarray.length; ++j) {
                        if (expandedarray[j].length > 1 && expandedarray[j][0] !== '-') {
                            expandedarray.splice(j, 1);
                            foundunpairedstart = true;
                            break;
                        }
                    }

                    if (!foundunpairedstart) {
                        for (let j = 0; j < expandedarray.length; ++j) {
                            if (expandedarray[j].length > 1 && expandedarray[j][0] === '-' && expandedarray[j][1] !== 'N') {
                                expandedarray.splice(j, 1);
                                break;
                            }
                        }
                    }
                }
            } else {
                while (a.length >= 2) {
                    ifv = 0;
                    let start = a[a.length - 2];
                    let end = a[a.length - 1];
                    let bigo = 0;
                    let tocopy = expandedarray.slice(start + 1, end);

                    if (end + 2 < expandedarray.length && expandedarray[end + 1] === '<' && expandedarray[end + 3] === '>') {
                        if (expandedarray[end + 2] === 'O' || expandedarray[end + 2] === 'o') {
                            bigo = 1;
                            ifv = 1;
                        } else {
                            let repeatcount = 1;
                            if (end + 3 < expandedarray.length && expandedarray[end + 2].startsWith('-N')) {
                                let numstr = expandedarray[end + 2].substring(2);
                                repeatcount = parseInt(numstr, 10);
                                expandedarray.splice(end + 1, 3);
                            } else {
                                expandedarray.splice(end + 1, 2);
                            }
                            for (let k = 0; k < repeatcount; ++k) {
                                expandedarray.splice(end + 1 + k * tocopy.length, 0, ...tocopy);
                            }
                        }
                    } else if (end + 1 < expandedarray.length && expandedarray[end + 1] === '<') {
                        ifv = 1;
                        a.pop();
                        a.pop();
                        continue;
                    } else {
                        ifv = 0;
                        for (let k = start + 1; k < end; ++k) {
                            if (expandedarray[k] !== '01' && expandedarray[k] !== '-01') {
                                if (expandedarray[k].length > 1 && expandedarray[k][0] !== '-') {
                                    let subarray = expandedarray.slice(k, end);
                                    expandedarray.splice(k, end - k + 1, ...subarray);
                                }
                            }
                        }
                    }

                    a.pop();
                    a.pop();
                    if (ifv === 1) {
                        for (let k = 0; k < expandedarray.length; ++k) {
                            if (expandedarray[k] === '<') {
                                expandedarray.splice(k, 1);
                                break;
                            }
                        }
                    }
                }
            }

            return expandedarray;
        }

        function processInput() {
            let input = document.getElementById('input').value;
            let repeatCount = parseInt(document.getElementById('w').value, 10);
            let chararray = stringfy(input);
            chararray = del(chararray);
            let expanded = expanda(chararray, repeatCount);
            document.getElementById('output').textContent = expanded.join(' ');
        }

        function setText(text) {
            document.getElementById('input').value = text;
        }

        function expandResult() {
            processInput();
        }

        function simulateExpansion() {
            let input = document.getElementById('input').value;
            let repeatCount = parseInt(document.getElementById('w').value, 10);
            let chararray = stringfy(input);
            chararray = del(chararray);
            let interval = setInterval(() => {
                let expanded = expanda(chararray, repeatCount);
                document.getElementById('output').textContent += '\n' + expanded.join(' ');
                repeatCount++;
                if (repeatCount > 10) { // Adjust this as needed
                    clearInterval(interval);
                }
            }, 500);
        }
    </script>
</body>
</html>
