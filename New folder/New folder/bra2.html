<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Expand String</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
        }
        #output {
            margin-top: 20px;
            white-space: pre-wrap; /* Preserve formatting and newlines */
        }
    </style>
</head>
<body>
    <h1>Expand String</h1>
    <label for="input">Input:</label>
    <input type="text" id="input" value="([{(,)}<]<),(>[>])">
    <br>
    <label for="repeatCount">Repeat count:</label>
    <input type="number" id="repeatCount" value="2">
    <br>
    <button onclick="expandText()">Expand</button>
    <button onclick="expandResult()">Expand Result</button>
    <button onclick="startSGH()">SGH</button>
    <div id="output"></div>
    <script>
        function stringfy(inp) {
            let chararray = [];
            let numbuffer = '';
            let commacount = 0;

            for (let c of inp) {
                if (c === ',') commacount++;
                else {
                    if (commacount > 0) chararray.push('-N' + commacount);
                    commacount = 0;

                    if (/\d/.test(c)) numbuffer += c;
                    else {
                        if (numbuffer) chararray.push('-N' + numbuffer);
                        numbuffer = '';
                        switch (c) {
                            case '(': chararray.push('01'); break;
                            case ')': chararray.push('-01'); break;
                            case '[': chararray.push('02'); break;
                            case ']': chararray.push('-02'); break;
                            case '{': chararray.push('03'); break;
                            case '}': chararray.push('-03'); break;
                            case 'w': chararray.push('09', '-N1', '-09'); break;
                            default: if (!/\s/.test(c)) chararray.push(c); break;
                        }
                    }
                }
            }
            if (commacount > 0) chararray.push('-N' + commacount);
            if (numbuffer) chararray.push('-N' + numbuffer);

            return chararray;
        }

        function del(chararray) {
            let lastNegative01Index = chararray.length;
            let lastNegative02Index = chararray.length;
            let lastNegative03Index = chararray.length;

            for (let i = 0; i < chararray.length; ++i) {
                if (chararray[i] === '-01') lastNegative01Index = i;
                else if (chararray[i] === '-02') lastNegative02Index = i;
                else if (chararray[i] === '-03') lastNegative03Index = i;
            }

            if (lastNegative01Index < chararray.length) {
                chararray = chararray.slice(0, lastNegative01Index + 1).concat(
                    chararray.slice(lastNegative01Index + 1).filter(str => str !== '01')
                );
            }
            if (lastNegative02Index < chararray.length) {
                chararray = chararray.slice(0, lastNegative02Index + 1).concat(
                    chararray.slice(lastNegative02Index + 1).filter(str => str !== '02')
                );
            }
            if (lastNegative03Index < chararray.length) {
                chararray = chararray.slice(0, lastNegative03Index + 1).concat(
                    chararray.slice(lastNegative03Index + 1).filter(str => str !== '03')
                );
            }
            return chararray;
        }

        function expanda(chararray, w) {
            let expandedarray = [...chararray];
            let a = [];
            let i = 0;
            let ifv = 0;

            while (i < expandedarray.length) {
                if (expandedarray[i].length > 1 && expandedarray[i][0] !== '-') {
                    let startstr = expandedarray[i];
                    a.push(i);
                    let counter = 1;
                    let found = false;
                    for (let j = i + 1; j < expandedarray.length; ++j) {
                        if (expandedarray[j] === startstr) counter++;
                        else if (expandedarray[j] === '-' + startstr) {
                            --counter;
                            if (counter === 0) {
                                a.push(j);
                                found = true;
                                i = j;
                                break;
                            }
                        }
                    }
                    if (!found) {
                        a.pop();
                        if (a.length) {
                            i = a.pop();
                        }
                    }
                }
                ++i;
            }

            if (a.length < 2) {
                let foundspecial = false;
                for (let j = 0; j < expandedarray.length; ++j) {
                    if (expandedarray[j] === '<') {
                        for (let k = j + 1; k < expandedarray.length; ++k) {
                            if (expandedarray[k] === '>') {
                                foundspecial = true;
                                expandedarray.splice(j, 1);
                                expandedarray.splice(k - 1, 1);
                                break;
                            }
                        }
                        if (foundspecial) break;
                    }
                }
                if (!foundspecial) {
                    let foundunpairedstart = false;
                    for (let j = 0; j < expandedarray.length; ++j) {
                        if (expandedarray[j].length > 1 && expandedarray[j][0] !== '-') {
                            expandedarray.splice(j, 1);
                            foundunpairedstart = true;
                            break;
                        }
                    }

                    if (!foundunpairedstart) {
                        for (let j = 0; j < expandedarray.length; ++j) {
                            if (expandedarray[j].length > 1 && expandedarray[j][0] === '-' && expandedarray[j][1] !== 'N') {
                                expandedarray.splice(j, 1);
                                break;
                            }
                        }
                    }
                }
            } else {
                while (a.length >= 2) {
                    ifv = 0;
                    let start = a[a.length - 2];
                    let end = a[a.length - 1];
                    let bigo = 0;
                    let tocopy = expandedarray.slice(start + 1, end);

                    if (end + 2 < expandedarray.length && expandedarray[end + 1] === '<' && expandedarray[end + 3] === '>') {
                        if (expandedarray[end + 2] === 'O' || expandedarray[end + 2] === 'o') {
                            bigo = 1;
                            ifv = 1;
                        } else {
                            let repeatcount = 1;
                            if (end + 3 < expandedarray.length && expandedarray[end + 2].startsWith('-N')) {
                                let numstr = expandedarray[end + 2].substring(2);
                                repeatcount = parseInt(numstr, 10);
                                expandedarray.splice(end + 1, 3);
                            } else expandedarray.splice(end + 1, 2);
                            for (let k = 0; k < repeatcount; ++k) expandedarray.splice(end + 1 + k * tocopy.length, 0, ...tocopy);
                        }
                    } else if (end + 1 < expandedarray.length && expandedarray[end + 1] === '<') {
                        ifv = 1;
                        a.pop();
                        a.pop();
                        continue;
                    } else {
                        ifv = 0;
                        for (let k = 0; k < w; ++k) expandedarray.splice(end + 1 + k * tocopy.length, 0, ...tocopy);
                    }

                    if (!bigo) expandedarray.splice(start, end + 1 - start);

                    if (a.length >= 2) {
                        a.pop();
                        a.pop();
                    }
                }
            }
            if (ifv) {
                for (let i = 2; i < expandedarray.length - 2; ++i) {
                    if (expandedarray[i] === '<' && expandedarray[i + 2] === '>') {
                        let targetString = expandedarray[i - 1];
                        let targetSubstring = targetString.substring(1);
                        let counter = 1;

                        for (let j = i - 2; j >= 0; --j) {
                            if (expandedarray[j] === targetString) {
                                counter++;
                            } else if (expandedarray[j] === targetSubstring) {
                                counter--;
                            }
                            if (counter === 0) {
                                let tocopy3 = expandedarray.slice(j + 1, i - 1);
                                if (expandedarray[i + 1][0] === '-' && expandedarray[i + 1][1] === 'N') {
                                    let numstr = expandedarray[i + 1].substring(2);
                                    for (let k = 0; k < parseInt(numstr, 10); ++k) {
                                        expandedarray.splice(i + 1 + k * tocopy3.length, 0, ...tocopy3);
                                    }
                                    expandedarray.splice(j, i + 2 - j);
                                } else if (expandedarray[i + 1] === 'O') {
                                    if (i - j === 2) {
                                        expandedarray.splice(j, i + 3 - j);
                                    } else expandedarray.splice(i + 3, 0, ...tocopy3);
                                    i += 2;
                                } else if (expandedarray[i + 1] === 'o') {
                                    if (i - j === 2) {
                                        expandedarray.splice(j, i + 3 - j);
                                    } else expandedarray.splice(j, 0, ...tocopy3);
                                    i += 2;
                                }
                                break;
                            }
                        }
                    }
                }
            }

            for (let i = 0; i < expandedarray.length; ++i) {
                if (expandedarray[i] === '<') {
                    let matched = false;
                    for (let j = i + 1; j < expandedarray.length; ++j) {
                        if (expandedarray[j] === '>') {
                            matched = true;
                            break;
                        }
                    }
                    if (!matched) {
                        expandedarray.splice(i, 1);
                        --i;
                    }
                } else if (expandedarray[i] === '>') {
                    let matched = false;
                    for (let j = i - 1; j >= 0; --j) {
                        if (expandedarray[j] === '<') {
                            matched = true;
                            break;
                        }
                    }
                    if (!matched) {
                        expandedarray.splice(i, 1);
                        --i;
                    }
                }
            }

            return expandedarray;
        }

        function resintingfy(chararray) {
            let result = '';
            for (let str of chararray) {
                if (str.length > 2 && str.startsWith('-N')) {
                    let numpart = str.substring(2);
                    let count = parseInt(numpart, 10);
                    result += ','.repeat(count);
                } else if (str === '01') result += '(';
                else if (str === '-01') result += ')';
                else if (str === '02') result += '[';
                else if (str === '-02') result += ']';
                else if (str === '03') result += '{';
                else if (str === '-03') result += '}';
                else if (str === '09') result += '{';
                else if (str === '-09') result += '}';
                else result += str;
            }
            return result;
        }

       function expandText() {
            let input = document.getElementById('input').value;
            let w = parseInt(document.getElementById('repeatCount').value, 10);
            let chararray = stringfy(input);
            chararray = del(chararray);
            let expandedarray = expanda(chararray, w);
                       document.getElementById('output').innerHTML = resintingfy(expandedarray); // Clear output on expand
        }

        function expandResult() {
            let output = document.getElementById('output');
            let lines = output.innerHTML.split('\n');
            let lastLine = lines.pop(); // Get the last line
let input = document.getElementById('input').value;

            if (lastLine !== undefined) {
                let w = parseInt(document.getElementById('repeatCount').value, 10);
                let chararray = stringfy(input);
                chararray = del(chararray);
                let expandedarray = expanda(chararray, w);
                let result = resintingfy(expandedarray);

                output.innerHTML += '\n' + result; // Add a newline for the new result
document.getElementById('input').value = resintingfy(expandedarray); // Clear output on expand

            }
        }


        function startSGH() {
            let previousResults = [];
            let interval = setInterval(() => {
                expandResult();
                let currentResult = document.getElementById('output').innerHTML.split('\n').pop();
                
                if (previousResults.includes(currentResult)) {
                    clearInterval(interval);
                } else {
                    previousResults.push(currentResult);
                }
            }, 500);
        }
    </script>
</body>
</html>
