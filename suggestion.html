<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Suggestion Board</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .suggestion { border: 1px solid #ddd; padding: 10px; margin: 5px 0; border-radius: 5px; display: flex; align-items: center; justify-content: space-between; }
        .votes { font-weight: bold; margin-right: 10px; }
        .condition { padding: 3px 6px; border-radius: 4px; font-size: 14px; font-weight: bold; }
        .not-started { background: #ccc; color: black; } /* ⏳ */
        .cancelled { background: #ff4d4d; color: white; } /* ❌ */
        .nope { background: black; color: white; } /* 🚫 */
        .in-progress { background: #ffcc00; color: black; } /* ⚒️ */
        .done { background: #4CAF50; color: white; } /* ✅ */
        .redoing { background: #800080; color: white; } /* 🔄 */
        .redone { background: #0073e6; color: white; } /* 🔁 */
        .perchance { background: #a52a2a; color: white; } /* 🌟 */
    </style>
</head>
<body>

    <h2>Suggestion Board</h2>
    
    <label>Username: <input type="text" id="username"></label>
    <label>Suggestion: <input type="text" id="suggestion"></label>
    <button onclick="addSuggestion()">Submit</button>

    <h3>Filter by Condition:</h3>
    <select id="conditionFilter" onchange="fetchSuggestions()">
        <option value="all">All</option>
        <option value="0">⏳ Not Started</option>
        <option value="1">⚒️ In Progress</option>
        <option value="2">✅ Done</option>
        <option value="3">🔄 Redoing</option>
        <option value="4">🔁 Redone</option>
        <option value="5">🌟 Perchance</option>
        <option value="-1">❌ Cancelled</option>
        <option value="-2">🚫 Nope</option>
    </select>

    <div id="suggestions"></div>

    <script>
        const API_URL = "https://docs.google.com/spreadsheets/d/1AEOohgUqJP20WUz-WkW19RfkKD032-wWJpPw4jbmcVY/edit?gid=0#gid=0"; // Replace this

        const conditionMap = {
            0: { symbol: "⏳", text: "Not Started", class: "not-started" },
            1: { symbol: "⚒️", text: "In Progress", class: "in-progress" },
            2: { symbol: "✅", text: "Done", class: "done" },
            3: { symbol: "🔄", text: "Redoing", class: "redoing" },
            4: { symbol: "🔁", text: "Redone", class: "redone" },
            5: { symbol: "🌟", text: "Perchance", class: "perchance" },
            6: { symbol: "❌", text: "Cancelled", class: "cancelled" },
            7: { symbol: "🚫", text: "Nope", class: "nope" },
        };

        async function fetchSuggestions() {
            const response = await fetch(API_URL);
            const suggestions = await response.json();
            const container = document.getElementById("suggestions");
            const filter = document.getElementById("conditionFilter").value;
            container.innerHTML = "";

            suggestions.slice(1) // Remove headers
                .filter(s => filter === "all" || s[3] == filter) // Apply condition filter
                .sort((a, b) => b[2] - a[2]) // Sort by votes
                .forEach(s => {
                    const condition = conditionMap[s[3]] || { symbol: "❓", text: "Unknown", class: "" };
                    container.innerHTML += `
                        <div class="suggestion">
                            <span class="votes">(${s[2]})</span> 
                            "${s[0]}" -${s[1]}
                            <span class="condition ${condition.class}">${condition.symbol} ${condition.text}</span>
                            <button onclick="vote('${s[0]}', '${s[1]}', 1)">+1</button>
                            <button onclick="vote('${s[0]}', '${s[1]}', -1)">-1</button>
                        </div>
                    `;
                });
        }

        async function addSuggestion() {
            const user = document.getElementById("username").value.trim();
            const text = document.getElementById("suggestion").value.trim();
            if (user && text) {
                await fetch(API_URL, {
                    method: "POST",
                    body: JSON.stringify({ action: "add", user, text }),
                    headers: { "Content-Type": "application/json" }
                });
                fetchSuggestions();
            }
        }

        async function vote(text, user, vote) {
            await fetch(API_URL, {
                method: "POST",
                body: JSON.stringify({ action: "vote", text, user, vote }),
                headers: { "Content-Type": "application/json" }
            });
            fetchSuggestions();
        }

        fetchSuggestions();
    </script>

</body>
</html>
