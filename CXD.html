<!doctype html>
<html>
<head>
<meta charset="utf-8"/>
<title>Coxeter Renderer — WebGL2 shader renderer</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/mathjs/10.0.1/math.min.js"></script>
<script src="clrspc.js"></script>
<script src="polyhedra.js"></script>
<script src="mthfnc.js"></script>

<style>
body{font-family:Arial;margin:10px;}
input{width:45px;}
canvas{border:1px solid black;display:block;margin-top:10px;width:700px;height:700px;}
table{border-collapse:collapse;}
td{padding:2px;}
.controls{display:flex;gap:10px;align-items:center;flex-wrap:wrap;}
</style>
</head>

<body>

<h3>Coxeter Matrix (WebGL2 shader renderer)</h3>

<table>
<tr><td><input id="m00" value="1"></td><td><input id="m01" value="3"></td><td><input id="m02" value="2"></td></tr>
<tr><td><input id="m10" value="3"></td><td><input id="m11" value="1"></td><td><input id="m12" value="3"></td></tr>
<tr><td><input id="m20" value="2"></td><td><input id="m21" value="3"></td><td><input id="m22" value="1"></td></tr>
</table>

Decoration
<input id="d0" value="1">
<input id="d1" value="0">
<input id="d2" value="0">

<div class="controls">
Preset <select id="preset"></select>
<button id="btnGenerate">Generate</button>

<label>Fill brightness
<input id="light" type="range" min="0" max="2" step="0.01" value="1">
</label>

<label><input id="showEdges" type="checkbox" checked> show edges</label>
<label><input id="flatShade" type="checkbox" checked> flat shading</label>

</div>

<canvas id="canvas" width="700" height="700"></canvas>

<script>

/* ---------- GL helpers ---------- */

function createShader(gl,type,src){

const s=gl.createShader(type)
gl.shaderSource(s,src)
gl.compileShader(s)

if(!gl.getShaderParameter(s,gl.COMPILE_STATUS)){
console.error(gl.getShaderInfoLog(s))
return null
}

return s
}

function createProgram(gl,vs,fs){

const p=gl.createProgram()

gl.attachShader(p,createShader(gl,gl.VERTEX_SHADER,vs))
gl.attachShader(p,createShader(gl,gl.FRAGMENT_SHADER,fs))

gl.linkProgram(p)

if(!gl.getProgramParameter(p,gl.LINK_STATUS)){
console.error(gl.getProgramInfoLog(p))
return null
}

return p
}

/* ---------- shaders ---------- */

const vs_src=`#version 300 es
in vec3 a_pos;
in vec3 a_normal;
in vec3 a_color;

uniform float u_rotX;
uniform float u_rotY;
uniform float u_zoom;
uniform float u_d;
uniform float u_aspect;

out vec3 v_normal;
out vec3 v_color;

vec3 rotX(vec3 p,float a){
float c=cos(a),s=sin(a);
return vec3(p.x,p.y*c-p.z*s,p.y*s+p.z*c);
}

vec3 rotY(vec3 p,float a){
float c=cos(a),s=sin(a);
return vec3(p.x*c+p.z*s,p.y,-p.x*s+p.z*c);
}

void main(){

vec3 p=a_pos;
p=rotX(p,u_rotX);
p=rotY(p,u_rotY);

float scale=u_zoom*2.0/(u_d-p.z);

float clipX=(p.x*scale)/u_aspect;
float clipY=(p.y*scale);

gl_Position=vec4(clipX,clipY,(2.0*p.z)/u_d,1.0);

v_normal=a_normal;
v_color=a_color;
}
`;

const fs_src=`#version 300 es
precision highp float;

in vec3 v_normal;
in vec3 v_color;

out vec4 outColor;

uniform float u_lightStrength;
uniform vec3 u_lightDir;

void main(){

vec3 n=normalize(v_normal);
vec3 L=normalize(u_lightDir);

float lam=abs(dot(n,L));

float ambient=0.1;
float intensity=ambient+u_lightStrength*lam;

vec3 col=v_color*intensity;

outColor=vec4(col,1.0);
}
`;

const edge_vs=`#version 300 es
in vec3 a_pos;

uniform float u_rotX;
uniform float u_rotY;
uniform float u_zoom;
uniform float u_d;
uniform float u_aspect;

void main(){

vec3 p=a_pos;

float cx=cos(u_rotX),sx=sin(u_rotX);
float cy=cos(u_rotY),sy=sin(u_rotY);

p=vec3(p.x,p.y*cx-p.z*sx,p.y*sx+p.z*cx);
p=vec3(p.x*cy+p.z*sy,p.y,-p.x*sy+p.z*cy);

float scale=u_zoom*2.0/(u_d-p.z);

float clipX=(p.x*scale)/u_aspect;
float clipY=p.y*scale;

gl_Position=vec4(clipX,clipY,(2.0*p.z)/u_d,1.0);
}
`;

const edge_fs=`#version 300 es
precision highp float;
out vec4 o;
uniform vec3 u_edgeColor;
void main(){o=vec4(u_edgeColor,1.0);}
`;

/* ---------- globals ---------- */

let gl
let triProgram
let edgeProgram

let triVAO
let edgeVAO

let triCount=0
let edgeCount=0

let verts=[]
let faces=[]

let rotX=0
let rotY=0
let zoom=1

const dParam=26

const canvas=document.getElementById("canvas")

/* ---------- convex face merge ---------- */

function computeConvexFaces(V){

const eps=1e-4
const planes=[]

function samePlane(a,b){
return Math.abs(a.d-b.d)<eps &&
Math.abs(a.n[0]-b.n[0])<eps &&
Math.abs(a.n[1]-b.n[1])<eps &&
Math.abs(a.n[2]-b.n[2])<eps
}

let n=V.length

for(let i=0;i<n;i++)
for(let j=i+1;j<n;j++)
for(let k=j+1;k<n;k++){

let a=V[i],b=V[j],c=V[k]

let normal=math.cross(
math.subtract(b,a),
math.subtract(c,a)
)

if(math.norm(normal)<eps)continue

normal=math.divide(normal,math.norm(normal))
let d=math.dot(normal,a)

let sign=null,ok=true

for(let p of V){

let s=math.dot(normal,p)-d

if(Math.abs(s)<eps)continue

if(sign===null)sign=Math.sign(s)
else if(Math.sign(s)!==sign){ok=false;break}

}

if(!ok)continue

let plane={n:normal,d:d,verts:new Set()}

for(let i2=0;i2<n;i2++){

let s=math.dot(normal,V[i2])-d

if(Math.abs(s)<eps)
plane.verts.add(i2)

}

if(plane.verts.size<3)continue

let merged=false

for(let p of planes){

if(samePlane(p,plane)){

plane.verts.forEach(v=>p.verts.add(v))
merged=true
break

}

}

if(!merged)planes.push(plane)

}

const faces=[]

for(let P of planes){

let idx=[...P.verts]

let ref=V[idx[0]]
let nrm=P.n

let u=Math.abs(nrm[0])>0.9 ?
math.cross([0,1,0],nrm):
math.cross([1,0,0],nrm)

u=math.divide(u,math.norm(u))
let v=math.cross(nrm,u)

idx.sort((a,b)=>{

let ap=math.subtract(V[a],ref)
let bp=math.subtract(V[b],ref)

let ax=math.dot(ap,u)
let ay=math.dot(ap,v)

let bx=math.dot(bp,u)
let by=math.dot(bp,v)

return Math.atan2(ay,ax)-Math.atan2(by,bx)

})

faces.push(idx)

}

return faces

}

/* ---------- GL init ---------- */

function initGL(){

gl=canvas.getContext("webgl2")

triProgram=createProgram(gl,vs_src,fs_src)
edgeProgram=createProgram(gl,edge_vs,edge_fs)

gl.enable(gl.DEPTH_TEST)

/* double sided rendering */
gl.disable(gl.CULL_FACE)

triVAO=gl.createVertexArray()
edgeVAO=gl.createVertexArray()

}

/* ---------- buffer builder ---------- */

function buildTriangleBuffers(V,F){

const pos=[]
const norm=[]
const col=[]
const edges=[]

for(const f of F){

let p0=V[f[0]]
let p1=V[f[1]]
let p2=V[f[2]]

let normal=math.cross(
math.subtract(p1,p0),
math.subtract(p2,p0)
)

normal=math.divide(normal,math.norm(normal))

const k=f.length
const color=[((k*94)%255)/255,((k*52)%255)/255,((k*72)%255)/255]

for(let i=1;i<f.length-1;i++){

let a=V[f[0]]
let b=V[f[i]]
let c=V[f[i+1]]

pos.push(...a,...b,...c)
norm.push(...normal,...normal,...normal)
col.push(...color,...color,...color)

}

for(let i=0;i<f.length;i++){

let a=V[f[i]]
let b=V[f[(i+1)%f.length]]

edges.push(...a,...b)

}

}

return{
triPositions:new Float32Array(pos),
triNormals:new Float32Array(norm),
triColors:new Float32Array(col),
edgePositions:new Float32Array(edges)
}

}

/* ---------- generate ---------- */

function generate(){

let M=[
[+m00.value,+m01.value,+m02.value],
[+m10.value,+m11.value,+m12.value],
[+m20.value,+m21.value,+m22.value]
]

let D=[+d0.value,+d1.value,+d2.value]

verts=normalizevertices(verticesfromcoxeter(M,D))
faces=computeConvexFaces(verts)

upload()

}

/* ---------- upload ---------- */

function upload(){

if(!gl)initGL()

const buf=buildTriangleBuffers(verts,faces)

triCount=buf.triPositions.length/3
edgeCount=buf.edgePositions.length/3

gl.bindVertexArray(triVAO)

let b=gl.createBuffer()
gl.bindBuffer(gl.ARRAY_BUFFER,b)
gl.bufferData(gl.ARRAY_BUFFER,buf.triPositions,gl.STATIC_DRAW)

let loc=gl.getAttribLocation(triProgram,"a_pos")
gl.enableVertexAttribArray(loc)
gl.vertexAttribPointer(loc,3,gl.FLOAT,false,0,0)

b=gl.createBuffer()
gl.bindBuffer(gl.ARRAY_BUFFER,b)
gl.bufferData(gl.ARRAY_BUFFER,buf.triNormals,gl.STATIC_DRAW)

loc=gl.getAttribLocation(triProgram,"a_normal")
gl.enableVertexAttribArray(loc)
gl.vertexAttribPointer(loc,3,gl.FLOAT,false,0,0)

b=gl.createBuffer()
gl.bindBuffer(gl.ARRAY_BUFFER,b)
gl.bufferData(gl.ARRAY_BUFFER,buf.triColors,gl.STATIC_DRAW)

loc=gl.getAttribLocation(triProgram,"a_color")
gl.enableVertexAttribArray(loc)
gl.vertexAttribPointer(loc,3,gl.FLOAT,false,0,0)

gl.bindVertexArray(null)

gl.bindVertexArray(edgeVAO)

b=gl.createBuffer()
gl.bindBuffer(gl.ARRAY_BUFFER,b)
gl.bufferData(gl.ARRAY_BUFFER,buf.edgePositions,gl.STATIC_DRAW)

loc=gl.getAttribLocation(edgeProgram,"a_pos")
gl.enableVertexAttribArray(loc)
gl.vertexAttribPointer(loc,3,gl.FLOAT,false,0,0)

gl.bindVertexArray(null)

draw()

}

/* ---------- draw ---------- */

function draw(){

const dpr=window.devicePixelRatio||1

canvas.width=canvas.clientWidth*dpr
canvas.height=canvas.clientHeight*dpr

gl.viewport(0,0,canvas.width,canvas.height)

gl.clearColor(1,1,1,1)
gl.clear(gl.COLOR_BUFFER_BIT|gl.DEPTH_BUFFER_BIT)

/* triangles */

gl.useProgram(triProgram)
gl.bindVertexArray(triVAO)

gl.uniform1f(gl.getUniformLocation(triProgram,"u_rotX"),rotX)
gl.uniform1f(gl.getUniformLocation(triProgram,"u_rotY"),rotY)
gl.uniform1f(gl.getUniformLocation(triProgram,"u_zoom"),zoom)
gl.uniform1f(gl.getUniformLocation(triProgram,"u_d"),dParam)

gl.uniform1f(gl.getUniformLocation(triProgram,"u_aspect"),
canvas.clientWidth/canvas.clientHeight)

gl.uniform1f(gl.getUniformLocation(triProgram,"u_lightStrength"),
parseFloat(light.value))

gl.uniform3fv(gl.getUniformLocation(triProgram,"u_lightDir"),
new Float32Array([0.6,0.7,0.4]))

gl.drawArrays(gl.TRIANGLES,0,triCount)

/* edges */

if(showEdges.checked){

gl.useProgram(edgeProgram)
gl.bindVertexArray(edgeVAO)

gl.uniform1f(gl.getUniformLocation(edgeProgram,"u_rotX"),rotX)
gl.uniform1f(gl.getUniformLocation(edgeProgram,"u_rotY"),rotY)
gl.uniform1f(gl.getUniformLocation(edgeProgram,"u_zoom"),zoom)
gl.uniform1f(gl.getUniformLocation(edgeProgram,"u_d"),dParam)

gl.uniform1f(gl.getUniformLocation(edgeProgram,"u_aspect"),
canvas.clientWidth/canvas.clientHeight)

gl.uniform3fv(gl.getUniformLocation(edgeProgram,"u_edgeColor"),
new Float32Array([0.05,0.05,0.05]))

gl.drawArrays(gl.LINES,0,edgeCount)

}

}

/* ---------- interaction ---------- */

canvas.onmousemove=e=>{
if(e.buttons){
rotY+=e.movementX*0.01
rotX+=e.movementY*0.01
draw()
}
}

canvas.onwheel=e=>{
e.preventDefault()
zoom*=Math.exp(-e.deltaY*0.001)
draw()
}

btnGenerate.onclick=generate



function setM(M){
for(let i=0;i<3;i++)
for(let j=0;j<3;j++)
document.getElementById("m"+i+j).value=M[i][j];
}

function setD(v){
for(let i=0;i<3;i++)
document.getElementById("d"+i).value=v[i];
}
const PRESETS = {
tetra:        { M:[[1,3,2],[3,1,3],[2,3,1]], D:[1,0,0]},
cube:         { M:[[1,4,2],[4,1,3],[2,3,1]], D:[1,0,0]},
octa:         { M:[[1,4,2],[4,1,3],[2,3,1]], D:[0,0,1]},
dodeca:       { M:[[1,5,2],[5,1,3],[2,3,1]], D:[1,0,0]},
icosa:        { M:[[1,5,2],[5,1,3],[2,3,1]], D:[0,0,1]},

cubeoctahedron:{ M:[[1,4,2],[4,1,3],[2,3,1]], D:[0,1,0]},
trunctetra:    { M:[[1,3,2],[3,1,3],[2,3,1]], D:[1,1,0]},
trunccube:     { M:[[1,4,2],[4,1,3],[2,3,1]], D:[1,1,0]},
rhombicubeoctahedron:{ M:[[1,4,2],[4,1,3],[2,3,1]], D:[1,0,1]},
truncocta:     { M:[[1,4,2],[4,1,3],[2,3,1]], D:[0,1,1]},
trunccubeoctahedron:{ M:[[1,4,2],[4,1,3],[2,3,1]], D:[1,1,1]},

icosidodeca:   { M:[[1,5,2],[5,1,3],[2,3,1]], D:[0,1,0]},
truncicosa:    { M:[[1,5,2],[5,1,3],[2,3,1]], D:[0,1,1]},
truncicosadodeca:{ M:[[1,5,2],[5,1,3],[2,3,1]], D:[1,1,1]},
rhombicosidodeca:{ M:[[1,5,2],[5,1,3],[2,3,1]], D:[1,0,1]},
truncdodeca:    { M:[[1,5,2],[5,1,3],[2,3,1]], D:[1,1,0]},


snubcube:         { M:[[1,4,2],[4,1,3],[2,3,1]], D:[2,2,2]},



snubdodecahedron:         { M:[[1,5,2],[5,1,3],[2,3,1]], D:[2,2,2]},


pyritosnubcube:         { M:[[1,4,2],[4,1,3],[2,3,1]], D:[1,2,2]},
pyritohedralicosa:         { M:[[1,4,2],[4,1,3],[2,3,1]], D:[1,2,2]},

};
// populate preset dropdown dynamically

for(let key in PRESETS){
let opt = document.createElement("option");
opt.value = key;
opt.textContent = key;
document.getElementById("preset").appendChild(opt);
}
document.getElementById("preset").onchange = function(){
let p = this.value;
if(!PRESETS[p]) return;

setM(PRESETS[p].M);
setD(PRESETS[p].D);
};

generate()

</script>

</body>
</html>
