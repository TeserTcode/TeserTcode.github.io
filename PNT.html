<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Advanced Paint App</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            background-color: #f5f5f5;
        }
        
        #app-container {
            display: flex;
            flex-direction: column;
            gap: 10px;
            width: 100%;
            max-width: 1200px;
        }
        
        #main-area {
            display: flex;
            gap: 10px;
        }
        
        #left-panel {
            display: flex;
            flex-direction: column;
            gap: 10px;
            width: 250px;
        }
        
        #tools-panel {
            display: flex;
            flex-direction: column;
            gap: 10px;
            padding: 10px;
            background-color: white;
            border: 1px solid #ccc;
            border-radius: 5px;
        }
        
        .tool-section {
            margin-bottom: 15px;
        }
        
        .tool-section h3 {
            margin-top: 0;
            margin-bottom: 10px;
            border-bottom: 1px solid #eee;
            padding-bottom: 5px;
        }
        
        #canvas-container {
            flex-grow: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: white;
            border: 2px solid #333;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
            padding: 10px;
        }
        
        #canvas {
            background-color: white;
            cursor: crosshair;
            border: 1px solid #ddd;
        }
        
        .tool-btn {
            padding: 8px;
            border: 1px solid #ccc;
            background-color: white;
            cursor: pointer;
            border-radius: 4px;
            margin: 2px;
            font-size: 14px;
        }
        
        .tool-btn.active {
            background-color: #4CAF50;
            color: white;
            border-color: #4CAF50;
        }
        
        .tool-btn:hover {
            background-color: #e9e9e9;
        }
        
        .tool-btn.active:hover {
            background-color: #45a049;
        }
        
        #color-picker {
            padding: 10px;
            border: 1px solid #ccc;
            background-color: white;
            border-radius: 5px;
        }
        
        #color-preview {
            width: 100%;
            height: 40px;
            border: 1px solid #ccc;
            margin-bottom: 10px;
            border-radius: 4px;
        }
        
        .color-mode-selector {
            margin-bottom: 10px;
        }
        
        .color-inputs {
            display: flex;
            flex-direction: column;
            gap: 5px;
            margin-bottom: 10px;
        }
        
        .color-input {
            display: flex;
            align-items: center;
        }
        
        .color-input label {
            width: 40px;
            font-size: 14px;
        }
        
        .color-input input {
            flex-grow: 1;
        }
        
        .color-input span {
            width: 40px;
            text-align: right;
            font-size: 14px;
        }
        
        #file-ops {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-top: 10px;
            flex-wrap: wrap;
        }
        
        .file-btn {
            padding: 8px 15px;
            background-color: #4CAF50;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }
        
        .file-btn:hover {
            background-color: #45a049;
        }
        
        select, input[type="range"] {
            width: 100%;
        }
        
        #brush-settings {
            margin-top: 10px;
        }
        
        #palette {
            display: grid;
            grid-template-columns: repeat(16, 1fr);
            grid-template-rows: repeat(4, 20px);
            gap: 1px;
            margin-top: 10px;
            border: 1px solid #ccc;
        }
        
        .palette-color {
            cursor: pointer;
        }
        
        #color-visualization {
            margin-top: 15px;
            position: relative;
        }
        
        #color-square {
            width: 200px;
            height: 200px;
            border: 1px solid #ccc;
            position: relative;
            overflow: hidden;
        }
        
        #color-square-cursor {
            position: absolute;
            width: 8px;
            height: 8px;
            border: 2px solid white;
            border-radius: 50%;
            pointer-events: none;
            box-shadow: 0 0 2px rgba(0,0,0,0.5);
        }
        
        #color-bar {
            width: 200px;
            height: 20px;
            margin-top: 5px;
            position: relative;
            border: 1px solid #ccc;
        }
        
        #color-bar-cursor {
            position: absolute;
            width: 8px;
            height: 24px;
            top: -2px;
            border: 2px solid white;
            pointer-events: none;
            box-shadow: 0 0 2px rgba(0,0,0,0.5);
        }
        
        #color-radial {
            width: 200px;
            height: 200px;
            border-radius: 50%;
            border: 1px solid #ccc;
            position: relative;
            overflow: hidden;
            margin-top: 10px;
        }
        
        #color-radial-cursor {
            position: absolute;
            width: 8px;
            height: 8px;
            border: 2px solid white;
            border-radius: 50%;
            pointer-events: none;
            box-shadow: 0 0 2px rgba(0,0,0,0.5);
        }
        
        #execution-panel {
            margin-top: 15px;
            padding: 10px;
            background-color: white;
            border: 1px solid #ccc;
            border-radius: 5px;
        }
        
        #code-editor {
            width: 100%;
            height: 100px;
            font-family: monospace;
            margin-bottom: 5px;
            resize: vertical;
        }
        
        #execution-buttons {
            display: flex;
            gap: 5px;
            margin-bottom: 5px;
        }
        
        .page-btn {
            padding: 5px 10px;
            background-color: #f0f0f0;
            border: 1px solid #ccc;
            border-radius: 3px;
            cursor: pointer;
        }
        
        .page-btn.active {
            background-color: #4CAF50;
            color: white;
            border-color: #4CAF50;
        }
        
        #fill-settings {
            margin-top: 10px;
        }
        
        #canvas-size {
            margin-top: 10px;
        }
        
        #api-snippets {
            display: flex;
            gap: 5px;
            margin-top: 5px;
            flex-wrap: wrap;
        }
        
        .snippet-btn {
            padding: 3px 6px;
            background-color: #f0f0f0;
            border: 1px solid #ccc;
            border-radius: 3px;
            cursor: pointer;
            font-size: 12px;
            font-family: monospace;
        }
        
        .history-btn {
            padding: 5px 10px;
            background-color: #2196F3;
            color: white;
            border: none;
            border-radius: 3px;
            cursor: pointer;
        }
        
        .history-btn:hover {
            background-color: #0b7dda;
        }
    </style>
</head>

    <script>
    function rgbToHex3(r, g, b) {
    // Ensure values are integers between 0-255
    r = Math.max(0, Math.min(255, Math.round(r)));
    g = Math.max(0, Math.min(255, Math.round(g)));
    b = Math.max(0, Math.min(255, Math.round(b)));
    
    return '#' + [r, g, b].map(x => {
        const hex = x.toString(16);
        return hex.length === 1 ? '0' + hex : hex;
    }).join('');
}
        // Canvas setup
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        
        // State variables
        let currentTool = 'pen';
        let isDrawing = false;
        let lastX = 0;
        let lastY = 0;
        let currentColor = '#000000';
        let brushSize = 5;
        let brushHardness = 100;
        let fillTolerance = 0;
        let continuousTolerance = true;
        let colorPickerMode = false;
        
        // History stack for undo functionality
        let historyStack = [];
        const MAX_HISTORY = 20;
        
        // Save current canvas state to history
        function saveState() {
            if (historyStack.length >= MAX_HISTORY) {
                historyStack.shift();
            }
            historyStack.push(canvas.toDataURL());
            updateUndoCount();
        }
        
        // Undo last action
        function undo() {
            if (historyStack.length > 1) {
                historyStack.pop(); // Remove current state
                const lastState = historyStack[historyStack.length - 1];
                const img = new Image();
                img.onload = function() {
                    ctx.clearRect(0, 0, canvas.width, canvas.height);
                    ctx.drawImage(img, 0, 0);
                };
                img.src = lastState;
            }
            updateUndoCount();
        }
        
        function updateUndoCount() {
            document.getElementById('undo-count').textContent = `(${historyStack.length - 1} steps)`;
        }
        
        // Scripting pages
        const scriptPages = ['', '', '', '', ''];
        let currentPage = 0;
        
        // Tool buttons
        const penToolBtn = document.getElementById('pen-tool');
        const brushToolBtn = document.getElementById('brush-tool');
        const paintBucketToolBtn = document.getElementById('paintbucket-tool');
        const colorPickerToolBtn = document.getElementById('colorpicker-tool');
        const undoBtn = document.getElementById('undo-btn');
        
        // Brush settings
        const brushSizeInput = document.getElementById('brush-size');
        const brushHardnessInput = document.getElementById('brush-hardness');
        const brushSizeValue = document.getElementById('brush-size-value');
        const brushHardnessValue = document.getElementById('brush-hardness-value');
        
        // Fill settings
        const fillToleranceInput = document.getElementById('fill-tolerance');
        const fillToleranceValue = document.getElementById('fill-tolerance-value');
        const continuousToleranceInput = document.getElementById('continuous-tolerance');
        
        // Canvas size
        const canvasWidthInput = document.getElementById('canvas-width');
        const canvasHeightInput = document.getElementById('canvas-height');
        const resizeBtn = document.getElementById('resize-btn');
        
        // Color picker elements
        const colorPreview = document.getElementById('color-preview');
        const colorSpaceSelect = document.getElementById('color-space');
        const pickerStyleSelect = document.getElementById('picker-style');
        
        // RGB inputs
        const redInput = document.getElementById('red');
        const greenInput = document.getElementById('green');
        const blueInput = document.getElementById('blue');
        const redValue = document.getElementById('red-value');
        const greenValue = document.getElementById('green-value');
        const blueValue = document.getElementById('blue-value');

        // Color visualization
        const colorSquare = document.getElementById('color-square');
        const colorSquareCursor = document.getElementById('color-square-cursor');
        const colorBar = document.getElementById('color-bar');
        const colorBarCursor = document.getElementById('color-bar-cursor');
        const colorRadial = document.getElementById('color-radial');
        const colorRadialCursor = document.getElementById('color-radial-cursor');
        
        // Palette
        
        const palette = document.getElementById('palette');
        
        // File operations
        const downloadBtn = document.getElementById('download-btn');
        const clearBtn = document.getElementById('clear-btn');
        const uploadBtn = document.getElementById('upload-btn');
        const uploadInput = document.getElementById('upload-input');
        
        // Execution panel
        const codeEditor = document.getElementById('code-editor');
        const executeBtn = document.getElementById('execute-btn');
        const pageButtons = document.querySelectorAll('.page-btn');
        const snippetButtons = document.querySelectorAll('.snippet-btn');
        
        // Initialize canvas with white background
        function initCanvas() {
            ctx.fillStyle = 'white';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            saveState();
        }
        
        initCanvas();
        
        // Tool selection
        function setActiveTool(tool) {
            currentTool = tool;
            colorPickerMode = tool === 'colorpicker';
            
            // Update button states
            penToolBtn.classList.remove('active');
            brushToolBtn.classList.remove('active');
            paintBucketToolBtn.classList.remove('active');
            colorPickerToolBtn.classList.remove('active');
            
            if (tool === 'pen') {
                penToolBtn.classList.add('active');
                canvas.style.cursor = 'crosshair';
            } else if (tool === 'brush') {
                brushToolBtn.classList.add('active');
                canvas.style.cursor = 'crosshair';
            } else if (tool === 'paintbucket') {
                paintBucketToolBtn.classList.add('active');
                canvas.style.cursor = 'pointer';
            } else if (tool === 'colorpicker') {
                colorPickerToolBtn.classList.add('active');
                canvas.style.cursor = 'crosshair';
            }
        }
        
        // Event listeners for tools
        penToolBtn.addEventListener('click', () => setActiveTool('pen'));
        brushToolBtn.addEventListener('click', () => setActiveTool('brush'));
        paintBucketToolBtn.addEventListener('click', () => setActiveTool('paintbucket'));
        colorPickerToolBtn.addEventListener('click', () => setActiveTool('colorpicker'));
        undoBtn.addEventListener('click', undo);
        
        // Brush settings
        brushSizeInput.addEventListener('input', () => {
            brushSize = parseInt(brushSizeInput.value);
            brushSizeValue.textContent = brushSize;
        });
        
        brushHardnessInput.addEventListener('input', () => {
            brushHardness = parseInt(brushHardnessInput.value);
            brushHardnessValue.textContent = brushHardness + '%';
        });
        
        // Fill settings
        fillToleranceInput.addEventListener('input', () => {
            fillTolerance = parseInt(fillToleranceInput.value);
            fillToleranceValue.textContent = fillTolerance;
        });
        
        continuousToleranceInput.addEventListener('change', () => {
            continuousTolerance = continuousToleranceInput.checked;
        });
        
        // Canvas resize
        resizeBtn.addEventListener('click', () => {
            const width = parseInt(canvasWidthInput.value);
            const height = parseInt(canvasHeightInput.value);
            
            if (width >= 100 && width <= 2000 && height >= 100 && height <= 2000) {
                // Save current content
                const tempCanvas = document.createElement('canvas');
                tempCanvas.width = canvas.width;
                tempCanvas.height = canvas.height;
                const tempCtx = tempCanvas.getContext('2d');
                tempCtx.drawImage(canvas, 0, 0);
                
                // Resize canvas
                canvas.width = width;
                canvas.height = height;
                
                // Restore content
                ctx.fillStyle = 'white';
                ctx.fillRect(0, 0, width, height);
                ctx.drawImage(tempCanvas, 0, 0);
                
                saveState();
            } else {
                alert('Canvas size must be between 100 and 2000 pixels');
            }
        });
        
        // Color conversion functions now use the external clrspc.js library
        
        // Update color preview and current color
function updateColor() {
    let r, g, b;
    const colorSpace = colorSpaceSelect.value;
    
    // Convert from current color space to RGB
    if (colorSpace === 'rgb') {
        r = parseInt(redInput.value);
        g = parseInt(greenInput.value);
        b = parseInt(blueInput.value);
    } else {
        // Get parameters based on color space name
        const param1 = parseInt(redInput.value);   // First parameter (e.g., H in HSL)
        const param2 = parseInt(greenInput.value); // Second parameter (e.g., S in HSL)
        const param3 = parseInt(blueInput.value);  // Third parameter (e.g., L in HSL)
        
        // Convert to RGB using the appropriate function
        const converter = window[`${colorSpace}ToRgb`];
        if (converter) {
            const rgb = converter(param1, param2, param3);
            r = rgb[0];
            g = rgb[1];
            b = rgb[2];
        } else {
            // Fallback to RGB if converter doesn't exist
            r = param1;
            g = param2;
            b = param3;
        }
    }
    
    // Update current color and preview
    currentColor = rgbToHex3(r, g, b);
    colorPreview.style.backgroundColor = currentColor;
    ctx.fillStyle = currentColor;
    ctx.strokeStyle = currentColor;
    
    // Update input labels based on color space
    updateInputLabels();
}

function updateInputLabels() {
    const colorSpace = colorSpaceSelect.value;
    const labels = colorSpace.toUpperCase().split('');
    
    // Update the labels for the RGB inputs
    document.querySelector('.color-input:nth-child(1) label').textContent = labels[0] + ':';
    document.querySelector('.color-input:nth-child(2) label').textContent = labels[1] + ':';

                // Restore state
                ctx.fillStyle = currentFillStyle;
                ctx.strokeStyle = currentStrokeStyle;
                ctx.lineWidth = currentLineWidth;
                
                saveState();
            } catch (error) {
                alert('Error executing script: ' + error.message);
            }
        });
        
        // Page management
        pageButtons.forEach(button => {
            button.addEventListener('click', () => {
                const page = parseInt(button.dataset.page);
                
                // Save current content to current page
                scriptPages[currentPage] = codeEditor.value;
                
                // Update current page
                currentPage = page;
                
                // Load new page content
                codeEditor.value = scriptPages[page];
                
                // Update active button
                pageButtons.forEach(btn => btn.classList.remove('active'));
                button.classList.add('active');
            });
        });
        
        // API snippet buttons
        snippetButtons.forEach(button => {
            button.addEventListener('click', () => {
                const snippet = button.dataset.snippet;
                const cursorPos = codeEditor.selectionStart;
                const text = codeEditor.value;
                codeEditor.value = text.substring(0, cursorPos) + snippet + text.substring(cursorPos);
                codeEditor.focus();
                
                // Position cursor between parentheses if they exist
                const parenIndex = snippet.indexOf('(');
                if (parenIndex !== -1) {
                    const commaCount = (snippet.match(/,/g) || []).length;
                    if (commaCount > 0) {
                        const newPos = cursorPos + parenIndex + 1;
                        codeEditor.setSelectionRange(newPos, newPos);
                    }
                }
            });
        });
        document.getElementById('palette-type').addEventListener('change', function() {
    createPalette(this.value);
});
        // Initialize
        setActiveTool('pen');
        updateColorVisualization();
    </script>
</body>
</html>
