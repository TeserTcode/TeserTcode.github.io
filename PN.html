<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rhythm Game</title>
    
    <style>
#progress-bar {
    width: 100%;
    height: 5px;
    background: #444;
}

#progress {
    height: 100%;
    width: 0%;
    background: cyan;
    transition: width 0.1s linear;
}
        body { 
            text-align: center; 
            font-family: Arial, sans-serif; 
            background: black; 
            color: white;
        }
        .game-container { display: flex; justify-content: center; gap: 20px; }
        .column { width: 60px; height: 300px; border: 2px solid white; position: relative; }
        .note {
            width: 50px; height: 20px; background: black; position: absolute;
            top: 0; left: 5px;
            animation: fall 1s linear forwards;
        }
        @keyframes fall {
            to { top: 280px; }
        }
        .perfect-line {
            position: absolute; width: 100%; height: 2px; background: blue;
            bottom: 70px;
        }
        .score-feedback {
            position: absolute; 
            font-weight: bold;
            font-size: 20px;
            animation: fade 1s ease-out forwards;
        }
        @keyframes fade {
            to { opacity: 0; transform: translateY(-20px); }
        }
        #score {
            background: linear-gradient(to right, cyan, white, #888);
            background-size: 200% 100%;
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            padding: 5px 15px;
            border-radius: 5px;
            display: inline-block;
        }
		  #playButton {   text-shadow: 0px 0px 3px black;
    background: linear-gradient(to right, #00bcd4, #007bff, #1a1a1a);
    border: 2px solid #ffffff;
    color: white;
    font-size: 20px;
    padding: 10px 25px;
    cursor: pointer;
    border-radius: 10px;
    box-shadow: 0 4px 10px rgba(0, 188, 212, 0.3);
    transition: all 0.3s ease;
  }

  #playButton:hover {
    background: linear-gradient(to right, #007bff, #00bcd4, #1a1a1a);
    box-shadow: 0 6px 15px rgba(0, 188, 212, 0.5);
    transform: scale(1.05);
  }

  #playButton:active {
    background: #00bcd4;
    box-shadow: 0 2px 5px rgba(0, 188, 212, 0.7);
    transform: scale(1);
  }
  		  #decreaseBtn {
             text-shadow: 0px 0px 3px black;
    background: linear-gradient(to right, #001ca4, #007baf, #1a1a1a);
    border: 2px solid #ffffff;
    color: white;
    font-size: 20px;
    padding: 5px 5px;
    cursor: pointer;
    border-radius: 10px;
    box-shadow: 0 4px 10px rgba(0, 188, 212, 0.3);
    transition: all 0.3s ease;
  }		  #increaseBtn {   text-shadow: 0px 0px 3px black;
    background: linear-gradient(to right, #001ca4, #007baf, #1a1a1a);
    border: 2px solid #ffffff;
    color: white;
    font-size: 20px;
    padding: 5px 5px;
    cursor: pointer;
    border-radius: 10px;
    box-shadow: 0 4px 10px rgba(0, 188, 212, 0.3);
    transition: all 0.3s ease;
  }
          #countdown {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 100px;
            text-shadow: 0 0 20px cyan;
            animation: pulse 1s infinite;
            display: none;
        }

        @keyframes pulse {
            0%, 100% { transform: translate(-50%, -50%) scale(1); }
            50% { transform: translate(-50%, -50%) scale(1.2); }
        }

       .particle {
    position: absolute;
    width: 10px;
    height: 10px;
    background: cyan;
    border-radius: 50%;
    box-shadow: 0 0 8px cyan, 0 0 16px rgba(0, 255, 255, 0.8);
    opacity: 1;
    animation: moveParticle 1s ease-out, fadeOut 1s ease-out;
}

@keyframes moveParticle {
    to {
        transform: translate(var(--dx), var(--dy)) scale(0);
    }
}

@keyframes fadeOut {
    to {
        opacity: 0;
 }   }

        @keyframes explode {
            0% { transform: scale(1); opacity: 1; }
            100% { transform: scale(3); opacity: 0; }
        }

        #settings-panel {
            position: fixed;
            top: 20px;
            right: 20px;
            background: rgba(0,0,0,0.8);
            padding: 20px;
            border: 2px solid cyan;
            border-radius: 10px;
            display: none;
        }

        .settings-item {
            margin: 10px 0;
        }

        /* Modified progress bar */
        #progress-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            padding: 10px;
            background: rgba(0,0,0,0.8);
        }
.note.spark {
    animation: sparkEffect 0.1s ease-in-out;
}

@keyframes sparkEffect {
    0% { transform: scale(1.2); filter: brightness(2); }
    100% { transform: scale(1); filter: brightness(1); }
}
        #progress-bar {
            height: 10px;
            background: #222;
            border-radius: 5px;
            overflow: hidden;
            border: 1px solid cyan;
        }

        #progress {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, cyan, #00bcd4);
            transition: width 0.1s linear;
            box-shadow: 0 0 10px cyan;
        }
#levelSelector {
    display: flex;
    flex-wrap: wrap;
    justify-content: start; /* Align to start */
    gap: 10px; /* Space between boxes */
    padding: 10px;
}

.level-box {
    display: inline-block;
  /*   width: 350px; Keep a fixed width for all boxes */
 /*   height: 20px;  Increased height */
  width: 20px;
  height: 20px;
    margin: 5px;
    padding: 10px;
    border-radius: 10px;
    text-align: center;
    font-size: 18px;
    font-weight: bold;
    color: white;
    text-shadow: 2px 2px 3px black;  /* Outline effect */
    cursor: pointer;
    transition: transform 0.2s, opacity 0.5s;
    white-space: nowrap; /* Prevent text wrapping */
    overflow: hidden; /* Hide text that overflows */
    text-overflow: ellipsis; /* Add "..." if the text overflows */
}

.level-box:hover {
    transform: scale(1.1);
}

.hidden {
    opacity: 0;
    transition: opacity 0.5s ease-out;
}
button:hover {
    background: linear-gradient(45deg, #007bff, #00bcd4, #1a1a1a);
    box-shadow: 0 6px 15px rgba(0, 255, 255, 0.7);
    transform: scale(1.05);
}

button:active {
    transform: scale(0.95);
    box-shadow: 0 2px 5px rgba(0, 255, 255, 0.9);
}

    <h1>Rhythm Game</h1>
    <div class="game-container">
        <div class="column" id="col-S"><div class="perfect-line"></div>S</div>
        <div class="column" id="col-D"><div class="perfect-line"></div>D</div>

        <div class="column" id="col-L"><div class="perfect-line"></div>L</div>
    </div>
    <br><br><br>
        <div class="level-display">Current Level: <span id="currentLevel">1</span></div>
    <div id="countdown"></div>
    <div id="settings-panel">
        <h3>Settings</h3>
        <div class="settings-item">
            <label>Volume: <input type="range" id="volume" min="0" max="1" step="0.1" value="1"></label>
        </div>
        <div class="settings-item">
            <label>Note Speed: <input type="range" id="note-speed" min="0.5" max="2" step="0.1" value="1"></label>
        </div>
    </div>

    <div id="progress-container">
        <div id="progress-bar">
            <div id="progress"></div>
        </div>
    </div>

</div>
    <h2>Score: <span id="score">0</span></h2>

            const oscillator = this.audioContext.createOscillator();

                oscillator.type = 'square'; // Use square wave
            } else if (instrument === 'SawtoothWave') {
                // Sawtooth wave
                oscillator.frequency.value = frequency;
                oscillator.type = 'sawtooth'; // Use sawtooth wave

class AutoSongGenerator {
    constructor(rhythmGame, levelIndex) {
        const levelData = levels[levelIndex];
        this.rhythmGame = rhythmGame;
        this.levelData = this.groupNotes(levelData); // Group notes with the same timestamp
        this.scale = levelScales[levelnames[levelIndex]];
        this.instrument = levelInstruments[levelnames[levelIndex]];
        this.harmonyInterval = levelHarmony[levelnames[levelIndex]];
        this.waveGenerator = new WaveGenerator();
    }

    groupNotes(levelData) {
        const groupedData = [];
        const timeMap = {};

        // Group notes by timestamp
        levelData.forEach(([key, time]) => {
            if (!timeMap[time]) {
                timeMap[time] = [];
            }
            timeMap[time].push(key);
        });

        // Create grouped entries
        for (const [time, keys] of Object.entries(timeMap)) {
            groupedData.push([keys.join(''), parseFloat(time)]);
        }

        return groupedData;
    }

    calculateMinGap(currentNoteIndex) {
        let minGap = Infinity;
        const currentTime = this.levelData[currentNoteIndex][1];

        // Look ahead to the next note with a different time
        for (let i = currentNoteIndex + 1; i < this.levelData.length; i++) {
            const nextTime = this.levelData[i][1];
            if (nextTime !== currentTime) { // Only consider notes with a different timestamp
                const gap = nextTime - currentTime;
                if (gap > 0 && gap < minGap) {
                    minGap = gap;
                }
            }
        }

        return minGap === Infinity ? 0.2 : minGap; // Default to 0.2s if no valid gap is found
    }

    generateSong() {
        this.levelData.forEach((note, index) => {
            const [keys, time] = note;
            const duration = this.calculateMinGap(index); // Calculate gap for each note

            setTimeout(() => {
                const frequencies = this.getFrequencies(keys);
                this.waveGenerator.playNote(frequencies, duration+0.2, this.instrument, this.harmonyInterval);
                this.rhythmGame.spawnNotes();
            }, (time - 0.3) * 1000); // Offset to align notes
        });
    }

    getFrequencies(keys) {
        // Split keys into an array (e.g., "SJ" -> ['S', 'J'])
        const keyArray = keys.split('');
        return keyArray.map(key => this.scale[this.getScaleIndex(key)]);
    }

    getScaleIndex(key) {
        const keyMap = { 'S': 0, 'D': 1, 'F': 2, 'J': 3, 'K': 4, 'L': 5 };
        return keyMap[key] || 0;
    }
}

            switch (level) {
                case "Awaitment":
                    return "linear-gradient(to bottom, black, blue, cyan, blue, black)";
                case "Blightning":
                    return "linear-gradient(to bottom, black, grey, yellow, grey, black)";
                case "Rapidfire":
                    return "linear-gradient(to bottom, black, red, black, red, black)";
                case "Shadowed":
                    return "linear-gradient(to bottom, black, #708090, black, darkgray, black)";
                case "Synclyth":
                    return "linear-gradient(to bottom, #5C6BC0, #7E57C2, #9C27B0, #AB47BC, #8E24AA)";
                case "Extreme Synclyth":
                    return "linear-gradient(to bottom, #FF1744, #FF4081, #F50057, #D500F9, #9CA7B0)";
                case "Apocalyptic Synclyth":
                    return "linear-gradient(to bottom, #57121C, #D32F2F, #FF5722, #FFDAB5, #FFFAF5)";
                case "Horizons":
                    return "linear-gradient(to bottom, #1A1A2E, #16213E, #0F3460, #533483, #E94560)";
                     case "nameless":
                    return "linear-gradient(to bottom, #1F1A2E, #16F13E, #0F3F60, #533F83, #E945F0)";
                default:
                    return "black";
            }
        }

function createLevelSelectors() {
    const selector = document.getElementById("level-selector");
    levelnames.forEach((level, index) => {
        let btn = document.createElement("button");
        btn.style.background = getGradient(level);
        btn.style.border = "2px solid white";
        btn.style.color = "white";
        btn.style.margin = "5px";
        btn.style.padding = "10px";
        btn.style.borderRadius = "10px";
        btn.innerText = level;
        btn.onclick = () => {
            currentlevel = index;
            updateUI();
        };
        selector.appendChild(btn);
    });
}
function updateUI() {
    const gradient = getGradient(levelnames[currentlevel]);
    document.getElementById("playButton").style.background = gradient;
    document.getElementById("increaseBtn").style.background = gradient;
    document.getElementById("decreaseBtn").style.background = gradient;
}
