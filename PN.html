<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rhythm Game</title>
    
    <style>
#progress-bar {
    width: 100%;
    height: 5px;
    background: #444;
}
@keyframes gradientShift {
    0% { background-position: 0% 0%; }
    50% { background-position: 100% 100%; }
    100% { background-position: 0% 0%; }
}

.column {
    background: var(--gradientColors);
    background-size: 200% 200%;
    animation: gradientShift 4s infinite alternate ease-in-out;
}
#progress {
    height: 100%;
    width: 0%;
    background: cyan;
    transition: width 0.1s linear;
}
        body { 
            text-align: center; 
            font-family: Arial, sans-serif; 
            background: black; 
            color: white;
        }
        .game-container { display: flex; justify-content: center; gap: 20px; }
        .column { width: 60px; height: 300px; border: 2px solid white; position: relative; }
        .note {
            width: 50px; height: 20px; background: black; position: absolute;
            top: 0; left: 5px;
            animation: fall 1s linear forwards;
        }
        @keyframes fall {
            to { top: 280px; }
        }
        .perfect-line {
            position: absolute; width: 100%; height: 2px; background: blue;
            bottom: 70px;
        }
        .score-feedback {
            position: absolute; 
            font-weight: bold;
            font-size: 20px;
            animation: fade 1s ease-out forwards;
        }
        @keyframes fade {
            to { opacity: 0; transform: translateY(-20px); }
        }
        #score {
            background: linear-gradient(to right, cyan, white, #888);
            background-size: 200% 100%;
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            padding: 5px 15px;
            border-radius: 5px;
            display: inline-block;
        }
		  #playButton {
    background: linear-gradient(to right, #00bcd4, #007bff, #1a1a1a);
    border: 2px solid #00bcd4;
    color: white;
    font-size: 20px;
    padding: 15px 30px;
    cursor: pointer;
    border-radius: 10px;
    box-shadow: 0 4px 10px rgba(0, 188, 212, 0.3);
    transition: all 0.3s ease;
  }

  #playButton:hover {
    background: linear-gradient(to right, #007bff, #00bcd4, #1a1a1a);
    box-shadow: 0 6px 15px rgba(0, 188, 212, 0.5);
    transform: scale(1.05);
  }

  #playButton:active {
    background: #00bcd4;
    box-shadow: 0 2px 5px rgba(0, 188, 212, 0.7);
    transform: scale(1);
  }
          #countdown {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 100px;
            text-shadow: 0 0 20px cyan;
            animation: pulse 1s infinite;
            display: none;
        }

        @keyframes pulse {
            0%, 100% { transform: translate(-50%, -50%) scale(1); }
            50% { transform: translate(-50%, -50%) scale(1.2); }
        }

       .particle {
    position: absolute;
    width: 10px;
    height: 10px;
    background: cyan;
    border-radius: 50%;
    box-shadow: 0 0 8px cyan, 0 0 16px rgba(0, 255, 255, 0.8);
    opacity: 1;
    animation: moveParticle 1s ease-out, fadeOut 1s ease-out;
}

@keyframes moveParticle {
    to {
        transform: translate(var(--dx), var(--dy)) scale(0);
    }
}

@keyframes fadeOut {
    to {
        opacity: 0;
 }   }

        @keyframes explode {
            0% { transform: scale(1); opacity: 1; }
            100% { transform: scale(3); opacity: 0; }
        }

        #settings-panel {
            position: fixed;
            top: 20px;
            right: 20px;
            background: rgba(0,0,0,0.8);
            padding: 20px;
            border: 2px solid cyan;
            border-radius: 10px;
            display: none;
        }

        .settings-item {
            margin: 10px 0;
        }

        /* Modified progress bar */
        #progress-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            padding: 10px;
            background: rgba(0,0,0,0.8);
        }

        #progress-bar {
            height: 10px;
            background: #222;
            border-radius: 5px;
            overflow: hidden;
            border: 1px solid cyan;
        }

        #progress {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, cyan, #00bcd4);
            transition: width 0.1s linear;
            box-shadow: 0 0 10px cyan;
        }
    </style>
</head>
<body>
    <h1>Rhythm Game</h1>
    <div class="game-container">
        <div class="column" id="col-S"><div class="perfect-line"></div>S</div>
        <div class="column" id="col-D"><div class="perfect-line"></div>D</div>
        <div class="column" id="col-F"><div class="perfect-line"></div>F</div>
        <div class="column" id="col-J"><div class="perfect-line"></div>J</div>
        <div class="column" id="col-K"><div class="perfect-line"></div>K</div>
        <div class="column" id="col-L"><div class="perfect-line"></div>L</div>
    </div>
    <br><br><br>
        <div class="level-display">Current Level: <span id="currentLevel">1</span></div>
    <div id="countdown"></div>
    <div id="settings-panel">
        <h3>Settings</h3>
        <div class="settings-item">
            <label>Volume: <input type="range" id="volume" min="0" max="1" step="0.1" value="1"></label>
        </div>
        <div class="settings-item">
            <label>Note Speed: <input type="range" id="note-speed" min="0.5" max="2" step="0.1" value="1"></label>
        </div>
    </div>

    <div id="progress-container">
        <div id="progress-bar">
            <div id="progress"></div>
        </div>
    </div>

</div>
    <h2>Score: <span id="score">0</span></h2>
    
    <button id="decreaseBtn">Decrease Level</button>
	<button id="playButton">Play Sound</button>
      <button id="increaseBtn">Increase Level</button>

let currentlevel=0;
    updateLevelDisplay();



        class RhythmGame {
             totalDuration = 0;
        gameActive = false;
            constructor() {
this.gamedata = levels[currentlevel];

                this.shown = new Set();
                this.clicked = new Set();
                this.lastHits = [];
                this.score = 0;
                this.gameStart = Date.now() / 1000;
                this.lastNoteTime = Math.max(...this.gamedata.map(g => g[1]));
                this.init();
            }
              startGame() {
            this.gameStart = Date.now() / 1000;
            this.totalDuration = this.lastNoteTime + 2;
            this.gameActive = true;
            
            setInterval(() => {
                if (this.gameActive) {
                    const currentTime = (Date.now() / 1000) - this.gameStart;
                    const progress = (currentTime / this.totalDuration) * 100;
                    document.getElementById('progress').style.width = `${Math.min(progress, 100)}%`;
                }
            }, 100);
            
            setInterval(() => this.spawnNotes(), 100);
            setTimeout(() => this.endGame(), (this.totalDuration) * 1000);
          //  new Audio('awaitment.mp3').play();
        }
        showCountdown() {
            const countdown = document.getElementById('countdown');
            countdown.style.display = 'block';
            
            const count = [3, 2, 1, 'GO!'];
            count.forEach((num, i) => {
                setTimeout(() => {
                    countdown.textContent = num;
                    if (i === count.length - 1) {
                        setTimeout(() => countdown.style.display = 'none', 500);
                        this.startGame();
                    }
                }, i * 1000);
            });
        }
                init() {
            document.addEventListener('keydown', (e) => this.checkKeyPress(e));
            this.showCountdown();
        }


            spawnNotes() {
                const currentTime = (Date.now() / 1000) - this.gameStart;
                this.gamedata.forEach(([key, time], index) => {
                    if (!this.shown.has(index) && time - currentTime <= 1) {
                        const col = document.getElementById(`col-${key}`);
                        if (!col) return;

                        const note = document.createElement('div');
                        note.classList.add('note');
                        col.appendChild(note);

                        note.addEventListener('animationend', () => {
                            col.removeChild(note);
                            if (!this.clicked.has(index)) this.clicked.add(index);
                        });

                        this.shown.add(index);
                    }
                });
            }

            checkKeyPress(event) {
                const key = event.key.toUpperCase();
                const col = document.getElementById(`col-${key}`);
                if (!col) return;

                const currentTime = (Date.now() / 1000) - this.gameStart;
                const closest = this.gamedata.reduce((closest, [gkey, time], index) => {
                    if (gkey === key && !this.clicked.has(index)) {
                        const diff = Math.abs(currentTime - (time - 0.2));
                        if (diff < closest.diff) return { index, diff };
                    }
                    return closest;
                }, { index: null, diff: Infinity });

                if (closest.index !== null) {
                    this.clicked.add(closest.index);
                    const note = col.querySelector('.note');
                    if (note) col.removeChild(note);

                    const points = Math.round(100 / (1 + closest.diff * 4));
                    this.score += points;
                    document.getElementById('score').innerText = Math.round(this.score);

                    this.showScoreFeedback(col, points);
                    this.updateLastHits(points);
                }
                
                            if (closest.index !== null) {
                // Add particle effect
                this.createParticles(col.getBoundingClientRect());
 
            }
            }
createParticles(rect) {
    for (let i = 0; i < 15; i++) { // More particles for a better effect
        const particle = document.createElement('div');
        particle.className = 'particle';
        
        // Initial position at center of rect
        particle.style.left = `${rect.left + rect.width / 2}px`;
        particle.style.top = `${rect.top + rect.height / 0.9}px`;
        
        // Random velocity
        const angle = Math.random() * Math.PI * 2;
        const velocity = 3 + Math.random() * 17;
        const dx = Math.cos(angle) * velocity;
        const dy = Math.sin(angle) * velocity;
        
        // Set CSS variables for animation
        particle.style.setProperty('--dx', `${dx}px`);
        particle.style.setProperty('--dy', `${dy}px`);

        document.body.appendChild(particle);

        setTimeout(() => particle.remove(), 1000); // Remove after animation
    }
}


             showScoreFeedback(col, points) {
                const feedback = document.createElement('div');
                feedback.classList.add('score-feedback');
                
                // Determine color and symbol based on points
                let color, symbol;
                if (points >= 90) {
                    color = '#00ffff'; // Cyan
                    symbol = '!!';
                } else if (points >= 80) {
                    color = '#0000ff'; // Blue
                    symbol = '!';
                } else if (points >= 70) {
                    color = '#00ff00'; // Green
                    symbol = '';
                } else if (points >= 60) {
                    color = '#ffff00'; // Yellow
                    symbol = '';
                } else if (points >= 40) {
                    color = '#ff0000'; // Red
                    symbol = '?';
                } else {
                    color = '#804000'; // Brown
                    symbol = '??';
                }

                feedback.style.color = color;
                feedback.innerText = `+${points}${symbol}`;
                col.appendChild(feedback);
                setTimeout(() => feedback.remove(), 1000);
            }

            updateLastHits(points) {
                this.lastHits.unshift(points);
                if (this.lastHits.length > 10) this.lastHits.pop();
                this.updateScoreList();
            }

            updateScoreList() {
                const scoreList = document.getElementById('score-list');
                if (!scoreList) return;
                scoreList.innerHTML = this.lastHits.map(points => `<li>+${points}</li>`).join('');
            }

            endGame() {
                alert(`Game Over! Your Score: ${Math.round(this.score)}`);
            }
        }
function applyScoreGradient() {
    document.querySelectorAll('.column').forEach(column => {
        const height = column.clientHeight;
        const perfectZone = 300 - 70; // Perfect-line position
        const perfectRatio = perfectZone / height;

        let gradientColors;

        switch (currentlevel) {
            case 0:
                gradientColors = `linear-gradient(
                    to bottom, 
                    black 0%, 
                    blue ${perfectRatio * 50}%, 
                    cyan ${perfectRatio * 100}%, 
                    blue ${perfectRatio * 150}%, 
                    black 100%
                )`;
                break;
            case 1:
                gradientColors = `linear-gradient(
                    to bottom, 
                    black 0%, 
                    grey ${perfectRatio * 50}%, 
                    yellow ${perfectRatio * 100}%, 
                    grey ${perfectRatio * 150}%, 
                    black 100%
                )`;
                break;
            case 2:
                gradientColors = `linear-gradient(
                    to bottom, 
                    black 0%, 
                    red ${perfectRatio * 50}%, 
                    black ${perfectRatio * 100}%, 
                    red ${perfectRatio * 150}%, 
                    black 100%
                )`;
                break;
              case 3:
                gradientColors = `linear-gradient(
                    to bottom, 
                    black 0%, 
                    #708090 ${perfectRatio * 50}%, 
                    black ${perfectRatio * 100}%, 
                    darkgray ${perfectRatio * 150}%, 
                    black 100%
                )`;
                break;
            default:
                gradientColors = "black"; // Fallback for undefined levels
        }

        column.style.background = gradientColors;
    });
}

applyScoreGradient();
  document.getElementById('playButton').addEventListener('click', () => {
  //  new Audio('awaitment.mp3').play();
	    new RhythmGame();
		
  });
