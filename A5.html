<!DOCTYPE html>
<html>
<head>
    <title>Icosahedron with 5 Cubes - A5 Symmetry</title>
    <style>
        body { 
            margin: 0; 
            overflow: hidden; 
            font-family: Arial, sans-serif;
        }
        #container {
            display: flex;
            width: 100vw;
            height: 100vh;
        }
        #left-panel {
            flex: 3;
            position: relative;
        }
        #right-panel {
            flex: 1;
            background: #f0f0f0;
            padding: 10px;
            overflow-y: auto;
        }
        #canvas-container {
            width: 100%;
            height: 100%;
        }
        .control-panel {
            position: absolute;
            top: 10px;
            left: 10px;
            background: rgba(255,255,255,0.9);
            padding: 10px;
            border-radius: 5px;
        }
        .state-button {
            display: block;
            width: 100%;
            margin: 5px 0;
            padding: 8px;
            background: #4CAF50;
            color: white;
            border: none;
            border-radius: 3px;
            cursor: pointer;
        }
        .state-button:hover {
            background: #45a049;
        }
        .corner-markers {
            position: absolute;
            bottom: 10px;
            left: 10px;
            background: rgba(255,255,255,0.9);
            padding: 10px;
            border-radius: 5px;
        }
        .marker {
            display: inline-block;
            width: 20px;
            height: 20px;
            margin: 2px;
            border: 1px solid #000;
        }
    </style>
</head>
<body>
    <div id="container">
        <div id="left-panel">
            <div id="canvas-container"></div>
            <div class="control-panel">
                <button onclick="startRotation()">Start Rotation</button>
                <button onclick="stopRotation()">Stop Rotation</button>
            </div>
            <div class="corner-markers" id="corner-markers">
                <div>Corner Cube Colors:</div>
            </div>
        </div>
        <div id="right-panel">
            <h3>A5 Group Elements (60 states)</h3>
            <div id="state-buttons"></div>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>
        // Golden ratio
        const phi = (1 + Math.sqrt(5)) / 2;
        
        // Icosahedron vertices (12 vertices)
        const icosahedronVertices = [
            [0, 1, phi], [0, 1, -phi], [0, -1, phi], [0, -1, -phi],
            [1, phi, 0], [1, -phi, 0], [-1, phi, 0], [-1, -phi, 0],
            [phi, 0, 1], [phi, 0, -1], [-phi, 0, 1], [-phi, 0, -1]
        ];

        // Cube definitions (each cube uses 8 vertices from the icosahedron)
        // These are the 5 cubes inscribed in the icosahedron
        const cubeConfigurations = [
            {
                name: "Cube 1 (Red)",
                color: 0xff4444,
                vertices: [0, 2, 5, 7, 8, 10, 1, 3] // Example indices - adjust based on actual cube vertices
            },
            {
                name: "Cube 2 (Green)", 
                color: 0x44ff44,
                vertices: [1, 3, 4, 6, 9, 11, 0, 2]
            },
            {
                name: "Cube 3 (Blue)",
                color: 0x4444ff, 
                vertices: [4, 6, 8, 10, 1, 3, 5, 7]
            },
            {
                name: "Cube 4 (Pink)",
                color: 0xff44ff,
                vertices: [5, 7, 9, 11, 0, 2, 4, 6]
            },
            {
                name: "Cube 5 (Yellow)",
                color: 0xffff44,
                vertices: [8, 10, 1, 3, 5, 7, 9, 11]
            }
        ];

        // Scene setup
        let scene, camera, renderer;
        let icosahedron, cubes = [];
        let isRotating = true;
        let rotationSpeed = 0.005;
        
        // Selected corners to show cube colors (5 vertices of icosahedron)
        const cornerIndices = [0, 4, 8, 1, 6]; // Example corner indices
        const cornerMarkers = [];

        init();
        createStateButtons();
        animate();

        function init() {
            // Scene
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x222222);

            // Camera
            camera = new THREE.PerspectiveCamera(75, window.innerWidth * 0.75 / window.innerHeight, 0.1, 1000);
            camera.position.z = 5;

            // Renderer
            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth * 0.75, window.innerHeight);
            document.getElementById('canvas-container').appendChild(renderer.domElement);

            // Lighting
            const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
            scene.add(ambientLight);
            
            const directionalLight = new THREE.DirectionalLight(0xffffff, 0.8);
            directionalLight.position.set(1, 1, 1);
            scene.add(directionalLight);

            // Create icosahedron (cyan, 50% transparent)
            const icosaGeometry = new THREE.IcosahedronGeometry(1, 0);
            const icosaMaterial = new THREE.MeshPhongMaterial({
                color: 0x00ffff,
                transparent: true,
                opacity: 0.5,
                wireframe: false
            });
            icosahedron = new THREE.Mesh(icosaGeometry, icosaMaterial);
            scene.add(icosahedron);

            // Create wireframe for icosahedron
            const wireframeGeometry = new THREE.IcosahedronGeometry(1.001, 0);
            const wireframeMaterial = new THREE.MeshBasicMaterial({
                color: 0x006666,
                wireframe: true
            });
            const wireframe = new THREE.Mesh(wireframeGeometry, wireframeMaterial);
            scene.add(wireframe);

            // Create 5 cubes
            createCubes();

            // Create corner markers
            createCornerMarkers();

            // Handle window resize
            window.addEventListener('resize', onWindowResize);
        }

        function createCubes() {
            cubeConfigurations.forEach((config, index) => {
                // Create cube geometry from the 8 vertices
                const cubeGeometry = new THREE.BufferGeometry();
                const vertices = [];
                
                // Get the actual vertex positions for this cube
                config.vertices.forEach(vertexIndex => {
                    const vertex = icosahedronVertices[vertexIndex];
                    vertices.push(vertex[0], vertex[1], vertex[2]);
                });
                
                // Define faces for the cube (simplified - you'd need proper face indices)
                const indices = [
                    0,1,2, 0,2,3, 4,5,6, 4,6,7, // Example indices
                    0,4,5, 0,5,1, 2,6,7, 2,7,3,
                    0,3,7, 0,7,4, 1,5,6, 1,6,2
                ];
                
                cubeGeometry.setAttribute('position', new THREE.Float32BufferAttribute(vertices, 3));
                cubeGeometry.setIndex(indices);
                cubeGeometry.computeVertexNormals();

                const cubeMaterial = new THREE.MeshPhongMaterial({
                    color: config.color,
                    transparent: true,
                    opacity: 0.5,
                    side: THREE.DoubleSide
                });

                const cube = new THREE.Mesh(cubeGeometry, cubeMaterial);
                scene.add(cube);
                cubes.push(cube);
            });
        }

        function createCornerMarkers() {
            const markerContainer = document.getElementById('corner-markers');
            cornerIndices.forEach((cornerIndex, i) => {
                const markerDiv = document.createElement('div');
                markerDiv.className = 'marker';
                markerDiv.style.backgroundColor = '#ffffff';
                markerDiv.id = `corner-${i}`;
                markerDiv.title = `Corner ${cornerIndex}`;
                markerContainer.appendChild(markerDiv);
                cornerMarkers.push(markerDiv);
            });
            updateCornerMarkers();
        }

        function updateCornerMarkers() {
            // This function would determine which cubes touch each corner
            // For now, just cycle through cube colors for demonstration
            cornerIndices.forEach((cornerIndex, i) => {
                const cubeIndex = (Math.floor(Date.now() / 1000) + i) % 5;
                const color = cubeConfigurations[cubeIndex].color;
                const marker = document.getElementById(`corner-${i}`);
                marker.style.backgroundColor = `#${color.toString(16).padStart(6, '0')}`;
            });
        }

        function createStateButtons() {
            const container = document.getElementById('state-buttons');
            
            // Create buttons for different A5 states
            for (let i = 0; i < 12; i++) { // Showing first 12 for example
                const button = document.createElement('button');
                button.className = 'state-button';
                button.textContent = `State ${i + 1}`;
                button.onclick = () => setIcosahedronState(i);
                container.appendChild(button);
            }
        }

        function setIcosahedronState(stateIndex) {
            stopRotation();
            
            // Apply different rotations based on state
            const angleX = (stateIndex * Math.PI / 6) % (2 * Math.PI);
            const angleY = (stateIndex * Math.PI / 8) % (2 * Math.PI);
            const angleZ = (stateIndex * Math.PI / 10) % (2 * Math.PI);
            
            icosahedron.rotation.x = angleX;
            icosahedron.rotation.y = angleY;
            icosahedron.rotation.z = angleZ;
            
            // Rotate cubes to match
            cubes.forEach((cube, i) => {
                cube.rotation.x = angleX;
                cube.rotation.y = angleY;
                cube.rotation.z = angleZ;
            });
        }

        function startRotation() {
            isRotating = true;
        }

        function stopRotation() {
            isRotating = false;
        }

        function onWindowResize() {
            camera.aspect = (window.innerWidth * 0.75) / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth * 0.75, window.innerHeight);
        }

        function animate() {
            requestAnimationFrame(animate);

            if (isRotating) {
                icosahedron.rotation.x += rotationSpeed;
                icosahedron.rotation.y += rotationSpeed * 1.1;
                
                cubes.forEach(cube => {
                    cube.rotation.x = icosahedron.rotation.x;
                    cube.rotation.y = icosahedron.rotation.y;
                });
                
                updateCornerMarkers();
            }

            renderer.render(scene, camera);
        }
    </script>
</body>
</html>
