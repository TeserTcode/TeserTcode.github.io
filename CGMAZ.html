<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>4D Cayley Graph Maze</title>
  <style>
    body{font-family:system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial;display:flex;gap:16px;margin:12px}
    #left{width:360px}
    #room{background:#f7f7f9;border-radius:8px;padding:16px;box-shadow:0 6px 18px rgba(0,0,0,0.06)}
    h2{margin:8px 0}
    .perm{font-family:monospace;background:#fff;padding:8px;border-radius:6px;border:1px solid #e5e5e5;display:inline-block}
    .doors{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
    .door{flex:1;padding:14px;border-radius:8px;color:white;font-weight:700;border:0;cursor:pointer;min-width:90px}
    .door:disabled{opacity:.35;cursor:not-allowed}
    .controls{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
    button.small{padding:8px 10px;border-radius:6px;border:1px solid #ddd;background:#fff;cursor:pointer}
    #network{flex:1;height:720px;border-radius:8px;border:1px solid #e8e8e8;display:none}
    footer{font-size:12px;color:#666;margin-top:8px}
    .meta{margin-top:10px}
    #history{max-height:200px;overflow-y:auto;border:1px solid #eee;border-radius:6px;padding:8px;margin-top:12px}
    .history-item{padding:4px;cursor:pointer;border-radius:4px;margin-bottom:2px;position:relative;padding-left:20px}
    .history-item.current{background:#e0e0ff;font-weight:bold}
    .history-item::before{content:'';position:absolute;left:8px;top:12px;width:8px;height:1px;background:#999}
    .history-item::after{content:'';position:absolute;left:8px;top:12px;width:1px;height:100%;background:#999}
    .history-item:last-child::after{height:12px}
    .history-item.root::before{display:none}
    #difficulty{margin-top:12px;padding:8px;border-radius:6px;border:1px solid #ddd;width:100%}
    #congrats{display:none;position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);background:white;padding:24px;border-radius:12px;box-shadow:0 10px 25px rgba(0,0,0,0.2);z-index:100;text-align:center}
    #congrats h2{color:#4CAF50;margin-top:0}
    #congrats button{margin-top:16px;padding:8px 16px;background:#4CAF50;color:white;border:none;border-radius:4px;cursor:pointer}
    .tree-view{list-style-type:none;padding-left:20px;margin:0}
    .tree-view ul{list-style-type:none;padding-left:20px}
    .tree-node{cursor:pointer;padding:2px 4px;border-radius:3px}
    .tree-node:hover{background:#f0f0f0}
    .tree-node.current{background:#e0e0ff;font-weight:bold}
    .tree-node.visited{color:#666}
    .tree-node.visited .node-label{text-decoration:line-through}
    .node-label{display:inline-block}
    .move-label{font-size:0.8em;color:#999;margin-left:4px}
  </style>
  <script src="https://unpkg.com/vis-network@9.1.2/dist/vis-network.min.js"></script>
</head>
<body>
  <div id="left">
    <div id="room">
      <h2>Room</h2>
      <select id="difficulty">
        <option value="easy">Easy (S4 group)</option>
        <option value="medium">Medium (S5 group)</option>
        <option value="hard">Hard (S6 group)</option>
      </select>
      
      <div>Permutation: <span id="perm" class="perm"></span></div>
      <div class="meta">Start: <span class="perm" id="startPerm"></span> · Finish: <span class="perm" id="finishPerm"></span></div>

      <div class="doors" id="doors"></div>

      <div class="controls">
        <button class="small" id="shuffleBtn">New random maze</button>
        <button class="small" id="graphBtn">Show graph</button>
        <button class="small" id="solveBtn">Show solution</button>
        <button class="small" id="stepSolveBtn">Step to finish</button>
      </div>
      <div style="margin-top:10px">Moves taken: <span id="moves">0</span></div>
      
      <div id="history">
        <div>Exploration Tree:</div>
        <div id="historyTree"></div>
      </div>
      
      <footer>
        This generates the Cayley graph of the subgroup generated by the three given generators (size ≤ 720). A random spanning tree is used as the maze (only tree edges are open).
      </footer>
    </div>
  </div>

  <div id="network"></div>
  
  <div id="congrats">
    <h2>Congratulations!</h2>
    <p>You've reached the finish in <span id="finalMoves">0</span> moves!</p>
    <button id="congratsBtn">Continue</button>
  </div>

<script>
// Difficulty levels
const DIFFICULTIES = {
  easy: {
    START: [1,2,3,4],
    FINISH: [4,3,2,1],
    GENERATORS: [
      {p:[3,2,4,1], color:'red', name:'R'},
      {p:[4,1,3,2], color:'green', name:'G'},
      {p:[2,3,1,4], color:'blue', name:'B'}
    ]
  },
  medium: {
    START: [1,2,3,4,5],
    FINISH: [5,4,3,2,1],
    GENERATORS: [
      {p:[3,2,4,1,5], color:'red', name:'R'},
      {p:[4,3,2,1,5], color:'green', name:'G'},
      {p:[5,2,3,1,4], color:'blue', name:'B'}
    ]
  },
  hard: {
    START: [1,2,3,4,5,6],
    FINISH: [6,5,4,3,2,1],
    GENERATORS: [
  {p:[3,2,4,1,6,5], color:'red', name:'R'},
  {p:[4,3,6,2,1,5], color:'green', name:'G'},
  {p:[5,2,3,1,4,6], color:'blue', name:'B'}
    ]
  }
};

let CURRENT_DIFFICULTY = 'easy';
let START = DIFFICULTIES[CURRENT_DIFFICULTY].START;
let FINISH = DIFFICULTIES[CURRENT_DIFFICULTY].FINISH;
let GENERATORS = DIFFICULTIES[CURRENT_DIFFICULTY].GENERATORS;

function pkey(p){return p.join(',');}
function clone(p){return p.slice();}
function compose(p,q){const n=p.length;const r=new Array(n);for(let i=0;i<n;i++){const qv=q[i]-1;r[i]=p[qv];}return r;}

function buildGroup(){const start=START;const map=new Map();const q=[start];map.set(pkey(start),clone(start));while(q.length){const cur=q.shift();for(const gen of GENERATORS){const nxt=compose(gen.p,cur);const k=pkey(nxt);if(!map.has(k)){map.set(k,clone(nxt));q.push(clone(nxt));}}}return Array.from(map.values());}

function buildAdj(nodes){const idx=new Map();nodes.forEach((p,i)=>idx.set(pkey(p),i));const adj=nodes.map(()=>[]);for(let i=0;i<nodes.length;i++){const p=nodes[i];for(let g=0;g<GENERATORS.length;g++){const nxt=compose(GENERATORS[g].p,p);const k=idx.get(pkey(nxt));if(k!==undefined){adj[i].push({to:k,gen:g});}}}return{adj,idx};}

function randomSpanningTree(adj,startIndex){const n=adj.length;const visited=new Array(n).fill(false);const treeEdges=new Map();const stack=[startIndex];visited[startIndex]=true;function key(u,v){return u+"-"+v}while(stack.length){const u=stack.pop();const neigh=adj[u].slice();for(let i=neigh.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[neigh[i],neigh[j]]=[neigh[j],neigh[i]];}for(const e of neigh){const v=e.to;if(!visited[v]){visited[v]=true;treeEdges.set(key(u,v),e.gen);treeEdges.set(key(v,u),e.gen);stack.push(v);}}}return treeEdges;}

function pathInTree(treeEdges,n,start,target){const tadj=Array.from({length:n},()=>[]);for(const k of treeEdges.keys()){const [u,v]=k.split('-').map(x=>parseInt(x,10));tadj[u].push(v);}const q=[start];const prev=new Array(n).fill(-1);prev[start]=start;while(q.length){const u=q.shift();if(u===target) break;for(const v of tadj[u]){if(prev[v]===-1){prev[v]=u;q.push(v);}}}if(prev[target]===-1) return null;const path=[];let cur=target;while(cur!==start){path.push(cur);cur=prev[cur];}path.push(start);return path.reverse();}

// History tree structure
class HistoryNode {
  constructor(nodeId, parent = null, move = null) {
    this.nodeId = nodeId;
    this.parent = parent;
    this.children = [];
    this.move = move; // Generator index that led to this node
    this.visited = false;
  }

  addChild(nodeId, move) {
    const child = new HistoryNode(nodeId, this, move);
    this.children.push(child);
    return child;
  }

  findChild(nodeId) {
    return this.children.find(child => child.nodeId === nodeId);
  }

  markVisited() {
    this.visited = true;
  }
}

let NODES = [];
let adj = [];
let idx = new Map();
let START_IDX = 0;
let FINISH_IDX = 0;
let TREE = new Map();
let currentHistoryNode = null;
let moves = 0;
let historyRoot = null;
let visitedNodes = new Set();

const permEl = document.getElementById('perm');
const startPermEl = document.getElementById('startPerm');
const finishPermEl = document.getElementById('finishPerm');
const doorsEl = document.getElementById('doors');
const movesEl = document.getElementById('moves');
const shuffleBtn = document.getElementById('shuffleBtn');
const graphBtn = document.getElementById('graphBtn');
const solveBtn = document.getElementById('solveBtn');
const stepSolveBtn = document.getElementById('stepSolveBtn');
const difficultySelect = document.getElementById('difficulty');
const historyTreeEl = document.getElementById('historyTree');
const congratsEl = document.getElementById('congrats');
const finalMovesEl = document.getElementById('finalMoves');
const congratsBtn = document.getElementById('congratsBtn');

function initGame() {
  START = DIFFICULTIES[CURRENT_DIFFICULTY].START;
  FINISH = DIFFICULTIES[CURRENT_DIFFICULTY].FINISH;
  GENERATORS = DIFFICULTIES[CURRENT_DIFFICULTY].GENERATORS;
  
  NODES = buildGroup();
  const adjData = buildAdj(NODES);
  adj = adjData.adj;
  idx = adjData.idx;
  
  const startKey = pkey(START);
  const finishKey = pkey(FINISH);
  if(!idx.has(startKey) || !idx.has(finishKey)) {
    alert('Start or finish not in generated subgroup — try different generators.');
    return;
  }
  
  START_IDX = idx.get(startKey);
  FINISH_IDX = idx.get(finishKey);
  TREE = randomSpanningTree(adj, START_IDX);
  
  // Initialize history tree
  historyRoot = new HistoryNode(START_IDX);
  currentHistoryNode = historyRoot;
  currentHistoryNode.markVisited();
  moves = 0;
  visitedNodes = new Set([START_IDX]);
  
  startPermEl.textContent = pkey(START);
  finishPermEl.textContent = pkey(FINISH);
  movesEl.textContent = moves;
  
  renderRoom();
  renderHistoryTree();
  if(network) {
    refreshNetwork();
  }
}

function renderRoom() {
  const currentNodeId = currentHistoryNode.nodeId;
  permEl.textContent = pkey(NODES[currentNodeId]);
  doorsEl.innerHTML = '';
  
  // Check if we reached the finish
  if(currentNodeId === FINISH_IDX) {
    showCongratulations();
    return;
  }
  
  for(let g = 0; g < GENERATORS.length; g++) {
    const btn = document.createElement('button');
    btn.className = 'door';
    btn.style.background = GENERATORS[g].color;
    btn.textContent = GENERATORS[g].name + ' →';
    
    const neighbor = idx.get(pkey(compose(GENERATORS[g].p, NODES[currentNodeId])));
    const edgeKey = currentNodeId + "-" + neighbor;
    
    if(TREE.has(edgeKey)) {
      // Disable button if this neighbor has already been visited
      btn.disabled = visitedNodes.has(neighbor);
      if (!btn.disabled) {
        btn.onclick = () => {
          // Check if we already have this child
          let child = currentHistoryNode.findChild(neighbor);
          if (!child) {
            // Add new child to history tree
            child = currentHistoryNode.addChild(neighbor, g);
          }
          child.markVisited();
          visitedNodes.add(neighbor);
          currentHistoryNode = child;
          moves++;
          movesEl.textContent = moves;
          renderRoom();
          renderHistoryTree();
          highlightNode(currentNodeId);
        };
      }
    } else {
      btn.disabled = true;
    }
    doorsEl.appendChild(btn);
  }
  
  // Add a go back button if we're not at root
  if(currentHistoryNode.parent) {
    const backBtn = document.createElement('button');
    backBtn.className = 'door';
    backBtn.style.background = '#555';
    backBtn.textContent = '← Back';
    backBtn.onclick = () => {
      currentHistoryNode = currentHistoryNode.parent;
      moves++;
      movesEl.textContent = moves;
      renderRoom();
      renderHistoryTree();
      highlightNode(currentHistoryNode.nodeId);
    };
    doorsEl.appendChild(backBtn);
  }
}

function renderHistoryTree() {
  historyTreeEl.innerHTML = '';
  
  function renderNode(node, parentEl) {
    const nodeEl = document.createElement('div');
    nodeEl.className = 'tree-node' + 
      (node === currentHistoryNode ? ' current' : '') +
      (node.visited ? ' visited' : '');
    
    const labelEl = document.createElement('span');
    labelEl.className = 'node-label';
    labelEl.textContent = pkey(NODES[node.nodeId]);
    
    if (node.nodeId === START_IDX) labelEl.textContent += ' (Start)';
    if (node.nodeId === FINISH_IDX) labelEl.textContent += ' (Finish)';
    
    nodeEl.appendChild(labelEl);
    
    if (node.move !== null) {
      const moveEl = document.createElement('span');
      moveEl.className = 'move-label';
      moveEl.textContent = GENERATORS[node.move].name;
      nodeEl.appendChild(moveEl);
    }
    
    nodeEl.onclick = (e) => {
      e.stopPropagation();
      if (node === currentHistoryNode) return;
      currentHistoryNode = node;
      moves++; // Approximate move count
      movesEl.textContent = moves;
      renderRoom();
      renderHistoryTree();
      highlightNode(currentHistoryNode.nodeId);
    };
    
    parentEl.appendChild(nodeEl);
    
    if (node.children.length > 0) {
      const childrenEl = document.createElement('ul');
      childrenEl.className = 'tree-view';
      parentEl.appendChild(childrenEl);
      
      node.children.forEach(child => {
        const li = document.createElement('li');
        childrenEl.appendChild(li);
        renderNode(child, li);
      });
    }
  }
  
  renderNode(historyRoot, historyTreeEl);
}

let network = null;
let showGraph = false;

function buildVisData() {
  const nodes = NODES.map((p, i) => ({
    id: i,
    label: pkey(p),
    shape: 'dot',
    size: 8,
    color: i === currentHistoryNode.nodeId ? '#ffcc00' : 
           (i === START_IDX ? '#4CAF50' : 
           (i === FINISH_IDX ? '#F44336' : 
           (visitedNodes.has(i) ? '#666666' : '#cccccc')))
  }));
  
  const edges = [];
  for(let u = 0; u < NODES.length; u++) {
    for(const e of adj[u]) {
      edges.push({
        from: u,
        to: e.to,
        color: GENERATORS[e.gen].color,
        arrows: 'to',
        smooth: true,
        physics: true,
        width: TREE.has(u + "-" + e.to) ? 2 : 1,
        dashes: TREE.has(u + "-" + e.to) ? false : true
      });
    }
  }
  return {nodes, edges};
}

function initNetwork() {
  const container = document.getElementById('network');
  const data = buildVisData();
  const options = {
    nodes: {
      font: {size: 12}
    },
    edges: {
      smooth: {type: 'continuous'}
    },
    physics: {
      stabilization: true,
      barnesHut: {
        gravitationalConstant: -15000,
        springLength: 120
      }
    },
    interaction: {
      hover: true,
      multiselect: false,
      selectable: true
    }
  };
  
  network = new vis.Network(container, data, options);
  highlightNode(currentHistoryNode.nodeId);
}

function refreshNetwork() {
  if(!network) return;
  const d = buildVisData();
  network.setData(d);
  highlightNode(currentHistoryNode.nodeId);
}

function highlightNode(i) {
  if(!network) return;
  network.selectNodes([i]);
  network.focus(i, {scale: 1.2});
}

function showSolution() {
  const p = pathInTree(TREE, NODES.length, currentHistoryNode.nodeId, FINISH_IDX);
  if(!p) {
    alert('No path');
    return;
  }
  
  let movesList = [];
  for(let i = 0; i < p.length - 1; i++) {
    const u = p[i], v = p[i+1];
    const genIndex = TREE.get(u + "-" + v);
    movesList.push(GENERATORS[genIndex].name);
  }
  alert('Solution moves: ' + movesList.join(' → '));
}

async function stepToFinish() {
  const p = pathInTree(TREE, NODES.length, currentHistoryNode.nodeId, FINISH_IDX);
  if(!p) {
    alert('No path');
    return;
  }
  
  for(let i = 1; i < p.length; i++) {
    await new Promise(r => setTimeout(r, 400));
    
    // Find or create the next node in history
    const nextNodeId = p[i];
    let child = currentHistoryNode.findChild(nextNodeId);
    if (!child) {
      // Find which generator leads to this node
      const edgeKey = currentHistoryNode.nodeId + "-" + nextNodeId;
      const genIndex = TREE.get(edgeKey);
      child = currentHistoryNode.addChild(nextNodeId, genIndex);
    }
    
    child.markVisited();
    visitedNodes.add(nextNodeId);
    currentHistoryNode = child;
    moves++;
    movesEl.textContent = moves;
    renderRoom();
    renderHistoryTree();
    highlightNode(currentHistoryNode.nodeId);
  }
}

function showCongratulations() {
  finalMovesEl.textContent = moves;
  congratsEl.style.display = 'block';
}

function hideCongratulations() {
  congratsEl.style.display = 'none';
}

// Event listeners
shuffleBtn.onclick = () => {
  initGame();
  if(showGraph) {
    refreshNetwork();
  }
};

graphBtn.onclick = () => {
  showGraph = !showGraph;
  document.getElementById('network').style.display = showGraph ? 'block' : 'none';
  graphBtn.textContent = showGraph ? 'Hide graph' : 'Show graph';
  if(showGraph && !network) {
    initNetwork();
  }
};

solveBtn.onclick = () => {
  showSolution();
};

stepSolveBtn.onclick = () => {
  stepToFinish();
};

difficultySelect.onchange = () => {
  CURRENT_DIFFICULTY = difficultySelect.value;
  initGame();
};

congratsBtn.onclick = () => {
  hideCongratulations();
};

// Initialize the game
initGame();
</script>
</body>
</html>
