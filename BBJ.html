<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Busy Beaver Simulator</title>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            height: 100vh;
            margin: 0;
            font-family: Arial, sans-serif;
        }
        .histogram-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-top: 20px;
            max-width: 800px;
            overflow-x: scroll;
            position: relative;
        }
        .histogram-row {
            display: flex;
            flex-direction: row;
            align-items: center;
            margin-bottom: 5px;
        }
        .box {
            width: 20px;
            height: 20px;
            margin: 1px;
            border: 1px solid #000;
        }
        .box-0 {
            background-color: white;
        }
        .box-1 {
            background-color: black;
        }
        .box-0-head {
            background-color: white;
            border: 5px solid red; 
            box-sizing: border-box;
        }
        .box-1-head {
            background-color: black;
            border: 5px solid red; 
            box-sizing: border-box;
        }
        .head-line {
            position: absolute;
            height: 2px;
            background-color: red;
            top: 18px;
        }
        .histogram {
            font-family: monospace;
        }
        .invisible {
            visibility: hidden;
        }
        
        /* High Contrast Color Schemes */
        /* Neon */
        .neon.state-1    { background-color: #ffcccc; }
        .neon.state-1-on { background-color: #ff0000; }
        .neon.state-2    { background-color: #ccffcc; }
        .neon.state-2-on { background-color: #00ff00; }
        .neon.state-3    { background-color: #ccccff; }
        .neon.state-3-on { background-color: #0000ff; }
        .neon.state-4    { background-color: #ffffcc; }
        .neon.state-4-on { background-color: #ffff00; }
        .neon.state-5    { background-color: #ffccff; }
        .neon.state-5-on { background-color: #ff00ff; }
        .neon.state-6    { background-color: #ccffff; }
        .neon.state-6-on { background-color: #00ffff; }

        /* Dark */
        .dark.state-1    { background-color: #d9d9d9; }
        .dark.state-1-on { background-color: #990000; }
        .dark.state-2    { background-color: #b3b3b3; }
        .dark.state-2-on { background-color: #006600; }
        .dark.state-3    { background-color: #8c8c8c; }
        .dark.state-3-on { background-color: #000099; }
        .dark.state-4    { background-color: #666666; }
        .dark.state-4-on { background-color: #999900; }
        .dark.state-5    { background-color: #404040; }
        .dark.state-5-on { background-color: #990099; }
        .dark.state-6    { background-color: #1a1a1a; }
        .dark.state-6-on { background-color: #009999; }

        /* Pastel */
        .pastel.state-1    { background-color: #ffe6e6; }
        .pastel.state-1-on { background-color: #ff6666; }
        .pastel.state-2    { background-color: #e6ffe6; }
        .pastel.state-2-on { background-color: #66ff66; }
        .pastel.state-3    { background-color: #e6e6ff; }
        .pastel.state-3-on { background-color: #6666ff; }
        .pastel.state-4    { background-color: #ffffe6; }
        .pastel.state-4-on { background-color: #ffff66; }
        .pastel.state-5    { background-color: #ffe6ff; }
        .pastel.state-5-on { background-color: #ff66ff; }
        .pastel.state-6    { background-color: #e6ffff; }
        .pastel.state-6-on { background-color: #66ffff; }

        /* Earth */
        .earth.state-1    { background-color: #f5e6cc; }
        .earth.state-1-on { background-color: #cc6600; }
        .earth.state-2    { background-color: #e6f5cc; }
        .earth.state-2-on { background-color: #669900; }
        .earth.state-3    { background-color: #cce6f5; }
        .earth.state-3-on { background-color: #0066cc; }
        .earth.state-4    { background-color: #f5f5cc; }
        .earth.state-4-on { background-color: #999900; }
        .earth.state-5    { background-color: #f5cce6; }
        .earth.state-5-on { background-color: #990066; }
        .earth.state-6    { background-color: #ccf5e6; }
        .earth.state-6-on { background-color: #009966; }

        /* Fire */
        .fire.state-1    { background-color: #ffebcc; }
        .fire.state-1-on { background-color: #ff3300; }
        .fire.state-2    { background-color: #ffcc99; }
        .fire.state-2-on { background-color: #ff6600; }
        .fire.state-3    { background-color: #ff9966; }
        .fire.state-3-on { background-color: #ff9900; }
        .fire.state-4    { background-color: #ffcc66; }
        .fire.state-4-on { background-color: #ffcc00; }
        .fire.state-5    { background-color: #ff9933; }
        .fire.state-5-on { background-color: #ff9933; }
        .fire.state-6    { background-color: #ff6633; }
        .fire.state-6-on { background-color: #ff6633; }

        /* Ice */
        .ice.state-1    { background-color: #e6f7ff; }
        .ice.state-1-on { background-color: #66c2ff; }
        .ice.state-2    { background-color: #ccf2ff; }
        .ice.state-2-on { background-color: #00b3ff; }
        .ice.state-3    { background-color: #b3ecff; }
        .ice.state-3-on { background-color: #0099e6; }
        .ice.state-4    { background-color: #99e6ff; }
        .ice.state-4-on { background-color: #0080cc; }
        .ice.state-5    { background-color: #80dfff; }
        .ice.state-5-on { background-color: #006699; }
        .ice.state-6    { background-color: #66d9ff; }
        .ice.state-6-on { background-color: #004d80; }

        /* Candy */
        .candy.state-1    { background-color: #ffd6e7; }
        .candy.state-1-on { background-color: #ff3399; }
        .candy.state-2    { background-color: #d6f7ff; }
        .candy.state-2-on { background-color: #33ccff; }
        .candy.state-3    { background-color: #e7ffd6; }
        .candy.state-3-on { background-color: #99ff33; }
        .candy.state-4    { background-color: #fff0d6; }
        .candy.state-4-on { background-color: #ffcc66; }
        .candy.state-5    { background-color: #f0d6ff; }
        .candy.state-5-on { background-color: #cc66ff; }
        .candy.state-6    { background-color: #ffd6d6; }
        .candy.state-6-on { background-color: #ff6666; }

        /* High Contrast */
        .highcontrast.state-1    { background-color: #ffffff; }
        .highcontrast.state-1-on { background-color: #ff0000; }
        .highcontrast.state-2    { background-color: #ffffff; }
        .highcontrast.state-2-on { background-color: #00ff00; }
        .highcontrast.state-3    { background-color: #ffffff; }
        .highcontrast.state-3-on { background-color: #0000ff; }
        .highcontrast.state-4    { background-color: #ffffff; }
        .highcontrast.state-4-on { background-color: #ffff00; }
        .highcontrast.state-5    { background-color: #ffffff; }
        .highcontrast.state-5-on { background-color: #ff00ff; }
        .highcontrast.state-6    { background-color: #ffffff; }
        .highcontrast.state-6-on { background-color: #00ffff; }
        
        /* Options panel */
        .options-panel {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin: 10px 0;
            justify-content: center;
        }
        .option-group {
            display: flex;
            flex-direction: column;
            padding: 5px;
            border: 1px solid #ddd;
            border-radius: 5px;
        }
        .share-link {
            margin-top: 10px;
            display: flex;
            gap: 5px;
        }
        #shareUrl {
            width: 300px;
        }
        .color-schemes {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 5px;
        }
        .color-scheme-option {
            display: flex;
            align-items: center;
        }
        .input-format {
            display: flex;
            gap: 10px;
            margin-bottom: 10px;
        }
        .input-format button {
            padding: 5px 10px;
        }
        .input-format button.active {
            background-color: #4CAF50;
            color: white;
        }
    </style>
</head>
<body>
    <h1>Busy Beaver Simulator</h1>

    <!-- Input for transitions -->
    <label for="transitionInput">Enter Transitions:</label><br>
    <div class="input-format">
        <button id="stdBtn" onclick="setInputFormat('std')">Standard (STD)</button>
        <button id="ttbbBtn" onclick="setInputFormat('ttbb')" class="active">Default (TTBB)</button>
    </div>
    <textarea id="transitionInput" rows="4" cols="50">3;L;1|1;R;0|0;L;0|3;LL;0|1;RR;1|2;L;1</textarea><br>
    <!--   3;L;1|1;R;0|0;L;0|3;LL;0|1;RR;1|2;L;1   2;R;1|3;L;1|1;L;1|2;R;1|2;L;1|0;L;1 -->
    <div class="options-panel">
        <div class="option-group">
            <label><input type="checkbox" id="animateCheckbox"> Animate</label>
            <label>Speed: <input type="range" id="speedSlider" min="10" max="500" value="400"></label>
        </div>
        <div class="option-group">
            <label><input type="checkbox" id="colorStatesCheckbox"> Color States</label>
            <div>
                <label><input type="radio" name="colorMethod" value="current" checked> Current State</label>
                <label><input type="radio" name="colorMethod" value="persistent"> Persistent</label>
            </div>
        </div>
        <div class="option-group">
            <label>Color Scheme:</label>
            <div class="color-schemes">
                <label class="color-scheme-option"><input type="radio" name="colorScheme" value="neon" checked> Neon</label>
                <label class="color-scheme-option"><input type="radio" name="colorScheme" value="dark"> Dark</label>
                <label class="color-scheme-option"><input type="radio" name="colorScheme" value="pastel"> Pastel</label>
                <label class="color-scheme-option"><input type="radio" name="colorScheme" value="earth"> Earth</label>
                <label class="color-scheme-option"><input type="radio" name="colorScheme" value="fire"> Fire</label>
                <label class="color-scheme-option"><input type="radio" name="colorScheme" value="ice"> Ice</label>
                <label class="color-scheme-option"><input type="radio" name="colorScheme" value="candy"> Candy</label>
                <label class="color-scheme-option"><input type="radio" name="colorScheme" value="highcontrast"> High Contrast</label>
            </div>
        </div>
    </div>
    
    <button onclick="runSimulation()">Run Simulation</button>
    <button onclick="generateShareLink()">Generate Share Link</button>
    
    <div class="share-link">
        <input type="text" id="shareUrl" readonly>
        <button onclick="copyShareLink()">Copy</button>
    </div>

    <h2>Simulation Result</h2>
    <p id="stepsOutput"></p>
    <p id="shiftsOutput"></p>

    <h3>Histogram:</h3>
    <div id="histogram" class="histogram-container"></div>

    <script>
        let inputFormat = 'ttbb'; // 'std' or 'ttbb'
        
        function setInputFormat(format) {
            inputFormat = format;
            document.getElementById('stdBtn').classList.toggle('active', format === 'std');
            document.getElementById('ttbbBtn').classList.toggle('active', format === 'ttbb');
        }
        
        function stdToTtbb(stdStr) {
            const blocks = stdStr.split('_');
            const result = [];

            for (let state = 0; state < blocks.length; state++) {
                const block = blocks[state];
                for (let i = 0; i < block.length; i += 3) {
                    const write = block[i];
                    const dir = block[i + 1];
                    const next = block[i + 2];

                    let nextState;
                    if (next === 'Z') {
                        nextState = 0;
                    } else {
                        nextState = next.charCodeAt(0) - 64; // A=1, B=2, ...
                    }

                    result.push(`${nextState};${dir};${write}`);
                }
            }

            return result.join('|');
        }
        
        function ttbbToStd(ttbbStr) {
            const items = ttbbStr.split('|');
            const blocks = [];

            for (let i = 0; i < items.length; i++) {
                const [next, dir, write] = items[i].split(';');
                const state = Math.floor(i / 2);
                if (!blocks[state]) blocks[state] = [];
                const nextChar = next === '0' ? 'Z' : String.fromCharCode(64 + parseInt(next));
                blocks[state].push(`${write}${dir}${nextChar}`);
            }

            return blocks.map(block => block.join('')).join('_');
        }

        const Move = {
            LEFT: 'L',
            RIGHT: 'R',
            LLEFT: 'LL',
            RRIGHT: 'RR',
            WAIT: 'W',
            JUMP: 'J'
        };

        // Track visited states for persistent coloring
        let stateHistory = [];
        let cellStates = {}; // Track which state last modified each cell
        let cellValues = {}; // Track cell values for on/off coloring

        function parseTransitions(input) {
            // Convert input if in STD format
            if (inputFormat === 'std') {
                input = stdToTtbb(input);
            }
            
            return input.split('|').map(transitionStr => {
                const parts = transitionStr.split(';');
                return {
                    nextState: parseInt(parts[0]),
                    move: parts[1],
                    write: parseInt(parts[2])
                };
            });
        }

        function loadBeaverFromURL() {
            const urlParams = new URLSearchParams(window.location.search);
            const beaver = urlParams.get('beaver');
            if (beaver) {
                document.getElementById('transitionInput').value = decodeURIComponent(beaver);
            }
            
            // Load format
            const format = urlParams.get('format');
            if (format) {
                setInputFormat(format);
            }
            
            // Load other parameters
            const animate = urlParams.get('animate');
            if (animate) document.getElementById('animateCheckbox').checked = animate === 'true';
            
            const speed = urlParams.get('speed');
            if (speed) document.getElementById('speedSlider').value = speed;
            
            const colorStates = urlParams.get('colorStates');
            if (colorStates) document.getElementById('colorStatesCheckbox').checked = colorStates === 'true';
            
            const scheme = urlParams.get('scheme');
            if (scheme) document.querySelector(`input[name="colorScheme"][value="${scheme}"]`).checked = true;
            
            const method = urlParams.get('method');
            if (method) document.querySelector(`input[name="colorMethod"][value="${method}"]`).checked = true;
        }

        function generateShareLink() {
            const baseUrl = window.location.href.split('?')[0];
            const beaver = encodeURIComponent(document.getElementById('transitionInput').value);
            const animate = document.getElementById('animateCheckbox').checked;
            const speed = document.getElementById('speedSlider').value;
            const colorStates = document.getElementById('colorStatesCheckbox').checked;
            const scheme = document.querySelector('input[name="colorScheme"]:checked').value;
            const method = document.querySelector('input[name="colorMethod"]:checked').value;
            const format = inputFormat;
         
            const url = `${baseUrl}?beaver=${beaver}&animate=${animate}&speed=${speed}&colorStates=${colorStates}&scheme=${scheme}&method=${method}&format=${format}`;
            document.getElementById('shareUrl').value = url;
        }

        function copyShareLink() {
            const shareUrl = document.getElementById('shareUrl');
            shareUrl.select();
            document.execCommand('copy');
            alert('Link copied to clipboard!');
        }

        async function runSimulation() {
            // Reset state tracking
            stateHistory = [];
            cellStates = {};
            cellValues = {};
            
            const input = document.getElementById('transitionInput').value;
            const transitions = parseTransitions(input);
            const animate = document.getElementById('animateCheckbox').checked;
            const speed = parseInt(document.getElementById('speedSlider').value);
            const colorStates = document.getElementById('colorStatesCheckbox').checked;
            const colorScheme = document.querySelector('input[name="colorScheme"]:checked').value;
            const colorMethod = document.querySelector('input[name="colorMethod"]:checked').value;
            const histogramContainer = document.getElementById('histogram');
            let positiveTape = [0];
            let negativeTape = [0];
            let tapeHead = 0;
            let currentState = 1;
            let stepCount = 0;
            let totalShifts = 0;
            let maxDistFromOrigin = 0;
            let totalOn = 0;
            let oldtapeHead = 0;

            // Clear the previous histogram
            document.getElementById('histogram').innerHTML = '';

            while (currentState !== 0 && stepCount < 1000) {
                let currentTape = tapeHead >= 0 ? positiveTape : negativeTape;
                let index = Math.abs(tapeHead);

                // Ensure the tape is long enough
                while (index >= currentTape.length) {
                    currentTape.length = index + 1;
                    currentTape.fill(0, currentTape.length - 1);
                }

                currentTape[index] = currentTape[index] || 0;
                let currentValue = currentTape[index];
                let t = transitions[(currentState - 1) * 2 + currentValue];

                // Write the value
                currentTape[index] = t.write;
                cellValues[`${tapeHead >= 0 ? 'p' : 'n'}${index}`] = t.write;
                if (t.write === 1) totalOn++;
                
                // Track which state modified this cell
                if (colorMethod === 'persistent') {
                    const cellKey = `${tapeHead >= 0 ? 'p' : 'n'}${index}`;
                    cellStates[cellKey] = currentState;
                }

                // Move the tape head
                if (t.move === Move.LEFT) {
                    tapeHead--;
                } else if (t.move === Move.RIGHT) {
                    tapeHead++;
                } else if (t.move === Move.LLEFT) {
                    tapeHead -= 2;
                    currentTape[Math.abs(tapeHead+1)] = currentTape[Math.abs(tapeHead+1)] | 0;
                } else if (t.move === Move.RRIGHT) {
                    tapeHead += 2;
                    currentTape[Math.abs(tapeHead-1)] = currentTape[Math.abs(tapeHead-1)] | 0;
                } else if (t.move === Move.JUMP) {
                    let foundOne = false;
                    // Search negative tape first (right to left)
                    for (let i = negativeTape.length - 1; i >= 0; --i) {
                        if (negativeTape[i] === 1) {
                            tapeHead = -i;
                            foundOne = true;
                            break;
                        }
                    }
                    if (!foundOne) {
                        // Search positive tape (left to right)
                        for (let i = 0; i < positiveTape.length; ++i) {
                            if (positiveTape[i] === 1) {
                                tapeHead = i;
                                foundOne = true;
                                break;
                            }
                        }
                    }
                    if (!foundOne) {
                        // No 1 found anywhere, halt
                        currentState = 0;
                    }
                }

                // Update the state
                stateHistory.push(currentState);
                currentState = t.nextState;
                stepCount++;
                totalShifts++;

                // Update max distance from origin
                maxDistFromOrigin = Math.max(maxDistFromOrigin, Math.abs(tapeHead));

                // Draw the histogram row for this step
                drawHistogramRow(
                    positiveTape, 
                    negativeTape, 
                    oldtapeHead, 
                    colorStates ? currentState : 0,
                    colorScheme,
                    colorMethod
                );
                oldtapeHead = tapeHead;

                // If animation is enabled, add a delay
                if (animate && currentState !== 0) {
                    histogramContainer.scrollTop = histogramContainer.scrollHeight;
                    await new Promise(resolve => setTimeout(resolve, 510 - speed));
                }
            }

            // Output the result
            if (currentState === 0) {
                document.getElementById('stepsOutput').textContent = `Total Steps: ${stepCount}`;
                document.getElementById('shiftsOutput').textContent = `Total Shifts: ${totalShifts}`;
            } else {
                document.getElementById('stepsOutput').textContent = `Simulation did not halt in time.`;
                document.getElementById('shiftsOutput').textContent = `Total Shifts: ${totalShifts}`;
            }

            // Display the total number of "on" bits
            document.getElementById('shiftsOutput').textContent += ` | Total "on" bits: ${totalOn}`;

            // Display max distance from origin
            document.getElementById('shiftsOutput').textContent += ` | Max Distance from Origin: ${maxDistFromOrigin}`;
        }

        function drawHistogramRow(positiveTape, negativeTape, tapeHead, currentState, colorScheme, colorMethod) {
            const histogramContainer = document.getElementById('histogram');
            const maxLength = Math.max(positiveTape.length, negativeTape.length);
            let histogramRow = '';

            // Draw the negative tape part (left side), pad with invisible boxes if needed
            for (let i = 0; i < maxLength - negativeTape.length; i++) {
                histogramRow += `<div class="box invisible"></div>`;
            }

            negativeTape.forEach((value, index) => {
                let boxClass = value === 1 ? 'box-1' : 'box-0';
                if (tapeHead < 0 && index === negativeTape.length + tapeHead) {
                    boxClass += '-head';
                }
                
                // Determine state class
                let stateClass = '';
                if (currentState > 0) {
                    const cellKey = `n${index}`;
                    const stateForCell = colorMethod === 'persistent' ? (cellStates[cellKey] || 0) : currentState;
                    if (stateForCell > 0) {
                        const cellValue = cellValues[cellKey] || 0;
                        stateClass = `${colorScheme} state-${stateForCell}${cellValue === 1 ? '-on' : ''}`;
                    }
                }
                
                if (index !== 0) {
                    histogramRow += `<div class="box ${boxClass} ${stateClass}"></div>`;
                }
            });

            histogramRow += '<div style="width: 1px;"></div>';
           
            positiveTape.forEach((value, index) => {
                let boxClass = value === 1 ? 'box-1' : 'box-0';
                if (tapeHead >= 0 && index === tapeHead) {
                    boxClass += '-head';
                }
                
                // Determine state class
                let stateClass = '';
                if (currentState > 0) {
                    const cellKey = `p${index}`;
                    const stateForCell = colorMethod === 'persistent' ? (cellStates[cellKey] || 0) : currentState;
                    if (stateForCell > 0) {
                        const cellValue = cellValues[cellKey] || 0;
                        stateClass = `${colorScheme} state-${stateForCell}${cellValue === 1 ? '-on' : ''}`;
                    }
                }
                
                histogramRow += `<div class="box ${boxClass} ${stateClass}"></div>`;
            });

            for (let i = 0; i < maxLength - positiveTape.length; i++) {
                histogramRow += `<div class="box invisible"></div>`;
            }

            const newRow = document.createElement('div');
            newRow.className = 'histogram-row';
            newRow.innerHTML = histogramRow;
            histogramContainer.appendChild(newRow);
        }

        // Load beaver from URL on page load
        window.onload = loadBeaverFromURL;
    </script>
</body>
</html>
