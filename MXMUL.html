<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Matrix Multiplication Visualizer</title>

<style>
  body {
    font-family: Arial, sans-serif;
    padding: 20px;
    background: #222;
    color: #eee;
  }

  table {
    border-collapse: collapse;
    margin: 10px 0;
  }

  td {
    padding: 5px;
    text-align: center;
    border: 1px solid #444;
    min-width: 40px;
  }

  input {
    width: 50px;
    text-align: center;
    background: #111;
    color: #eee;
    border: 1px solid #555;
  }

  button {
    margin: 4px;
  }

  h3 {
    margin-bottom: 5px;
  }

  .highlightA { background: cyan; color: #000; }
  .highlightB { background: yellow; color: #000; }

  /* === GRID LAYOUT === */
  .container {
    display: grid;
    grid-template-columns: auto auto;
    grid-template-rows: auto auto;
    gap: 30px;
    align-items: start;
  }

  .matrixA { grid-column: 1; grid-row: 2; }
  .matrixB { grid-column: 2; grid-row: 1; }
  .matrixC { grid-column: 2; grid-row: 2; }

  .matrix {
    background: #1a1a1a;
    padding: 10px;
    border-radius: 6px;
  }

  .breakdown {
    margin-top: 20px;
    font-family: monospace;
    background: #111;
    padding: 10px;
    border-radius: 6px;
  }
</style>
</head>

<body>

<h2>Matrix Multiplication</h2>

<div>
  <label>Rows A:
    <input type="number" id="rowsA" value="2" min="1" max="10">
  </label>
  <label>Cols A / Rows B:
    <input type="number" id="colsA" value="3" min="1" max="10">
  </label>
  <label>Cols B:
    <input type="number" id="colsB" value="2" min="1" max="10">
  </label>
  <button onclick="resizeMatrices()">Resize</button>
</div>

<div class="container">

  <!-- Matrix B (TOP) -->
  <div class="matrix matrixB">
    <h3>Matrix B</h3>
    <div id="matrixB"></div>
    <button onclick="randomizeB(-10,10)">Random (-10 to 10)</button>
    <button onclick="randomizeB(0,10)">Random (0 to 10)</button>
    <button onclick="randomizeB(-1,1,[ -1,0,1 ])">Random (-1,0,1)</button>
  </div>

  <!-- Matrix A (LEFT) -->
  <div class="matrix matrixA">
    <h3>Matrix A</h3>
    <div id="matrixA"></div>
    <button onclick="randomizeA(-10,10)">Random (-10 to 10)</button>
    <button onclick="randomizeA(0,10)">Random (0 to 10)</button>
    <button onclick="randomizeA(-1,1,[ -1,0,1 ])">Random (-1,0,1)</button>
  </div>

  <!-- Matrix C (BOTTOM RIGHT) -->
  <div class="matrix matrixC">
    <h3>Matrix C = A × B</h3>
    <div id="matrixC"></div>
    <div style="font-size: 0.9em; opacity: 0.8;">Hover over entries</div>
  </div>

</div>

<div class="breakdown">
  <div id="formula1"></div>
  <div id="formula2"></div>
</div>

<script>
let A = [], B = [], C = [];
let m = 2, n = 3, p = 2;

function resizeMatrices() {
  m = parseInt(document.getElementById('rowsA').value);
  n = parseInt(document.getElementById('colsA').value);
  p = parseInt(document.getElementById('colsB').value);
  initMatrices();
}

function initMatrices() {
  A = Array.from({length: m}, () => Array(n).fill(0));
  B = Array.from({length: n}, () => Array(p).fill(0));
  C = Array.from({length: m}, () => Array(p).fill(0));

  renderMatrix('matrixA', A, 'A');
  renderMatrix('matrixB', B, 'B');
  computeC();
  renderMatrix('matrixC', C, 'C');
  clearBreakdown();
}

function renderMatrix(containerId, matrix, name) {
  const container = document.getElementById(containerId);
  container.innerHTML = '';
  const table = document.createElement('table');

  matrix.forEach((row, i) => {
    const tr = document.createElement('tr');
    row.forEach((val, j) => {
      const td = document.createElement('td');

      if (name === 'C') {
        td.textContent = val;
        td.onmouseover = () => highlightDot(i, j);
        td.onmouseout = clearHighlights;
      } else {
        const input = document.createElement('input');
        input.type = 'number';
        input.value = val;
        input.oninput = e => {
          matrix[i][j] = parseFloat(e.target.value) || 0;
          computeC();
          renderMatrix('matrixC', C, 'C');
        };
        td.appendChild(input);
      }

      tr.appendChild(td);
    });
    table.appendChild(tr);
  });

  container.appendChild(table);
}

function randomizeMatrix(matrix, min, max, customVals) {
  for (let i = 0; i < matrix.length; i++) {
    for (let j = 0; j < matrix[0].length; j++) {
      matrix[i][j] = customVals
        ? customVals[Math.floor(Math.random() * customVals.length)]
        : Math.floor(Math.random() * (max - min + 1)) + min;
    }
  }
}

function randomizeA(min, max, customVals) {
  randomizeMatrix(A, min, max, customVals);
  renderMatrix('matrixA', A, 'A');
  computeC();
  renderMatrix('matrixC', C, 'C');
  clearBreakdown();
}

function randomizeB(min, max, customVals) {
  randomizeMatrix(B, min, max, customVals);
  renderMatrix('matrixB', B, 'B');
  computeC();
  renderMatrix('matrixC', C, 'C');
  clearBreakdown();
}

function computeC() {
  C = Array.from({length: m}, () => Array(p).fill(0));
  for (let i = 0; i < m; i++) {
    for (let j = 0; j < p; j++) {
      for (let k = 0; k < n; k++) {
        C[i][j] += A[i][k] * B[k][j];
      }
    }
  }
}

function highlightDot(row, col) {
  const tableA = document.querySelector('#matrixA table');
  const tableB = document.querySelector('#matrixB table');
  const f1 = [];
  const f2 = [];

  for (let k = 0; k < n; k++) {
    tableA.rows[row].cells[k].classList.add('highlightA');
    tableB.rows[k].cells[col].classList.add('highlightB');
    f1.push(`${A[row][k]}·${B[k][col]}`);
    f2.push(A[row][k] * B[k][col]);
  }

  document.getElementById('formula1').textContent =
    `C[${row},${col}] = ` + f1.join(' + ') + ` = ${C[row][col]}`;
  document.getElementById('formula2').textContent =
    f2.join(' + ') + ` = ${C[row][col]}`;
}

function clearHighlights() {
  document.querySelectorAll('.highlightA,.highlightB')
    .forEach(el => el.classList.remove('highlightA','highlightB'));
  clearBreakdown();
}

function clearBreakdown() {
  document.getElementById('formula1').textContent = '';
  document.getElementById('formula2').textContent = '';
}

initMatrices();
</script>

</body>
</html>
