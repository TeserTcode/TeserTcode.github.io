<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>2D Fourier Transform</title>
  <style>
    canvas { image-rendering: pixelated; }
  </style>
</head>
<body>
  <h1>2D Fourier Transform Tool</h1>
  <input type="file" id="imgInput" accept="image/*"><br>
  <label>Transform Type:</label>
  <select id="transformType">
    <option value="dft2d">2D DFT</option>
    <option value="idft2d">2D IDFT</option>
    <option value="rowdft">Row DFT</option>
    <option value="coldft">Column DFT</option>
  </select><br>
  <label>Rotation:</label>
  <select id="rotationType">
    <option value="circular">Circular</option>
    <option value="hyperbolic">Hyperbolic</option>
  </select><br>
  <label>L:</label><input type="range" id="Lslider" min="0" max="4" step="0.01" value="1"><br>
  <label>Color Mode:</label>
  <select id="colorMode">
    <option value="bw">Black & White</option>
    <option value="rgb">RGB</option>
    <option value="complex">Complex Color</option>
  </select><br>
  <label>Contrast:</label><input type="range" id="contrast" min="0" max="5" step="0.1" value="1"><br>
  <label>Brightness:</label><input type="range" id="brightness" min="-1" max="1" step="0.01" value="0"><br>
  <label>Hue:</label><input type="range" id="hue" min="0" max="360" step="1" value="0"><br>
  <canvas id="sourceCanvas"></canvas>
  <canvas id="outputCanvas"></canvas>

  <script>
    const imgInput = document.getElementById('imgInput');
    const sourceCanvas = document.getElementById('sourceCanvas');
    const outputCanvas = document.getElementById('outputCanvas');
    const ctxSrc = sourceCanvas.getContext('2d');
    const ctxOut = outputCanvas.getContext('2d');

    imgInput.addEventListener('change', async (e) => {
      const img = new Image();
      img.src = URL.createObjectURL(e.target.files[0]);
      await img.decode();
      sourceCanvas.width = outputCanvas.width = img.width;
      sourceCanvas.height = outputCanvas.height = img.height;
      ctxSrc.drawImage(img, 0, 0);
      transformImage();
    });

    document.querySelectorAll('select, input[type=range]').forEach(el => {
      el.addEventListener('input', transformImage);
    });

    function transformImage() {
      const transformType = document.getElementById('transformType').value;
      const rotationType = document.getElementById('rotationType').value;
      const L = parseFloat(document.getElementById('Lslider').value);
      const contrast = parseFloat(document.getElementById('contrast').value);
      const brightness = parseFloat(document.getElementById('brightness').value);
      const hue = parseFloat(document.getElementById('hue').value);
      const colorMode = document.getElementById('colorMode').value;

      const width = sourceCanvas.width;
      const height = sourceCanvas.height;
      const imageData = ctxSrc.getImageData(0, 0, width, height);
      const pixels = imageData.data;
      const gray = [];

      for (let y = 0; y < height; y++) {
        gray[y] = [];
        for (let x = 0; x < width; x++) {
          const i = (y * width + x) * 4;
          const val = (pixels[i] + pixels[i + 1] + pixels[i + 2]) / 3;
          gray[y][x] = { re: val, im: 0 };
        }
      }

      let result;
      switch (transformType) {
        case 'dft2d':
          result = computeDFT2D(gray, width, height, L, rotationType);
          break;
        case 'idft2d':
          result = computeIDFT2D(gray, width, height, L, rotationType);
          break;
        case 'rowdft':
          result = gray.map(row => computeDFT1D(row, L, rotationType));
          break;
        case 'coldft':
          result = transpose(transpose(gray).map(row => computeDFT1D(row, L, rotationType)));
          break;
      }

      const outImage = ctxOut.getImageData(0, 0, width, height);
      for (let y = 0; y < height; y++) {
        for (let x = 0; x < width; x++) {
          const i = (y * width + x) * 4;
          const val = result[y][x];
          let mag = Math.sqrt(val.re ** 2 + val.im ** 2);
          mag = Math.pow(mag * contrast + brightness * 255, 1.0);
          let r = mag, g = mag, b = mag;

          if (colorMode === 'complex') {
            const angle = Math.atan2(val.im, val.re);
            const hueAngle = (angle / (2 * Math.PI) * 360 + hue) % 360;
            [r, g, b] = hslToRgb(hueAngle / 360, 1, Math.min(1, mag / 255));
          } else if (colorMode === 'rgb') {
            r = val.re; g = val.im; b = 128;
          }

          outImage.data[i] = Math.min(255, Math.max(0, r));
          outImage.data[i + 1] = Math.min(255, Math.max(0, g));
          outImage.data[i + 2] = Math.min(255, Math.max(0, b));
          outImage.data[i + 3] = 255;
        }
      }
      ctxOut.putImageData(outImage, 0, 0);
    }

    function computeDFT1D(signal, L = 1, mode = 'circular') {
      const N = signal.length;
      const out = new Array(N);
      for (let n = 0; n < N; n++) {
        let re = 0, im = 0;
        for (let k = 0; k < N; k++) {
          const angle = L * 2 * Math.PI * k * n / N;
          const cos = Math.cos(angle), sin = Math.sin(angle);
          if (mode === 'circular') {
            re += signal[k].re * cos + signal[k].im * sin;
            im += -signal[k].re * sin + signal[k].im * cos;
          } else {
            re += signal[k].re * cos + signal[k].im * sin;
            im += signal[k].re * sin + signal[k].im * cos;
          }
        }
        out[n] = { re, im };
      }
      return out;
    }

    function computeIDFT2D(freq, w, h, L = 1, mode = 'circular') {
      const cols = new Array(h);
      for (let y = 0; y < h; y++) cols[y] = new Array(w);

      for (let x = 0; x < w; x++) {
        const col = [];
        for (let y = 0; y < h; y++) col.push(freq[y][x]);
        const invCol = computeIDFT1D(col, L, mode);
        for (let y = 0; y < h; y++) cols[y][x] = invCol[y];
      }

      const rows = new Array(h);
      for (let y = 0; y < h; y++) rows[y] = computeIDFT1D(cols[y], L, mode);
      return rows;
    }

    function computeIDFT1D(freq, L = 1, mode = 'circular') {
      const N = freq.length;
      const output = new Array(N);
      for (let n = 0; n < N; n++) {
        let re = 0, im = 0;
        for (let k = 0; k < N; k++) {
          const angle = L * 2 * Math.PI * k * n / N;
          const cos = Math.cos(angle), sin = Math.sin(angle);
          if (mode === 'circular') {
            re += freq[k].re * cos - freq[k].im * sin;
            im += freq[k].re * sin + freq[k].im * cos;
          } else {
            re += freq[k].re * cos + freq[k].im * sin;
            im += freq[k].re * sin + freq[k].im * cos;
          }
        }
        output[n] = { re, im };
      }
      return output;
    }

    function computeDFT2D(input, width, height, L, mode) {
      const rows = input.map(row => computeDFT1D(row, L, mode));
      return transpose(transpose(rows).map(row => computeDFT1D(row, L, mode)));
    }

    function transpose(matrix) {
      return matrix[0].map((_, i) => matrix.map(row => row[i]));
    }

    function hslToRgb(h, s, l) {
      const a = s * Math.min(l, 1 - l);
      const f = n => {
        const k = (n + h * 12) % 12;
        return l - a * Math.max(-1, Math.min(k - 3, 9 - k, 1));
      };
      return [f(0) * 255, f(8) * 255, f(4) * 255];
    }
  </script>
</body>
</html>
