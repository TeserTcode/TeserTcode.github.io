<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>2D Transform Lab v3</title>
  <style>
    body { font-family: 'Segoe UI', sans-serif; background: #121212; color: #e0e0e0; display: flex; flex-direction: column; align-items: center; padding: 20px; }
    .controls { background: #1e1e1e; padding: 20px; border-radius: 12px; display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 15px; width: 95%; max-width: 1000px; border: 1px solid #333; margin-bottom: 20px; }
    .control-group { display: flex; flex-direction: column; gap: 5px; }
    canvas { border: 2px solid #444; background: #000; width: 100%; max-width: 450px; height: auto; image-rendering: pixelated; }
    .canvas-container { display: flex; gap: 20px; flex-wrap: wrap; justify-content: center; width: 100%; }
    label { font-size: 0.8rem; font-weight: bold; color: #999; text-transform: uppercase; }
    input, select { background: #2d2d2d; color: white; border: 1px solid #444; padding: 5px; border-radius: 4px; }
    h1 { margin: 0 0 20px 0; font-weight: 300; letter-spacing: 2px; }
  </style>
</head>
<body>
  <h1>TRANSFORM LAB</h1>
  
  <div class="controls">
    <div class="control-group">
      <label>Input Image</label>
      <input type="file" id="imgInput" accept="image/*">
      <label>Transform Type</label>
      <select id="transformType">
        <option value="fft2d">2D FFT (Centered)</option>
        <option value="ifft2d">2D Inverse FFT (Reconstruct)</option>
        <option value="dct">2D Discrete Cosine (DCT)</option>
        <option value="hartley">2D Hartley</option>
        <option value="rowfft">Row FFT Only</option>
        <option value="colfft">Column FFT Only</option>
      </select>
    </div>
    
    <div class="control-group">
      <label>Color Mode</label>
      <select id="colorMode">
        <option value="bw">Grayscale</option>
        <option value="complex">Complex (Hue=Phase)</option>
        <option value="rgb">RGB (Re=R, Im=G)</option>
      </select>
      <label>Scaling</label>
      <select id="scaleMode">
        <option value="log">Logarithmic</option>
        <option value="linear">Linear</option>
      </select>
    </div>

    <div class="control-group">
      <label>Brightness / Darken</label>
      <input type="range" id="brightness" min="-255" max="255" value="0">
      <label>Contrast</label>
      <input type="range" id="contrast" min="0" max="10" step="0.1" value="1">
    </div>

    <div class="control-group">
      <label>Options</label>
      <div><input type="checkbox" id="autoScale" checked> Auto-Normalize</div>
      <label>Hue Shift (Complex)</label>
      <input type="range" id="hue" min="0" max="360" value="0">
    </div>
  </div>

  <div class="canvas-container">
    <figure><figcaption>SOURCE</figcaption><canvas id="sourceCanvas"></canvas></figure>
    <figure><figcaption>OUTPUT</figcaption><canvas id="outputCanvas"></canvas></figure>
  </div>

  <script>
    const imgInput = document.getElementById('imgInput');
    const sourceCanvas = document.getElementById('sourceCanvas');
    const outputCanvas = document.getElementById('outputCanvas');
    const ctxSrc = sourceCanvas.getContext('2d', {willReadFrequently: true});
    const ctxOut = outputCanvas.getContext('2d');

    // --- Math Engines ---
    function fft1D(re, im, invert = false) {
      const n = re.length;
      for (let i = 1, j = 0; i < n; i++) {
        let bit = n >> 1;
        for (; j & bit; bit >>= 1) j ^= bit;
        j ^= bit;
        if (i < j) { [re[i], re[j]] = [re[j], re[i]]; [im[i], im[j]] = [im[j], im[i]]; }
      }
      for (let len = 2; len <= n; len <<= 1) {
        let ang = 2 * Math.PI / len * (invert ? 1 : -1);
        let wlen_re = Math.cos(ang), wlen_im = Math.sin(ang);
        for (let i = 0; i < n; i += len) {
          let w_re = 1, w_im = 0;
          for (let j = 0; j < len / 2; j++) {
            let u_re = re[i + j], u_im = im[i + j];
            let v_re = re[i+j+len/2]*w_re - im[i+j+len/2]*w_im;
            let v_im = re[i+j+len/2]*w_im + im[i+j+len/2]*w_re;
            re[i+j] = u_re+v_re; im[i+j] = u_im+v_im;
            re[i+j+len/2] = u_re-v_re; im[i+j+len/2] = u_im-v_im;
            let tmp = w_re*wlen_re - w_im*wlen_im;
            w_im = w_re*wlen_im + w_im*wlen_re; w_re = tmp;
          }
        }
      }
      if (invert) for (let i = 0; i < n; i++) { re[i] /= n; im[i] /= n; }
    }

    // Simplified DCT-II via FFT
    function dct2D(re, w, h) {
      // Row DCT
      for(let y=0; y<h; y++){
        let rowRe = re.subarray(y*w, (y+1)*w), rowIm = new Float64Array(w);
        fft1D(rowRe, rowIm);
        for(let i=0; i<w; i++) {
          let ang = -i * Math.PI / (2 * w);
          rowRe[i] = rowRe[i] * Math.cos(ang) - rowIm[i] * Math.sin(ang);
        }
      }
    }

    // --- Image Processing ---
    imgInput.addEventListener('change', async (e) => {
      const img = new Image();
      img.src = URL.createObjectURL(e.target.files[0]);
      await img.decode();
      const size = Math.pow(2, Math.floor(Math.log2(Math.min(img.width, img.height))));
      sourceCanvas.width = outputCanvas.width = size;
      sourceCanvas.height = outputCanvas.height = size;
      ctxSrc.drawImage(img, 0, 0, size, size);
      process();
    });

    document.querySelectorAll('input, select').forEach(el => el.addEventListener('input', process));

    function process() {
      const w = sourceCanvas.width, h = sourceCanvas.height;
      if (w === 0) return;
      const srcData = ctxSrc.getImageData(0, 0, w, h).data;
      let re = new Float64Array(w * h), im = new Float64Array(w * h);

      for (let i = 0; i < w * h; i++) re[i] = (srcData[i*4] + srcData[i*4+1] + srcData[i*4+2])/3;

      const type = document.getElementById('transformType').value;
      
      if (type.includes('fft')) {
        const inv = type === 'ifft2d';
        if (type !== 'colfft') { // Rows
          for (let y = 0; y < h; y++) fft1D(re.subarray(y*w, (y+1)*w), im.subarray(y*w, (y+1)*w), inv);
        }
        if (type !== 'rowfft') { // Cols
          for (let x = 0; x < w; x++) {
            let r = new Float64Array(h), m = new Float64Array(h);
            for (let y = 0; y < h; y++) { r[y] = re[y*w+x]; m[y] = im[y*w+x]; }
            fft1D(r, m, inv);
            for (let y = 0; y < h; y++) { re[y*w+x] = r[y]; im[y*w+x] = m[y]; }
          }
        }
      } else if (type === 'dct') {
        dct2D(re, w, h);
      } else if (type === 'hartley') {
        for (let y = 0; y < h; y++) {
          let r = re.subarray(y*w, (y+1)*w), m = im.subarray(y*w, (y+1)*w);
          fft1D(r, m);
          for(let i=0; i<w; i++) re[y*w+i] = r[i] - m[i]; 
        }
      }

      render(re, im, w, h, type);
    }

    function render(re, im, w, h, type) {
      const out = ctxOut.createImageData(w, h);
      const colorMode = document.getElementById('colorMode').value;
      const scaleMode = document.getElementById('scaleMode').value;
      const autoScale = document.getElementById('autoScale').checked;
      const brightness = parseFloat(document.getElementById('brightness').value);
      const contrast = parseFloat(document.getElementById('contrast').value);
      const hueBase = parseFloat(document.getElementById('hue').value);

      let maxM = 0;
      let mags = new Float64Array(w*h);
      for(let i=0; i<w*h; i++) {
        let m = (type === 'ifft2d') ? re[i] : Math.sqrt(re[i]**2 + im[i]**2);
        if (scaleMode === 'log' && type !== 'ifft2d') m = Math.log(1 + m);
        mags[i] = m;
        if (m > maxM) maxM = m;
      }

      for (let y = 0; y < h; y++) {
        for (let x = 0; x < w; x++) {
          let sx = x, sy = y;
          // Center the FFT for visualization only
          if (type === 'fft2d' || type === 'rowfft' || type === 'colfft') {
            if(type !== 'colfft') sx = (x + w/2) % w;
            if(type !== 'rowfft') sy = (y + h/2) % h;
          }
          
          const idx = sy * w + sx;
          let val = mags[idx];
          if (autoScale && maxM !== 0) val = (val / maxM) * 255;
          val = (val * contrast) + brightness;

          const outIdx = (y * w + x) * 4;
          if (colorMode === 'complex' && type !== 'ifft2d') {
            const phase = Math.atan2(im[idx], re[idx]);
            const rgb = hsvToRgb((phase / (2*Math.PI) * 360 + hueBase + 360) % 360, 0.8, Math.min(1, val/255));
            out.data[outIdx] = rgb[0]; out.data[outIdx+1] = rgb[1]; out.data[outIdx+2] = rgb[2];
          } else if (colorMode === 'rgb') {
            out.data[outIdx] = re[idx] + 128; out.data[outIdx+1] = im[idx] + 128; out.data[outIdx+2] = 128;
          } else {
            out.data[outIdx] = out.data[outIdx+1] = out.data[outIdx+2] = val;
          }
          out.data[outIdx+3] = 255;
        }
      }
      ctxOut.putImageData(out, 0, 0);
    }

    function hsvToRgb(h, s, v) {
      let f = (n, k = (n + h / 60) % 6) => v - v * s * Math.max(Math.min(k, 4 - k, 1), 0);
      return [f(5) * 255, f(3) * 255, f(1) * 255];
    }
  </script>
</body>
</html>
