<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NBF</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background-image: url('ABREbg.png');
            background-size: cover;
            background-position: center;
            font-family: 'nbf';
        }
        .container {
            text-align: center;
            color: white;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.7);
        }
        h1 {
            font-size: 5em;
        }
        input[type="number"] {
            padding: 10px;
            font-size: 1.5em;
            margin: 10px;
        }
        button {
            padding: 10px 20px;
            font-size: 1.5em;
            margin: 20px;
            cursor: pointer;
        }
        .result {
            font-size: 3em;
            font-family: 'nbf';
        }
        #abbreviationSelect {
            font-size: 2em;
        }
        #showEquation {
            font-size: 1.5em;
            margin: 10px;
        }
        @font-face {
            font-family: 'nbf';
            src: local('VIGA-REGULAR.OTF');
        }
    </style>
</head>
<body>
    <div class="container">
        <div id="inputContainer">
            <input type="number" id="headInput" value="10">
            <input type="number" id="exponentInput" value="30003">
            <input type="number" id="expoexponentInput" value="1">
        </div>
        <br>

        <select id="abbreviationSelect">
            <option value="nbf">nbf</option>
            <option value="levia">Levia</option>
            <option value="tesert">Tesert</option>
            <option value="taco">Taco</option>
            <option value="sc">SC</option>
        </select>

        <div>
            <input type="checkbox" id="showEquation" checked>
            <label for="showEquation">Show equation</label>
        </div>

        <br>
        <button onclick="calculate()">Calculate</button>
        <h1 id="result">Result</h1>
        <h1 id="formattedResult" class="result"></h1>
    </div>

                    i80: "Occon", i81: "Meoccon", i82: "Duoccon", i83: "Troccon", i84: "Ttoccon", i85: "Ptoccon", i86: "Hxoccon", i87: "Hpoccon", i88: "Ococcon", i89: "Enoccon",

            },
            levia: {

                ones: { i0: '', i1: 'U', i2: 'D', i3: 'T', i4: 'Qa', i5: 'Qt', i6: 'Sx', i7: 'Sp', i8: 'O', i9: 'N' },
                tens: { i0: '', i1: 'Dc', i2: 'Vg', i3: 'Tg', i4: 'Qd', i5: 'Qi', i6: 'Se', i7: 'St', i8: 'Og', i9: 'Nn' },

                tens: { i0: '', i1: 'D', i2: 'Vg', i3: 'Tg', i4: 'Qg', i5: 'Kg', i6: 'Sg', i7: 'Hg', i8: 'Og', i9: 'Ng' },

            },
            taco: {
                minor: { i0: '', i1: 'K', i2: 'M', i3: 'B', i4: 'T', i5: 'q', i6: 'Q', i7: 's', i8: 'S', i9: 'O', i10: 'N' },
                ones: { i0: '', i1: 'U', i2: 'D', i3: 'T', i4: 'q', i5: 'Q', i6: 's', i7: 'S', i8: 'O', i9: 'N' },
                tens: { i0: '', i1: 'De', i2: 'Vg', i3: 'Tg', i4: 'Qu', i5: 'Qi', i6: 'Se', i7: 'Sp', i8: 'Oc', i9: 'No' },
                tensabovehundred: { i0: '', i1: 'De', i2: 'Vg', i3: 'Tg', i4: 'Qu', i5: 'Qi', i6: 'Se', i7: 'Sp', i8: 'Oc', i9: 'No' },
                hundreds: { i0: '', i1: 'Ce', i2: 'Du', i3: 'Te', i4: 'Qr', i5: 'Qn', i6: 'Sc', i7: 'St', i8: 'Ot', i9: 'Nn' },

                tens: { i0: '', i1: 'Dc', i2: 'Vg', i3: 'Tg', i4: 'Qu', i5: 'Qi', i6: 'Sx', i7: 'Sp', i8: 'Oc', i9: 'No' },
                tensabovehundred: { i0: '', i1: 'Dc', i2: 'Vg', i3: 'Tg', i4: 'Qu', i5: 'Qi', i6: 'Sx', i7: 'Sp', i8: 'Oc', i9: 'No' },
                hundreds: { i0: '', i1: 'Ce', i2: 'Du', i3: 'Tc', i4: 'Qr', i5: 'Qg', i6: 'Sc', i7: 'St', i8: 'Ot', i9: 'Ng' },
                major: { i0: '', i1: 'Mil', i2: 'Mcr', i3: 'Nan', i4: 'Pic', i5: 'Fmt', i6: 'Att', i7: 'Zpt', i8: 'Yct', i9: 'Rnt', i10: 'Vec', i11: 'Mec' },
            }
        };

        function name(x, layer) {
            const Abbreviations = Abbrevs[document.getElementById('abbreviationSelect').value];
            let data = [0, 0, 0, 0];
            let abbrev = '';
            if (x === 1 && layer === 0) return 'k';
            if (x === 0) return '';
            if (layer !== 0) x++;
            data[0] = Math.floor((x - 1) / 1000);
            data[1] = Math.floor((x - 1) / 100) % 10;
            data[2] = Math.floor((x - 1) / 10) % 10;
            data[3] = (x - 1) % 10;
            if ((x - 1) % 1000 < 10) {
                if (data[3] !== 1 || layer < 3) {
                    abbrev = data[3] !== 0 ? Abbreviations.minor[`i${data[3]}`] + Abbreviations.major[`i${layer}`] : '';
                } else {
                    abbrev = Abbreviations.major[`i${layer}`];
                }
            } else if (data[2] === 1 && data[1] === 0) {
                abbrev = Abbreviations.ones[`i${data[3]}`] + "D" + Abbreviations.major[`i${layer}`];
            } else {
                abbrev = Abbreviations.ones[`i${data[3]}`] + Abbreviations.tens[`i${data[2]}`] + Abbreviations.hundreds[`i${data[1]}`] + Abbreviations.major[`i${layer}`];
            }
            return data[0] === 0 ? abbrev : name(data[0], layer + 1) + abbrev;
        }

        function power(a, b) {
            try {
                let lognumber = b * Math.log10(a);
                let mod3 = Math.floor((3 - (lognumber % 3)));
                let illion = Math.floor(lognumber / 3);
                let number = Math.pow(10, lognumber % 3);
                number = Math.floor(number * Math.pow(10, mod3)) / Math.pow(10, mod3);
                if (illion < 0) {
                    return number + name(-illion, 0) + "th";
                } else {
                    return number + name(illion, 0);
                }
            } catch (error) {
                return "err";
            }
        }

        function calculate() {
            let base = parseFloat(document.getElementById('headInput').value);
            let exponent = parseFloat(document.getElementById('exponentInput').value);
            let expoexponent = parseFloat(document.getElementById('expoexponentInput').value);
            
            const result = power(base, Math.pow(exponent, expoexponent));
            
            if (document.getElementById('showEquation').checked) {
                document.getElementById('result').textContent = `${base}^${exponent}^${expoexponent} = ${result}`;
            } else {
                document.getElementById('result').textContent = result;
            }
        }
    </script>
