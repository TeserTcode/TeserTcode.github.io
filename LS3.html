function loadPreset() {
    const presetName = document.getElementById("presetSelect").value;
    if (!presetName) return;

    const preset = presets[presetName];
    document.getElementById("angle").value = preset.angle;
    document.getElementById("main").value = preset.main;

    rules = {};
    moveBehavior = {};

    for (let key in preset.rules) {
        let value = preset.rules[key];

        if (value.startsWith("0")) {
            value = value.slice(1); // Remove leading zero
            moveBehavior[key] = false;
        } else {
            moveBehavior[key] = true;
        }

        rules[key] = value;
    }

    updateRuleUI();
}

        function addRule() {
            const letter = prompt("Enter a new rule letter (A-Z):").toUpperCase();
            if (!letter.match(/^[A-Z]$/) || rules[letter]) return;
            rules[letter] = letter;
            moveBehavior[letter] = true;
            updateRuleUI();
        }

        function updateRuleBindings() {
            document.querySelectorAll(".rule-input").forEach(input => {
                input.oninput = () => rules[input.dataset.letter] = input.value;
            });
            document.querySelectorAll(".move-checkbox").forEach(checkbox => {
                checkbox.onchange = () => moveBehavior[checkbox.dataset.letter] = checkbox.checked;
            });
        }

function rotateX(v, angle) {
  let [x,y,z] = v;
  return [x, y*Math.cos(angle) - z*Math.sin(angle), y*Math.sin(angle) + z*Math.cos(angle)];
}

function rotateY(v, angle) {
  let [x,y,z] = v;
  return [x*Math.cos(angle) + z*Math.sin(angle), y, -x*Math.sin(angle) + z*Math.cos(angle)];
}

function rotateZ(v, angle) {
  let [x,y,z] = v;
  return [x*Math.cos(angle) - y*Math.sin(angle), x*Math.sin(angle) + y*Math.cos(angle), z];
}
// Initialize
let direction = [0,1,0]; // forward
let left = [-1,0,0];     // left
let up = [0,0,1];        // up

function rotateVector(v, axis, angle) {
    const [x,y,z] = v;
    const [u,vv,ww] = axis;
    const cosA = Math.cos(angle);
    const sinA = Math.sin(angle);

    // Rodrigues' rotation formula
    return [
        x*cosA + (vv*z - ww*y)*sinA + u*(u*x + vv*y + ww*z)*(1-cosA),
        y*cosA + (ww*x - u*z)*sinA + vv*(u*x + vv*y + ww*z)*(1-cosA),
        z*cosA + (u*y - vv*x)*sinA + ww*(u*x + vv*y + ww*z)*(1-cosA)
    ];
}

let[pX,pY]=project3(add(proja.x0,x),add(proja.y0,y),add(proja.x0,z));
ctx.moveTo(pX,pY)
}
function zToColor(z, zMin, zMax) {
if(zMax==zMin)return `rgb(0,0,0)`
    const gray = Math.floor(200-255 * (z*4 - zMin) / (zMax - zMin));
    return `rgb(${gray-50},${gray},${gray+50})`;
}

function lineTo(x0, y0, z0, x1, y1, z1, zMin, zMax){

    let [pX1, pY1] = project3(add(proja.x0, x1), add(proja.y0, y1), add(proja.x0, z1));

    const grad = ctx.createLinearGradient(pX0, pY0, pX1, pY1);
    grad.addColorStop(0, zToColor(z0, zMin, zMax));
    grad.addColorStop(1, zToColor(z1, zMin, zMax));
    ctx.strokeStyle = grad;

    ctx.beginPath();
    ctx.moveTo(pX0, pY0);
    ctx.lineTo(pX1, pY1);
    ctx.stroke();
}

function shiftHue(hexColor, degrees) {
    let [r, g, b] = hexColor.match(/\w\w/g).map(x => parseInt(x, 16));
    let [h, s, l] = rgbToHsl(r, g, b);
    h = (h + degrees) % 360;
    return hslToHex(h, s, l);
}

        hexColor;
    
    return `rgba(${parseInt(hexColor.slice(1, 3), 16)}, 
               ${parseInt(hexColor.slice(3, 5), 16)}, 
               ${parseInt(hexColor.slice(5, 7), 16)}, 
               ${opacity})`;
}

		function linearRegression(x, y) {
			const n = x.length;
    const xMean = x.reduce((sum, val) => sum + val, 0) / n;
    const yMean = y.reduce((sum, val) => sum + val, 0) / n;

    const numerator = x.reduce((sum, val, i) => sum + (val - xMean) * (y[i] - yMean), 0);
    const denominator = x.reduce((sum, val) => sum + Math.pow(val - xMean, 2), 0);

    const slope = numerator / denominator;
    const intercept = yMean - slope * xMean;

    return { slope, intercept };
}

		function calculateHurstExponent() {
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const boxSize = parseInt(document.getElementById('boxSize').value);
    const boxSpacing = parseInt(document.getElementById('boxSpacing').value);

    let data = []; // Store pixel values

    // Iterate over the canvas to collect pixel values
    for (let y = 0; y < canvas.height; y += boxSpacing) {
        for (let x = 0; x < canvas.width; x += boxSpacing) {
            const imageData = ctx.getImageData(x, y, 1, 1).data;
            const r = imageData[0];
            const g = imageData[1];
            const b = imageData[2];
            const a = imageData[3];

            // Check if the pixel is not white
            if (r !== 255 || g !== 255 || b !== 255 || a !== 255) {
                data.push(1); // Filled pixel
            } else {
                data.push(0); // Empty pixel
            }
        }
    }

    // Calculate rescaled range
    const n = data.length;
    const mean = data.reduce((sum, val) => sum + val, 0) / n;
    let cumulativeDeviation = 0;
    let range = 0;
    let stdDev = 0;

    for (let i = 0; i < n; i++) {
        cumulativeDeviation += data[i] - mean;
        if (cumulativeDeviation > range) range = cumulativeDeviation;
        if (cumulativeDeviation < -range) range = -cumulativeDeviation;
        stdDev += Math.pow(data[i] - mean, 2);
    }

    stdDev = Math.sqrt(stdDev / n);

    // Calculate Hurst exponent
    const hurstExponent = Math.log(range / stdDev) / Math.log(n);
    alert(`Hurst Exponent: ${hurstExponent}`);
}

            // Check if the pixel is not white
            if (r !== 255 || g !== 255 || b !== 255 || a !== 255) {
                points.push({ x, y });
            }
        }
    }

    // Calculate correlation sum
    let correlationSum = 0;
    const r = boxSize/canvas.height; // Distance threshold
    for (let i = 0; i < points.length; i++) {
        for (let j = i + 1; j < points.length; j++) {
            const dx = points[i].x - points[j].x;
            const dy = points[i].y - points[j].y;
            const distance = Math.sqrt(dx * dx + dy * dy);
            if (distance < r) {
                correlationSum++;
            }
        }
    }

    // Calculate correlation dimension
    const correlationDimension = Math.log(correlationSum) / Math.log(r);
    alert(`Correlation Dimension: ${correlationDimension}`);
}

            totalPixels += filledPixels;
        }
    }

    // Calculate Shannon entropy
    let entropy = 0;
    for (const count of boxCounts) {

        r = randomUnitVector();
    } while (Math.abs(r[0]*v[0] + r[1]*v[1] + r[2]*v[2]) > 0.9);
    const dot = r[0]*v[0] + r[1]*v[1] + r[2]*v[2];
    let orth = [
        r[0]-dot*v[0],
        r[1]-dot*v[1],
        r[2]-dot*v[2]
    ];
    return normalize(orth);
}

// Spherical linear interpolation for unit vectors
function slerp(u, v, t){
    let dot = u[0]*v[0]+u[1]*v[1]+u[2]*v[2];
    dot = Math.min(Math.max(dot,-1),1);
    const theta = Math.acos(dot)*t;
    const w = normalize([v[0]-dot*u[0], v[1]-dot*u[1], v[2]-dot*u[2]]);
    return [
        u[0]*Math.cos(theta)+w[0]*Math.sin(theta),
        u[1]*Math.cos(theta)+w[1]*Math.sin(theta),
        u[2]*Math.cos(theta)+w[2]*Math.sin(theta)
    ];
}

// --- Button animation ---
document.getElementById("rotateBtn").addEventListener("click", () => {
    startTime = null;

    const originalA = [proja.a1, proja.a2, proja.a3];
    const originalB = [proja.b1, proja.b2, proja.b3];

    // generate random orthonormal target vectors
    const targetA = randomUnitVector();
    const targetB = orthogonalUnitVector(targetA);

    function animateRotation(timestamp){
        if(!startTime) startTime = timestamp;
        const elapsed = timestamp - startTime;
        const t = Math.min(elapsed / duration, 1);

        // interpolate using slerp
        const a = slerp(originalA, targetA, t);
        const b = slerp(originalB, targetB, t);

        proja.a1 = a[0]; proja.a2 = a[1]; proja.a3 = a[2];
        proja.b1 = b[0]; proja.b2 = b[1]; proja.b3 = b[2];

        generateLSystem();
		proja.a1 = originalA[0]; proja.a2 = originalA[1]; proja.a3 = originalA[2];
        proja.b1 = originalB[0]; proja.b2 = originalB[1]; proja.b3 = originalB[2];
        if(t < 1){
            requestAnimationFrame(animateRotation);
        } else {
            // restore original projection at the end
            proja.a1 = originalA[0]; proja.a2 = originalA[1]; proja.a3 = originalA[2];
            proja.b1 = originalB[0]; proja.b2 = originalB[1]; proja.b3 = originalB[2];
            generateLSystem();
        }
    }

    requestAnimationFrame(animateRotation);
});
