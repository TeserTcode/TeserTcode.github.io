        // Element colors
const elementColors = {
    'C': 'black',      // Carbon
    'H': 'gray',       // Hydrogen
    'O': 'red',        // Oxygen
    'N': 'blue',       // Nitrogen
    'P': 'purple',     // Phosphorus
    'Si': 'orange',    // Silicon
    'S': 'yellow',     // Sulfur
    'F': 'green',      // Fluorine
    'Cl': 'lime',      // Chlorine
    'Br': 'darkorange', // Bromine
    'I': 'darkviolet',  // Iodine
    'Na': 'darkblue',  // Sodium
    'K': 'violet',     // Potassium
    'Ca': 'darkgreen', // Calcium
    'Mg': 'teal',      // Magnesium
    'Fe': 'brown',     // Iron
    'Cu': 'copper',    // Copper
    'Zn': 'darkgray',  // Zinc
    'Ag': 'silver',    // Silver
    'Au': 'gold',      // Gold
    'Pb': 'dimgray',   // Lead
    'Al': 'lightgray', // Aluminum
    'He': 'pink',      // Helium
    'Ne': 'lightblue', // Neon
    'Ar': 'cyan',      // Argon
    'Li': 'crimson',   // Lithium
    'Be': 'darkred',   // Beryllium
    'B': 'saddlebrown' // Boron
};

        // Current molecule index and score
        let currentMoleculeIndex = 0;
        let score = 0;

        // Canvas and context
        const canvas = document.getElementById('moleculeCanvas');
        const ctx = canvas.getContext('2d');

        // Function to calculate canvas size based on molecule dimensions
        function calculateCanvasSize(molecule) {
            let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
            molecule.atoms.forEach(atom => {
                if (atom.x < minX) minX = atom.x;
                if (atom.y < minY) minY = atom.y;
                if (atom.x > maxX) maxX = atom.x;
                if (atom.y > maxY) maxY = atom.y;
            });
            const padding = 50; // Add padding around the molecule
            return {
                width: maxX - minX + 3 * padding,
                height: maxY - minY + 3 * padding
            };
        }

        // Function to draw a molecule
function drawMolecule(molecule) {
    const { width, height } = calculateCanvasSize(molecule);
    canvas.width = width;
    canvas.height = height;

    ctx.clearRect(0, 0, canvas.width, canvas.height);

    // Draw bonds
    molecule.bonds.forEach(bond => {
        const atom1 = molecule.atoms[bond.atom1Index];
        const atom2 = molecule.atoms[bond.atom2Index];

        // Calculate the bond vector
        const dx = atom2.x - atom1.x;
        const dy = atom2.y - atom1.y;

        // Calculate the perpendicular vector (normalized)
        const length = Math.sqrt(dx * dx + dy * dy);
        const perpDx = -dy / length; // Rotate 90 degrees counterclockwise
        const perpDy = dx / length;

        // Offset distance for double and triple bonds
        const offset = 3;

        // Draw the bond
        ctx.beginPath();
        ctx.moveTo(atom1.x, atom1.y);
        ctx.lineTo(atom2.x, atom2.y);

        if (bond.bondType === 'double') {
            // Draw a second line offset perpendicularly
            ctx.moveTo(atom1.x + perpDx * offset, atom1.y + perpDy * offset);
            ctx.lineTo(atom2.x + perpDx * offset, atom2.y + perpDy * offset);
        } else if (bond.bondType === 'triple') {
            // Draw two additional lines offset perpendicularly
            ctx.moveTo(atom1.x + perpDx * offset, atom1.y + perpDy * offset);
            ctx.lineTo(atom2.x + perpDx * offset, atom2.y + perpDy * offset);
            ctx.moveTo(atom1.x - perpDx * offset, atom1.y - perpDy * offset);
            ctx.lineTo(atom2.x - perpDx * offset, atom2.y - perpDy * offset);
        }

        ctx.stroke();
    });

    // Draw atoms (on top of bonds)
    molecule.atoms.forEach(atom => {
        ctx.beginPath();
        ctx.arc(atom.x, atom.y, 10, 0, 2 * Math.PI);
        if (atom.element === 'C') {
            // Draw a black dot for carbon
            ctx.fillStyle = elementColors[atom.element];
            ctx.fill();
        } else {
            // Draw colored circles for other elements
            ctx.fillStyle = elementColors[atom.element];
            ctx.fill();
            ctx.strokeStyle = 'black';
            ctx.stroke();
            ctx.fillStyle = 'black';
            ctx.fillText(atom.element, atom.x - 5, atom.y + 5);
        }});
}
   

        // Function to check the answer
        function checkAnswer() {
            const userAnswer = document.getElementById('answerInput').value.trim().toLowerCase();
            const correctAnswer = molecules[currentMoleculeIndex].name;
            const correctLetters = correctAnswer.length;
            const wrongLetters = Math.abs(userAnswer.length - correctLetters);

            if (userAnswer === correctAnswer) {
                // Correct answer
                score += correctLetters;
                document.getElementById('feedback').textContent = "Correct!";
            } else {
                // Incorrect answer
                score -= wrongLetters + Math.floor(correctLetters / 2);
                document.getElementById('feedback').textContent = `Incorrect. The correct answer is ${correctAnswer}.`;
            }

            // Update score
            document.getElementById('score').textContent = `Score: ${score}`;

            // Move to the next molecule
            currentMoleculeIndex = (currentMoleculeIndex + 1) % molecules.length;
            drawMolecule(molecules[currentMoleculeIndex]);
            document.getElementById('answerInput').value = ""; // Clear input
        }

        // Draw the first molecule when the page loads
        window.onload = () => drawMolecule(molecules[currentMoleculeIndex]);
