        function rastgeleCumleSec() {
            const rastgeleIndex = Math.floor(Math.random() * cumleler.length);
            return cumleler[rastgeleIndex];
        }

        function cumleGoster() {
            mevcutCumle = rastgeleCumleSec();
            const cumleElement = document.getElementById("cumle");
            cumleElement.innerHTML = mevcutCumle.cumle;
            cumleElement.style.backgroundColor = ""; // Stili temizle
        }

        function highlightKelime(cumle, lokasyon, className) {
            if (!lokasyon) return cumle; // Lokasyon yoksa cümleyi olduğu gibi döndür
            const kelime = lokasyon.split(" ")[1]; // "B <kelime>" formatından kelimeyi al
            if (!kelime) return cumle; // Kelime yoksa cümleyi olduğu gibi döndür
            const regex = new RegExp(`(${kelime})`, "gi"); // Büyük-küçük harf duyarsız regex
            return cumle.replace(regex, `<span class="${className}">$1</span>`);
        }

        function cevapKontrol(cevap) {
            const puanElement = document.getElementById("puan");
            const cumleElement = document.getElementById("cumle");

            if (cevap === mevcutCumle.tip) {
                puan += 1000;
                puanElement.textContent = `Puan: ${puan}`;
                alert("Doğru cevap! +1000 puan");
            } else {
                puan -= 1000;
                puanElement.textContent = `Puan: ${puan}`;
                alert("Yanlış cevap! -1000 puan");
                hataListesi.push(mevcutCumle);
                const hataListesiUl = document.getElementById("hataListesiUl");
                const li = document.createElement("li");
                li.innerHTML = highlightKelime(mevcutCumle.cumle, mevcutCumle.lokasyon, "altiCizili");
                hataListesiUl.appendChild(li);
            }

            // Cümleyi renklendir
            if (cevap === "hicbiri") {
                cumleElement.style.backgroundColor = "#95a5a6"; // Gri
            } else {
                const renkliCumle = highlightKelime(mevcutCumle.cumle, mevcutCumle.lokasyon, mevcutCumle.tip);
                cumleElement.innerHTML = renkliCumle;
            }

            // Yeni cümle göster (stili temizle)
            setTimeout(cumleGoster, 2000);
        }

        document.getElementById("edat").addEventListener("click", () => cevapKontrol("edat"));
        document.getElementById("baglac").addEventListener("click", () => cevapKontrol("baglac"));
        document.getElementById("hicbiri").addEventListener("click", () => cevapKontrol("hicbiri"));
