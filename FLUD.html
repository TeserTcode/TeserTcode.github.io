<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>GPU Navier-Stokes</title>
    <style>
        * {
            margin: 0
        }
        html,
        body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #000
        }
        canvas {
            width: 100%;
            height: 100%;
            display: block;
            image-rendering: pixelated
        }
        #u {
            position: fixed;
            left: 10px;
            top: 10px;
            background: rgba(15, 15, 15, .92);
            color: #ddd;
            padding: 6px 8px;
            font: 11px monospace;
            line-height: 18px;
            border: 1px solid #444;
            user-select: none
        }
        select,
        input,
        button {
            background: #181818;
            color: #ddd;
            border: 1px solid #555;
            font: 11px monospace
        }
        select {
            width: 110px
        }
        input[type=range] {
            width: 60px
        }
        input[type=text] {
            width: 40px
        }
        button {
            padding: 1px 6px;
            cursor: pointer
        }
        .r {
            display: flex;
            align-items: center;
            gap: 3px;
            flex-wrap: wrap
        }
    </style>
</head>
<body>
    <canvas id=c></canvas>
    <div id=u>
        <div class=r><select id=b><option value=0>velocity</option><option value=1>pressure</option><option value=2>vortex</option></select></div>
        <div class=r><select id=d><option value=0>mouse</option><option value=1>right</option><option value=2>left</option><option value=3>up</option><option value=4>down</option></select></div>
        <div class=r><select id=c0><option value=0>derivatives</option><option value=1>speed</option><option value=2>velocity XY</option><option value=3>pressure</option><option value=4>vorticity</option></select></div>
        <div class=r><select id=r0><option value=256>256</option><option value=384>384</option><option value=512 selected>512</option><option value=768>768</option><option value=1024>1024</option></select></div>
        <div class=r>spd <input id=s type=range min=1 max=12 value=3><span id=sv>3</span></div>
        <div class=r>dt <input id=t type=text value=.012></div>
        <div class=r>vis <input id=v type=text value=.0008></div>
        <div class=r>str <input id=st type=text value=1></div>
        <div class=r>rad <input id=ra type=text value=12></div>
        <div class=r><button id=rs>reset</button><button id=cl>clear</button></div>
    </div>
    <script>
        "use strict";
        const C = document.getElementById('c'),
            G = C.getContext('webgl2', { antialias: !1, alpha: !1, depth: !1, stencil: !1, premultipliedAlpha: !1,
                preserveDrawingBuffer: !1 });
        if (!G) throw document.body.innerHTML = "<pre style=color:white>WebGL2 required</pre>";
        if (!G.getExtension('EXT_color_buffer_float')) throw document.body.innerHTML =
            "<pre style=color:white>EXT_color_buffer_float required</pre>";

        function S(t, s) { var a = G.createShader(t);
            G.shaderSource(a, s);
            G.compileShader(a); if (!G.getShaderParameter(a, G.COMPILE_STATUS)) throw G.getShaderInfoLog(a); return a }

        function P(s) { var p = G.createProgram();
            G.attachShader(p, S(G.VERTEX_SHADER,
                    '#version 300 es\nprecision highp float;const vec2 v[3]=vec2[](vec2(-1,-1),vec2(3,-1),vec2(-1,3));out vec2 u;void main(){vec2 p=v[gl_VertexID];u=p*.5+.5;gl_Position=vec4(p,0,1);}'
                    ));
            G.attachShader(p, S(G.FRAGMENT_SHADER, s));
            G.linkProgram(p); if (!G.getProgramParameter(p, G.LINK_STATUS)) throw G.getProgramInfoLog(p); return p }
        const VS = '#version 300 es\nprecision highp float;in vec2 u;out vec4 o;uniform sampler2D v,f;uniform float t;uniform vec2 x;void main(){vec2 p=u-texture(v,u).xy*t*x;p=clamp(p,vec2(0),vec2(1));o=texture(f,p);}',
            DF = '#version 300 es\nprecision highp float;in vec2 u;out vec4 o;uniform sampler2D f;uniform vec2 x;uniform float a;void main(){vec4 c=texture(f,u);vec4 l=texture(f,u-vec2(x.x,0));vec4 r=texture(f,u+vec2(x.x,0));vec4 d=texture(f,u-vec2(0,x.y));vec4 n=texture(f,u+vec2(0,x.y));o=c+a*(l+r+d+n-4.*c);}',
            DG = '#version 300 es\nprecision highp float;in vec2 u;out vec4 o;uniform sampler2D v;uniform vec2 x;void main(){float l=texture(v,u-vec2(x.x,0)).x,r=texture(v,u+vec2(x.x,0)).x,d=texture(v,u-vec2(0,x.y)).y,n=texture(v,u+vec2(0,x.y)).y;o=vec4(.5*(r-l+n-d),0,0,1);}',
            PS = '#version 300 es\nprecision highp float;in vec2 u;out vec4 o;uniform sampler2D p,d;uniform vec2 x;void main(){float l=texture(p,u-vec2(x.x,0)).x,r=texture(p,u+vec2(x.x,0)).x,b=texture(p,u-vec2(0,x.y)).x,t=texture(p,u+vec2(0,x.y)).x,di=texture(d,u).x;o=vec4((l+r+b+t-di)*.25,0,0,1);}',
            PJ = '#version 300 es\nprecision highp float;in vec2 u;out vec4 o;uniform sampler2D v,p;uniform vec2 x;void main(){vec2 vel=texture(v,u).xy;float l=texture(p,u-vec2(x.x,0)).x,r=texture(p,u+vec2(x.x,0)).x,b=texture(p,u-vec2(0,x.y)).x,t=texture(p,u+vec2(0,x.y)).x;vel-=.5*vec2(r-l,t-b);o=vec4(vel,0,1);}',
            BS = '#version 300 es\nprecision highp float;in vec2 u;out vec4 o;uniform sampler2D f;uniform vec2 m,g;uniform float r,s;uniform int k;void main(){vec4 c=texture(f,u);float q=exp(-distance(u,m)*distance(u,m)/max(r*r,1e-6));if(k==0)c.xy+=g*s*q;else if(k==1)c.x+=s*q;else if(k==2){vec2 e=u-m;float h=length(e);if(h>1e-5)c.xy+=vec2(-e.y,e.x)/h*s*q;}o=c;}',
            DS = '#version 300 es\nprecision highp float;in vec2 u;out vec4 o;uniform sampler2D v,p,s;uniform vec2 x;uniform int m;float q(vec2 p){return texture(s,clamp(p,vec2(0),vec2(1))).x;}float d1(){float l=q(u-vec2(x.x,0)),r=q(u+vec2(x.x,0)),b=q(u-vec2(0,x.y)),t=q(u+vec2(0,x.y));return length(vec2(.5*(r-l),.5*(t-b)));}float d2(){float c=q(u),l=q(u-vec2(x.x,0)),r=q(u+vec2(x.x,0)),b=q(u-vec2(0,x.y)),t=q(u+vec2(0,x.y));return length(vec2(r-2.*c+l,t-2.*c+b));}float d3(){float xm2=q(u-2.*vec2(x.x,0)),xm1=q(u-vec2(x.x,0)),xp1=q(u+vec2(x.x,0)),xp2=q(u+2.*vec2(x.x,0)),ym2=q(u-2.*vec2(0,x.y)),ym1=q(u-vec2(0,x.y)),yp1=q(u+vec2(0,x.y)),yp2=q(u+2.*vec2(0,x.y));return length(vec2(.5*(xp2-2.*xp1+2.*xm1-xm2),.5*(yp2-2.*yp1+2.*ym1-ym2)));}void main(){vec2 vel=texture(v,u).xy;float pr=texture(p,u).x;if(m==0){float a=d1(),b=d2(),c=d3();a=1.-exp(-a*30.);b=1.-exp(-b*80.);c=1.-exp(-c*200.);o=vec4(a,b,c,1);}else if(m==1){float sp=1.-exp(-length(vel)*3.);o=vec4(sp,sp,sp,1);}else if(m==2){o=vec4(.5+vel.x*.15,.5+vel.y*.15,length(vel)*.1,1);}else if(m==3){float qq=.5+pr*.05;o=vec4(qq,qq,qq,1);}else{float l=texture(v,u-vec2(x.x,0)).y,r=texture(v,u+vec2(x.x,0)).y,b=texture(v,u-vec2(0,x.y)).x,t=texture(v,u+vec2(0,x.y)).x,z=.5+.5*(.5*(r-l-b+t));o=vec4(z,.5,1.-z,1);}}';
        const PR = { a: P(VS), d: P(DF), g: P(DG), p: P(PS), j: P(PJ), b: P(BS), s: P(DS) };

        function TX() { var t = G.createTexture();
            G.bindTexture(G.TEXTURE_2D, t);
            G.texParameteri(G.TEXTURE_2D, G.TEXTURE_MIN_FILTER, G.LINEAR);
            G.texParameteri(G.TEXTURE_2D, G.TEXTURE_MAG_FILTER, G.LINEAR);
            G.texParameteri(G.TEXTURE_2D, G.TEXTURE_WRAP_S, G.CLAMP_TO_EDGE);
            G.texParameteri(G.TEXTURE_2D, G.TEXTURE_WRAP_T, G.CLAMP_TO_EDGE);
            G.texStorage2D(G.TEXTURE_2D, 1, G.RGBA16F, N, N); return t }

        function FB(t) { var f = G.createFramebuffer();
            G.bindFramebuffer(G.FRAMEBUFFER, f);
            G.framebufferTexture2D(G.FRAMEBUFFER, G.COLOR_ATTACHMENT0, G.TEXTURE_2D, t, 0); if (G.checkFramebufferStatus(G
                    .FRAMEBUFFER) !== G.FRAMEBUFFER_COMPLETE) throw Error('FBO incomplete'); return f }

        function MP() { var a = TX(),
                b = TX(); return { a: a, b: b, fa: FB(a), fb: FB(b) } }

        function CL(f) { G.bindFramebuffer(G.FRAMEBUFFER, f);
            G.viewport(0, 0, N, N);
            G.clearColor(0, 0, 0, 1);
            G.clear(G.COLOR_BUFFER_BIT) }

        function DR(f) { G.bindFramebuffer(G.FRAMEBUFFER, f);
            G.viewport(0, 0, N, N);
            G.bindVertexArray(VA);
            G.drawArrays(G.TRIANGLES, 0, 3) }

        function U1(p, n, v) { var l = G.getUniformLocation(p, n); if (l !== null) G.uniform1f(l, v) }

        function U2(p, n, x, y) { var l = G.getUniformLocation(p, n); if (l !== null) G.uniform2f(l, x, y) }

        function U1i(p, n, v) { var l = G.getUniformLocation(p, n); if (l !== null) G.uniform1i(l, v) }

        function BT(t, u, n, p) { G.activeTexture(G.TEXTURE0 + u);
            G.bindTexture(G.TEXTURE_2D, t); var l = G.getUniformLocation(p, n); if (l !== null) G.uniform1i(l, u) }

        function SW(o) { var a = o.a,
                b = o.b,
                fa = o.fa,
                fb = o.fb;
            o.a = b;
            o.b = a;
            o.fa = fb;
            o.fb = fa }

        function ADV() { var p = PR.a;
            G.useProgram(p);
            BT(VEL.a, 0, 'v', p);
            BT(VEL.a, 1, 'f', p);
            U1(p, 't', +T.value || .01);
            U2(p, 'x', 1 / N, 1 / N);
            DR(VEL.fb);
            SW(VEL) }

        function DIFF() { var nu = Math.max(0, +V.value || 0); if (nu <= 0) return;
            var p = PR.d;
            G.useProgram(p);
            BT(VEL.a, 0, 'f', p);
            U2(p, 'x', 1 / N, 1 / N);
            U1(p, 'a', Math.min(nu * (+T.value || .01) * N * N, .2));
            DR(VEL.fb);
            SW(VEL) }

        function DIV() { var p = PR.g;
            G.useProgram(p);
            BT(VEL.a, 0, 'v', p);
            U2(p, 'x', 1 / N, 1 / N);
            DR(DIVF) }

        function PSOLVE() { CL(PRES.fa);
            CL(PRES.fb); var p = PR.p; for (var i = 0; i < 30; i++) { G.useProgram(p);
                BT(PRES.a, 0, 'p', p);
                BT(DIVT, 1, 'd', p);
                U2(p, 'x', 1 / N, 1 / N);
                DR(PRES.fb);
                SW(PRES) } }

        function PROJ() { var p = PR.j;
            G.useProgram(p);
            BT(VEL.a, 0, 'v', p);
            BT(PRES.a, 1, 'p', p);
            U2(p, 'x', 1 / N, 1 / N);
            DR(VEL.fb);
            SW(VEL) }

        function CLAMP(x, a, b) { return Math.max(a, Math.min(b, x)) }
        let MX = .5,
            MY = .5,
            DX = 0,
            DY = 0,
            MD = !1;

        function MPOS(e) { var r = C.getBoundingClientRect(),
                x = CLAMP((e.clientX - r.left) / r.width, 0, 1),
                y = CLAMP((e.clientY - r.top) / r.height, 0, 1);
            DX = x - MX;
            DY = y - MY;
            MX = x;
            MY = y }
        C.onpointerdown = function(e) { MD = !0;
            C.setPointerCapture(e.pointerId);
            MPOS(e) };
        C.onpointermove = MPOS;
        C.onpointerup = function() { MD = !1 };
        C.onpointercancel = function() { MD = !1 };

        function GF() { var d = +D.value; if (d === 1) return [1, 0]; if (d === 2) return [-1, 0]; if (d === 3) return [0, -
                1
            ]; if (d === 4) return [0, 1]; var m = Math.hypot(DX, DY); if (m < 1e-8) return [0, 0]; return [DX / m, DY /
                m
            ] }

        function BRUSH() { if (!MD) return;
            var p = PR.b;
            G.useProgram(p);
            BT(VEL.a, 0, 'f', p);
            U2(p, 'm', MX, 1 - MY);
            var f = GF();
            U2(p, 'g', f[0], -f[1]);
            U1(p, 'r', (+RA.value || 12) / N);
            U1(p, 's', +ST.value || 1);
            U1i(p, 'k', +B.value);
            DR(VEL.fb);
            SW(VEL) }

        function STEP() { BRUSH();
            ADV();
            DIFF();
            DIV();
            PSOLVE();
            PROJ() }

        function DISP() { G.bindFramebuffer(G.FRAMEBUFFER, null);
            G.viewport(0, 0, C.width, C.height);
            var p = PR.s;
            G.useProgram(p);
            BT(VEL.a, 0, 'v', p);
            BT(PRES.a, 1, 'p', p);
            BT(VEL.a, 2, 's', p);
            U2(p, 'x', 1 / N, 1 / N);
            U1i(p, 'm', +C0.value);
            G.bindVertexArray(VA);
            G.drawArrays(G.TRIANGLES, 0, 3) }

        function RESET() { CL(VEL.fa);
            CL(VEL.fb);
            CL(PRES.fa);
            CL(PRES.fb);
            CL(DIVF);
            var p = PR.b;
            G.useProgram(p);
            BT(VEL.a, 0, 'f', p);
            U2(p, 'm', .5, .5);
            U2(p, 'g', 1, 0);
            U1(p, 'r', .13);
            U1(p, 's', .8);
            U1i(p, 'k', 2);
            DR(VEL.fb);
            SW(VEL) }

        function INIT() { VEL = MP();
            PRES = MP();
            DIVT = TX();
            DIVF = FB(DIVT);
            CL(VEL.fa);
            CL(VEL.fb);
            CL(PRES.fa);
            CL(PRES.fb);
            CL(DIVF);
            RESET() }

        function RESIZE() { var d = Math.min(window.devicePixelRatio || 1, 2);
            C.width = Math.floor(C.clientWidth * d);
            C.height = Math.floor(C.clientHeight * d) }
        let N = +document.getElementById('r0').value,
            VEL, PRES, DIVT, DIVF, VA = G.createVertexArray();
        G.bindVertexArray(VA);
        var B = document.getElementById('b'),
            D = document.getElementById('d'),
            C0 = document.getElementById('c0'),
            R0 = document.getElementById('r0'),
            T = document.getElementById('t'),
            V = document.getElementById('v'),
            ST = document.getElementById('st'),
            RA = document.getElementById('ra'),
            S0 = document.getElementById('s'),
            SV = document.getElementById('sv');
        S0.oninput = function() { SV.textContent = S0.value };
        R0.onchange = function() { N = +R0.value;
            INIT() };
        document.getElementById('cl').onclick = function() { CL(VEL.fa);
            CL(VEL.fb);
            CL(PRES.fa);
            CL(PRES.fb);
            CL(DIVF) };
        document.getElementById('rs').onclick = RESET;
        window.onresize = RESIZE;
        RESIZE();
        INIT();

        function FRAME() { for (var i = 0, sp = +S0.value || 1; i < sp; i++) STEP();
            DISP();
            requestAnimationFrame(FRAME) }
        FRAME();
    </script>
</body>
</html>
