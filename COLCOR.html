// Compute Pearson correlation
function corr(x, y) {
  const n = x.length;
  const meanX = x.reduce((a,b)=>a+b,0)/n;
  const meanY = y.reduce((a,b)=>a+b,0)/n;
  const num = x.map((v,i)=>(v-meanX)*(y[i]-meanY)).reduce((a,b)=>a+b,0);
  const den = Math.sqrt(
    x.map(v=>Math.pow(v-meanX,2)).reduce((a,b)=>a+b,0) *
    y.map(v=>Math.pow(v-meanY,2)).reduce((a,b)=>a+b,0)
  );
  return den ? num/den : 0;
}

// RGB sampling (grid)
function sampleRGB(n=10){
  const samples = [];
  for(let i=0;i<n;i++){
    for(let j=0;j<n;j++){
      for(let k=0;k<n;k++){
        samples.push([i*255/(n-1), j*255/(n-1), k*255/(n-1)]);
      }
    }
  }
  return samples;
}

const samples = sampleRGB(10);

function computeCorrelations() {
  const table = document.createElement('table');
  const header = document.createElement('tr');
  header.innerHTML = '<th>Space 1 / Space 2</th>' + sliderConfigs.map(c=>c[0]).map(n=>`<th>${n}</th>`).join('');
  table.appendChild(header);

  for (let i = 0; i < sliderConfigs.length; i++) {
    const row = document.createElement('tr');
    const space1 = sliderConfigs[i][0];
    row.innerHTML = `<th>${space1}</th>`;
    for (let j = 0; j < sliderConfigs.length; j++) {
      const space2 = sliderConfigs[j][0];
      const vals1 = [], vals2 = [];

      samples.forEach(s=>{
        let rgb = s;
        let out1 = (space1==='rgb') ? rgb : window[space1+'ToRgb'] ? window[space1+'ToRgb'](...s) : window['rgbTo'+space1.charAt(0).toUpperCase()+space1.slice(1)](...rgb);
        let out2 = (space2==='rgb') ? rgb : window[space2+'ToRgb'] ? window[space2+'ToRgb'](...s) : window['rgbTo'+space2.charAt(0).toUpperCase()+space2.slice(1)](...rgb);
        // Flatten all 3 channels
        for(let k=0;k<3;k++){
          vals1.push(out1[k]);
          vals2.push(out2[k]);
        }
      });

      const c = corr(vals1, vals2);
      const cell = document.createElement('td');
      cell.textContent = c.toFixed(2);
      cell.style.backgroundColor = corrColor(c);
      row.appendChild(cell);
    }
    table.appendChild(row);
  }
  document.getElementById('table-container').appendChild(table);
}
