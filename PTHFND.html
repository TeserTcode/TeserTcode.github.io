function ogdircng(ogdir, dir, x, y) {
  if (ogdir === 1) {
    switch (dir) {
      case 1:
        dir = 4;
        break;
      case 4:
        dir = 2;
        break;
      case 2:
        y--;
        break;
    }
  }
  if (ogdir === 2) {
    switch (dir) {
      case 2:
        dir = 1;
        break;
      case 1:
        dir = 3;
        break;
      case 3:
        x--;
        break;
    }
  }
  if (ogdir === 3) {
    switch (dir) {
      case 3:
        dir = 2;
        break;
      case 2:
        dir = 4;
        break;
      case 4:
        y++;
        break;
    }
  }
  if (ogdir === 4) {
    switch (dir) {
      case 4:
        dir = 3;
        break;
      case 3:
        dir = 1;
        break;
      case 1:
        x++;
        break;
    }
  }
  return { dir, x, y };
}

      }

  }
