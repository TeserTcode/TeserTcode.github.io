<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Young Diagram Growth Graph</title>
  <script src="https://unpkg.com/vis-network/standalone/umd/vis-network.min.js"></script>
  <style>
    body { font-family: Arial, sans-serif; }
    #network { width: 100%; height: 90vh; border: 1px solid #ccc; }
    #controls { margin-bottom: 10px; }
    .box {
      display: inline-block;
      width: 20px;
      height: 20px;
      margin: 1px;
      background: lightblue;
      border: 1px solid #444;
    }
  </style>
</head>
<body>

<h2>Young Diagram Growth Graph</h2>
<div id="controls">
  <label>Target Shape (comma-separated row lengths): 
    <input type="text" id="shapeInput" value="3,2,1" size="15" />
  </label>
  <button onclick="generateGraph()">Build Growth Graph</button>
</div>

<div id="network"></div>

<script>
function parseShape(input) {
  return input.split(",").map(x => parseInt(x.trim())).filter(x => !isNaN(x));
}

function shapeKey(rows) {
  return rows.join(",");
}

function clone(rows) {
  return [...rows];
}

function validAdditions(shape, current) {
  const results = [];
  for (let r = 0; r < shape.length; r++) {
    if ((current[r] || 0) < shape[r]) {
      const next = clone(current);
      next[r] = (next[r] || 0) + 1;
      // Must remain weakly decreasing
      if (r === 0 || next[r - 1] >= next[r]) {
        results.push(next);
      }
    }
  }
  return results;
}

function generateGraph() {
  const shape = parseShape(document.getElementById("shapeInput").value);
  const visited = new Map();
  const nodes = [], edges = [];
  let idCounter = 1;

  function dfs(current) {
    const key = shapeKey(current);
    if (visited.has(key)) return visited.get(key);
    const id = idCounter++;
    visited.set(key, id);

    // Label is visual box layout
    const label = current.map(r => "■".repeat(r)).join("\n") || "∅";
    nodes.push({ id, label, shape: "box", font: {align: 'left'} });

    for (const next of validAdditions(shape, current)) {
      const toId = dfs(next);
      edges.push({ from: id, to: toId, arrows: "to" });
    }

    return id;
  }

  dfs([]); // start from empty diagram

  const container = document.getElementById("network");
  const data = {
    nodes: new vis.DataSet(nodes),
    edges: new vis.DataSet(edges)
  };
  const options = {
    layout: { hierarchical: { direction: "UD", sortMethod: "directed" } },
    physics: false,
    nodes: { margin: 5 }
  };
  const network = new vis.Network(container, data, options);
}
</script>

</body>
</html>
