<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>2048 Extended</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
:root {
    --tile-radius: 0px;
}

body {
    text-align: center;
    background: url('2048bg.png') no-repeat center center fixed;
    background-size: 100vw 100vh;
    font-family: Arial, sans-serif;
    user-select: none;
}

#topbar {
    display: flex;
    justify-content: space-between;
    width: fit-content;
    margin: 12px auto;
    gap: 0px;
}

.scorebox {
    display: inline-block;
            width: 256px;
            margin: 10px 0;
            font-size: 24px;
            background: #ebb467;
            background-image: -webkit-linear-gradient(top, #00ffdd, #00ddff);
            background-image: -moz-linear-gradient(top, #00ffdd, #00ddff);
            background-image: -ms-linear-gradient(top, #00ffdd, #00ddff);
            background-image: -o-linear-gradient(top, #00ffdd, #00ddff);
            background-image: linear-gradient(to bottom, #00ffdd, #00ddff);
            -webkit-border-radius: 0;
            -moz-border-radius: 0;
            border-radius: 0px;
            -webkit-box-shadow: 0px 1px 3px #666666;
            -moz-box-shadow: 0px 1px 3px #666666;
            box-shadow: 0px 1px 3px #666666;
            font-family: Arial;
            color: #000000;
            padding: 10px 5px;
            border: solid #000000 2px;
            text-decoration: none;
}

#board-wrap {
    display: inline-block;
    background: #555;          /* darker grey */
}

table {
    border-collapse: collapse;
    background: #fff;
}

td {
    padding: 0;
    font-size: 0px;
}
h1 {
color:white
}
img.tile {
font-size: 1px;
    width: 96px;
    height: 96px;
    border: 2px solid #000;
    border-radius: var(--tile-radius);
    background: white;
    transition: transform 0.18s ease;
}

img.spawn {
    animation: spawn 0.22s ease-out;
}

@keyframes spawn {
    from { transform: scale(0); }
    to   { transform: scale(1); }
}

#gameover {
    display: none;
    font-size: 48px;
    font-weight: bold;
    color: red;
    margin-top: 20px;
}

button, select, input {
   margin: 20px auto;
            max-width: 800px;
            background-color: rgba(255, 255, 255, 0.8);
            padding: 5px;
            border-radius: 10px;
 opacity: 1;
}

#options {
 
   
background-image: -webkit-linear-gradient(top, rgba(52, 217, 214, 0.5), rgba(43, 184, 90, 0.5));
background-image: -moz-linear-gradient(top, rgba(52, 217, 214, 0.5), rgba(43, 184, 90, 0.5));
background-image: -ms-linear-gradient(top, rgba(52, 217, 214, 0.5), rgba(43, 184, 90, 0.5));
background-image: -o-linear-gradient(top, rgba(52, 217, 214, 0.5), rgba(43, 184, 90, 0.5));
background-image: linear-gradient(to bottom, rgba(52, 217, 214, 0.5), rgba(43, 184, 90, 0.5));
            -webkit-border-radius: 26;
            -moz-border-radius: 26;
            border-radius: 26px;
            font-family: Georgia;
            color: #000000;
            font-size: 30px;
            padding: 5px 10px 5px 10px;
            text-decoration: none;
            margin: 1px;
}
</style>
</head>

<body>

<h1>2048</h1>

<div id="topbar">
    <div class="scorebox" id="score">Score: 0</div>
    <div class="scorebox" id="hiscore">Top: 0</div>
</div>

<div id="board-wrap">
    <table id="board"></table>
</div>

<div id="gameover">Ultraskill issue</div>

<div>
    <button onclick="toggleOptions()">Options</button>
</div>

<div id="options">

    <div>
        <b>Board size:</b>
        <input id="nVal" type="number" value="4" min="2" max="10"> ×
        <input id="mVal" type="number" value="4" min="2" max="10">
        <button onclick="customBoard()">Apply</button>
    </div>

    <div>
        <button onclick="loadBoard(generateBoard(3,3))">3×3</button>
        <button onclick="loadBoard(generateBoard(4,4))">4×4</button>
        <button onclick="loadBoard(generateBoard(5,5))">5×5</button>
        <button onclick="loadBoard(generateBoard(3,5))">3×5</button>
        <button onclick="loadBoard(donutBoard())">Donut</button>
    </div>

    <div>
        <b>Theme:</b>
        <select onchange="setTheme(this.value)">
            <option>classic</option>
            <option>basee</option>
            <option>itlq</option>
            <option>lv</option>
            <option>tesert</option>
            <option>tesertold</option>
            <option>tre</option>
        </select>
    </div>

    <div>
        <b>Corners:</b>
        <button onclick="setCorners('square')">Square</button>
        <button onclick="setCorners('soft')">Soft</button>
        <button onclick="setCorners('round')">Round</button>
        <button onclick="setCorners('circle')">Circle</button>
        <button onclick="setCorners('chamfer')">Chamfer</button>
        <button onclick="setCorners('super')">Super</button>
    </div>

    <div>
        <button onclick="saveState()">Save</button>
        <button onclick="loadState()">Load</button>
        <button onclick="retry()">Retry</button>
    </div>

</div>

<script>
/* ===== STATE ===== */
let n=4,m=4,board=[],active=[],moveRules={},score=0,hiscore=0;
let lastMoves=[],theme="classic",spawnQueue=[],animating=false;

const table=document.getElementById("board");
const scoreBox=document.getElementById("score");
const hiBox=document.getElementById("hiscore");
const gameOver=document.getElementById("gameover");

/* ===== IMAGE ===== */
function imgPath(v){
    if(v===-1)return `2048tiles/${theme}/-1.png`;
    return `2048tiles/${theme}/${v}.png`;
}

/* ===== BOARD GEN ===== */
function generateBoard(N,M,holes=[]){
    const L=Array(N*M).fill(1);
    holes.forEach(h=>L[h]=0);
    const Mv={W:[],A:[],S:[],D:[]};

    for(let c=0;c<M;c++){
        let col=[];
        for(let r=0;r<N;r++){const i=r*M+c;if(L[i])col.push(i);}
        if(col.length){Mv.W.push(col);Mv.S.push(col.slice().reverse());}
    }
    for(let r=0;r<N;r++){
        let row=[];
        for(let c=0;c<M;c++){const i=r*M+c;if(L[i])row.push(i);}
        if(row.length){Mv.A.push(row);Mv.D.push(row.slice().reverse());}
    }
    return {n:N,m:M,L,Mv};
}

function donutBoard(){
    return generateBoard(5,5,[6,7,8,11,12,13,16,17,18]);
}

/* ===== LOAD ===== */
function loadBoard(cfg){
    n=cfg.n;m=cfg.m;active=cfg.L;moveRules=cfg.Mv;
    board=Array.from({length:n},()=>Array(m).fill(0));
    score=0;
    retry();
}

function draw(spawned=[]){
    table.innerHTML="";
    for(let r=0;r<n;r++){
        const tr=document.createElement("tr");
        for(let c=0;c<m;c++){
            const td=document.createElement("td");
            const img=document.createElement("img");
            img.className="tile";
            const i=r*m+c;
            img.dataset.index=i;
            img.src=active[i]?imgPath(board[r][c]):imgPath(-1);
            if(spawned.includes(i))img.classList.add("spawn");
            td.appendChild(img);
            tr.appendChild(td);
        }
        table.appendChild(tr);
    }
    scoreBox.textContent="Score: "+score;
    hiBox.textContent="Top: "+hiscore;
}

/* ===== GAME ===== */
function findEmpty(){
    const e=[];
    for(let i=0;i<n*m;i++){
        if(active[i]){
            const r=i/m|0,c=i%m;
            if(board[r][c]===0)e.push(i);
        }
    }
    return e;
}

function queueSpawn(){
    const e=findEmpty();
    if(!e.length)return;
    spawnQueue.push(e[Math.random()*e.length|0]);
}

function applySpawns(){
    const spawned=[];
    spawnQueue.forEach(i=>{
        board[i/m|0][i%m]=Math.random()<0.9?1:2;
        spawned.push(i);
    });
    spawnQueue=[];
    draw(spawned);
}

function performMove(dir){
    if(animating)return;
    gameOver.style.display="none";
    lastMoves=[];
    let moved=false;
    const merged=Array.from({length:n},()=>Array(m).fill(false));

    for(const seq of moveRules[dir]){
        for(let i=1;i<seq.length;i++){
            const from=seq[i];
            let r=from/m|0,c=from%m;
            if(!board[r][c])continue;
            let val=board[r][c],j=i-1;
            while(j>=0){
                const to=seq[j];
                let tr=to/m|0,tc=to%m;
                if(board[tr][tc]===0)j--;
                else if(board[tr][tc]===val&&!merged[tr][tc]){
                    board[tr][tc]++;board[r][c]=0;
                    merged[tr][tc]=true;
                    score+=2**board[tr][tc];
                    hiscore=Math.max(hiscore,score);
                    lastMoves.push({from,to});
                    moved=true;break;
                }else break;
            }
            if(j!==i-1&&board[r][c]){
                const to=seq[j+1];
                board[to/m|0][to%m]=board[r][c];
                board[r][c]=0;
                lastMoves.push({from,to});
                moved=true;
            }
        }
    }

    if(!moved){
        if(!movesAvailable())gameOver.style.display="block";
        return;
    }

    queueSpawn();
    animating=true;
    draw();
    animateMoves(()=>{applySpawns();animating=false;});
}

/* ===== ANIM ===== */
function animateMoves(done){
    let left=lastMoves.length;
    if(!left){done();return;}
    lastMoves.forEach(mv=>{
        const to=document.querySelector(`img[data-index="${mv.to}"]`);
        const dx=(mv.from%m-mv.to%m)*96;
        const dy=((mv.from/m|0)-(mv.to/m|0))*96;
        to.style.transform=`translate(${dx}px,${dy}px)`;
        requestAnimationFrame(()=>{
            to.style.transform="translate(0,0)";
            setTimeout(()=>{if(--left===0)done();},180);
        });
    });
}

/* ===== UTILS ===== */
function movesAvailable(){
    if(findEmpty().length)return true;
    for(let r=0;r<n;r++)for(let c=0;c<m;c++){
        if(c+1<m&&board[r][c]===board[r][c+1])return true;
        if(r+1<n&&board[r][c]===board[r+1][c])return true;
    }
    return false;
}

function retry(){board.forEach(r=>r.fill(0));queueSpawn();queueSpawn();applySpawns();}
function setTheme(t){theme=t;draw();}
function setCorners(t){
    if(t==="square")css(0);
    if(t==="soft")css(10);
    if(t==="round")css(22);
    if(t==="circle")css(48);
    if(t==="chamfer")document.documentElement.style.setProperty("--tile-radius","12px 0");
    if(t==="super")document.documentElement.style.setProperty("--tile-radius","35%");
}
function css(v){document.documentElement.style.setProperty("--tile-radius",v+"px");}
function customBoard(){
    const N=+nVal.value,M=+mVal.value;
    if(N>=2&&M>=2)loadBoard(generateBoard(N,M));
}
function toggleOptions(){
    options.style.display=options.style.display==="none"?"block":"none";
}

/* ===== SAVE ===== */
function saveState(){
    localStorage.setItem("2048save",JSON.stringify({n,m,board,active,moveRules,score,hiscore,theme}));
}
function loadState(){
    const s=JSON.parse(localStorage.getItem("2048save"));
    if(!s)return;
    ({n,m,board,active,moveRules,score,hiscore,theme}=s);
    draw();
}

/* ===== INPUT ===== */
document.addEventListener("keydown",e=>{
    const k=e.key.toLowerCase();
    if(k==="arrowup"||k==="w")performMove("W");
    if(k==="arrowdown"||k==="s")performMove("S");
    if(k==="arrowleft"||k==="a")performMove("A");
    if(k==="arrowright"||k==="d")performMove("D");
    
});

loadBoard(generateBoard(4,4));
</script>

</body>
</html>
