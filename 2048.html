<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>2048 Extended</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
:root {
    --tile-radius: 0px;
    --anim-speed: 0.18s;
    --anim-ease: ease;
}

body {
    text-align: center;
    /* Fixed: Stretch bg to cover full scrollable height */
    background: url('2048bg.png') no-repeat center center;
    background-size: cover;
    background-attachment: fixed;
    min-height: 100vh;
    margin: 0;
    font-family: Arial, sans-serif;
    user-select: none;
    -webkit-user-select: none;
}

#topbar {
    display: flex;
    justify-content: space-between;
    width: fit-content;
    margin: 12px auto;
    gap: 10px;
}

.scorebox {
    display: inline-block;
    min-width: 120px;
    margin: 10px 0;
    font-size: 20px;
    background: #ebb467;
    background-image: linear-gradient(to bottom, #00ffdd, #00ddff);
    box-shadow: 0px 1px 3px #666666;
    font-family: Arial;
    color: #000000;
    padding: 10px 15px;
    border: solid #000000 2px;
    font-weight: bold;
}

#board-wrap {
    display: inline-block;
    background: #555; /* darker grey */
    padding: 10px;
    border-radius: 10px;
}

table {
    border-collapse: separate;
    border-spacing: 0;
    background: transparent;
}

td {
    padding: 2px;
    font-size: 0px;
    width: 96px;
    height: 96px;
}

h1 {
    color: white;
    text-shadow: 2px 2px 4px #000;
    margin: 10px 0;
}

/* Tile styling */
.tile-container {
    width: 96px;
    height: 96px;
    display: flex;
    justify-content: center;
    align-items: center;
    position: relative;
}

img.tile {
    width: 96px;
    height: 96px;
    border: 2px solid #000;
    border-radius: var(--tile-radius);
    background: white;
    /* Updated to use variables for speed/ease */
    transition: transform var(--anim-speed) var(--anim-ease);
    box-sizing: border-box;
    display: block;
}

/* Fallback styling for missing images */
.text-tile {
    width: 96px;
    height: 96px;
    border: 2px solid #666;
    border-radius: var(--tile-radius);
    background: #000;
    color: #fff;
    font-size: 32px;
    font-weight: bold;
    display: flex;
    justify-content: center;
    align-items: center;
    box-sizing: border-box;
    transition: transform var(--anim-speed) var(--anim-ease);
}

img.spawn, .text-tile.spawn {
    animation: spawn 0.22s ease-out;
}

/* Invisible holes for non-square boards */
.hole {
    opacity: 0;
    visibility: hidden;
}

@keyframes spawn {
    from { transform: scale(0); }
    to   { transform: scale(1); }
}

#gameover {
    display: none;
    font-size: 48px;
    font-weight: bold;
    color: red;
    text-shadow: 2px 2px 0px black;
    margin-top: 20px;
}

button, select, input {
    margin: 5px;
    background-color: rgba(255, 255, 255, 0.9);
    padding: 8px 12px;
    border-radius: 6px;
    border: 1px solid #000;
    font-size: 16px;
    cursor: pointer;
}

button:hover {
    background-color: #fff;
}

#options {
    display: none;
    max-width: 600px;
    margin: 20px auto;
    background-image: linear-gradient(to bottom, rgba(52, 217, 214, 0.8), rgba(43, 184, 90, 0.8));
    border-radius: 20px;
    border: 2px solid #000;
    padding: 15px;
    color: #000;
}

#options div {
    margin-bottom: 12px;
    border-bottom: 1px solid rgba(0,0,0,0.2);
    padding-bottom: 8px;
}

/* D-PAD STYLING */
#dpad {
    margin: 20px auto;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 5px;
}
.d-row {
    display: flex;
    gap: 5px;
}
.d-btn {
    width: 60px;
    height: 60px;
    font-size: 24px;
    font-weight: bold;
    background: rgba(255,255,255,0.8);
    border: 2px solid #000;
    border-radius: 10px;
    touch-action: manipulation; /* Improves touch response */
}
.d-btn:active {
    background: #00ffdd;
}

</style>
</head>

<body>

<h1>2048 Extended</h1>

<div id="topbar">
    <div class="scorebox" id="score">Score: 0</div>
    <div class="scorebox" id="hiscore">Top: 0</div>
</div>

<div id="board-wrap">
    <table id="board"></table>
</div>

<div id="gameover">Ultraskill issue</div>

<div id="dpad">
    <div class="d-row">
        <button class="d-btn" onclick="performMove('W')">▲</button>
    </div>
    <div class="d-row">
        <button class="d-btn" onclick="performMove('A')">◀</button>
        <button class="d-btn" onclick="performMove('S')">▼</button>
        <button class="d-btn" onclick="performMove('D')">▶</button>
    </div>
</div>

<div>
    <button onclick="toggleOptions()">⚙ Options</button>
</div>

<div id="options">

    <div>
        <b>Board size:</b>
        <input id="nVal" type="number" value="4" min="2" max="10" style="width:50px"> × 
        <input id="mVal" type="number" value="4" min="2" max="10" style="width:50px">
        <button onclick="customBoard()">Apply</button>
    </div>

    <div>
        <b>Presets:</b><br>
        <button onclick="loadBoard(generateBoard(3,3))">3×3</button>
        <button onclick="loadBoard(generateBoard(4,4))">4×4</button>
        <button onclick="loadBoard(generateBoard(5,5))">5×5</button>
        <button onclick="loadBoard(generateBoard(3,5))">3×5</button>
        <button onclick="loadBoard(donutBoard())">Donut</button>
    </div>

    <div>
        <b>Visuals:</b><br>
        Theme: 
        <select onchange="setTheme(this.value)">
            <option>classic</option>
            <option>basee</option>
            <option>itlq</option>
            <option>lv</option>
            <option>tesert</option>
            <option>tesertold</option>
            <option>tre</option>
        </select>
    </div>

    <div>
        <b>Animation:</b><br>
        Speed: 
        <input type="range" min="50" max="500" value="180" oninput="setAnimSpeed(this.value)"> 
        <span id="speedDisplay">180ms</span><br>
        
        Easing:
        <select onchange="setAnimEase(this.value)">
            <option value="ease">Ease</option>
            <option value="linear">Linear</option>
            <option value="ease-in">Ease In</option>
            <option value="ease-out">Ease Out</option>
            <option value="cubic-bezier(0.68, -0.55, 0.27, 1.55)">Bounce</option>
        </select>
    </div>

    <div>
        <b>Corners:</b><br>
        <button onclick="setCorners('square')">Square</button>
        <button onclick="setCorners('soft')">Soft</button>
        <button onclick="setCorners('round')">Round</button>
        <button onclick="setCorners('circle')">Circle</button>
        <button onclick="setCorners('chamfer')">Chamfer</button>
        <button onclick="setCorners('super')">Super</button>
    </div>

    <div>
        <button onclick="saveState()">Save Game</button>
        <button onclick="loadState()">Load Game</button>
        <button onclick="retry()">Reset</button>
    </div>

</div>

<script>
/* ===== STATE ===== */
let n=4,m=4,board=[],active=[],moveRules={},score=0,hiscore=0;
let lastMoves=[],theme="classic",spawnQueue=[],animating=false;
let animDuration = 180; // Default matches CSS

const table=document.getElementById("board");
const scoreBox=document.getElementById("score");
const hiBox=document.getElementById("hiscore");
const gameOver=document.getElementById("gameover");
const options=document.getElementById("options");

/* ===== IMAGE ===== */
function imgPath(v){
    if(v===-1) return `2048tiles/${theme}/-1.png`;
    return `2048tiles/${theme}/${v}.png`;
}

/* ===== BOARD GEN ===== */
function generateBoard(N,M,holes=[]){
    const L=Array(N*M).fill(1);
    holes.forEach(h=>L[h]=0);
    const Mv={W:[],A:[],S:[],D:[]};

    for(let c=0;c<M;c++){
        let col=[];
        for(let r=0;r<N;r++){const i=r*M+c;if(L[i])col.push(i);}
        if(col.length){Mv.W.push(col);Mv.S.push(col.slice().reverse());}
    }
    for(let r=0;r<N;r++){
        let row=[];
        for(let c=0;c<M;c++){const i=r*M+c;if(L[i])row.push(i);}
        if(row.length){Mv.A.push(row);Mv.D.push(row.slice().reverse());}
    }
    return {n:N,m:M,L,Mv};
}

function donutBoard(){
    return generateBoard(5,5,[6,7,8,11,12,13,16,17,18]);
}

/* ===== LOAD ===== */
function loadBoard(cfg){
    n=cfg.n;m=cfg.m;active=cfg.L;moveRules=cfg.Mv;
    board=Array.from({length:n},()=>Array(m).fill(0));
    score=0;
    retry();
}

/* Updated Draw Function (Handles Holes + Fallback) */
function draw(spawned=[]){
    table.innerHTML="";
    for(let r=0;r<n;r++){
        const tr=document.createElement("tr");
        for(let c=0;c<m;c++){
            const td=document.createElement("td");
            const i=r*m+c;
            
            // Container needed for positioning fallback text
            const div = document.createElement("div");
            div.className = "tile-container";

            // Logic for tile rendering
            if(!active[i]){
                // Invisible Hole
                div.classList.add("hole");
            } else {
                const val = board[r][c];
                // Try to create image
                const img = document.createElement("img");
                img.className = "tile";
                img.dataset.index = i; // For animation targeting
                img.src = active[i] ? imgPath(val) : imgPath(-1);
                
                // Fallback: If image fails, replace with text div
                img.onerror = function() {
                    this.remove(); // Remove broken image
                    const textDiv = document.createElement("div");
                    textDiv.className = "text-tile";
                    textDiv.dataset.index = i;
                    // Calculate 2^val, or empty string if 0/-1
                    textDiv.textContent = val > 0 ? Math.pow(2, val) : "";
                    if(spawned.includes(i)) textDiv.classList.add("spawn");
                    
                    // Style empty cells differently if needed, currently black box
                    if(val === 0) {
                        textDiv.style.background = "#fff"; // White background for empty
                        textDiv.style.border = "2px solid #ccc";
                    }
                    div.appendChild(textDiv);
                };

                if(spawned.includes(i)) img.classList.add("spawn");
                div.appendChild(img);
            }
            
            td.appendChild(div);
            tr.appendChild(td);
        }
        table.appendChild(tr);
    }
    scoreBox.textContent="Score: "+score;
    hiBox.textContent="Top: "+hiscore;
}

/* ===== GAME LOGIC ===== */
function findEmpty(){
    const e=[];
    for(let i=0;i<n*m;i++){
        if(active[i]){
            const r=i/m|0,c=i%m;
            if(board[r][c]===0)e.push(i);
        }
    }
    return e;
}

function queueSpawn(){
    const e=findEmpty();
    if(!e.length)return;
    spawnQueue.push(e[Math.random()*e.length|0]);
}

function applySpawns(){
    const spawned=[];
    spawnQueue.forEach(i=>{
        board[i/m|0][i%m]=Math.random()<0.9?1:2;
        spawned.push(i);
    });
    spawnQueue=[];
    draw(spawned);
}

function performMove(dir){
    if(animating)return;
    gameOver.style.display="none";
    lastMoves=[];
    let moved=false;
    const merged=Array.from({length:n},()=>Array(m).fill(false));

    for(const seq of moveRules[dir]){
        for(let i=1;i<seq.length;i++){
            const from=seq[i];
            let r=from/m|0,c=from%m;
            if(!board[r][c])continue;
            let val=board[r][c],j=i-1;
            while(j>=0){
                const to=seq[j];
                let tr=to/m|0,tc=to%m;
                if(board[tr][tc]===0)j--;
                else if(board[tr][tc]===val&&!merged[tr][tc]){
                    board[tr][tc]++;board[r][c]=0;
                    merged[tr][tc]=true;
                    score+=2**board[tr][tc];
                    hiscore=Math.max(hiscore,score);
                    lastMoves.push({from,to});
                    moved=true;break;
                }else break;
            }
            if(j!==i-1&&board[r][c]){
                const to=seq[j+1];
                board[to/m|0][to%m]=board[r][c];
                board[r][c]=0;
                lastMoves.push({from,to});
                moved=true;
            }
        }
    }

    if(!moved){
        if(!movesAvailable())gameOver.style.display="block";
        return;
    }

    queueSpawn();
    animating=true;
    draw(); // Updates board state in DOM (tiles jump to new pos)
    // Actually, simple draw() makes them jump instantly. 
    // We need to reverse-animate them for the slide effect, or use FLIP.
    // The previous code used a simple translation hack. Let's fix targeting.
    animateMoves(()=>{applySpawns();animating=false;});
}

/* ===== ANIMATION ===== */
function animateMoves(done){
    let left=lastMoves.length;
    if(!left){done();return;}
    
    // Logic: Tiles have been drawn at DESTINATION. 
    // We visually move them from SOURCE to DESTINATION relative to their current spot.
    // Wait... the previous code did: move TO, translate BACK, then ease to 0.
    
    lastMoves.forEach(mv=>{
        // Targeted by dataset-index. Note: If merged, we might be animating the "result" tile
        // This simple animation logic doesn't visually handle merges perfectly (2 tiles moving to 1 spot)
        // But keeps existing logic structure.
        
        // Find the element currently at the 'to' index
        // Since we redrew, the tile at 'to' is the one we want to animate coming FROM 'from'.
        const targetEl = document.querySelector(`img[data-index="${mv.to}"], .text-tile[data-index="${mv.to}"]`);
        
        if(targetEl){
            const dx=(mv.from%m-mv.to%m)*96;
            const dy=((mv.from/m|0)-(mv.to/m|0))*96;
            
            // Remove transition to set initial position instantly
            targetEl.style.transition = 'none';
            targetEl.style.transform=`translate(${dx}px,${dy}px)`;
            
            // Force reflow
            targetEl.offsetHeight; 
            
            // Enable transition and move to 0
            targetEl.style.transition = `transform var(--anim-speed) var(--anim-ease)`;
            targetEl.style.transform="translate(0,0)";
        }
    });

    // Wait for Animation Duration
    setTimeout(()=>{
        done();
    }, animDuration);
}

/* ===== UTILS & UI ===== */
function movesAvailable(){
    if(findEmpty().length)return true;
    for(let r=0;r<n;r++)for(let c=0;c<m;c++){
        if(c+1<m&&board[r][c]===board[r][c+1])return true;
        if(r+1<n&&board[r][c]===board[r+1][c])return true;
    }
    return false;
}

function retry(){board.forEach(r=>r.fill(0));queueSpawn();queueSpawn();applySpawns();}
function setTheme(t){theme=t;draw();}

function setCorners(t){
    if(t==="square")css(0);
    if(t==="soft")css(10);
    if(t==="round")css(22);
    if(t==="circle")css(48);
    if(t==="chamfer")document.documentElement.style.setProperty("--tile-radius","12px 0");
    if(t==="super")document.documentElement.style.setProperty("--tile-radius","35%");
}
function css(v){document.documentElement.style.setProperty("--tile-radius",v+"px");}

/* Animation Config */
function setAnimSpeed(ms){
    animDuration = +ms;
    document.documentElement.style.setProperty("--anim-speed", ms+"ms");
    document.getElementById("speedDisplay").textContent = ms+"ms";
}
function setAnimEase(e){
    document.documentElement.style.setProperty("--anim-ease", e);
}

function customBoard(){
    const N=+nVal.value,M=+mVal.value;
    if(N>=2&&M>=2)loadBoard(generateBoard(N,M));
}
function toggleOptions(){
    options.style.display=options.style.display==="none"?"block":"none";
}

/* ===== SAVE ===== */
function saveState(){
    localStorage.setItem("2048save",JSON.stringify({n,m,board,active,moveRules,score,hiscore,theme}));
    alert("Saved!");
}
function loadState(){
    const s=JSON.parse(localStorage.getItem("2048save"));
    if(!s)return;
    ({n,m,board,active,moveRules,score,hiscore,theme}=s);
    draw();
}

/* ===== INPUT ===== */
document.addEventListener("keydown",e=>{
    const k=e.key.toLowerCase();
    if(["arrowup","w"].includes(k)){ e.preventDefault(); performMove("W"); }
    if(["arrowdown","s"].includes(k)){ e.preventDefault(); performMove("S"); }
    if(["arrowleft","a"].includes(k)){ e.preventDefault(); performMove("A"); }
    if(["arrowright","d"].includes(k)){ e.preventDefault(); performMove("D"); }
});

// Initialize
loadBoard(generateBoard(4,4));
</script>

</body>
</html>
