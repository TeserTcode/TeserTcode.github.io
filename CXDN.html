function applyPreset(val) {

    document.getElementById('vef').value = "V: "+vertCount+" E: "+leng(edgeIndices)+" F:"+facecount;

function parseCDString() {
    const str = document.getElementById('cdString').value.trim().toLowerCase();
    if (!str) return;

    const realNodes = str.match(/[xos]/g) || [];
    const dim = realNodes.length;
    if (dim < 1) return;

    N = dim;
    dimNInput.value = N;
    resizeMatrix(); 

    let matrix = Array.from({ length: N }, (_, i) => 
        Array.from({ length: N }, (_, j) => (i === j ? 1 : 2))
    );
    let decorations = new Array(N).fill(0);

    const nodeMap = "abcdefghijklmnopqrstuvwxyz";
    let nodeIndex = -1; 
    let i = 0;
    
    // We need to track where the NEXT node should connect to.
    // Usually it's the previous node, but after a * pointer, it's the pointer target.
    let connectionSource = -1; 

    while (i < str.length) {
        let char = str[i];

        // --- CASE 1: Real Node (x, o, s) ---
        if (/[xos]/.test(char)) {
            nodeIndex++;
            decorations[nodeIndex] = (char === 'x' ? 1 : (char === 's' ? 2 : 0));
            
            // Connect to the source (either previous node or a * branch point)
            if (connectionSource >= 0 && nodeIndex < N) {
                // If a branch value wasn't already set by a number, default to 3
                if (matrix[nodeIndex][connectionSource] === 2) {
                    matrix[nodeIndex][connectionSource] = matrix[connectionSource][nodeIndex] = 3;
                }
            }
            
            // By default, the next node will connect to THIS node
            connectionSource = nodeIndex;
            i++;
        }
        // --- CASE 2: Branch Value (3, 4, 5/2, etc.) ---
        else if (/[0-9]/.test(char)) {
            let start = i;
            while (i < str.length && /[0-9\/.]/.test(str[i])) i++;
            let val = eval(str.substring(start, i));

            // Set the link for the UPCOMING node
            if (connectionSource >= 0 && nodeIndex + 1 < N) {
                matrix[connectionSource][nodeIndex + 1] = matrix[nodeIndex + 1][connectionSource] = val;
            }
        }
        // --- CASE 3: Pointer / Loop (*c) ---
        else if (char === '*') {
            i++; 
            let targetChar = str[i];
            let targetIdx = nodeMap.indexOf(targetChar);
            i++;

            if (targetIdx >= 0 && targetIdx < N) {
                // Update the connection source! 
                // The NEXT node will now sprout from the targetIdx instead of the current nodeIndex.
                connectionSource = targetIdx;

                // If a branch value follows the asterisk (e.g. *c3), apply it to that future link
                if (i < str.length && /[0-9]/.test(str[i])) {
                    let start = i;
                    while (i < str.length && /[0-9\/.]/.test(str[i])) i++;
                    let val = eval(str.substring(start, i));
                    if (nodeIndex + 1 < N) {
                        matrix[targetIdx][nodeIndex + 1] = matrix[nodeIndex + 1][targetIdx] = val;
                    }
                }
            }
        }
        else {
            i++;
        }
    }

    // Sync to UI
    for (let r = 0; r < N; r++) {
        document.getElementById(`d${r}`).value = decorations[r];
        for (let c = 0; c < N; c++) {
            document.getElementById(`m${r}${c}`).value = matrix[r][c];
        }
    }
    generate();
}
function parseBranch(b) {
    if (b.includes('/')) {
        let parts = b.split('/');
        return parseFloat(parts[0]) / parseFloat(parts[1]);
    }
    return parseFloat(b) || 3;
}

function updateUIFromParsed(dim, nodes, connections) {
    // Set Dimension
    N = dim;
    dimNInput.value = N;
    resizeMatrix(); // This clears the table and builds inputs

    // Fill Decoration
    nodes.forEach((n, i) => {
        let decoVal = (n.type === 'x') ? 1 : (n.type === 's' ? 2 : 0);
        document.getElementById(`d${i}`).value = decoVal;
    });

    // Fill Matrix
    // Default matrix is already 1s on diag and 2s elsewhere from resizeMatrix()
    connections.forEach(c => {
        if (c.from < N && c.to < N) {
            document.getElementById(`m${c.from}${c.to}`).value = c.val;
            document.getElementById(`m${c.to}${c.from}`).value = c.val;
        }
    });

    generate();
}



// --------------------------------------------------------------------
// Robust shader compilation and program linking
function createProgram(vsSrc, fsSrc) {
  const vs = gl.createShader(gl.VERTEX_SHADER);
  gl.shaderSource(vs, vsSrc);
  gl.compileShader(vs);
  if (!gl.getShaderParameter(vs, gl.COMPILE_STATUS)) {
    console.error('Vertex shader compilation failed:', gl.getShaderInfoLog(vs));
    gl.deleteShader(vs);
    return null;
  }

  const fs = gl.createShader(gl.FRAGMENT_SHADER);
  gl.shaderSource(fs, fsSrc);
  gl.compileShader(fs);
  if (!gl.getShaderParameter(fs, gl.COMPILE_STATUS)) {
    console.error('Fragment shader compilation failed:', gl.getShaderInfoLog(fs));
    gl.deleteShader(vs);
    gl.deleteShader(fs);
    return null;
  }

  const prog = gl.createProgram();
  gl.attachShader(prog, vs);
  gl.attachShader(prog, fs);
  gl.linkProgram(prog);
  if (!gl.getProgramParameter(prog, gl.LINK_STATUS)) {
    console.error('Program linking failed:', gl.getProgramInfoLog(prog));
    gl.deleteProgram(prog);
    gl.deleteShader(vs);
    gl.deleteShader(fs);
    return null;
  }

  gl.detachShader(prog, vs);
  gl.detachShader(prog, fs);
  gl.deleteShader(vs);
  gl.deleteShader(fs);

  return prog;
}

// --------------------------------------------------------------------
// Shaders
const vsTri = `#version 300 es
in vec3 a_pos;
in vec3 a_normal;
in vec3 a_color;
uniform float rx;
uniform float ry;
uniform float zoom;
uniform float d;
uniform float aspect;
uniform float aa;
out vec3 v_color;
out vec3 v_normal;
vec3 rotX(vec3 p,float a){ float c=cos(a),s=sin(a); return vec3(p.x, p.y*c-p.z*s, p.y*s+p.z*c); }
vec3 rotY(vec3 p,float a){ float c=cos(a),s=sin(a); return vec3(p.x*c+p.z*s, p.y, -p.x*s+p.z*c); }
void main(){

    for (let j = 0; j < N; j++) {
      let el = document.getElementById(`m${i}${j}`).value;
      row.push(parseFloat(el) || 1);
    }
    M.push(row);
  }

  // Read decoration
  let D = [];
  for (let i = 0; i < N; i++) {
    let el = document.getElementById(`d${i}`).value;
    D.push(parseFloat(el) || 0);
  }

  // Generate N‑D vertices (external library)
  vertsND = verticesfromcoxeter(M, D);
	
  // Build edges & faces
  const { edges: edgeBuf, edgeIndices: newEdges } = buildEdges(vertsND);
  edgeIndices = newEdges;
  computeFaces = makeFaceFinder(edgeIndices,vertsND);

  // Apply ND rotation
  let rotatedND = vertsND.map(v => rotateND(v, ndAngles));

  // Project to 3D
  verts3D = rotatedND.map(projectND);

  // Re‑build edge buffer with projected vertices
  let edgeBufProj = [];
  if(isedge)
  for (let [a,b] of edgeIndices) {
    if (a >= verts3D.length || b >= verts3D.length) continue;
    edgeBufProj.push(...verts3D[a], ...verts3D[b]);
  }

  if (triBatches.length) {
    triBatches.forEach(b => gl.deleteVertexArray(b.vao));
    triBatches = [];
  }

  // Compute faces (existing)
  faces = computeFaces(rotatedND);

  // Upload (now asynchronous)
  upload(new Float32Array(edgeBufProj));
  applyvef(); // if needed
  
  
}

// --------------------------------------------------------------------
// Cache for triangulation results
const triangulationCache = new Map();
// Global storage for triangle batches
let triBatches = []; // each element: { vao, count, blendMode? }

// Modified upload function (now async via setTimeout)
function upload(edgeBuffer) {
  const newEdgeProg = createProgram(vsEdge, fsEdge);
  const newTriProg = createProgram(vsTri, fsTri);
  
  if (!newTriProg || !newEdgeProg) {
    console.warn('Shader compilation failed, keeping previous programs');
    draw();
    return;
  }

  // Delete old programs and VAOs
  if (triProgram) gl.deleteProgram(triProgram);
  if (edgeProgram) gl.deleteProgram(edgeProgram);
  triProgram = newTriProg;
  edgeProgram = newEdgeProg;

  gl.enable(gl.BLEND);
  gl.blendFunc(blendMode.src, blendMode.dst);
  gl.enable(gl.DEPTH_TEST);
  gl.disable(gl.CULL_FACE);
  
  // Delete old triangle VAOs
  if (triBatches.length) {
    triBatches.forEach(b => gl.deleteVertexArray(b.vao));
    triBatches = [];
  }
  if (triVAO) gl.deleteVertexArray(triVAO); // old single VAO
  triVAO = null; // not used anymore

  // Setup edge VAO (unchanged)
  if (edgeVAO) gl.deleteVertexArray(edgeVAO);
  edgeVAO = gl.createVertexArray();
  gl.bindVertexArray(edgeVAO);
  if (isedge && edgeBuffer.length) {
    let loc = gl.getAttribLocation(edgeProgram, "a_pos");
    if (loc !== -1) {
      let buf = gl.createBuffer();
      gl.bindBuffer(gl.ARRAY_BUFFER, buf);
      gl.bufferData(gl.ARRAY_BUFFER, edgeBuffer, gl.STATIC_DRAW);
      gl.enableVertexAttribArray(loc);
      gl.vertexAttribPointer(loc, 3, gl.FLOAT, false, 0, 0);
    }
  }
  edgeCount = edgeBuffer.length / 3;

  // Setup vertex VAO (unchanged)
  let vertBuffer = [];
  for (let v of verts3D) {
    vertBuffer.push(v[0], v[1], v[2]);
  }
  vertCount = vertBuffer.length / 3;
  if (vertVAO) gl.deleteVertexArray(vertVAO);
  vertVAO = gl.createVertexArray();
  gl.bindVertexArray(vertVAO);
  let locv = gl.getAttribLocation(edgeProgram, "a_pos");
  if (locv !== -1 && vertBuffer.length) {
    let buf = gl.createBuffer();
    gl.bindBuffer(gl.ARRAY_BUFFER, buf);
    gl.bufferData(gl.ARRAY_BUFFER, new Float32Array(vertBuffer), gl.STATIC_DRAW);
    gl.enableVertexAttribArray(locv);
    gl.vertexAttribPointer(locv, 3, gl.FLOAT, false, 0, 0);
  }

  // Start asynchronous batch processing of faces
  const BATCH_SIZE = 10000; // faces per batch
  let faceIndex = 0;
  const totalFaces = faces.length;

  function processNextBatch() {
    if (faceIndex >= totalFaces) {
      // All batches done – draw once more to ensure final image
      draw();
      return;
    }

    const batchEnd = Math.min(faceIndex + BATCH_SIZE, totalFaces);
    const batchFaces = faces.slice(faceIndex, batchEnd);

    // Build triangle data for this batch
    let pos = [], norm = [], col = [];

    for (let f of batchFaces) {
      let faceVerts = vectormap(x => projectND(x), f);
      if (faceVerts.length < 3) continue;

      // Compute center
      let center = [0, 0, 0];
      faceVerts.forEach(v => {
        center[0] += v[0];
        center[1] += v[1];
        center[2] += v[2];
      });
      center = center.map(c => c / faceVerts.length);

      // Compute normal (Newell method)
      let normal = [0, 0, 0];
      for (let i = 0; i < faceVerts.length; i++) {
        let current = faceVerts[i];
        let next = faceVerts[(i + 1) % faceVerts.length];
        normal[0] += (current[1] - next[1]) * (current[2] + next[2]);
        normal[1] += (current[2] - next[2]) * (current[0] + next[0]);
        normal[2] += (current[0] - next[0]) * (current[1] + next[1]);
      }
      let len = Math.sqrt(normal[0]*normal[0] + normal[1]*normal[1] + normal[2]*normal[2]);
      if (len > 1e-6) {
        normal = normal.map(c => c / len);
      } else {
        normal = [0, 0, 1];
      }

      // Generate triangles
      for (let i = 0; i < faceVerts.length; i++) {
        let a = faceVerts[i];
        let b = faceVerts[(i + 1) % faceVerts.length];
        // Triangle: center, a, b
        pos.push(...center, ...a, ...b);
        norm.push(...normal, ...normal, ...normal);

        // Color (same as original)
        let k = f.length;
        let color = [
          ((k * (rk || 1) + center[0] * 1) % 255) / 255 + 0.1,
          ((k * (gk || 2) + center[1] * 1) % 255) / 255 + 0.1,
          ((k * (bk || 3) + center[2] * 1) % 255) / 255 + 0.1,
          0.5
        ].map(v => v * (lll || 1));
        col.push(...color, ...color, ...color);
      }
    }

    // Create VAO for this batch
    const vao = gl.createVertexArray();
    gl.bindVertexArray(vao);

    // Positions
    let loc = gl.getAttribLocation(triProgram, "a_pos");
    if (loc !== -1 && pos.length) {
      let buf = gl.createBuffer();
      gl.bindBuffer(gl.ARRAY_BUFFER, buf);
      gl.bufferData(gl.ARRAY_BUFFER, new Float32Array(pos), gl.STATIC_DRAW);
      gl.enableVertexAttribArray(loc);
      gl.vertexAttribPointer(loc, 3, gl.FLOAT, false, 0, 0);
    }

    // Normals
    loc = gl.getAttribLocation(triProgram, "a_normal");
    if (loc !== -1 && norm.length) {
      let buf = gl.createBuffer();
      gl.bindBuffer(gl.ARRAY_BUFFER, buf);
      gl.bufferData(gl.ARRAY_BUFFER, new Float32Array(norm), gl.STATIC_DRAW);
      gl.enableVertexAttribArray(loc);
      gl.vertexAttribPointer(loc, 3, gl.FLOAT, false, 0, 0);
    }

    // Colors
    loc = gl.getAttribLocation(triProgram, "a_color");
    if (loc !== -1 && col.length) {
      let buf = gl.createBuffer();
      gl.bindBuffer(gl.ARRAY_BUFFER, buf);
      gl.bufferData(gl.ARRAY_BUFFER, new Float32Array(col), gl.STATIC_DRAW);
      gl.enableVertexAttribArray(loc);
      gl.vertexAttribPointer(loc, 4, gl.FLOAT, false, 0, 0);
    }

    gl.bindVertexArray(null);

    // Store batch info
    triBatches.push({
      vao: vao,
      count: pos.length / 3 // number of vertices (3 per triangle)
    });

    // Update progress (optional)
    faceIndex = batchEnd;
   if(totalFaces>BATCH_SIZE) console.log(`Processed ${faceIndex} / ${totalFaces} faces`);

    // Draw current state (so user sees incremental rendering)
    draw();

    // Schedule next batch (yield to browser)
    setTimeout(processNextBatch, 0);
  }

  // Start first batch
  processNextBatch();
}

// Modified draw function – iterates over all triangle batches
function draw() {
  if (!triProgram || !edgeProgram) return;

  gl.viewport(0, 0, canvas.width, canvas.height);
  const hex = bgPicker.value;
  const r = parseInt(hex.substr(1,2),16)/255;
  const g = parseInt(hex.substr(3,2),16)/255;
  const b = parseInt(hex.substr(5,2),16)/255;
  gl.clearColor(r, g, b, 1.0);
  gl.clear(gl.COLOR_BUFFER_BIT | gl.DEPTH_BUFFER_BIT);

  // Edges
  gl.depthMask(true);
  gl.useProgram(edgeProgram);
  gl.bindVertexArray(edgeVAO);
  gl.uniform1f(gl.getUniformLocation(edgeProgram,"rx"), rotX);
  gl.uniform1f(gl.getUniformLocation(edgeProgram,"ry"), rotY);
  gl.uniform1f(gl.getUniformLocation(edgeProgram,"zoom"), zoom);
  gl.uniform1f(gl.getUniformLocation(edgeProgram,"d"), perspDist);
  gl.uniform1f(gl.getUniformLocation(edgeProgram,"aspect"), canvas.width/canvas.height);
  if (edgeCount) gl.drawArrays(gl.LINES, 0, edgeCount);

  // Faces – draw all batches
  if (blendMode === BlendModes.opaque) {
    gl.disable(gl.BLEND);
    gl.depthMask(true);
    gl.blendEquation(gl.FUNC_ADD);
  } else {
    gl.enable(gl.BLEND);
    gl.depthMask(false);
    gl.blendFunc(blendMode.src, blendMode.dst);
    gl.blendEquation(blendMode.eq ?? gl.FUNC_ADD);
  }

  gl.useProgram(triProgram);
  for (let batch of triBatches) {
    gl.bindVertexArray(batch.vao);
    gl.uniform1f(gl.getUniformLocation(triProgram,"rx"), rotX);
    gl.uniform1f(gl.getUniformLocation(triProgram,"ry"), rotY);
    gl.uniform1f(gl.getUniformLocation(triProgram,"zoom"), zoom);
    gl.uniform1f(gl.getUniformLocation(triProgram,"d"), perspDist);
    gl.uniform1f(gl.getUniformLocation(triProgram,"aspect"), canvas.width/canvas.height);
    gl.uniform1f(gl.getUniformLocation(triProgram,"aa"), aa);
    if (batch.count) gl.drawArrays(gl.TRIANGLES, 0, batch.count);
  }

  // Vertices (points)
  gl.useProgram(edgeProgram);
  gl.bindVertexArray(vertVAO);
  gl.uniform1f(gl.getUniformLocation(edgeProgram,"rx"), rotX);
  gl.uniform1f(gl.getUniformLocation(edgeProgram,"ry"), rotY);
  gl.uniform1f(gl.getUniformLocation(edgeProgram,"zoom"), zoom);
  gl.uniform1f(gl.getUniformLocation(edgeProgram,"d"), perspDist);
  gl.uniform1f(gl.getUniformLocation(edgeProgram,"aspect"), canvas.width/canvas.height);
  if (vertCount && isvert) gl.drawArrays(gl.POINTS, 0, vertCount);

  gl.depthMask(true);
}

	'a': 7, 's': 8, 'd': 9, 'f': 10, 'g': 11, 'h': 12, 'j': 13
  };

 //   e.preventDefault();
    activeNDPlane = planeMap[key]-1;
  }
});


// Modified mouse handler
canvas.onmousemove = e => {
  if (e.buttons) {
    if (activeNDPlane >= 0) {
      // Control ND rotation angles
      const base = activeNDPlane*2;// * 2;
      const speed = 0.01;
      
      // Mouse X affects first angle, mouse Y affects second angle
      if (base < ndAngles.length) {
        ndAngles[base] += e.movementX * speed;
        if (base + 1 < ndAngles.length) {
          ndAngles[base + 1] += e.movementY * speed;
        }
        generate();  // regenerate with new ND rotation
      }
    } else {
      // Normal 3D rotation of the projected object
      rotY += e.movementX * 0.01;
      rotX += e.movementY * 0.01;
      draw();
    }
  }
};



canvas.onwheel = e => {
  e.preventDefault();
  zoom *= Math.exp(-e.deltaY * 0.001);

};

function applyNomAndGenerate() {
    const N = parseInt(dimNInput.value, 10) || 4;

    // 1. Save current matrix
    const originalMatrix = [];
    for (let i = 0; i < N; i++) {
        originalMatrix[i] = [];
        for (let j = 0; j < N; j++) {
            const el = document.getElementById(`m${i}${j}`);
            originalMatrix[i][j] = el ? el.value : '';
        }
    }

    // 2. Apply nom() to each element
    for (let i = 0; i < N; i++) {
        for (let j = 0; j < N; j++) {
            const el = document.getElementById(`m${i}${j}`);
            if (el) el.value = getnom(el.value-0.00001);
        }
    }

    // 3. Generate with nom() applied
    generate();
	//return;
//console.log(23)
    // 4. Restore original matrix
    for (let i = 0; i < N; i++) {
        for (let j = 0; j < N; j++) {
            const el = document.getElementById(`m${i}${j}`);
            if (el) el.value = originalMatrix[i][j];
        }
    }

    // 5. Generate with original matrix
    generate();
}
