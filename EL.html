<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Electrical Circuit Simulator</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            margin: 20px;
        }
        .grid {
            display: grid;
            grid-template-columns: repeat(40, 20px);
            grid-template-rows: repeat(20, 20px);
            gap: 1px;
            margin-bottom: 20px;
        }
        .cell {
            width: 20px;
            height: 20px;
            border: 1px solid #ccc;
            background-size: cover;
            cursor: pointer;
            position: relative;
        }
        .cell:hover::after {
            content: attr(data-info);
            position: absolute;
            top: -25px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.8);
            color: white;
            padding: 2px 5px;
            border-radius: 3px;
            font-size: 12px;
            white-space: nowrap;
        }
        .controls {
            margin-bottom: 20px;
        }
        .controls select, .controls input, .controls button {
            margin-right: 10px;
        }
        .info {
            margin-top: 20px;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <div class="controls">
        <select id="component-select">
            <option value="air">Air</option>
            <option value="wire">Wire</option>
            <option value="resistor">Resistor</option>
            <option value="batteryp">Battery Plus</option>
            <option value="batterym">Battery Minus</option>
            <option value="batterya">Alternating Current</option>
            <option value="batterys">Square Wave</option>
            <option value="batteryw">Triangle Wave</option>
            <option value="batteryz">Sawtooth Wave</option>
            <option value="bulb">Bulb</option>
            <option value="read">Read</option>
        </select>
        <select id="premade-circuits">
            <option value="custom">Custom Circuit</option>
            <option value="battery-resistor">Battery + Resistor</option>
            <option value="battery-bulb">Battery + Bulb</option>
            <option value="parallel">Parallel Circuit</option>
            <option value="series">Series Circuit</option>
        </select>
        <input type="number" id="tickrate" placeholder="Tickrate (ms)" value="100">
        <button id="start-simulate">Start Simulation</button>
        <button id="reset-simulation">Reset Simulation</button>
    </div>
    <div class="grid" id="grid"></div>
    <div class="info" id="info">Click on a cell to read voltage (V) and current (I).</div>

    <script>
        const gridElement = document.getElementById('grid');
        const componentSelect = document.getElementById('component-select');
        const premadeCircuits = document.getElementById('premade-circuits');
        const tickrateInput = document.getElementById('tickrate');
        const startSimulateButton = document.getElementById('start-simulate');
        const resetSimulationButton = document.getElementById('reset-simulation');
        const infoElement = document.getElementById('info');

        const gridSize = { rows: 20, cols: 40 };
        const components = {
            air: { image: 'air.png', resistance: 999999, conductivity: 1 / 999999 },
            wire: { image: 'wire.png', resistance: 0.01, conductivity: 1 / 0.01 },
            resistor: { image: 'resistor.png', resistance: 10, conductivity: 1 / 10 },
            batteryp: { image: 'batteryp.png', voltage: 5, resistance: 999999, conductivity: 10 },
            batterym: { image: 'batterym.png', voltage: -5, resistance: 999999, conductivity: 10 },
            batterya: { image: 'batterya.png', voltage: 0, resistance: 999999, conductivity: 10 }, // AC
            batterys: { image: 'batterys.png', voltage: 0, resistance: 999999, conductivity: 10 }, // Square wave
            batteryw: { image: 'batteryw.png', voltage: 0, resistance: 999999, conductivity: 10 }, // Triangle wave
            batteryz: { image: 'batteryz.png', voltage: 0, resistance: 999999, conductivity: 10 }, // Sawtooth wave
            bulb: { image: 'bulboff.png', resistance: 10, conductivity: 1 / 10 }, // Bulb (off by default)
            read: { image: 'air.png', resistance: 999999, conductivity: 1 / 999999 },
        };

        const bulbThreshold = 1; // Power threshold to turn on the bulb

        let grid = []; // Stores component types
        let V = []; // Stores voltage values
        let I = []; // Stores current vectors (as objects with x and y components)
        let simulationInterval = null;
        let simulationTime = 0; // Track simulation time for waveforms

        // Initialize grid, voltage, and current arrays
        function createGrid() {
            for (let row = 0; row < gridSize.rows; row++) {
                let rowArray = [];
                let VRow = [];
                let IRow = [];
                for (let col = 0; col < gridSize.cols; col++) {
                    const cell = document.createElement('div');
                    cell.className = 'cell';
                    cell.dataset.row = row;
                    cell.dataset.col = col;
                    cell.dataset.component = 'air';
                    cell.style.backgroundImage = `url(${components.air.image})`;
                    cell.addEventListener('click', () => handleCellClick(row, col));
                    gridElement.appendChild(cell);
                    rowArray.push('air');
                    VRow.push(0);
                    IRow.push({ x: 0, y: 0 }); // Initialize current as a vector
                }
                grid.push(rowArray);
                V.push(VRow);
                I.push(IRow);
            }
        }

        // Handle cell click (place component or read values)
        function handleCellClick(row, col) {
            const selectedComponent = componentSelect.value;
            if (selectedComponent === 'read') {
                readCellInfo(row, col); // Read values without placing anything
            } else {
                placeComponent(row, col); // Place the selected component
            }
        }

        // Place a component on the grid
        function placeComponent(row, col) {
            const selectedComponent = componentSelect.value;
            const cell = document.querySelector(`.cell[data-row="${row}"][data-col="${col}"]`);
            cell.dataset.component = selectedComponent;
            cell.style.backgroundImage = `url(${components[selectedComponent].image})`;
            grid[row][col] = selectedComponent;
        }

        // Read voltage and current at a specific cell
        function readCellInfo(row, col) {
            const voltage = V[row][col].toFixed(2);
            const currentMagnitude = Math.sqrt(I[row][col].x ** 2 + I[row][col].y ** 2).toFixed(2);
            infoElement.textContent = `Cell (${row}, ${col}): V = ${voltage}, I = ${currentMagnitude}`;
        }

        // Generate waveform voltages
        function generateWaveform(component, time) {
            const frequency = 1; // Frequency in Hz
            const amplitude = 5; // Amplitude of the waveform

            switch (component) {
                case 'batterya': // Alternating current (sine wave)
                    return amplitude * Math.sin(2 * Math.PI * frequency * time);
                case 'batterys': // Square wave
                    return amplitude * (Math.sin(2 * Math.PI * frequency * time) > 0 ? 1 : -1);
                case 'batteryw': // Triangle wave
                    return (2 * amplitude / Math.PI) * Math.asin(Math.sin(2 * Math.PI * frequency * time));
                case 'batteryz': // Sawtooth wave
                    return 2 * amplitude * (time * frequency - Math.floor(time * frequency + 0.5));
                default:
                    return 0;
            }
        }

        // Simulate voltage and current
        function simulate() {
            simulationTime += tickrateInput.value / 1000; // Update simulation time in seconds

            // Create a copy of the current array to avoid overwriting during calculation
            const I_new = JSON.parse(JSON.stringify(I));

            // Calculate currents based on voltage differences
            for (let row = 0; row < gridSize.rows; row++) {
                for (let col = 0; col < gridSize.cols; col++) {
                    const component = grid[row][col];
                    if (component === 'wire' || component === 'resistor' || component === 'bulb') {
                        const neighbors = [
                            { row: row - 1, col, dx: 0, dy: -1 }, // Top
                            { row: row + 1, col, dx: 0, dy: 1 },  // Bottom
                            { row, col: col - 1, dx: -1, dy: 0 }, // Left
                            { row, col: col + 1, dx: 1, dy: 0 }  // Right
                        ];

                        let I_x = 0;
                        let I_y = 0;

                        neighbors.forEach(n => {
                            if (n.row >= 0 && n.row < gridSize.rows && n.col >= 0 && n.col < gridSize.cols) {
                                const neighborComponent = grid[n.row][n.col];
                                const ΔV = V[row][col] - V[n.row][n.col];
                                const R = components[component].resistance + components[neighborComponent].resistance;
                                const I_flow = ΔV / R; // Current flow between cells

                                // Add to the current vector components
                                I_x += I_flow * n.dx;
                                I_y += I_flow * n.dy;
                            }
                        });

                        // Update the current vector
                        I_new[row][col].x = I_x;
                        I_new[row][col].y = I_y;
                    }
                }
            }

            // Update the current array
            for (let row = 0; row < gridSize.rows; row++) {
                for (let col = 0; col < gridSize.cols; col++) {
                    I[row][col] = I_new[row][col];
                }
            }

            // Update voltages based on weighted averages
            for (let row = 0; row < gridSize.rows; row++) {
                for (let col = 0; col < gridSize.cols; col++) {
                    const component = grid[row][col];
                    if (component === 'batteryp') {
                        V[row][col] = components.batteryp.voltage;
                    } else if (component === 'batterym') {
                        V[row][col] = components.batterym.voltage;
                    } else if (component === 'batterya' || component === 'batterys' || component === 'batteryw' || component === 'batteryz') {
                        // Update voltage for waveform generators
                        V[row][col] = generateWaveform(component, simulationTime);
                    } else if (component === 'wire' || component === 'resistor' || component === 'bulb') {
                        const neighbors = [
                            { row: row - 1, col, weight: components[grid[row - 1]?.[col]]?.conductivity || 0 }, // Top
                            { row: row + 1, col, weight: components[grid[row + 1]?.[col]]?.conductivity || 0 }, // Bottom
                            { row, col: col - 1, weight: components[grid[row]?.[col - 1]]?.conductivity || 0 }, // Left
                            { row, col: col + 1, weight: components[grid[row]?.[col + 1]]?.conductivity || 0 }  // Right
                        ];
                        let totalWeight = 0;
                        let weightedSum = 0;
                        neighbors.forEach(n => {
                            if (n.row >= 0 && n.row < gridSize.rows && n.col >= 0 && n.col < gridSize.cols) {
                                weightedSum += V[n.row][n.col] * n.weight;
                                totalWeight += n.weight;
                            }
                        });
                        if (totalWeight > 0) {
                            V[row][col] = weightedSum / totalWeight;
                        }
                    }
                }
            }

            // Update cell colors and bulb states based on voltage and current magnitude
            for (let row = 0; row < gridSize.rows; row++) {
                for (let col = 0; col < gridSize.cols; col++) {
                    const cell = document.querySelector(`.cell[data-row="${row}"][data-col="${col}"]`);
                    const voltageColor = Math.min(200, Math.max(50, 125 + V[row][col] * 30));
                    const currentMagnitude = Math.sqrt(I[row][col].x ** 2 + I[row][col].y ** 2);
                    const currentColor = Math.min(200, Math.max(50, 125 + currentMagnitude * 30));
                    cell.style.backgroundColor = `rgb(${voltageColor}, 0, ${currentColor})`;
                    cell.dataset.info = `V: ${V[row][col].toFixed(2)}, I: ${currentMagnitude.toFixed(2)}`;

                    // Update bulb state
                    if (grid[row][col] === 'bulb') {
                        const neighbors = [
                            { row: row - 1, col }, // Top
                            { row: row + 1, col }, // Bottom
                            { row, col: col - 1 }, // Left
                            { row, col: col + 1 }  // Right
                        ];
                        let maxΔV = 0;
                        neighbors.forEach(n => {
                            if (n.row >= 0 && n.row < gridSize.rows && n.col >= 0 && n.col < gridSize.cols) {
                                const ΔV = Math.abs(V[row][col] - V[n.row][n.col]);
                                if (ΔV > maxΔV) {
                                    maxΔV = ΔV;
                                }
                            }
                        });

                        const I_bulb = maxΔV / components.bulb.resistance; // Current through bulb
                        const P_bulb = I_bulb ** 2 * components.bulb.resistance; // Power dissipated by bulb

                        if (P_bulb > bulbThreshold) {
                            cell.style.backgroundImage = `url(bulbon.png)`;
                        } else {
                            cell.style.backgroundImage = `url(bulboff.png)`;
                        }
                    }
                }
            }
        }

        // Reset simulation
        function resetSimulation() {
            for (let row = 0; row < gridSize.rows; row++) {
                for (let col = 0; col < gridSize.cols; col++) {
                    const cell = document.querySelector(`.cell[data-row="${row}"][data-col="${col}"]`);
                    cell.dataset.component = 'air';
                    cell.style.backgroundImage = `url(${components.air.image})`;
                    grid[row][col] = 'air';
                    V[row][col] = 0;
                    I[row][col] = { x: 0, y: 0 };
                }
            }
            simulationTime = 0; // Reset simulation time
            infoElement.textContent = "Simulation reset. Click on a cell to read voltage (V) and current (I).";
        }

        // Load premade circuits
        function loadPremadeCircuit(circuit) {
            resetSimulation();
            switch (circuit) {
                case 'battery-resistor':
                    placeComponent(10, 10, 'batteryp');
                    placeComponent(10, 11, 'wire');
                    placeComponent(10, 12, 'resistor');
                    placeComponent(10, 13, 'wire');
                    placeComponent(10, 14, 'batterym');
                    break;
                case 'battery-bulb':
                    placeComponent(10, 10, 'batteryp');
                    placeComponent(10, 11, 'wire');
                    placeComponent(10, 12, 'bulb');
                    placeComponent(10, 13, 'wire');
                    placeComponent(10, 14, 'batterym');
                    break;
                case 'parallel':
                    placeComponent(10, 10, 'batteryp');
                    placeComponent(10, 11, 'wire');
                    placeComponent(10, 12, 'resistor');
                    placeComponent(11, 12, 'wire');
                    placeComponent(11, 11, 'resistor');
                    placeComponent(11, 10, 'wire');
                    placeComponent(11, 9, 'batterym');
                    break;
                case 'series':
                    placeComponent(10, 10, 'batteryp');
                    placeComponent(10, 11, 'wire');
                    placeComponent(10, 12, 'resistor');
                    placeComponent(10, 13, 'wire');
                    placeComponent(10, 14, 'resistor');
                    placeComponent(10, 15, 'wire');
                    placeComponent(10, 16, 'batterym');
                    break;
                default:
                    break;
            }
        }

        // Start/stop simulation
        startSimulateButton.addEventListener('click', () => {
            if (simulationInterval) {
                clearInterval(simulationInterval);
                simulationInterval = null;
                startSimulateButton.textContent = 'Start Simulation';
            } else {
                const tickrate = parseInt(tickrateInput.value, 10);
                simulationInterval = setInterval(simulate, tickrate);
                startSimulateButton.textContent = 'Stop Simulation';
            }
        });

        // Reset simulation
        resetSimulationButton.addEventListener('click', resetSimulation);

        // Load premade circuit
        premadeCircuits.addEventListener('change', (e) => {
            loadPremadeCircuit(e.target.value);
        });

        // Initialize the grid
        createGrid();
    </script>
</body>
</html>
