<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Grid Electric Simulator</title>
<style>
body { margin:0; font-family:sans-serif; background:#eee; display:flex; height:100vh; }
#ui { width:300px; background:#f8f8f8; border-right:1px solid #ccc; padding:10px; box-sizing:border-box; overflow:auto; }
#ui h2 { margin:6px 0; font-size:16px; }
#ui label { display:block; font-size:13px; margin-top:6px; }
#ui input, #ui select { width:100%; }
#canvasWrap { flex:1; display:flex; justify-content:center; align-items:center; }
canvas { background:white; image-rendering: pixelated; }
</style>
</head>
<body>
<div id="ui">
  <h2>Brush</h2>
  <select id="brush">
    <option value="air">Air</option>
    <option value="wire">Wire</option>
    <option value="resistor">Resistor</option>
    <option value="bulb">Bulb</option>
    <option value="battery+">Battery +</option>
    <option value="battery-">Battery - (GND)</option>
    <option value="batteryA">Battery (Sine)</option>
    <option value="batteryS">Battery (Square)</option>
    <option value="batteryZ">Battery (Sawtooth)</option>
    <option value="batteryW">Battery (Triangle)</option>
    <option value="inductor">Inductor</option>
    <option value="capacitor">Capacitor</option>
    <option value="diodeUp">Diode ↑</option>
    <option value="diodeDown">Diode ↓</option>
    <option value="diodeLeft">Diode ←</option>
    <option value="diodeRight">Diode →</option>
    <option value="gnd">GND</option>
  </select>

  <label>Resistance (Ω)</label>
  <input id="resistance" type="number" value="10" />

  <label>Battery Voltage (V)</label>
  <input id="voltage" type="number" value="5" />

  <label>Battery Max Current (A)</label>
  <input id="maxcurrent" type="number" value="1" />

  <label>Bulb Nominal Current (A)</label>
  <input id="bulbI" type="number" value="0.2" />

  <label>Background</label>
  <select id="bgmode">
    <option value="white">White</option>
    <option value="V">Voltage (RGB)</option>
    <option value="A">Current (RGB)</option>
  </select>

  <label><input type="checkbox" id="cornersConnect"> Connect Corners</label>
  <label><input type="checkbox" id="trueNodal" checked> True Nodal Analysis</label>
</div>

<div id="canvasWrap">
  <canvas id="cv" width="800" height="800"></canvas>
</div>

<script>
const W=40,H=40;
const cv=document.getElementById('cv');
const ctx=cv.getContext('2d');
const S=cv.width/W;
const AIR_OHM=1e9;

const imgs={};
['air','wire','resistor','bulbon','bulboff','battery+','battery-',
'inductor','capacitor','diodeUp','diodeDown','diodeLeft','diodeRight','gnd'].forEach(n=>{
  const i=new Image(); i.src=`./electric/${n}.png`; imgs[n]=i;
});

const grid=Array.from({length:H},()=>Array.from({length:W},()=>({
  type:'air', R:AIR_OHM, V:0, I:0, maxI:Infinity, srcV:0, waveform:null, freq:60
})));

function cellOhm(c){
  if(c.type==='air') return AIR_OHM;
  if(c.type==='wire') return 1e-6;
  if(c.type==='resistor') return c.R;
  if(c.type==='bulb') return 10;
  if(c.type==='inductor') return 1e-3; // small for DC
  if(c.type==='capacitor') return 1e9; // open for DC
  return 1e-6;
}

cv.addEventListener('mousedown',e=>{
  const r=cv.getBoundingClientRect();
  const x=Math.floor((e.clientX-r.left)/S);
  const y=Math.floor((e.clientY-r.top)/S);
  if(x<0||y<0||x>=W||y>=H) return;
  const b=document.getElementById('brush').value;
  const c=grid[y][x];
  c.type=b;
  c.R=parseFloat(resistance.value);
  c.srcV=(b==='battery+'?parseFloat(voltage.value):(b==='battery-'?-parseFloat(voltage.value):0));
  c.maxI=parseFloat(maxcurrent.value);
  if(b==='batteryA') c.waveform='sin';
  if(b==='batteryS') c.waveform='square';
  if(b==='batteryZ') c.waveform='saw';
  if(b==='batteryW') c.waveform='triangle';
});

cv.addEventListener('contextmenu',e=>{
  e.preventDefault();
  const r=cv.getBoundingClientRect();
  const x=Math.floor((e.clientX-r.left)/S);
  const y=Math.floor((e.clientY-r.top)/S);
  if(x<0||y<0||x>=W||y>=H) return;
  const tool=prompt("Enter component type for this cell");
  if(tool && imgs[tool]) grid[y][x].type=tool;
});

function solve(){
  const t=performance.now()/1000;
  const neighbors=[[1,0],[-1,0],[0,1],[0,-1]];
  if(document.getElementById('cornersConnect').checked){
    neighbors.push([1,1],[1,-1],[-1,1],[-1,-1]);
  }

  // waveform update
  for(let y=0;y<H;y++)for(let x=0;x<W;x++){
    const c=grid[y][x];
    if(c.waveform){
      const amp=parseFloat(voltage.value);
      const f=c.freq;
      if(c.waveform==='sin') c.V=amp*Math.sin(2*Math.PI*f*t);
      if(c.waveform==='square') c.V=amp*(Math.sin(2*Math.PI*f*t)>=0?1:-1);
      if(c.waveform==='saw') c.V=amp*2*(t*f - Math.floor(t*f+0.5));
      if(c.waveform==='triangle') c.V=amp*2*Math.abs(2*(t*f - Math.floor(t*f+0.5)))-amp;
    }
  }

  if(document.getElementById('trueNodal').checked){
    // simple nodal relaxation
    for(let it=0;it<40;it++){
      for(let y=0;y<H;y++)for(let x=0;x<W;x++){
        const c=grid[y][x];
        if(c.srcV!==0 || c.waveform) continue;
        let sumV=0,sumW=0;
        neighbors.forEach(([dx,dy])=>{
          const nx=x+dx,ny=y+dy;
          if(nx<0||ny<0||nx>=W||ny>=H) return;
          const n=grid[ny][nx],R=Math.min(cellOhm(c),cellOhm(n)),w=1/R;
          sumV+=n.V*w; sumW+=w;
        });
        if(sumW>0) c.V=sumV/sumW;
      }
    }
  } else {
    // fallback relaxation
    for(let it=0;it<40;it++){
      for(let y=0;y<H;y++)for(let x=0;x<W;x++){
        const c=grid[y][x];
        if(c.srcV!==0) continue;
        let sumV=0,sumW=0;
        neighbors.forEach(([dx,dy])=>{
          const nx=x+dx,ny=y+dy;
          if(nx<0||ny<0||nx>=W||ny>=H) return;
          const n=grid[ny][nx],R=Math.min(cellOhm(c),cellOhm(n)),w=1/R;
          sumV+=n.V*w; sumW+=w;
        });
        if(sumW>0) c.V=sumV/sumW;
      }
    }
  }

  // current calculation
  for(let y=0;y<H;y++)for(let x=0;x<W;x++){
    let I=0; const c=grid[y][x];
    neighbors.forEach(([dx,dy])=>{
      const nx=x+dx,ny=y+dy;
      if(nx<0||ny<0||nx>=W||ny>=H) return;
      const n=grid[ny][nx],R=Math.min(cellOhm(c),cellOhm(n));
      I+=Math.abs((c.V-n.V)/R);
    });
    c.I=I;
  }
}

function draw(){
  solve();
  ctx.clearRect(0,0,cv.width,cv.height);
  const bg=document.getElementById('bgmode').value;

  // autoscale
  let minV=Infinity,maxV=-Infinity,minI=Infinity,maxI=-Infinity;
  for(let y=0;y<H;y++)for(let x=0;x<W;x++){
    const c=grid[y][x];
    if(c.V<minV) minV=c.V; if(c.V>maxV) maxV=c.V;
    if(c.I<minI) minI=c.I; if(c.I>maxI) maxI=c.I;
  }
  const scaleV=v=>Math.floor(255*(v-minV)/(maxV-minV+1e-6));
  const scaleI=i=>Math.floor(255*(i-minI)/(maxI-minI+1e-6));

  for(let y=0;y<H;y++)for(let x=0;x<W;x++){
    const c=grid[y][x];
    if(bg!=='white'){
      let r=0,g=0,b=0;
      if(bg==='V'){ r=scaleV(c.V); b=scaleV(-c.V); }
      if(bg==='A'){ g=scaleI(c.I); }
      ctx.fillStyle=`rgb(${r|0},${g|0},${b|0})`;
      ctx.fillRect(x*S,y*S,S,S);
    }

    let img=imgs[c.type];
    if(c.type==='bulb'){
      const t=Math.min(1,c.I/parseFloat(bulbI.value));
      if(c.I>parseFloat(bulbI.value)*1.5) img=imgs['bulboff'];
      ctx.globalAlpha=t;
      ctx.drawImage(imgs['bulbon'],x*S,y*S,S,S);
      ctx.globalAlpha=1-t;
      ctx.drawImage(imgs['bulboff'],x*S,y*S,S,S);
      ctx.globalAlpha=1;
    } else if(img) ctx.drawImage(img,x*S,y*S,S,S);
  }
  requestAnimationFrame(draw);
}

draw();
</script>
</body>
</html>
