<!doctype html>
<html>
<body>

<div>
  <label>Width <input id="w" type="number" value="900"></label>
  <label>Height <input id="h" type="number" value="650"></label><br>

  <label>φ min <input id="phiMin" type="number" value="0" step="0.001"></label>
  <label>φ max <input id="phiMax" type="number" value="0.5" step="0.001"></label><br>

  <label>E min <input id="eMin" type="number" value="-4"></label>
  <label>E max <input id="eMax" type="number" value="4"></label><br>

  <label>k samples <input id="kSamples" type="number" value="6"></label>
  <label>q max <input id="qmax" type="number" value="80"></label><br>

  <label>Adaptive q
    <select id="adaptiveQ">
      <option value="off">off</option>
      <option value="cf">continued fraction</option>
    </select>
  </label>

  <label>q tol <input id="qTol" type="number" value="1e-4"></label>
  <label>q adaptive max <input id="qAdaptiveMax" type="number" value="300"></label><br>

  <label>Force q <input id="forceQ" type="number" value="0"></label>
  <label>Force p <input id="forceP" type="number" value="0"></label><br>

  <label>Band sharpness <input id="bandSharp" type="number" value="0.7" step="0.05"></label><br>

  <label>Color mode
    <select id="colorMode">
      <option value="gap">gap-chern</option>
      <option value="band">band-chern</option>
      <option value="trace">signed-trace</option>
      <option value="density">density-map</option>
      <option value="mono">monochrome</option>
    </select>
  </label><br>

  <label>Show TKNN <input id="showTKNN" type="checkbox" checked></label>
  <label>TKNN q limit <input id="chernQMax" type="number" value="30"></label>
  <label>Chern grid <input id="chernGrid" type="number" value="10"></label><br>

  <label>Color gain <input id="colorGain" type="number" value="40"></label><br>

  <button id="renderBtn">Render</button>
  <button id="saveBtn">Save</button>
</div>

<canvas id="c"></canvas>

<script>
const canvas = document.getElementById("c");
const ctx = canvas.getContext("2d");
let renderToken = 0;
const chernCache = new Map();

function clamp(x,a,b){ return Math.max(a,Math.min(b,x)); }

function setSize(){
  canvas.width = +w.value;
  canvas.height = +h.value;
}
w.onchange = h.onchange = setSize;
setSize();

/* ---------- Rational approximation ---------- */

function bestRational(phi,qmax){
  let best={p:0,q:1,err:1};
  for(let q=1;q<=qmax;q++){
    let p=Math.round(phi*q);
    let e=Math.abs(phi-p/q);
    if(e<best.err) best={p,q,err:e};
  }
  return best;
}

function bestRationalCF(x,qmax,tol){
  let h1=1,h0=0,k1=0,k0=1,x1=x;
  while(true){
    let a=Math.floor(x1);
    let h=a*h1+h0, k=a*k1+k0;
    if(k>qmax) break;
    if(Math.abs(h/k-x)<tol) return {p:h,q:k};
    h0=h1; h1=h; k0=k1; k1=k;
    x1=1/(x1-a);
    if(!isFinite(x1)) break;
  }
  return {p:h1,q:k1};
}

/* ---------- Transfer matrix ---------- */

function siteMatrix(E,theta){ return [[E-2*Math.cos(theta),-1],[1,0]]; }

function matMul(A,B){
  return [
    [A[0][0]*B[0][0]+A[0][1]*B[1][0],A[0][0]*B[0][1]+A[0][1]*B[1][1]],
    [A[1][0]*B[0][0]+A[1][1]*B[1][0],A[1][0]*B[0][1]+A[1][1]*B[1][1]]
  ];
}

function monodromy(phi,p,q,E,k){
  let M=[[1,0],[0,1]];
  for(let n=0;n<q;n++){
    let theta=2*Math.PI*n*phi+k;
    M=matMul(siteMatrix(E,theta),M);
  }
  return M;
}

function spectral(phi,E){
  let p,q;
  if(+forceQ.value>0){
    q=+forceQ.value;
    p=+forceP.value||Math.round(phi*q);
  }else{
    let r=adaptiveQ.value==="cf"
      ? bestRationalCF(phi,+qAdaptiveMax.value,+qTol.value)
      : bestRational(phi,+qmax.value);
    p=r.p; q=r.q;
  }

  let min=1e9,tr=0;
  for(let i=0;i<+kSamples.value;i++){
    let k=2*Math.PI*i/+kSamples.value;
    let M=monodromy(phi,p,q,E,k);
    let t=M[0][0]+M[1][1];
    let a=Math.abs(t);
    if(a<min){min=a; tr=t;}
  }
  let raw=clamp((2-min)/2,0,1);
  return {v:Math.pow(raw,+bandSharp.value), p,q,tr};
}

/* ---------- Complex helpers ---------- */

function cadd(a,b){return[a[0]+b[0],a[1]+b[1]];}
function cmul(a,b){return[a[0]*b[0]-a[1]*b[1],a[0]*b[1]+a[1]*b[0]];}
function cconj(a){return[a[0],-a[1]];}
function cabs(a){return Math.hypot(a[0],a[1]);}
function carg(z){return Math.atan2(z[1],z[0]);}

/* ---------- Harper + TKNN ---------- */

function harper(p,q,kx,ky){
  let H=Array.from({length:q},()=>Array(q).fill([0,0]));
  for(let n=0;n<q;n++){
    H[n][n]=[2*Math.cos(2*Math.PI*p*n/q+ky),0];
    H[n][(n+1)%q]=[Math.cos(kx),Math.sin(kx)];
    H[n][(n-1+q)%q]=[Math.cos(-kx),Math.sin(-kx)];
  }
  return H;
}

function eigenvector(p,q,kx,ky){
  let H=harper(p,q,kx,ky);
  let v=Array.from({length:q},()=>[Math.random(),0]);
  for(let it=0;it<30;it++){
    let w=Array.from({length:q},()=>[0,0]);
    for(let i=0;i<q;i++)
      for(let j=0;j<q;j++)
        w[i]=cadd(w[i],cmul(H[i][j],v[j]));
    let n=Math.sqrt(w.reduce((s,x)=>s+cabs(x)**2,0));
    if(n<1e-12) break;
    v=w.map(x=>[x[0]/n,x[1]/n]);
  }
  return v;
}

function berryLink(a,b){
  let re=0,im=0;
  for(let i=0;i<a.length;i++){
    re+=a[i][0]*b[i][0]+a[i][1]*b[i][1];
    im+=a[i][0]*b[i][1]-a[i][1]*b[i][0];
  }
  let n=Math.hypot(re,im);
  return n<1e-12?[1,0]:[re/n,im/n];
}

function computeChern(p,q){
  const key=p+"/"+q;
  if(chernCache.has(key)) return chernCache.get(key);
  let N=+chernGrid.value,sum=0;
  for(let i=0;i<N;i++)for(let j=0;j<N;j++){
    let kx=2*Math.PI*i/N,ky=2*Math.PI*j/N;
    let a=eigenvector(p,q,kx,ky);
    let ax=eigenvector(p,q,kx+2*Math.PI/N,ky);
    let ay=eigenvector(p,q,kx,ky+2*Math.PI/N);
    let axy=eigenvector(p,q,kx+2*Math.PI/N,ky+2*Math.PI/N);
    let Ux=berryLink(a,ax),Uy=berryLink(a,ay);
    let Uxy=berryLink(ay,axy),Uyx=berryLink(ax,axy);
    sum+=carg(cmul(cmul(Ux,Uyx),cmul(cconj(Uxy),cconj(Uy))));
  }
  let c=Math.round(sum/(2*Math.PI));
  chernCache.set(key,c);
  return c;
}

/* ---------- Coloring ---------- */

function colorPixel(s){
  let gain=+colorGain.value;
  if(colorMode.value==="mono"){
    let g=s.v*255; return [g,g,g];
  }
  if(colorMode.value==="trace"){
    let t=Math.sign(s.tr)*s.v;
    return [128+t*gain,128,128-t*gain];
  }
  if(colorMode.value==="density"){
    return [s.v*255,0,255*(1-s.v)];
  }
  if(showTKNN.checked && s.q<=+chernQMax.value){
    let c=computeChern(s.p,s.q);
    let t=clamp(c/6,-1,1);
    return [
      128+t*gain,
      128-Math.abs(t)*gain,
      128-t*gain
    ];
  }
  return [0,0,0];
}

/* ---------- Render ---------- */

async function render(token){
  setSize();
  let W=canvas.width,H=canvas.height;
  let img=ctx.createImageData(W,H);

  for(let x=0;x<W;x++){
    if(token!==renderToken) return;
    let phi=+phiMin.value+(phiMax.value-phiMin.value)*x/(W-1);
    for(let y=0;y<H;y++){
      let E=+eMax.value-(eMax.value-eMin.value)*y/(H-1);
      let s=spectral(phi,E);
      let [r,g,b]=colorPixel(s);
      let i=4*(y*W+x);
      img.data[i]=clamp(r,0,255);
      img.data[i+1]=clamp(g,0,255);
      img.data[i+2]=clamp(b,0,255);
      img.data[i+3]=255;
    }
    if(x%8===0){ ctx.putImageData(img,0,0); await new Promise(r=>setTimeout(r,0)); }
  }
  ctx.putImageData(img,0,0);
}

renderBtn.onclick=()=>{ renderToken++; render(renderToken); };
saveBtn.onclick=()=>{ let a=document.createElement("a"); a.href=canvas.toDataURL(); a.download="butterfly.png"; a.click(); };

renderBtn.click();
</script>
</body>
</html>
