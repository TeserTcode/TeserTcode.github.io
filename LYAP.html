<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lyapunov Fractal Explorer</title>
    <style>
        body {
            margin: 0;
            padding: 20px;
            font-family: Arial, sans-serif;
            background-color: #222;
            color: #eee;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            max-width: 1000px;
            width: 100%;
        }
        h1 {
            text-align: center;
            margin-bottom: 20px;
            color: #fff;
        }
        .canvas-container {
            position: relative;
            width: 100%;
            height: 500px;
            border: 1px solid #444;
            margin-bottom: 20px;
            overflow: hidden;
            background-color: #000;
        }
        canvas {
            position: absolute;
            top: 0;
            left: 0;
            cursor: move;
        }
        .controls {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 20px;
        }
        .control-group {
            background-color: #333;
            padding: 15px;
            border-radius: 5px;
        }
        h2 {
            margin-top: 0;
            font-size: 1.2em;
            color: #fff;
            border-bottom: 1px solid #555;
            padding-bottom: 5px;
        }
        .form-group {
            margin-bottom: 10px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-size: 0.9em;
        }
        input[type="text"], input[type="number"] {
            width: 100%;
            padding: 8px;
            background-color: #444;
            border: 1px solid #555;
            border-radius: 3px;
            color: #eee;
            box-sizing: border-box;
        }
        input[type="range"] { width: 100%; }
        .checkbox-group { display: flex; align-items: center; margin-bottom: 10px; }
        .checkbox-group input { margin-right: 8px; }
        button {
            background-color: #4a6fa5;
            color: white;
            border: none;
            padding: 8px 15px;
            border-radius: 3px;
            cursor: pointer;
            font-size: 0.9em;
            transition: background-color 0.2s;
        }
        button:hover { background-color: #5a7fb5; }
        .info { margin-top: 10px; font-size: 0.8em; color: #aaa; }
        .coordinates {
            position: absolute;
            bottom: 10px;
            left: 10px;
            background-color: rgba(0,0,0,0.7);
            padding: 5px 10px;
            border-radius: 3px;
            font-size: 0.8em;
        }
        @media (max-width: 768px) { .controls { grid-template-columns: 1fr; } }
    </style>
</head>
<body>
<div class="container">
    <h1>Lyapunov Fractal Explorer</h1>
    <div class="canvas-container">
        <canvas id="fractalCanvas"></canvas>
        <div class="coordinates" id="coordinates">x: 0.0, y: 0.0</div>
    </div>
    <div class="controls">
        <div class="control-group">
            <h2>Sequence Parameters</h2>
            <div class="form-group">
                <label for="sequence">A/B Sequence (e.g., AB):</label>
                <input type="text" id="sequence" value="AB" maxlength="10">
            </div>
            <div class="form-group">
                <label for="nValue">Sequence Length (n):</label>
                <input type="number" id="nValue" value="100" min="10" max="1000">
            </div>
            <div class="form-group">
                <label for="cValue">C Value: <span id="cValueDisplay">0.5</span></label>
                <input type="range" id="cValue" min="-2" max="2" step="0.01" value="0.5">
            </div>
            <button id="renderButton">Render Fractal</button>
        </div>
        <div class="control-group">
            <h2>Visualization Options</h2>
            <div class="checkbox-group">
                <input type="checkbox" id="vectorField" checked>
                <label for="vectorField">Show Vector Field (Starting Points)</label>
            </div>
            <div class="form-group">
                <label for="hueCount">Number of Hues:</label>
                <input type="number" id="hueCount" value="5" min="1" max="20">
            </div>
            <div class="info">
                <p>Negative Lyapunov exponents: Darker grays</p>
                <p>Zero exponent: 50% gray</p>
                <p>Positive exponents: Lighter grays/whites</p>
            </div>
        </div>
    </div>
</div>

<script>
const canvas = document.getElementById('fractalCanvas');
const ctx = canvas.getContext('2d');
const container = document.querySelector('.canvas-container');
const coordinates = document.getElementById('coordinates');

// Fractal parameters
let params = {
    sequence: 'AB',
    n: 100,
    c: 0.5,
    showVectors: true,
    hueCount: 5,
    zoom: 1,
    offsetX: 0,
    offsetY: 0
};

// UI elements
const sequenceInput = document.getElementById('sequence');
const nValueInput = document.getElementById('nValue');
const cValueInput = document.getElementById('cValue');
const cValueDisplay = document.getElementById('cValueDisplay');
const renderButton = document.getElementById('renderButton');
const vectorFieldCheckbox = document.getElementById('vectorField');
const hueCountInput = document.getElementById('hueCount');

// Resize canvas
function resizeCanvas() {
    canvas.width = container.clientWidth;
    canvas.height = container.clientHeight;
    renderFractal();
}
window.addEventListener('resize', resizeCanvas);
resizeCanvas();

// Update params from UI
function updateParams() {
    params.sequence = sequenceInput.value.toUpperCase().replace(/[^AB]/g,'') || 'AB';
    sequenceInput.value = params.sequence;
    params.n = parseInt(nValueInput.value);
    params.c = parseFloat(cValueInput.value);
    params.showVectors = vectorFieldCheckbox.checked;
    params.hueCount = parseInt(hueCountInput.value);
    cValueDisplay.textContent = params.c.toFixed(2);
}
sequenceInput.addEventListener('input', updateParams);
nValueInput.addEventListener('input', updateParams);
cValueInput.addEventListener('input', updateParams);
vectorFieldCheckbox.addEventListener('change', updateParams);
hueCountInput.addEventListener('input', updateParams);
renderButton.addEventListener('click', renderFractal);

// Panning and zoom
let isDragging = false;
let dragStart = { x: 0, y: 0 };
let offsetStart = { x: 0, y: 0 };

canvas.addEventListener('wheel', e => {
    e.preventDefault();
    const rect = canvas.getBoundingClientRect();
    const mouseX = e.clientX - rect.left;
    const mouseY = e.clientY - rect.top;

    const normX = (mouseX / canvas.width - 0.5) * 4;
    const normY = (mouseY / canvas.height - 0.5) * 4;

    const zoomFactor = e.deltaY > 0 ? 0.95 : 1.05;
    params.zoom *= zoomFactor;

    params.offsetX = (params.offsetX + normX) - normX / zoomFactor;
    params.offsetY = (params.offsetY + normY) - normY / zoomFactor;

    renderFractal();
});

canvas.addEventListener('mousedown', e => {
    isDragging = true;
    dragStart.x = e.clientX;
    dragStart.y = e.clientY;
    offsetStart.x = params.offsetX;
    offsetStart.y = params.offsetY;
});
canvas.addEventListener('mousemove', e => {
    if (!isDragging) return;
    const dx = (e.clientX - dragStart.x) / canvas.width * 4 / params.zoom;
    const dy = (e.clientY - dragStart.y) / canvas.height * 4 / params.zoom;
    params.offsetX = offsetStart.x - dx;
    params.offsetY = offsetStart.y - dy;
    renderFractal();
});
canvas.addEventListener('mouseup', () => isDragging = false);
canvas.addEventListener('mouseleave', () => isDragging = false);

// Lyapunov exponent calculation
function lyapunovExponent(a, b, sequence, n) {
    let x = 0.5;
    for(let i=0;i<100;i++){
        const r = sequence[i % sequence.length]==='A'?a:b;
        x = r*x*(1-x);
    }
    let sum = 0;
    for(let i=0;i<n;i++){
        const r = sequence[i % sequence.length]==='A'?a:b;
        const deriv = r*(1-2*x);
        sum += Math.log(Math.abs(deriv));
        x = r*x*(1-x);
    }
    return sum/n;
}

// Render fractal
function renderFractal() {
    updateParams();
    const width = canvas.width;
    const height = canvas.height;
    const imageData = ctx.createImageData(width, height);
    const data = imageData.data;

    for(let py=0; py<height; py++){
        for(let px=0; px<width; px++){
            const worldX = ((px / width) - 0.5) * 4 / params.zoom - params.offsetX;
            const worldY = ((py / height) - 0.5) * 4 / params.zoom - params.offsetY;
            const exponent = lyapunovExponent(worldX, worldY, params.sequence, params.n);

            const idx = (py * width + px) * 4;
            let color;
            if(exponent<0){
                const intensity = Math.min(1, Math.abs(exponent)/10);
                color = Math.floor(128 * intensity);
            } else if(exponent===0){
                color = 128;
            } else {
                const intensity = Math.min(1, exponent/10);
                color = 128 + Math.floor(127*intensity);
            }
            data[idx] = data[idx+1] = data[idx+2] = color;
            data[idx+3] = 255;
        }
    }

    ctx.putImageData(imageData,0,0);

    if(params.showVectors){
        // Placeholder: optionally draw vector field
    }

    // Update coordinates
    coordinates.textContent = `x: ${params.offsetX.toFixed(3)}, y: ${params.offsetY.toFixed(3)}, zoom: ${params.zoom.toFixed(3)}`;
}

// Initial render
renderFractal();
</script>
</body>
</html>
