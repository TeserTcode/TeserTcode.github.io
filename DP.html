<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>GPU Double Pendulum Lyapunov Explorer</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gif.js/0.2.0/gif.js"></script>
</head>
<body>
<h3>Double Pendulum Lyapunov Explorer</h3>
<div>
  m1 <input id="m1" type="number" value="1" step="0.1">
  m2 <input id="m2" type="number" value="1" step="0.1">
  l1 <input id="l1" type="number" value="1" step="0.1">
  l2 <input id="l2" type="number" value="1" step="0.1"><br>
  gravity <input id="g" type="number" value="9.8" step="0.1">
  dt <input id="dt" type="number" value="0.01" step="0.001">
  steps <input id="steps" type="number" value="1000">
  eps <input id="eps" type="number" value="1e-6" step="1e-6"><br>
  renorm every <input id="renorm" type="number" value="10">
  map <select id="map">
    <option value="theta">theta1/theta2</option>
    <option value="omega">omega1/omega2</option>
  </select><br>
  Palette <select id="palette">
    <option value="default">Default (blue-red)</option>
    <option value="gray">Grayscale</option>
    <option value="rainbow">Rainbow</option>
  </select><br>
  Sweep Variable
  <select id="sweepVar">
    <option value="m1">m1</option>
    <option value="m2">m2</option>
    <option value="l1">l1</option>
    <option value="l2">l2</option>
    <option value="g">gravity</option>
  </select>
  min <input id="sweepMin" type="number" value="0.5" step="0.1">
  max <input id="sweepMax" type="number" value="2" step="0.1">
  frames <input id="sweepFrames" type="number" value="10"><br>
  <button onclick="render()">Render</button>
  <button onclick="savePNG()">Save PNG</button>
  <button onclick="makeGIF()">Make GIF</button>
</div>
<canvas id="canvas" width="360" height="360"></canvas>
<script id="shader-fs" type="x-shader/x-fragment">
precision highp float;
uniform float m1,m2,l1,l2,g,dt;
uniform int steps, renormEvery;
uniform float eps;
uniform int palette;
uniform int mapType;
vec2 deriv(vec4 s) {
  float th1=s.x, w1=s.y, th2=s.z, w2=s.w;
  float d=th1-th2;
  float denom= (m1+m2)*l1 - m2*l1*cos(d)*cos(d);
  float a1=(m2*l1*w1*w1*sin(d)*cos(d)+m2*g*sin(th2)*cos(d)+m2*l2*w2*w2*sin(d)-(m1+m2)*g*sin(th1))/denom;
  float a2=(-m2*l2*w2*w2*sin(d)*cos(d)+(m1+m2)*(g*sin(th1)*cos(d)-l1*w1*w1*sin(d)-g*sin(th2)))/denom*l1/l2;
  return vec2(a1,a2);
}
void main(){
  vec2 uv=(gl_FragCoord.xy/vec2(360.0,360.0))*6.28318-3.14159;
  vec4 s;
  if(mapType==0) s=vec4(uv.x,0.0,uv.y,0.0);
  else s=vec4(0.0,uv.x,0.0,uv.y);
  vec4 s2=s; s2.x+=eps; s2.z+=eps;
  float sep=length(s2-s);
  float lce=0.0;
  for(int i=0;i<20000;i++){
    if(i>=steps) break;
    vec2 a=deriv(s);
    vec2 a2=deriv(s2);

    s+=vec4(s.y,a.x,s.w,a.y)*dt;
    s2+=vec4(s2.y,a2.x,s2.w,a2.y)*dt;

    if (mod(float(i+1), float(renormEvery)) == 0.0) {
      float d=length(s2-s);
      lce += log(d/sep);
      s2 = s + (s2 - s) / d * sep;
    }
}

  lce/=float(steps/renormEvery);
  float v=clamp(lce*5.0,0.0,1.0);
  vec3 col;
  if(palette==0){
    col=mix(vec3(0,0,1),vec3(1,0,0),v);
  } else if(palette==1){
    col=vec3(v);
  } else {
    col=vec3(0.5+0.5*sin(6.2831*v+0.0),
             0.5+0.5*sin(6.2831*v+2.094),
             0.5+0.5*sin(6.2831*v+4.188));
  }
  gl_FragColor=vec4(col,1);
}
</script>
<script>
let gl, program;
function compileShader(src,type){
  let s=gl.createShader(type);
  gl.shaderSource(s,src);
  gl.compileShader(s);
  if(!gl.getShaderParameter(s,gl.COMPILE_STATUS)) throw gl.getShaderInfoLog(s);
  return s;
}
function initGL(){
  gl=canvas.getContext("webgl");
  let vs=compileShader("attribute vec4 pos;void main(){gl_Position=pos;}",gl.VERTEX_SHADER);
  let fs=compileShader(document.getElementById("shader-fs").text,gl.FRAGMENT_SHADER);
  program=gl.createProgram();
  gl.attachShader(program,vs);gl.attachShader(program,fs);
  gl.bindAttribLocation(program,0,"pos");
  gl.linkProgram(program);
  if(!gl.getProgramParameter(program,gl.LINK_STATUS)) throw gl.getProgramInfoLog(program);
  gl.useProgram(program);
  let buf=gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER,buf);
  gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,1,-1,-1,1,1,1]),gl.STATIC_DRAW);
  gl.vertexAttribPointer(0,2,gl.FLOAT,false,0,0);gl.enableVertexAttribArray(0);
}
function setUniforms(vars){
  gl.uniform1f(gl.getUniformLocation(program,"m1"),vars.m1);
  gl.uniform1f(gl.getUniformLocation(program,"m2"),vars.m2);
  gl.uniform1f(gl.getUniformLocation(program,"l1"),vars.l1);
  gl.uniform1f(gl.getUniformLocation(program,"l2"),vars.l2);
  gl.uniform1f(gl.getUniformLocation(program,"g"),vars.g);
  gl.uniform1f(gl.getUniformLocation(program,"dt"),vars.dt);
  gl.uniform1i(gl.getUniformLocation(program,"steps"),vars.steps);
  gl.uniform1f(gl.getUniformLocation(program,"eps"),vars.eps);
  gl.uniform1i(gl.getUniformLocation(program,"renormEvery"),vars.renormEvery);
  gl.uniform1i(gl.getUniformLocation(program,"palette"),vars.palette);
  gl.uniform1i(gl.getUniformLocation(program,"mapType"),vars.mapType);
}
function render(vars){
  if(!program) initGL();
  if(!vars) vars=getVars();
  setUniforms(vars);
  gl.drawArrays(gl.TRIANGLE_STRIP,0,4);
}
function getVars(){
  return {
    m1:+m1.value,m2:+m2.value,l1:+l1.value,l2:+l2.value,
    g:+g.value,dt:+dt.value,steps:+steps.value,eps:+eps.value,
    renormEvery:+renorm.value,
    palette:palette.selectedIndex,
    mapType:map.selectedIndex
  };
}
function savePNG(){
  let link=document.createElement("a");
  link.download="frame.png";
  link.href=canvas.toDataURL("image/png");
  link.click();
}
function makeGIF(){
  let vars=getVars();
  let vname=sweepVar.value,min=+sweepMin.value,max=+sweepMax.value;
  let frames=+sweepFrames.value;
  let gif=new GIF({workers:2,quality:10});
  let step=(max-min)/(frames-1);
  function addFrame(i){
    if(i>=frames){
      gif.on('finished',function(blob){
        let url=URL.createObjectURL(blob);
        let a=document.createElement("a");
        a.href=url;a.download="sweep.gif";a.click();
      });
      gif.render();
      return;
    }
    vars[vname]=min+i*step;
    render(vars);
    gif.addFrame(canvas,{copy:true,delay:200});
    requestAnimationFrame(()=>addFrame(i+1));
  }
  addFrame(0);
}
</script>
</body>
</html>
