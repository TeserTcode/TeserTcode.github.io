<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eternal Calendar</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            margin: 20px;
        }
        h1 {
            margin-bottom: 0;
        }
        h2 {
            margin-top: 5px;
        }
        .calendar-container {
            display: flex;
            align-items: center;
            justify-content: center;
        }
        table {
            border-collapse: collapse;
            margin: 20px;
        }
        th, td {
            padding: 10px;
            border: 1px solid #ccc;
            width: 14.28%;
            text-align: center;
            vertical-align: top;
            position: relative;
        }
        th {
            background-color: #f0f0f0;
        }
        td {
            transition: all 0.3s ease;
        }
        td.prev-month, td.next-month {
            color: grey;
            background-color: #f9f9f9;
        }
        td.prev-month span, td.next-month span {
            color: #666;
        }
        td[data-tag] {
      /*  box-shadow: inset 0 0 8px 2px var(--tag-color); */
        }
        .selected-day {
            box-shadow: inset 0 0 16px 4px #ff9800 !important;
        }
        .tag-info {
            display: none;
            position: absolute;
            bottom: 100%;
            left: 50%;
            transform: translateX(-50%);
            background-color: #f9f9f9;
            border: 1px solid #ddd;
            padding: 5px;
            width: 200px;
            font-size: 0.8em;
            z-index: 10;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        }
        td:hover .tag-info {
            display: block;
        }
        input[type="number"] {
            width: 50px;
            margin: 5px;
        }
        button {
            margin-top: 10px;
            padding: 5px 10px;
        }
        select {
            margin: 10px;
            padding: 5px;
        }
        .nav-buttons {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .calendar-type {
            font-size: 0.8em;
            color: grey;
        }
    </style>
</head>
<body>

    <h1>Eternal Calendar</h1>
    <h2 id="month-year">April - 2024</h2>
    <div class="calendar-type" id="calendar-type">Gregorian</div>

    <select id="calendar-select" onchange="generateCalendar()">
        <option value="gregorian">Gregorian</option>
        <option value="hijri">Hijri</option>
        <option value="hebrew">Hebrew</option>
        <option value="julian">Julian</option>
        <option value="persian">Persian</option>
    </select>

    <div class="calendar-container">
        <div class="nav-buttons">
            <button data-nav="prev-millenia" onclick="changeYear(-1000)">← Millenia</button>
            <button data-nav="prev-century" onclick="changeYear(-100)">← Century</button>
            <button data-nav="prev-decade" onclick="changeYear(-10)">← Decade</button>
            <button data-nav="prev-year" onclick="changeYear(-1)">← Year</button>
            <button data-nav="prev-month" onclick="changeMonth(-1)">← Month</button>
            <button data-nav="prev-day" onclick="changeDay(-1)">← Day</button>
        </div>
        <table id="calendar">
            <thead>
                <tr>
                    <th>Mo</th>
                    <th>Tu</th>
                    <th>We</th>
                    <th>Th</th>
                    <th>Fr</th>
                    <th>Sa</th>
                    <th>Su</th>
                </tr>
            </thead>
            <tbody id="calendar-body">
                <!-- Rows will be generated dynamically -->
            </tbody>
        </table>
        <div class="nav-buttons">
            <button data-nav="next-millenia" onclick="changeYear(1000)">Millenia →</button>
            <button data-nav="next-century" onclick="changeYear(100)">Century →</button>
            <button data-nav="next-decade" onclick="changeYear(10)">Decade →</button>
            <button data-nav="next-year" onclick="changeYear(1)">Year →</button>
            <button data-nav="next-month" onclick="changeMonth(1)">Month →</button>
            <button data-nav="next-day" onclick="changeDay(1)">Day →</button>
        </div>
    </div>

    <div>
        <input type="number" id="day-input" placeholder="Day" min="1" max="31">
        <input type="number" id="month-input" placeholder="Month" min="1" max="12">
        <input type="number" id="year-input" placeholder="Year" min="1900" max="2100">
        <button onclick="generateCalendar()">Generate Calendar</button>
        <button onclick="fillFromUnixTime()">From Unix Time</button>
        <button onclick="setCurrentTime()">Get Current Time</button>
    </div>

    <select id="country-select" onchange="generateCalendar()">
        <option value="all">All</option>
        <option value="Turkey">Turkey</option>
        <option value="France">France</option>
        <option value="Albania">Albania</option>
        <option value="Georgia">Georgia</option>
        <option value="Kazakhstan">Kazakhstan</option>
        <option value="United States">USA</option>
        <option value="United Kingdom">UK</option>
    </select>

    <script>
  let currentDay = new Date().getDate();
let currentMonth = new Date().getMonth() + 1;
let currentYear = new Date().getFullYear();

const tags = {
    '1-1': {
        name: "New Year's Day",
        info: "The first day of the year, celebrated with various traditions and events.",
        color: "#FF5733",
        country: "United States"
    },
};

// Gregorian to Hijri conversion
function gregorianToHijri(date) {
    const gregorianEpoch = new Date(622, 6, 16); // July 16, 622 CE (Hijri epoch)
    const daysSinceEpoch = Math.floor((date - gregorianEpoch) / (1000 * 60 * 60 * 24));

    let hijriYear = Math.floor((daysSinceEpoch + 10646) / 354.367); // Adjusted calculation
    let hijriDayOfYear = Math.floor((daysSinceEpoch + 10646) % 354.367);
    let hijriMonth = 0;
    let hijriDay = hijriDayOfYear + 1;

    const hijriMonthsDays = [30, 29, 30, 29, 30, 29, 30, 29, 30, 29, 30, 29]; // Alternating days in Hijri months

    for (let i = 0; i < hijriMonthsDays.length; i++) {
        if (hijriDay <= hijriMonthsDays[i]) {
            hijriMonth = i + 1;
            break;
        }
        hijriDay -= hijriMonthsDays[i];
    }

    return { year: hijriYear, month: hijriMonth, day: hijriDay };
}


// Hijri to Gregorian conversion
function hijriToGregorian(hijriYear, hijriMonth, hijriDay) {
    const gregorianEpoch = new Date(622, 6, 16);
    const daysSinceEpoch = (hijriYear - 1) * 354.367 + (hijriMonth - 1) * 29.53 + hijriDay - 1;
    return new Date(gregorianEpoch.getTime() + daysSinceEpoch * 24 * 60 * 60 * 1000);
}

// Generate calendar based on selected type
function generateCalendar() {
    const calendarType = document.getElementById('calendar-select').value;
    document.getElementById('calendar-type').textContent = calendarType.charAt(0).toUpperCase() + calendarType.slice(1);

    if (calendarType === 'hijri') {
        const hijriDate = gregorianToHijri(new Date(currentYear, currentMonth - 1, currentDay));
        displayHijriCalendar(hijriDate.month, hijriDate.year, hijriDate.day);
    } else {
        displayGregorianCalendar(currentMonth, currentYear, currentDay);
    }
}


// Display Gregorian calendar
function displayGregorianCalendar(month, year, highlightDay = null) {
    const countryFilter = document.getElementById('country-select').value;
    const calendarBody = document.getElementById('calendar-body');
    calendarBody.innerHTML = '';
    const monthYearHeader = document.getElementById('month-year');
    const daysInMonth = new Date(year, month, 0).getDate();
    const firstDay = new Date(year, month - 1, 1).getDay();
    const offset = (firstDay === 0) ? 6 : firstDay - 1;
    const prevDays = new Date(year, month - 1, 0).getDate();

    monthYearHeader.textContent = `${new Intl.DateTimeFormat('en-US', { month: 'long' }).format(new Date(year, month - 1))} - ${year}`;
    let row = document.createElement('tr');
    let nextMonthDay = 1;

    for (let i = 0; i < 42; i++) {
        let cell = document.createElement('td');

        if (i < offset) {
            cell.classList.add('prev-month');
            cell.innerHTML = `<span>${prevDays - offset + i + 1}</span>`;
        } else if (i >= offset && i < daysInMonth + offset) {
            const date = i - offset + 1;
            cell.textContent = date;

            const tagKey = `${date}-${month}`;
            if (tags[tagKey] && (countryFilter === 'all' || tags[tagKey].country === countryFilter)) {
                const tagData = tags[tagKey];
                cell.setAttribute('data-tag', tagData.name);
                cell.style.setProperty('--tag-color', tagData.color);
                cell.classList.add(`country-${tagData.country.toLowerCase().replace(/\s+/g, '-')}`);

                const tagInfo = document.createElement('div');
                tagInfo.classList.add('tag-info');
                tagInfo.innerHTML = `<strong>${tagData.name}</strong> (${tagData.country}):<br>${tagData.info}`;
                cell.appendChild(tagInfo);
            }

            if (highlightDay === date) {
                cell.classList.add('selected-day');
            }
        } else {
            cell.classList.add('next-month');
            cell.innerHTML = `<span>${nextMonthDay++}</span>`;
        }

        row.appendChild(cell);

        if (row.children.length === 7) {
            calendarBody.appendChild(row);
            row = document.createElement('tr');
        }
    }
}

// Display Hijri calendar
function displayHijriCalendar(month, year, highlightDay = null) {
    const countryFilter = document.getElementById('country-select').value;
    const calendarBody = document.getElementById('calendar-body');
    calendarBody.innerHTML = '';
    const monthYearHeader = document.getElementById('month-year');
    const hijriMonths = ["Muharram", "Safar", "Rabi' I", "Rabi' II", "Jumada I", "Jumada II", "Rajab", "Sha'ban", "Ramadan", "Shawwal", "Dhul-Qa'dah", "Dhul-Hijjah"];
    const daysInMonth = [30, 29, 30, 29, 30, 29, 30, 29, 30, 29, 30, 29]; // Hijri months length

    monthYearHeader.textContent = `${hijriMonths[month - 1]} - ${year}`;

    let row = document.createElement('tr');
    let nextMonthDay = 1;

    for (let i = 0; i < 42; i++) {
        let cell = document.createElement('td');

        if (i < daysInMonth[month - 1]) {
            const date = i + 1;
            cell.textContent = date;

            if (highlightDay !== null && highlightDay === date) {
                cell.classList.add('selected-day');
            }
        } else {
            cell.classList.add('next-month');
            cell.innerHTML = `<span>${nextMonthDay++}</span>`;
        }

        row.appendChild(cell);

        if (row.children.length === 7) {
            calendarBody.appendChild(row);
            row = document.createElement('tr');
        }
    }
}

function changeMonth(delta) {
    currentMonth += delta;
    if (currentMonth < 1) {
        currentMonth = 12;
        currentYear--;
    } else if (currentMonth > 12) {
        currentMonth = 1;
        currentYear++;
    }
    generateCalendar();
}

function changeYear(delta) {
    currentYear += delta;
    generateCalendar();
}
        function setCurrentTime() {
            const now = new Date();
            currentDay = now.getDate();
            currentMonth = now.getMonth() + 1;
            currentYear = now.getFullYear();

            document.getElementById('day-input').value = currentDay;
            document.getElementById('month-input').value = currentMonth;
            document.getElementById('year-input').value = currentYear;

            generateCalendar();
        }
                function changeDay(delta) {
            currentDay += delta;
            const daysInMonth = new Date(currentYear, currentMonth, 0).getDate();
            if (currentDay > daysInMonth) {
                currentDay = 1;
                changeMonth(1);
            } else if (currentDay < 1) {
                changeMonth(-1);
                currentDay = new Date(currentYear, currentMonth, 0).getDate();
            }
            generateCalendar();
        }

        function fillFromUnixTime() {
            const unixTime = prompt("Enter Unix Time:");
            if (unixTime) {
                const date = new Date(parseInt(unixTime) * 1000);
                document.getElementById('day-input').value = date.getDate();
                document.getElementById('month-input').value = date.getMonth() + 1;
                document.getElementById('year-input').value = date.getFullYear();
                generateCalendar();
            }
        }
setCurrentTime();

    </script>
</body>
</html>
