vec2 complexExp(vec2 z) {
    float ex = exp(z.x);
    return vec2(ex * cos(z.y), ex * sin(z.y));
}

vec2 complexLog(vec2 z) {
    float r = length(z);
    float theta = atan(z.y, z.x);
    return vec2(log(r), theta);
}
const float LN2  = 0.69314718055994530942;
const float LN10 = 2.30258509299404568402;
vec2 complexLog2(vec2 z) {
    vec2 lz = complexLog(z);
    return lz / LN2;
}
vec2 complexLog10(vec2 z) {
    vec2 lz = complexLog(z);
    return lz / LN10;
}
vec2 complexExp2(vec2 z) {
    return complexExp(z * LN2);
}
vec2 complexExp10(vec2 z) {
    return complexExp(z * LN10);
}

vec2 complexMul(vec2 a, vec2 b) {
    return vec2(a.x * b.x - a.y * b.y, a.x * b.y + a.y * b.x);
}

vec2 complexAdd(vec2 a, vec2 b) {
    return vec2(a.x + b.x, a.y + b.y);
}

vec2 complexSub(vec2 a, vec2 b) {
    return vec2(a.x - b.x, a.y - b.y);
}

vec2 complexPow(vec2 base, vec2 exponent) {
    return complexExp(complexMul(exponent, complexLog(base)));
}
vec2 complexDiv(vec2 a, vec2 b) {
    float denom = b.x * b.x + b.y * b.y;
    return vec2(
        (a.x * b.x + a.y * b.y) / denom,  // real part
        (a.y * b.x - a.x * b.y) / denom   // imaginary part
    );
}

vec2 powertower(vec2 x, int n, vec2 a) {

       const canvas = document.getElementById("glCanvas");

function resize(){
  canvas.width = innerWidth;
  canvas.height = innerHeight;

}
addEventListener("resize",resize);
resize();

const vertexSrc = `
attribute vec2 position;
void main(){ gl_Position = vec4(position,0,1); }
`;

const quad = gl.createBuffer();
gl.bindBuffer(gl.ARRAY_BUFFER, quad);
gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1,1,-1,-1,1,1,1]), gl.STATIC_DRAW);

let program;
let u_res,u_off,u_zoom;

function compile(mode){
    if(program) gl.deleteProgram(program);

    const fragSrc =
`#define MODE ${mode}
${document.getElementById("fragmentTemplate").textContent}`;

    const vs = gl.createShader(gl.VERTEX_SHADER);
    gl.shaderSource(vs,vertexSrc);
    gl.compileShader(vs);

    const fs = gl.createShader(gl.FRAGMENT_SHADER);
    gl.shaderSource(fs,fragSrc);
    gl.compileShader(fs);

    if(!gl.getShaderParameter(fs,gl.COMPILE_STATUS)){
        console.error(gl.getShaderInfoLog(fs));
        return;
    }

    program = gl.createProgram();
    gl.attachShader(program,vs);
    gl.attachShader(program,fs);
    gl.linkProgram(program);
    gl.useProgram(program);

    const loc = gl.getAttribLocation(program,"position");
    gl.enableVertexAttribArray(loc);
    gl.vertexAttribPointer(loc,2,gl.FLOAT,false,0,0);

    u_res = gl.getUniformLocation(program,"u_resolution");
    u_off = gl.getUniformLocation(program,"u_offset");
    u_zoom = gl.getUniformLocation(program,"u_zoom");
}

compile(2);

let zoom = 0.02;
let offset = {x:0,y:0};
let drag=false,last={x:0,y:0};

addEventListener("wheel",e=>zoom*=e.deltaY>0?0.9:1.1);
canvas.addEventListener("mousedown",e=>{drag=true;last={x:e.x,y:e.y}});
addEventListener("mouseup",()=>drag=false);
addEventListener("mousemove",e=>{
    if(drag){
        offset.x -= (e.x-last.x)*0.002/zoom;
        offset.y += (e.y-last.y)*0.002/zoom;
        last={x:e.x,y:e.y};
    }
});

select.onchange=()=>compile(+select.value);

function render(){
    gl.uniform2f(u_res,canvas.width,canvas.height);
    gl.uniform2f(u_off,offset.x,offset.y);
    gl.uniform1f(u_zoom,zoom);
    gl.drawArrays(gl.TRIANGLE_STRIP,0,4);
    requestAnimationFrame(render);
}
render();
