const vec2 constant = vec2(0.318131505204764135312654251587664517203517614, 1.33723570143068940890116214319371061253950214);

vec2 complexExp(vec2 z) {
    float ex = exp(z.x);
    return vec2(ex * cos(z.y), ex * sin(z.y));
}

vec2 complexLog(vec2 z) {
    float r = length(z);
    float theta = atan(z.y, z.x);
    return vec2(log(r), theta);
}

vec2 complexMul(vec2 a, vec2 b) {
    return vec2(a.x * b.x - a.y * b.y, a.x * b.y + a.y * b.x);
}

vec2 complexAdd(vec2 a, vec2 b) {
    return vec2(a.x + b.x, a.y + b.y);
}

vec2 complexSub(vec2 a, vec2 b) {
    return vec2(a.x - b.x, a.y - b.y);
}

vec2 complexPow(vec2 base, vec2 exponent) {
    return complexExp(complexMul(exponent, complexLog(base)));
}

vec2 tetr(vec2 b) {
	 initKnthetaa();
    vec2 fi = vec2(b.x, abs(b.y));
    vec2 bi = vec2(mod(b.x, 1.0), fi.y);

    for (int i = 0; i < 50; i++) {
        vec2 term = complexMul(vec2(0.0, 1.0), vec2(6.28318530718 * float(i), 0.0));
        term = complexMul(term, bi);
        fi = complexAdd(fi, complexMul(knthetaa[i], complexExp(term)));
    }

    fi = complexAdd(constant, complexPow(complexLog(constant), complexSub(fi, vec2(float(bign), 0.0))));

    for (int i = 0; i < bign; i++) {
        fi = complexExp(fi);
    }

    if (b.y < 0.0) {
        fi.y = -fi.y; // Complex conjugate
    }

    return fi;
}
		
		float tanh(float x){

        vec3 hsvToRgb(float h, float s, float v) {
            vec3 c = vec3(h, s, v);
            vec3 rgb = clamp(abs(mod(c.x * 6.0 + vec3(0.0, 4.0, 2.0), 6.0) - 3.0) - 1.0, 0.0, 1.0);
            return c.z * mix(vec3(1.0), rgb, c.y);

            float hue = atan(z.y, z.x) / 6.28318;
            float value = tanh(magnitude) * 0.9 + 0.1;
            
            gl_FragColor = vec4(hsvToRgb(hue, 1.0, value), 1.0);

    <script>
        const canvas = document.getElementById("glCanvas");
        const gl = canvas.getContext("webgl");
        
        let zoom = 0.02;
        let offset = { x: 0.0, y: 0.0 };
        let isDragging = false;
        let lastMouse = { x: 0, y: 0 };
        
        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            gl.viewport(0, 0, canvas.width, canvas.height);
        }
        
        window.addEventListener("resize", resizeCanvas);
        resizeCanvas();
        
        window.addEventListener("wheel", (event) => {
            zoom *= event.deltaY > 0 ? 0.9 : 1.1;
        });
        
        canvas.addEventListener("mousedown", (event) => {
            isDragging = true;
            lastMouse.x = event.clientX;
            lastMouse.y = event.clientY;
        });
        
        window.addEventListener("mouseup", () => { isDragging = false; });
        
        window.addEventListener("mousemove", (event) => {
            if (isDragging) {
                offset.x -= (event.clientX - lastMouse.x) * 0.002 / zoom;
                offset.y += (event.clientY - lastMouse.y) * 0.002 / zoom;
                lastMouse.x = event.clientX;
                lastMouse.y = event.clientY;
            }
        });
        
        function compileShader(gl, source, type) {
            let shader = gl.createShader(type);
            gl.shaderSource(shader, source);
            gl.compileShader(shader);
            if (!gl.getShaderParameter(shader, gl.COMPILE_STATUS)) {
                console.error("Shader compile error:", gl.getShaderInfoLog(shader));
                return null;
            }
            return shader;
        }
        
        let vertexShader = compileShader(gl, `
            attribute vec4 position;
            void main() { gl_Position = position; }
        `, gl.VERTEX_SHADER);
        
        let fragmentShader = compileShader(gl, document.getElementById("fragmentShader").textContent, gl.FRAGMENT_SHADER);
        
        let program = gl.createProgram();
        gl.attachShader(program, vertexShader);
        gl.attachShader(program, fragmentShader);
        gl.linkProgram(program);
        gl.useProgram(program);
        
        let positionBuffer = gl.createBuffer();
        gl.bindBuffer(gl.ARRAY_BUFFER, positionBuffer);
        gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 1, -1, -1, 1, 1, 1]), gl.STATIC_DRAW);
        
        let positionLocation = gl.getAttribLocation(program, "position");
        gl.enableVertexAttribArray(positionLocation);
        gl.vertexAttribPointer(positionLocation, 2, gl.FLOAT, false, 0, 0);
        
        let resolutionLocation = gl.getUniformLocation(program, "u_resolution");
        let offsetLocation = gl.getUniformLocation(program, "u_offset");
        let zoomLocation = gl.getUniformLocation(program, "u_zoom");
        
        function render() {
            gl.uniform2f(resolutionLocation, canvas.width, canvas.height);
            gl.uniform2f(offsetLocation, offset.x, offset.y);
            gl.uniform1f(zoomLocation, zoom);
            gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
            requestAnimationFrame(render);
        }
