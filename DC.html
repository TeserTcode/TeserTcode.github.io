function createAndAnimateMesh() {
gridSize = document.getElementById('bmp-width').value;
 const magnitudeToLightnessExpr = document.getElementById('magnitude-to-lightness').value.trim();
            const colorMode = document.getElementById('color-mode').value;
            const saturationChroma = parseInt(document.getElementById('saturation-chroma').value);
            const lightness = parseInt(document.getElementById('lightness').value);

  const maxHeight = parseFloat(document.getElementById('max-height').value);
let thick = parseFloat(document.getElementById('thick').value);
    if (mesh) {

     function updateMesh() {
        const positions = geometry.attributes.position.array;
        const numVertices = positions.length / 3;

        const colors = new Float32Array(numVertices * 3);  // Create color array

        for (let i = 0; i < numVertices; i++) {

            const y = positions[i * 3 + 1];

             let z = math.complex(x, y);
z =  teth.evaluate(document.getElementById('function').value, { x: z });
            const zMagnitude = math.min(maxHeight,math.abs(z));
			if(negmag==1)

           } positions[i * 3 + 1] = -y;  // Set height to |z|

updateMesh();

function createAndAnimateMeshSPH() {
    const gridSize = document.getElementById('bmp-width').value;
    const magnitudeToLightnessExpr = document.getElementById('magnitude-to-lightness').value.trim();
    const colorMode = document.getElementById('color-mode').value;
    const saturationChroma = parseInt(document.getElementById('saturation-chroma').value);
    const lightness = parseInt(document.getElementById('lightness').value);
    const hue = parseInt(document.getElementById('hue').value);

    const funcStr = document.getElementById('function').value.trim();
    const maxHeight = parseFloat(document.getElementById('max-height').value);

    if (mesh) {
        scene.remove(mesh);
        geometry.dispose();
        material.dispose();
    }

    geometry = new THREE.SphereGeometry(5, gridSize, gridSize); // Adjust radius and grid size as needed
    material = new THREE.MeshBasicMaterial({ vertexColors: true, wireframe: false });
    mesh = new THREE.Mesh(geometry, material);
    scene.add(mesh);

    function updateMesh() {
        const positions = geometry.attributes.position.array;
        const numVertices = positions.length / 3;

        const colors = new Float32Array(numVertices * 3);  // Create color array

        for (let i = 0; i < numVertices; i++) {
            const x = positions[i * 3];
            const y = positions[i * 3 + 1];
            const z = positions[i * 3 + 2];

            const r = Math.sqrt(x * x + y * y + z * z);
            const theta = Math.acos(z / r);  // Theta is the polar angle from the z-axis
            const phi = Math.atan2(y, x);    // Phi is the azimuthal angle in the xy-plane

            let sphericalInput = math.complex(theta, phi);  // Construct complex number with theta and phi
            sphericalInput = teth.evaluate(funcStr, { x: sphericalInput });  // Evaluate user-provided function

            const zMagnitude = math.min(maxHeight, math.abs(sphericalInput));

           const newRadius = zMagnitude;

            positions[i * 3] = newRadius * Math.sin(theta) * Math.cos(phi);  // Update X
            positions[i * 3 + 1] = newRadius * Math.sin(theta) * Math.sin(phi);  // Update Y
            positions[i * 3 + 2] = newRadius * Math.cos(theta);  // Update Z

            const color = complexToColor( math.complex(x, y),sphericalInput, magnitudeToLightnessExpr, colorMode, saturationChroma, lightness, paletteImageData,  0.1, 1 );

             colors[i * 3] = color[0] / 255;
            colors[i * 3 + 1] = color[1] / 255;
            colors[i * 3 + 2] = color[2] / 255;
        }

        geometry.attributes.position.needsUpdate = true;
        geometry.computeVertexNormals();

        geometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));  // Apply color array
        geometry.attributes.color.needsUpdate = true;
    }

    function animateMesh() {
        requestAnimationFrame(animateMesh);
        renderer.render(scene, camera);
    }

    updateMesh();  // Initial update of the mesh
    animateMesh();
}

function updateCamera() {
    velocity.set(0, 0, 0);
    rotationVelocity.set(0, 0, 0);

    if (moveBackward) velocity.z += moveSpeed;
    if (moveLeft) velocity.x -= moveSpeed;
    if (moveRight) velocity.x += moveSpeed;
    if (moveUp) velocity.y -= moveSpeed;
    if (moveDown) velocity.y += moveSpeed;

    camera.position.add(velocity.applyQuaternion(camera.quaternion));

     if (rotateLeft) rotationVelocity.y += rotateSpeed;
    if (rotateRight) rotationVelocity.y -= rotateSpeed;
    if (rotateUp) rotationVelocity.x += rotateSpeed;
    if (rotateDown) rotationVelocity.x -= rotateSpeed;
    if (rotateUpc) rotationVelocity.z += rotateSpeed;
    if (rotateDownc) rotationVelocity.z -= rotateSpeed;

    let quaternion = new THREE.Quaternion();
    quaternion.setFromEuler(new THREE.Euler(rotationVelocity.x, rotationVelocity.y, rotationVelocity.z, 'XYZ'));
    camera.quaternion.multiplyQuaternions(quaternion, camera.quaternion);
}

function plotGraph(point1, point2) {
    const parametricMode = document.getElementById('parametricMode').checked;
 //   const maximum = parseFloat(document.getElementById('maximum').value); // Assuming you have an input for maximum

    if (!parametricMode) {
        const bmpheight = parseFloat(document.getElementById('bmp-height').value);
        const bmpwidth = parseFloat(document.getElementById('bmp-width').value);
        const canvas = document.getElementById('graphCanvas');
        const ctx = canvas.getContext('2d');
        canvas.width = bmpwidth * 5;
        canvas.height = bmpheight * 5;
        canvas.style.width = '300px';
        canvas.style.height = '300px';
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        const numSamples = 1000;
        const realValues = [];
        const imagValues = [];

        ctx.fillStyle = 'white';
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        if (math.min(point1.imag, point2.imag) < 0 && math.max(point1.imag, point2.imag) > 0) {
            const zeroY = (point1.imag) / (point2.imag - point1.imag) * canvas.height + canvas.height;
            ctx.strokeStyle = 'DimGray';
            ctx.beginPath();
            ctx.moveTo(canvas.width - zeroY, 0);
            ctx.lineTo(canvas.width - zeroY, canvas.height);
            ctx.stroke();
        }
        if (math.min(point1.real, point2.real) < 0 && math.max(point1.real, point2.real) > 0) {
            const zeroY = (point1.real) / (point2.real - point1.real) * canvas.height + canvas.height;
            ctx.strokeStyle = 'black';
            ctx.beginPath();
            ctx.moveTo(canvas.width - zeroY, 0);
            ctx.lineTo(canvas.width - zeroY, canvas.height);
            ctx.stroke();
        }

        for (let i = 0; i <= numSamples; i++) {
            const t = i / numSamples;
            const real = point1.real + t * (point2.real - point1.real);
            const imag = point1.imag + t * (point2.imag - point1.imag);
            const z = math.complex(real, imag);
            const fn = teth.evaluate(document.getElementById('function').value, { x: z });

            if (!isNaN(fn.re) && !isNaN(fn.im) && isFinite(fn.re) && isFinite(fn.im)) {
                realValues.push(fn.re);
                imagValues.push(fn.im);
            } else {
                realValues.push(null);
                imagValues.push(null);
            }
        }

        ctx.lineWidth = Math.max(1, canvas.width / 100);
        const graphWidth = canvas.width;
        const graphHeight = canvas.height;

        // Adjust min and max values based on the maximum variable
        let maxValue, minValue;
        if (maximum > 0) {
            maxValue = Math.min(maximum, Math.max(...imagValues, ...realValues));
            minValue = Math.max(-maximum, Math.min(...imagValues, ...realValues));
        } else if (maximum < 0) {
            maxValue = -maximum;
            minValue = maximum;
        } else {
            maxValue = Math.max(...imagValues, ...realValues);
            minValue = Math.min(...imagValues, ...realValues);
        }

        if (0 > minValue && 0 < maxValue) {
            const zeroX = (-minValue) / (maxValue - minValue) * canvas.height;
            ctx.strokeStyle = 'black';
            ctx.beginPath();
            ctx.moveTo(0, canvas.height - zeroX);
            ctx.lineTo(canvas.width, canvas.height - zeroX);
            ctx.stroke();
        }

        ctx.beginPath();
        ctx.strokeStyle = 'red';
        for (let i = 0; i < realValues.length; i++) {
            const x = (i / numSamples) * graphWidth;
            const y = graphHeight - ((realValues[i] - minValue) / (maxValue - minValue)) * graphHeight;
            if (i === 0) {
                ctx.moveTo(x, y);
            } else {
                ctx.lineTo(x, y);
            }
        }
        ctx.stroke();

        ctx.beginPath();
        ctx.strokeStyle = 'blue';
        for (let i = 0; i < imagValues.length; i++) {
            const x = (i / numSamples) * graphWidth;
            const y = graphHeight - ((imagValues[i] - minValue) / (maxValue - minValue)) * graphHeight;
            if (i === 0) {
                ctx.moveTo(x, y);
            } else {
                ctx.lineTo(x, y);
            }
        }
        ctx.stroke();
    } else {
        const bmpheight = parseFloat(document.getElementById('bmp-height').value);
        const bmpwidth = parseFloat(document.getElementById('bmp-width').value);
        const canvas = document.getElementById('graphCanvas');
        const ctx = canvas.getContext('2d');
        canvas.width = bmpwidth * 5;
        canvas.height = bmpheight * 5;
        canvas.style.width = '300px';
        canvas.style.height = '300px';
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        const numSamples = 1000;
        const realValues = [];
        const imagValues = [];

        ctx.fillStyle = 'white';
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        for (let i = 0; i <= numSamples; i++) {
            const t = i / numSamples;
            const real = point1.real + t * (point2.real - point1.real);
            const imag = point1.imag + t * (point2.imag - point1.imag);
            const z = math.complex(real, imag);
            const fn = teth.evaluate(document.getElementById('function').value, { x: z });

            if (!isNaN(fn.re) && !isNaN(fn.im) && isFinite(fn.re) && isFinite(fn.im)) {
                realValues.push(fn.re);
                imagValues.push(fn.im);
            } else {
                realValues.push(null);
                imagValues.push(null);
            }
        }

        // Determine min/max values for scaling
        let maxValueX, minValueX, maxValueY, minValueY;
        if (maximum > 0) {
            maxValueX = Math.min(maximum, Math.max(...realValues.filter(v => v !== null)));
            minValueX = Math.max(-maximum, Math.min(...realValues.filter(v => v !== null)));
            maxValueY = Math.min(maximum, Math.max(...imagValues.filter(v => v !== null)));
            minValueY = Math.max(-maximum, Math.min(...imagValues.filter(v => v !== null)));
        } else if (maximum < 0) {
            maxValueX = -maximum;
            minValueX = maximum;
            maxValueY = -maximum;
            minValueY = maximum;
        } else {
            maxValueX = Math.max(...realValues.filter(v => v !== null));
            minValueX = Math.min(...realValues.filter(v => v !== null));
            maxValueY = Math.max(...imagValues.filter(v => v !== null));
            minValueY = Math.min(...imagValues.filter(v => v !== null));
        }

        ctx.lineWidth = Math.max(1, canvas.width / 100);

        // Draw axes
        if (0 > minValueX && 0 < maxValueX) {
            const zeroX = (-minValueX) / (maxValueX - minValueX) * canvas.width;
            ctx.strokeStyle = 'black';
            ctx.beginPath();
            ctx.moveTo(zeroX, 0);
            ctx.lineTo(zeroX, canvas.height);
            ctx.stroke();
        }

        if (0 > minValueY && 0 < maxValueY) {
            const zeroY = (-minValueY) / (maxValueY - minValueY) * canvas.height;
            ctx.strokeStyle = 'black';
            ctx.beginPath();
            ctx.moveTo(0, canvas.height - zeroY);
            ctx.lineTo(canvas.width, canvas.height - zeroY);
            ctx.stroke();
        }

        // Draw parametric curve
        ctx.beginPath();
        ctx.strokeStyle = 'red';
        for (let i = 0; i < realValues.length; i++) {
            if (realValues[i] !== null && imagValues[i] !== null) {
                const x = ((realValues[i] - minValueX) / (maxValueX - minValueX)) * canvas.width;
                const y = canvas.height - ((imagValues[i] - minValueY) / (maxValueY - minValueY)) * canvas.height;
                if (i === 0) {
                    ctx.moveTo(x, y);
                } else {
                    ctx.lineTo(x, y);
                }
            }
        }
        ctx.stroke();
    }
}

function generatePalette() {
    const rows = parseInt(document.getElementById('rows').value);
    const columns = parseInt(document.getElementById('columns').value);
    const colors = [];
    
    for (let i = 1; i <= rows * columns; i++) {
        const colorInput = document.getElementById(`color-${i}`);
        colors.push(colorInput.value);
    }

    const canvas = document.createElement('canvas');
    canvas.width = 360;
    canvas.height = 100;
    const ctx = canvas.getContext('2d');
    const imageData = ctx.createImageData(canvas.width, canvas.height);

    const width = canvas.width;
    const height = canvas.height;
    const rowHeight = height / (rows - 1);
    const columnWidth = width / columns;

    for (let y = 0; y < height; y++) {
        for (let x = 0; x < width; x++) {
            const row = Math.floor(y / rowHeight);
            const column = Math.floor(x / columnWidth);
            const rowFraction = (y % rowHeight) / rowHeight;
            const columnFraction = (x % columnWidth) / columnWidth;
            const color1 = hexToRgb(colors[row * columns + column]);
            const color2 = hexToRgb(colors[row * columns + (column + 1) % columns]);
            const color3 = hexToRgb(colors[(row + 1) % rows * columns + column]);
            const color4 = hexToRgb(colors[(row + 1) % rows * columns + (column + 1) % columns]);

            const colorHorizontal1 = interpolateColor(color1, color2, columnFraction);
            const colorHorizontal2 = interpolateColor(color3, color4, columnFraction);
            const finalColor = interpolateColor(colorHorizontal1, colorHorizontal2, rowFraction);

            const index = ((y -0) * width + x) * 4;
            imageData.data[index] = finalColor[0];     // Red
            imageData.data[index + 1] = finalColor[1]; // Green
            imageData.data[index + 2] = finalColor[2]; // Blue
            imageData.data[index + 3] = 255;           // Alpha
        }
    }

    ctx.putImageData(imageData, 0, 0);
    
    paletteImageData = ctx.getImageData(0, 0, 360, 100).data;

}

		const textarea = document.getElementById("function");

//const textarea = document.getElementById("function");
//const autocompleteList = document.getElementById("autocomplete-list");
//const textarea = document.getElementById("function");
//const autocompleteList = document.getElementById("autocomplete-list");
let selectedIndex = -1;
let hoverTimer;
const prefixHelp = {
  "_": "All functions",
  "#": "Total functions count",
  "@": "Recently used functions",
  ":": "Random functions",
  "!": "Utility functions (e.g., log, debug, error)",
  "?": "Show help for all prefixes",
  "$": "DOM manipulation functions",
  ">": "Async or promise-based functions",
  "*": "Math or calculation functions",
  "~": "String manipulation functions",
  "&": "Event-related or callback functions",
  "%": "Date or time-related functions",
  "t": "Trigonometric functions (e.g., sin, cos, tan)",
  "g": "Gamma and related functions",
  "l": "Logarithmic and exponential functions",
  "b": "Bessel and special functions",
  "L": "Long functions (>100 characters)",
  "LL": "Longer functions (>200 characters)"
};
textarea.addEventListener("input", (e) => {
  const cursorPosition = textarea.selectionStart;
  const text = textarea.value;

  const prefixMatch = /[a-zA-Z0-9_#@:!?$>*~&%]+$/;
  const match = text.slice(0, cursorPosition).match(prefixMatch);
  let prefix = match ? match[0] : "";
const trigFunctions = ["sin", "cos", "tan", "asin", "acos", "atan", "sinh", "cosh", "tanh", "asinh", "acosh", "atanh"];
const gammaFunctions = ["gamma", "lambertw", "factorial", "sinc"];
const logExpFunctions = ["log", "exp", "log10", "log2", "ln"];
const besselFunctions = ["besselj", "bessely", "besseli", "besselk"];
const specialFunctions = ["dedekindeta", "jinvariant", "sinc", "ncr", "npr", "npdf", "ncdf", "npsi"];
 
 autocompleteList.innerHTML = "";
  selectedIndex = -1;

  if (!prefix) {
    autocompleteList.style.display = "none";
    return;
  }

  let suggestions = [];

  if (prefix === "_") {
    suggestions = allFunctionsNames;
  } else if (prefix === "#") {
    const suggestionDiv = document.createElement("div");
    suggestionDiv.textContent = `Total Functions: ${allFunctionsNames.length}`;
    autocompleteList.appendChild(suggestionDiv);
    autocompleteList.style.display = "block";
    return;
  } else if (prefix === "@") {
    suggestions = recentFunctions; // Assuming `recentFunctions` is an array of recently used functions
  } else if (prefix === ":") {
    suggestions = allFunctionsNames.sort(() => Math.random() - 0.5).slice(0, 10); // Random functions
  } else if (prefix === "!") {
    suggestions = allFunctionsNames.filter(name => name.startsWith("log") || name.startsWith("debug") || name.startsWith("error"));
  } else if (prefix === "?"){
    // Show help for all prefixes
    const helpDiv = document.createElement("div");
    helpDiv.className = "help-text";
    helpDiv.innerHTML = Object.entries(prefixHelp)
      .map(([key, value]) => `<strong>${key}</strong>: ${value}`)
      .join("<br>");
    autocompleteList.appendChild(helpDiv);
    autocompleteList.style.display = "block";
    return;
    
  } else if (prefix === "$") {
    suggestions = allFunctionsNames.filter(name => name.startsWith("$") || name.includes("DOM"));
  } else if (prefix === ">") {
    suggestions = allFunctionsNames.filter(name => name.endsWith("Async") || name.startsWith("fetch"));
  } else if (prefix === "*") {
    suggestions = allFunctionsNames.filter(name => name.startsWith("calc") || name.startsWith("math"));
  } else if (prefix === "~") {
    suggestions = allFunctionsNames.filter(name => name.startsWith("trim") || name.startsWith("substring") || name.startsWith("replace"));
  } else if (prefix === "&") {
    suggestions = allFunctionsNames.filter(name => name.startsWith("on") || name.startsWith("handle"));
  } else if (prefix === "%") {
    suggestions = allFunctionsNames.filter(name => name.startsWith("date") || name.startsWith("time"));
  }else if (prefix === "t") {
    suggestions = trigFunctions;
  } else if (prefix === "g") {
    suggestions = gammaFunctions;
  } else if (prefix === "l") {
    suggestions = logExpFunctions;
  } else if (prefix === "b") {
    suggestions = besselFunctions.concat(specialFunctions);
  } else if (prefix === "L") {
    suggestions = longFunctions;
  } else if (prefix === "LL") {
    suggestions = longerFunctions;
  }  else {
    let searchTerms = [prefix];
    if (prefix.includes("arc") || prefix.includes("inv")) {
      searchTerms.push(prefix.replace(/arc/g, "inv"), prefix.replace(/inv/g, "arc"));
    }

    suggestions = allFunctionsNames
      .filter((name) => searchTerms.some(term => name.includes(term)))
      .sort((a, b) => {
        const aStarts = searchTerms.some(term => a.startsWith(term));
        const bStarts = searchTerms.some(term => b.startsWith(term));
        if (aStarts && !bStarts) return -1;
        if (!aStarts && bStarts) return 1;
        return a.length - b.length;
      });
  }

  if (suggestions.length === 0) {
    autocompleteList.style.display = "none";
    return;
  }

  autocompleteList.style.display = "block";
  autocompleteList.style.left = `${textarea.offsetLeft}px`;
  autocompleteList.style.top = `${textarea.offsetTop + textarea.offsetHeight}px`;
  autocompleteList.style.width = `${textarea.offsetWidth}px`;

  suggestions.forEach((suggestion, index) => {
    const params = getParamNames(allFunctions[suggestion]) || [];
    const paramsText = params.length > 0 ? `(${params.join(", ")})` : "()";

    const suggestionDiv = document.createElement("div");
    suggestionDiv.textContent = `${suggestion} ${paramsText}`;
    suggestionDiv.dataset.index = index;

    suggestionDiv.addEventListener("click", () => {
      insertSuggestion(suggestion);
    });

    suggestionDiv.addEventListener("mouseenter", () => {
      hoverTimer = setTimeout(() => {
        showFunctionCode(suggestion, suggestionDiv);
      }, 1000); // 1 second hover delay
    });

    suggestionDiv.addEventListener("mouseleave", () => {
      clearTimeout(hoverTimer);
      hideFunctionCode();
    });

    autocompleteList.appendChild(suggestionDiv);
  });
});

textarea.addEventListener("keydown", (e) => {
    hideFunctionCode();
  const items = autocompleteList.children;
  if (items.length === 0) return;

  if (e.key === "ArrowDown") {
    selectedIndex = (selectedIndex + 1) % items.length;
    updateSelection();
    e.preventDefault();
  } else if (e.key === "ArrowUp") {
    selectedIndex = (selectedIndex - 1 + items.length) % items.length;
    updateSelection();
    e.preventDefault();
  } else if (e.key === "Shift" && selectedIndex >= 0) {
    insertSuggestion(items[selectedIndex].textContent.split(" ")[0]);
    e.preventDefault();
  }
});

function updateSelection() {
    hideFunctionCode();
  const items = autocompleteList.children;
  Array.from(items).forEach((item, index) => {
    item.style.background = index === selectedIndex ? "#ddd" : "white";
  });
}

function insertSuggestion(suggestion) {
  const cursorPosition = textarea.selectionStart;
  const text = textarea.value;
  const prefixMatch = /[a-zA-Z0-9_#@:!?$>*~&%]+$/;
  const beforeCursor = text.slice(0, cursorPosition);
  const afterCursor = text.slice(cursorPosition);
  const updatedBeforeCursor = beforeCursor.replace(prefixMatch, suggestion);
  textarea.value = updatedBeforeCursor + afterCursor;
  textarea.selectionStart = textarea.selectionEnd = updatedBeforeCursor.length;
  autocompleteList.style.display = "none";

  // Add to recent functions
  if (!recentFunctions.includes(suggestion)) {
    recentFunctions.unshift(suggestion);
    if (recentFunctions.length > maxRecent) recentFunctions.pop();
  }
}

function showFunctionCode(functionName, element) {
  const functionCode = allFunctions[functionName];
  if (functionCode) {
    const codeBubble = document.createElement("div");
    codeBubble.className = "code-bubble";
    codeBubble.textContent = functionCode;
    document.body.appendChild(codeBubble);

    const rect = element.getBoundingClientRect();
    codeBubble.style.position = "absolute";
    codeBubble.style.left = `${rect.left}px`;
    codeBubble.style.top = `${rect.bottom}px`;
  }
}

function hideFunctionCode() {
  const codeBubble = document.querySelector(".code-bubble");
  if (codeBubble) {
    codeBubble.remove();
  }
}
